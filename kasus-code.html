<style>
:root{

p{margin:.4em 0 .8em}
a{color:var(--accent)}
button{
  font:inherit;color:var(--text);cursor:pointer;border-radius:12px;

}
button:hover:not(:disabled){background:var(--btnh)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
.primary:hover:not(:disabled){background:#ffe08f}
input[type=text]{

  padding:.25em .45em;min-height:46px;
}
input[readonly]{background:#e6e9ee}
.muted{color:var(--muted)} .small{font-size:.85em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Kopfzeile ---------- */
#top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6em;flex-wrap:wrap;
  padding:.35em .8em;background:rgba(9,18,32,.95);border-bottom:2px solid var(--line);
}
#top .brand{font-weight:800;font-size:1.05em;margin-right:.4em;white-space:nowrap}
#hud{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;flex:1}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.1em .7em;white-space:nowrap}
.badge{background:var(--accent);color:var(--accent-text);font-weight:800;border-radius:8px;padding:.05em .5em}
#top .tools{display:flex;gap:.4em}
#top .tools button{min-height:42px;padding:.2em .7em;font-size:.9em}

/* ---------- Layout ---------- */
.homelink{color:var(--muted);text-decoration:none;font-size:.85em;border:1px solid var(--line);border-radius:999px;padding:.15em .7em;white-space:nowrap}

main{max-width:1320px;margin:0 auto;padding:.8em 1em 2em}

.center{text-align:center}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}

.story p{font-size:1.05em}

.instr{color:var(--muted);font-size:.9em;margin:.2em 0 .4em}
.satz{font-size:1.2em;margin:.4em 0 .7em}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:700;padding:0 .2em}
.gapin{width:8ch;max-width:100%;text-align:center;font-weight:700}

.options{display:flex;flex-wrap:wrap;gap:.6em;margin:.3em 0 .4em}

.fb-title{font-weight:800;font-size:1.1em}
.feedback .row{margin-top:.4em}
.digit-reveal{display:inline-block;background:var(--accent);color:var(--accent-text);border-radius:8px;padding:0 .5em;font-weight:800;margin-left:.3em}
.umlauts{display:flex;gap:.35em;flex-wrap:wrap;align-items:center;margin:.3em 0}
.umlauts button{min-width:48px;font-weight:700;padding:.2em .5em}

/* ---------- Seitenleiste ---------- */
.side{display:flex;flex-direction:column;gap:.7em}

.side h3{font-size:.95em;margin:0 0 .4em}
.digits{display:flex;gap:.3em;flex-wrap:wrap}
.dg{width:1.6em;height:1.9em;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid var(--line);background:#0e1a2c;font-weight:800;font-size:1.05em}
.dg.on{border-color:var(--accent);color:var(--accent)}
.inv{list-style:none;margin:0;padding:0;font-size:.9em}
.inv li{padding:.15em 0}

/* ---------- Szene ---------- */
.scene{position:relative;width:100%;max-width:calc(44vh * 1000 / 560);min-width:min(100%,420px);aspect-ratio:1000/560;margin:.3em auto .5em;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#1d2d44}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .lbl{font:700 30px Arial,sans-serif;fill:#fff;stroke:#0b1626;stroke-width:7px;paint-order:stroke;text-anchor:middle}
.zone{position:absolute;min-height:0;padding:0;background:transparent;border:3px dashed transparent;border-radius:12px}
.zone:hover:not(:disabled){background:rgba(255,255,255,.12)}
.scene.armed .zone,body.dragging .zone{border-color:rgba(255,209,102,.75);background:rgba(255,209,102,.07)}

.item{font-size:clamp(30px,4vw,52px);line-height:1;padding:.1em .3em;min-height:0;background:#24456f;border:3px solid var(--accent);border-radius:14px;cursor:grab;touch-action:none;user-select:none}

.ftext{display:flex;flex-wrap:wrap;gap:.2em .25em;font-size:1.15em;margin:.3em 0 .7em;line-height:1.3}

function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function paras(s){ return String(s||'').split(/\n\s*\n/).map(p => '<p>'+fmt(p)+'</p>').join(''); }
function asList(x){ return Array.isArray(x) ? x : [x]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function gapHTML(satz, inner){ const p = String(satz).split('___'); return p.length>1 ? p.map(fmt).join(inner) : fmt(satz); }
function fillGap(satz, txt){ return plain(String(satz).replace('___', txt)); }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; const p=n=>String(n).padStart(2,'0'); return (h? h+':'+p(m) : p(m))+':'+p(x); }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }

/* ---------- Antworten vergleichen ----------
   tolerant: Leerzeichen, Satzzeichen, Großschreibung am Satzanfang,
   ae/oe/ue/ss statt ä/ö/ü/ß. Exakt: alle Endungen.                  */
function canon(s){
  return String(s==null?'':s).normalize('NFC')
    .replace(/[„“”‟"«»‚‘’']/g,' ')
    .replace(/[.,!?;:…]/g,' ')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .replace(/\s+/g,' ').trim();
}
function lowFirst(s){ return s.charAt(0).toLowerCase() + s.slice(1); }
function compare(input, solutions, atStart){
  const a = canon(input);
  if(!a) return { empty:true };
  const sols = asList(solutions);
  for(const sol of sols){
    const b = canon(sol);
    if(a===b || (atStart!==false && lowFirst(a)===lowFirst(b))) return { ok:true, match:sol, note:commaNote(input, sol) };
  }
  for(const sol of sols){
    if(a.toLowerCase()===canon(sol).toLowerCase())
      return { ok:true, match:sol, note:'Achte auf die Groß- und Kleinschreibung: „'+sol+'“.' };
  }
  return { ok:false };
}
function commaNote(input, sol){
  return (String(sol).includes(',') && !String(input).includes(',')) ? 'Denk an das Komma: „'+sol+'“.' : '';
}

/* ---------- Prüfcode ---------- */
function cyrb53(str, seed){
  let h1 = 0xdeadbeef ^ (seed||0), h2 = 0x41c6ce57 ^ (seed||0);
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1 = Math.imul(h1^(h1>>>16),2246822507) ^ Math.imul(h2^(h2>>>13),3266489909);
  h2 = Math.imul(h2^(h2>>>16),2246822507) ^ Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2) + (h1>>>0);
}
const B32 = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level, ch, pct, ddmmyy, name){
  let n = cyrb53([level, ch?'C':'N', pct, ddmmyy, normName(name), E.geheimwort].join('|'));
  let out = '';
  for(let i=0;i<5;i++){ out += B32[n % 32]; n = Math.floor(n/32); }
  return out;
}
function makeCode(level, ch, pct, date, name){
  const p=n=>String(n).padStart(2,'0');
  const d = p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100);
  return level+(ch?'C':'')+'-'+pct+'-'+d+'-'+checksum(level,ch,pct,d,name);
}
function verifyCode(code, name){
  const m = String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)(C?)-(\d{1,3})-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: A2-75-081026-K7QFM' };
  const ok = checksum(m[1], !!m[2], +m[3], m[4], name) === m[5];
  return { valid:ok, level:m[1], challenge:!!m[2], pct:+m[3], date:m[4].slice(0,2)+'.'+m[4].slice(2,4)+'.20'+m[4].slice(4,6) };
}

let actx = null;
const SND = { ok:[[660,.12],[880,.2]], bad:[[220,.28]], door:[[523,.12],[659,.12],[784,.12],[1047,.35]], tick:[[520,.06]] };
function sound(name){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    SND[name].forEach(([f,d]) => {
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.03); t += d*0.9;
    });
  }catch(e){}
}

  let s=seed||1, out='';
  const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<n;i++) out += '<circle cx="'+Math.round(x+r()*w)+'" cy="'+Math.round(y+r()*h)+'" r="'+(1+r()*2).toFixed(1)+'" fill="#fff" opacity="'+(0.5+r()*0.5).toFixed(2)+'"/>';
  return out;
}

  }
  return html + '</div>';
}

/* =====================================================================
   PRÜFUNG DER AUFGABEN-DATEN (Hinweis für die Lehrkraft)
   ===================================================================== */
const TYPEN = ['auswahl','luecke','satz','ordnen','sortieren','ziehen','fehler'];
const FEHLER_RX = /\[([^|\]]+)\|([^\]]+)\]/g;
function validate(){
  const errs = [];
  LEVELS.forEach(lv => {
    const L = QUESTIONS[lv];
    if(!L.raeume || !L.raeume.length){ errs.push(lv+': keine Räume.'); return; }
    L.raeume.forEach((R,ri) => {
      if(!R.aufgaben || !R.aufgaben.length){ errs.push(lv+', Raum '+(ri+1)+': keine Aufgaben.'); return; }
      R.aufgaben.forEach((q,qi) => {
        q.niveau = lv; q.raum = ri+1;
        const w = lv+', Raum '+(ri+1)+' („'+R.name+'“), Aufgabe '+(qi+1)+': ';
        if(!TYPEN.includes(q.typ)){ errs.push(w+'unbekannter typ „'+q.typ+'“.'); return; }
        if(q.typ!=='fehler' && !q.satz) errs.push(w+'satz fehlt.');
        if(q.szene && !SCENES[q.szene]) errs.push(w+'Raumbild „'+q.szene+'“ gibt es nicht.');
        if(q.zeige && (!q.szene || !SCENES[q.szene] || !SCENES[q.szene].orte[q.zeige.ort])) errs.push(w+'zeige.ort „'+(q.zeige.ort)+'“ gibt es im Raumbild nicht.');
        switch(q.typ){
          case 'auswahl':
            if(!Array.isArray(q.optionen) || q.optionen.length<2) errs.push(w+'mindestens zwei optionen nötig.');
            else if(!q.optionen.includes(q.loesung)) errs.push(w+'loesung „'+q.loesung+'“ steht nicht in den optionen.');
            if(new Set(q.optionen||[]).size !== (q.optionen||[]).length) errs.push(w+'eine Option steht doppelt da.');
            break;
          case 'luecke':
            if((String(q.satz).split('___').length-1)!==1) errs.push(w+'der satz braucht genau eine Lücke ___.');
            if(!q.loesung || !asList(q.loesung).length) errs.push(w+'loesung fehlt.');
            break;
          case 'satz':
            if(!q.loesung || !asList(q.loesung).length) errs.push(w+'loesung fehlt.');
            break;
          case 'ordnen':
            if(!Array.isArray(q.woerter) || q.woerter.length<2) errs.push(w+'mindestens zwei woerter nötig.');
            if(!String(q.satz).includes('___')) errs.push(w+'der satz braucht eine Lücke ___.');
            break;
          case 'sortieren':
            if(!Array.isArray(q.gruppen) || q.gruppen.length<2) errs.push(w+'mindestens zwei gruppen nötig.');
            (q.karten||[]).forEach((k,ki) => { if(!(k.gruppe>=1 && k.gruppe<=(q.gruppen||[]).length)) errs.push(w+'Karte '+(ki+1)+' hat keine gültige gruppe.'); });
            if(!q.karten || q.karten.length<2) errs.push(w+'mindestens zwei karten nötig.');
            break;
          case 'ziehen':
            if(!q.szene || !SCENES[q.szene]) errs.push(w+'ziehen braucht ein Raumbild (szene).');
            else asList(q.loesung).forEach(z => { if(!SCENES[q.szene].orte[z]) errs.push(w+'Stelle „'+z+'“ gibt es im Raumbild „'+q.szene+'“ nicht.'); });
            if(!q.gegenstand) errs.push(w+'gegenstand fehlt.');
            break;
          case 'fehler':
            if(!q.text || (String(q.text).match(FEHLER_RX)||[]).length!==1) errs.push(w+'der text braucht genau eine Markierung [falsch|richtig].');
            break;
        }
      });
    });
  });
  return errs;
}

/* =====================================================================
   SPIELSTAND
   ===================================================================== */
function signature(level){ return QUESTIONS[level].raeume.map(r => r.aufgaben.length).join(','); }
function L(){ return QUESTIONS[state.level]; }
function R(){ return L().raeume[state.room]; }
function curIndex(){ return state.order[state.room][state.task]; }
function curQ(){ return R().aufgaben[curIndex()]; }
function key(){ return state.room+'-'+curIndex(); }
function totalTasks(level){ return QUESTIONS[level].raeume.reduce((n,r) => n + r.aufgaben.length, 0); }
function limitMs(){ return (E.challengeMinuten[state.level]||30)*60000; }
function spanish(){ return !!(E.spanischeHilfe && E.spanischeHilfe[state.level]); }

function newGame(level, challenge){
  const Lv = QUESTIONS[level];
  state = {
    v:1, level, challenge:!!challenge, sig:signature(level),
    phase:'intro', room:0, task:0, attempts:0, tipFor:null,
    order:  Lv.raeume.map(r => shuffle(r.aufgaben.map((_,i) => i))),
    digits: Lv.raeume.map(r => r.aufgaben.map(() => 1 + Math.floor(Math.random()*9))),
    results:{}, score:0, tipsUsed: Lv.raeume.map(() => 0),
    wrong:[], inventory:[], elapsed:0,
    name:'', finished:null, timeout:false
  };
  save();
}
function loadGame(){
  try{
    const s = JSON.parse(lsGet(LS_GAME) || 'null');
    if(s && s.v===1 && QUESTIONS[s.level] && s.sig===signature(s.level)) return s;
  }catch(e){}
  return null;
}

   ZEIT
   ===================================================================== */
let tickN = 0;
setInterval(() => {
  if(!state || view!=='game' || !ACTIVE.includes(state.phase) || document.hidden || location.hash==='#lehrer') return;
  state.elapsed += 1000; tickN++;
  updateTime();
  if(state.challenge && state.elapsed >= limitMs()){
    state.timeout = true; state.phase = 'end'; save(); render(); return;
  }
  if(tickN % 5 === 0) save();
}, 1000);
function updateTime(){
  const el = document.getElementById('hudTime');
  if(!el || !state) return;

const DEFAULT_INSTR = {

function renderTask(){
  const Rm = R();
  while(state.task < Rm.aufgaben.length && state.results[key()]) { state.task++; state.attempts=0; state.tipFor=null; }

    '<div class="room"><section class="card" aria-labelledby="taskTitle">'+
      '<div class="task-head"><h2 id="taskTitle">'+esc(Rm.name)+' · Aufgabe '+(state.task+1)+' von '+Rm.aufgaben.length+'</h2><span class="chip">'+esc(Rm.thema||'')+'</span></div>'+

        '<span class="spacer"></span><span class="muted small" id="attemptInfo">Versuch '+(state.attempts+1)+' von 2</span>'+

      (spanish() && Rm.hinweis_es ? '<div id="pistaBox" class="tipbox es" lang="es" hidden>'+fmt(Rm.hinweis_es)+'</div>' : '')+
      '<div id="feedback" class="feedback" role="status" aria-live="polite"></div>'+

function sideHTML(){
  const Rm = R(); const dg = state.digits[state.room];

  for(let i=0;i<Rm.aufgaben.length;i++){
    const idx = state.order[state.room][i];

function useTip(){
  if(ui.done || state.tipFor===key()) return;
  if(state.tipsUsed[state.room] >= E.tippsProRaum) return;
  state.tipsUsed[state.room]++; state.tipFor = key(); state.score -= E.tippKosten; save();

function showTry(msg){
  const fb = $('#feedback');
  fb.className = 'feedback try';
  fb.innerHTML = '<div class="fb-title">✗ Noch nicht richtig.</div><p style="margin:.2em 0 0">'+fmt(msg)+'</p>';

function showInvalid(msg){
  const fb = $('#feedback');
  fb.className = 'feedback';
  fb.innerHTML = '<p style="margin:0">ℹ️ '+fmt(msg)+'</p>';
}
function check(){
  if(ui.done) return;
  const q = ui.q;
  const res = T[q.typ].check(q);
  if(res.invalid){ showInvalid(res.invalid); return; }
  if(res.ok){ finish(true, res); return; }
  if(state.attempts === 0){
    state.attempts = 1; save();
    if(T[q.typ].markWrong) T[q.typ].markWrong(q, res);
    $('#attemptInfo').textContent = 'Versuch 2 von 2';
    showTry((res.msg ? res.msg+' ' : '')+'Du hast noch einen Versuch. Denk an: **'+(q.thema||'')+'**');
    sound('bad');
    return;
  }
  finish(false, res);
}
function finish(ok, res){
  ui.done = true;
  const q = ui.q, Rm = R();
  const pts = ok ? (state.attempts===0 ? E.punkteErsterVersuch : E.punkteZweiterVersuch) : 0;
  state.score += pts;
  state.results[key()] = { p:pts, ok };
  if(!ok){
    state.wrong.push({ raum:Rm.name, aufgabe:taskText(q), deine:T[q.typ].answer(q) || '–', loesung:solutionText(q), thema:q.thema||'' });
  }
  const digit = state.digits[state.room][state.task];
  save();
  if(T[q.typ].reveal) T[q.typ].reveal(q, ok);
  $$('#taskBody input').forEach(i => i.readOnly = true);
  $$('#taskBody button').forEach(b => b.disabled = true);
  $('#btnCheck').hidden = true; $('#btnTip').disabled = true;
  $('#attemptInfo').textContent = '';
  const fb = $('#feedback');
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  let h = ok
    ? '<div class="fb-title">✓ Richtig! +'+pts+' Punkte</div>'
    : '<div class="fb-title">✗ Leider falsch.</div><p style="margin:.2em 0">Richtig ist: <strong>'+esc(solutionText(q))+'</strong></p>';
  if(res && res.note) h += '<p style="margin:.2em 0">ℹ️ '+esc(res.note)+'</p>';
  if(q.erklaerung_de) h += '<p style="margin:.3em 0">'+fmt(q.erklaerung_de)+'</p>';
  h += '<p style="margin:.3em 0">🔢 Zahl für das Türschloss:<span class="digit-reveal">'+digit+'</span></p>';
  if(spanish() && q.erklaerung_es) h += '<div id="esBox" class="tipbox es" lang="es" hidden>'+fmt(q.erklaerung_es)+'</div>';
  h += '<div class="row">'+(spanish() && q.erklaerung_es ? '<button type="button" id="btnES" lang="es" aria-expanded="false">💬 Ayuda en español</button>' : '')+
       '<span class="spacer"></span><button type="button" class="primary" id="btnNext">Weiter ➜</button></div>';
  fb.innerHTML = h;
  const es = $('#btnES');
  if(es) es.addEventListener('click', () => { const b=$('#esBox'); b.hidden=!b.hidden; es.setAttribute('aria-expanded', String(!b.hidden)); });
  $('#btnNext').addEventListener('click', nextTask);
  const dEl = $$('#digits .dg')[state.task]; if(dEl){ dEl.textContent = digit; dEl.classList.add('on'); }
  renderHUD();
  sound(ok ? 'ok' : 'bad');
  $('#btnNext').focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function nextTask(){
  state.task++; state.attempts=0; state.tipFor=null;
  if(state.task >= R().aufgaben.length) state.phase = 'lock';
  save(); render();
}
function taskText(q){ return q.typ==='fehler' ? plain(String(q.text).replace(FEHLER_RX,'$1')) : plain(q.satz); }
function solutionText(q){
  switch(q.typ){
    case 'auswahl': return String(q.satz).includes('___') ? fillGap(q.satz, q.loesung) : q.loesung;
    case 'luecke':  return fillGap(q.satz, asList(q.loesung)[0]);
    case 'satz':    return asList(q.loesung)[0];
    case 'ordnen':  return fillGap(q.satz, q.woerter.join(' '));
    case 'sortieren': return q.gruppen.map((g,i) => g+': '+q.karten.filter(k => k.gruppe===i+1).map(k => k.text).join(' · ')).join(' | ');
    case 'ziehen':  return SCENES[q.szene].orte[asList(q.loesung)[0]].name;
    case 'fehler':  return plain(String(q.text).replace(FEHLER_RX,'$2'));
  }
  return '';
}

/* =====================================================================
   ZIEHEN & ABLEGEN (Maus, Touch; Klick-Alternative für Tastatur)
   ===================================================================== */
let drag = null, suppressClick = false;
function draggable(el, payload){
  el.addEventListener('pointerdown', e => {
    if(ui.done || (e.pointerType==='mouse' && e.button!==0)) return;
    drag = { el, payload, sx:e.clientX, sy:e.clientY, ghost:null };
  });
}
function dropTargetAt(x,y){ const t = document.elementFromPoint(x,y); return t ? t.closest('[data-drop]') : null; }
function clearHover(){ $$('.drop-hover').forEach(x => x.classList.remove('drop-hover')); }
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 8) return;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.removeAttribute('id'); drag.ghost.classList.add('ghost'); drag.ghost.style.cssText = '';
    if(drag.ghost.classList.contains('sitem')){ drag.ghost.classList.remove('sitem'); drag.ghost.classList.add('item'); }
    drag.el.style.opacity = '.35'; drag.el.style.pointerEvents = 'none';
    document.body.appendChild(drag.ghost); document.body.classList.add('dragging');
  }
  drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
  clearHover(); const dz = dropTargetAt(e.clientX, e.clientY); if(dz) dz.classList.add('drop-hover');
  e.preventDefault();
}, { passive:false });
function endDrag(e, cancel){
  const d = drag; drag = null;
  if(!d || !d.ghost) return;
  d.ghost.remove(); document.body.classList.remove('dragging'); clearHover();
  d.el.style.opacity = ''; d.el.style.pointerEvents = '';
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  if(cancel) return;
  const dz = dropTargetAt(e.clientX, e.clientY);
  if(dz && ui.onDrop) ui.onDrop(d.payload, dz.dataset.drop);
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

/* =====================================================================
   AUFGABENTYPEN
   ===================================================================== */
function umlautBar(){
  return '<div class="umlauts" aria-label="Sonderzeichen">'+['ä','ö','ü','ß','Ä','Ö','Ü'].map(c => '<button type="button" class="uml" data-c="'+c+'" tabindex="-1">'+c+'</button>').join('')+
    '<span class="muted small">oder tippe ae, oe, ue, ss</span></div>';
}
function bindInputs(body){
  $$('input[type=text]', body).forEach(inp => {
    inp.addEventListener('focus', () => { ui.lastInput = inp; });
    inp.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); check(); } });
  });
  ui.lastInput = $('input[type=text]', body);
  $$('.uml', body).forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => {
      const inp = ui.lastInput; if(!inp || inp.readOnly) return;
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
      inp.value = inp.value.slice(0,s) + b.dataset.c + inp.value.slice(en);
      inp.focus(); inp.setSelectionRange(s+1, s+1);
    });
  });
}
const INPUT_ATTR = 'type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';

const T = {

  /* ---------- Multiple Choice ---------- */
  auswahl: {
    init(q, body){
      ui.opts = shuffle(q.optionen); ui.sel = null;
      body.innerHTML = sceneHTML(q,false)+
        '<p class="satz">'+gapHTML(q.satz,'<span class="gap" id="gap">&nbsp;</span>')+'</p>'+
        '<div class="options" role="radiogroup" aria-label="Antworten">'+
        ui.opts.map((o,i) => '<button type="button" class="opt" role="radio" aria-checked="false" data-i="'+i+'"><span class="k" aria-hidden="true">'+(i+1)+'</span>'+esc(o)+'</button>').join('')+'</div>';
      $$('.opt', body).forEach(b => b.addEventListener('click', e => {
        if(ui.done || b.disabled) return;
        const i = +b.dataset.i;
        if(e.detail===0 && ui.sel===i){ check(); return; }
        T.auswahl.select(i);
      }));
    },
    select(i){
      ui.sel = i;
      $$('.opt').forEach((b,j) => { b.classList.toggle('sel', j===i); b.setAttribute('aria-checked', String(j===i)); });
      const g = $('#gap'); if(g) g.textContent = ui.opts[i];
    },
    check(q){
      if(ui.sel==null) return { invalid:'Bitte wähle zuerst eine Antwort.' };
      return { ok: ui.opts[ui.sel] === q.loesung };
    },
    markWrong(){
      const b = $$('.opt')[ui.sel]; b.classList.remove('sel'); b.classList.add('mark-bad'); b.disabled = true; b.setAttribute('aria-checked','false');
      ui.sel = null; const g=$('#gap'); if(g) g.innerHTML='&nbsp;';
      const n = $$('.opt').find(x => !x.disabled); if(n) n.focus();
    },
    reveal(q){
      $$('.opt').forEach((b,i) => { b.classList.remove('sel'); if(ui.opts[i]===q.loesung) b.classList.add('mark-ok'); else if(i===ui.sel) b.classList.add('mark-bad'); });
      const g=$('#gap'); if(g) g.textContent = q.loesung;
    },
    answer(){ return ui.sel==null ? '' : ui.opts[ui.sel]; }
  },

  /* ---------- Lücke mit Eingabe ---------- */
  luecke: {
    init(q, body){
      const len = Math.max(...asList(q.loesung).map(s => String(s).length));
      const w = Math.min(32, Math.max(7, len+3));
      body.innerHTML = sceneHTML(q,false)+
        '<p class="satz">'+gapHTML(q.satz,'<input '+INPUT_ATTR+' id="ans" class="gapin" aria-label="Lücke" style="width:'+w+'ch">')+'</p>'+umlautBar();
      bindInputs(body);
    },
    check(q){
      const v = $('#ans').value; ui.ans = v;
      const before = String(q.satz).split('___')[0].trim();
      const r = compare(v, q.loesung, before==='' || /[.!?:„“"–]$/.test(before));
      if(r.empty) return { invalid:'Bitte schreib zuerst eine Antwort in die Lücke.' };
      return r;
    },
    markWrong(){ const i=$('#ans'); i.select(); },
    answer(){ return ui.ans || ''; }
  },

  /* ---------- ganzer Satz ---------- */
  satz: {
    init(q, body){
      body.innerHTML = sceneHTML(q,false)+'<p class="satz">'+fmt(q.satz)+'</p>'+
        '<label class="sr" for="ans">Deine Antwort</label><input '+INPUT_ATTR+' id="ans" class="fullin" placeholder="Schreib hier den ganzen Satz …">'+umlautBar();
      bindInputs(body);
    },
    check(q){
      const v = $('#ans').value; ui.ans = v;
      const r = compare(v, q.loesung);
      if(r.empty) return { invalid:'Bitte schreib zuerst einen Satz.' };
      return r;
    },
    markWrong(){ $('#ans').focus(); },
    answer(){ return ui.ans || ''; }
  },

  /* ---------- Wörter ordnen ---------- */
  ordnen: {
    init(q, body){
      const words = q.woerter.concat(q.extra||[]).map((w,i) => ({ w, id:i }));
      let pool = shuffle(words);
      if(pool.length>1 && !(q.extra||[]).length){ let n=0; while(pool.map(x=>x.w).join(' ')===q.woerter.join(' ') && n++<10) pool = shuffle(words); }
      ui.pool = pool; ui.built = [];
      body.innerHTML = sceneHTML(q,false)+'<p class="satz">'+gapHTML(q.satz,'<span class="build" id="build" aria-label="Deine Antwort" aria-live="polite"></span>')+'</p>'+
        '<div class="pool" id="pool" aria-label="Wörter"></div><div class="row"><button type="button" id="btnReset">↺ Zurücksetzen</button></div>';
      $('#btnReset').addEventListener('click', () => { if(ui.done) return; ui.pool = ui.pool.concat(ui.built); ui.built=[]; T.ordnen.draw(); });
      T.ordnen.draw();
    },
    draw(){
      const mk = (x,where) => '<button type="button" class="chipw" data-id="'+x.id+'" data-where="'+where+'">'+esc(x.w)+'</button>';
      $('#build').innerHTML = ui.built.map(x => mk(x,'build')).join('');
      $('#pool').innerHTML = ui.pool.map(x => mk(x,'pool')).join('') || '<span class="muted small">alle Wörter verwendet</span>';
      $$('.chipw').forEach(b => b.addEventListener('click', () => {
        if(ui.done) return;
        const id = +b.dataset.id;
        if(b.dataset.where==='pool'){ const i=ui.pool.findIndex(x=>x.id===id); ui.built.push(ui.pool.splice(i,1)[0]); }
        else { const i=ui.built.findIndex(x=>x.id===id); ui.pool.push(ui.built.splice(i,1)[0]); }
        T.ordnen.draw();
        const nb = $('#pool .chipw') || $('#btnCheck'); if(nb) nb.focus();
      }));
    },
    check(q){
      if(!ui.built.length) return { invalid:'Klick zuerst die Wörter in der richtigen Reihenfolge an.' };
      const a = ui.built.map(x=>x.w).join(' ');
      const sols = [q.woerter.join(' ')].concat((q.alternativen||[]).map(x => Array.isArray(x)?x.join(' '):x));
      return { ok: sols.some(s => canon(s)===canon(a)) };
    },
    markWrong(){ $('#build').classList.add('shake'); setTimeout(()=>{ const b=$('#build'); if(b) b.classList.remove('shake'); },500); },
    reveal(q, ok){
      if(!ok){ $('#build').innerHTML = q.woerter.map(w => '<span class="chipw mark-ok" style="padding:.3em .7em;border-radius:12px;border:2px solid">'+esc(w)+'</span>').join(''); }
    },
    answer(){ return (ui.built||[]).map(x=>x.w).join(' '); }
  },

  /* ---------- Sortieren ---------- */
  sortieren: {
    init(q, body){
      ui.cards = shuffle(q.karten.map((k,i) => ({ ...k, id:i })));
      ui.place = {}; ui.sel = null;
      body.innerHTML = '<p class="satz">'+fmt(q.satz)+'</p>'+
        '<div class="pool" id="pool" data-drop="pool" aria-label="Karten"></div>'+
        '<div class="bins">'+q.gruppen.map((g,i) => '<div class="bin" data-drop="'+(i+1)+'"><button type="button" class="binbtn" data-bin="'+(i+1)+'">⬇ '+esc(g)+'</button><div class="bin-items" id="bin'+(i+1)+'"></div></div>').join('')+'</div>';
      ui.onDrop = (id, target) => { if(ui.done) return; ui.place[id] = target==='pool' ? undefined : +target; ui.sel=null; T.sortieren.draw(); };
      $$('.binbtn', body).forEach(b => b.addEventListener('click', () => { if(ui.sel!=null) ui.onDrop(ui.sel, b.dataset.bin); }));
      $$('.bin', body).forEach(b => b.addEventListener('click', e => { if(e.target===b && ui.sel!=null) ui.onDrop(ui.sel, b.dataset.drop); }));
      $('#pool').addEventListener('click', e => { if(e.target.id==='pool' && ui.sel!=null) ui.onDrop(ui.sel, 'pool'); });
      T.sortieren.draw();
    },
    draw(){
      $('#pool').innerHTML=''; $$('.bin-items').forEach(b => b.innerHTML='');
      ui.cards.forEach(c => {
        const b = document.createElement('button');
        b.type='button'; b.className='card-s'+(ui.sel===c.id?' sel':''); b.textContent=c.text; b.dataset.id=c.id;
        if(ui.marks && ui.marks[c.id]) b.classList.add(ui.marks[c.id]);
        b.setAttribute('aria-pressed', String(ui.sel===c.id));
        const where = ui.place[c.id];
        (where ? $('#bin'+where) : $('#pool')).appendChild(b);
        draggable(b, c.id);
        b.addEventListener('click', () => {
          if(suppressClick || ui.done) return;
          ui.sel = ui.sel===c.id ? null : c.id; T.sortieren.draw();
          const f = $('.card-s[data-id="'+c.id+'"]'); if(f) f.focus();
        });
      });
      if(!$('#pool').children.length) $('#pool').innerHTML = '<span class="muted small">Alle Karten sind einsortiert. Hier kannst du Karten zurücklegen.</span>';
      if(ui.marks) ui.marks = null;
    },
    check(q){
      if(ui.cards.some(c => !ui.place[c.id])) return { invalid:'Bitte sortiere zuerst alle Karten in eine Gruppe.' };
      ui.ans = q.gruppen.map((g,i) => g+': '+ui.cards.filter(c => ui.place[c.id]===i+1).map(c=>c.text).join(' · ')).join(' | ');
      const wrong = ui.cards.filter(c => ui.place[c.id]!==c.gruppe).length;
      return { ok: wrong===0, msg: wrong ? (wrong===1 ? '1 Karte ist falsch (✗).' : wrong+' Karten sind falsch (✗).') : '' };
    },
    markWrong(){
      ui.marks = {}; ui.cards.forEach(c => { if(ui.place[c.id]!==c.gruppe) ui.marks[c.id]='mark-bad'; });
      T.sortieren.draw();
    },
    reveal(q){
      const before = { ...ui.place };
      ui.cards.forEach(c => ui.place[c.id] = c.gruppe);
      ui.marks = {}; ui.cards.forEach(c => ui.marks[c.id] = before[c.id]===c.gruppe ? 'mark-ok' : 'mark-bad');
      ui.sel = null; T.sortieren.draw();
      $$('.card-s').forEach(b => b.disabled = true);
    },
    answer(){ return ui.ans || ''; }
  },

  /* ---------- Gegenstand im Raumbild platzieren ---------- */
  ziehen: {
    init(q, body){
      ui.zone = null; ui.sel = false;
      body.innerHTML = '<p class="satz">'+fmt(q.satz)+'</p><div class="scene-row">'+sceneHTML(q,true)+
        '<div class="tray" id="tray" data-drop="tray"><button type="button" class="item" id="item" aria-label="Gegenstand '+esc(q.gegenstand)+' auswählen">'+esc(q.gegenstand)+'</button><span class="muted small">← zieh mich ins Bild</span></div></div>';
      ui.onDrop = (_, target) => { if(ui.done) return; ui.zone = target==='tray' ? null : target; ui.sel=false; T.ziehen.draw(); };
      $$('.zone', body).forEach(z => z.addEventListener('click', () => { if(suppressClick || ui.done) return; if(ui.sel) ui.onDrop(null, z.dataset.drop); }));
      $('#tray').addEventListener('click', e => { if(e.target.id==='tray' && ui.sel) ui.onDrop(null,'tray'); });
      T.ziehen.draw();
    },
    draw(){
      const q = ui.q, S = SCENES[q.szene];
      const old = $('#item'); if(old) old.remove();
      const b = document.createElement('button');
      b.type='button'; b.id='item'; b.textContent=q.gegenstand;
      b.setAttribute('aria-label','Gegenstand '+q.gegenstand+(ui.sel?' (ausgewählt – jetzt eine Stelle wählen)':' auswählen'));
      if(ui.zone){
        b.className = 'sitem'+(ui.sel?' sel':''); b.style.cssText = zcenter(S.orte[ui.zone].r);
        $('#scene').appendChild(b);
      } else {
        b.className = 'item'+(ui.sel?' sel':'');
        $('#tray').insertBefore(b, $('#tray').firstChild);
      }
      draggable(b, 'item');
      b.addEventListener('click', () => { if(suppressClick || ui.done) return; ui.sel = !ui.sel; T.ziehen.draw(); const n=$('#item'); if(n) n.focus(); });
      $('#scene').classList.toggle('armed', !!ui.sel);
      $$('.zone').forEach(z => z.classList.remove('z-bad'));
    },
    check(q){
      if(!ui.zone) return { invalid:'Zieh den Gegenstand zuerst an eine Stelle im Bild.' };
      ui.ans = SCENES[q.szene].orte[ui.zone].name;
      return { ok: asList(q.loesung).includes(ui.zone) };
    },
    markWrong(){ const z = $('.zone[data-drop="'+ui.zone+'"]'); if(z) z.classList.add('z-bad'); },
    reveal(q, ok){
      const wrongZone = ok ? null : ui.zone;
      if(!ok){ ui.zone = asList(q.loesung)[0]; ui.sel = false; T.ziehen.draw(); }
      if(wrongZone){ const z = $('.zone[data-drop="'+wrongZone+'"]'); if(z) z.classList.add('z-bad'); }
      const zr = $('.zone[data-drop="'+ui.zone+'"]'); if(zr) zr.classList.add('z-ok');
    },
    answer(){ return ui.ans || ''; }
  },

  /* ---------- Fehlersuche ---------- */
  fehler: {
    init(q, body){
      const MARK = '\u0001';
      let falsch='', richtig='';
      const txt = String(q.text).replace(FEHLER_RX, (_,a,b) => { falsch=a; richtig=b; return MARK; });
      ui.tokens = txt.split(/\s+/).filter(Boolean).map(t => t.includes(MARK) ? { t:t.replace(MARK,falsch), err:true } : { t, err:false });
      ui.richtig = richtig; ui.sel = null;
      body.innerHTML = sceneHTML(q,false)+'<div class="ftext" id="ftext" role="group" aria-label="Text – klick auf das falsche Wort">'+
        ui.tokens.map((x,i) => '<button type="button" class="tok" data-i="'+i+'" aria-pressed="false">'+esc(x.t)+'</button>').join('')+'</div>'+
        '<p class="row" style="margin:.2em 0"><label for="ans">Korrektur für <strong id="selWord">…</strong>:</label> <input '+INPUT_ATTR+' id="ans" class="gapin" style="width:14ch"></p>'+umlautBar();
      $$('.tok', body).forEach(b => b.addEventListener('click', () => {
        if(ui.done || b.disabled) return;
        ui.sel = +b.dataset.i;
        $$('.tok').forEach(x => { x.classList.toggle('sel', x===b); x.setAttribute('aria-pressed', String(x===b)); });
        $('#selWord').textContent = '„'+ui.tokens[ui.sel].t.replace(/[.,!?;:]+$/,'')+'“';
        $('#ans').focus();
      }));
      bindInputs(body);
    },
    check(q){
      if(ui.sel==null) return { invalid:'Klick zuerst auf das Wort, das falsch ist.' };
      const v = $('#ans').value;
      if(!canon(v)) return { invalid:'Schreib die richtige Form in das Feld.' };
      ui.ans = '„'+ui.tokens[ui.sel].t.replace(/[.,!?;:]+$/,'')+'“ → „'+v+'“';
      if(!ui.tokens[ui.sel].err) return { ok:false, msg:'Das Wort „'+ui.tokens[ui.sel].t.replace(/[.,!?;:]+$/,'')+'“ ist richtig. Der Fehler steckt woanders.' };
      const r = compare(v, ui.richtig, ui.sel===0);
      if(!r.ok) return { ok:false, msg:'Das falsche Wort hast du gefunden, aber die Korrektur stimmt noch nicht.' };
      return r;
    },
    markWrong(){},
    reveal(q){
      $$('.tok').forEach((b,i) => { if(ui.tokens[i].err){ b.classList.add('mark-ok'); b.textContent = ui.tokens[i].t+' → '+ui.richtig; } else if(i===ui.sel) b.classList.add('mark-bad'); });
    },
    answer(){ return ui.ans || ''; }
  }
};

/* ---------- Tastatur: Zahlen für Multiple Choice ---------- */
document.addEventListener('keydown', e => {
  if(!state || view!=='game' || location.hash==='#lehrer') return;
  if(e.target && e.target.matches && e.target.matches('input,textarea')) return;
  if(state.phase==='task' && ui.q && ui.q.typ==='auswahl' && !ui.done){
    const n = parseInt(e.key,10);
    if(n>=1 && n<=ui.opts.length){ const b=$$('.opt')[n-1]; if(!b.disabled){ T.auswahl.select(n-1); b.focus(); } e.preventDefault(); }
  }
  if(state.phase==='lock' && ui.lock){
    if(/^[0-9]$/.test(e.key)){ ui.lock.press(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ ui.lock.press('del'); e.preventDefault(); }
    else if(e.key==='Enter' && !(e.target && e.target.closest && e.target.closest('button'))){ ui.lock.press('ok'); e.preventDefault(); }
  }
});

/* ---------- Türschloss ---------- */
function renderLock(){
  const Rm = R(); const code = state.digits[state.room].join('');
  app.innerHTML = '<section class="card narrow center"><h1>🔒 Die Tür ist verschlossen</h1>'+
    '<p>Ihr habt alle Zahlen gefunden! Gib den Code in der richtigen Reihenfolge ein.</p>'+
    '<div class="digits" style="justify-content:center">'+state.digits[state.room].map(d => '<span class="dg on">'+d+'</span>').join('')+'</div>'+
    '<div class="lockcode" id="lockcode" tabindex="0" aria-live="polite" aria-label="Eingegebener Code – Zahlen tippen, Enter bestätigt"></div>'+
    '<div class="keypad">'+['1','2','3','4','5','6','7','8','9','del','0','ok'].map(k => '<button type="button" data-k="'+k+'"'+(k==='ok'?' class="primary"':'')+' aria-label="'+(k==='del'?'Löschen':k==='ok'?'Bestätigen':k)+'">'+(k==='del'?'⌫':k==='ok'?'✔':k)+'</button>').join('')+'</div>'+
    '<div id="lockfb" role="status" aria-live="polite"></div></section>';
  let entered = '';
  const show = () => { $('#lockcode').textContent = entered.padEnd(code.length,'_').split('').join(' '); };
  ui.lock = { press(k){
    if(k==='del') entered = entered.slice(0,-1);
    else if(k==='ok'){
      if(entered===code){
        state.inventory.push(Rm.belohnung); state.phase='roomdone'; save(); sound('door'); render(); return;
      }
      const lc=$('#lockcode'); lc.classList.remove('shake'); void lc.offsetWidth; lc.classList.add('shake');
      $('#lockfb').innerHTML = '<p class="badline">✗ Der Code stimmt nicht. Versuch es noch einmal.</p>'; sound('bad'); entered='';
    }
    else if(entered.length < code.length) entered += k;
    show();
  }};
  $$('.keypad button').forEach(b => b.addEventListener('click', () => ui.lock.press(b.dataset.k)));
  show(); focusMain('#lockcode');
}

/* ---------- Ergebnis ---------- */
function stats(){
  const total = totalTasks(state.level);
  const max = total * E.punkteErsterVersuch;
  const score = Math.max(0, state.score);
  const answered = Object.keys(state.results).length;
  return { total, max, score, answered, pct: Math.round(score/max*100), open: total-answered };
}
function renderEnd(){
  if(!state.name){
    app.innerHTML = '<section class="card narrow"><h1>'+(state.timeout?'⏳ Die Zeit ist abgelaufen!':'🏁 Fast fertig!')+'</h1>'+
      '<p>Schreib deinen Namen, damit deine Lehrkraft dein Ergebnis zuordnen kann. Der Name bleibt nur auf diesem Gerät.</p>'+
      '<p class="row"><label for="nameIn">Dein Name:</label> <input '+INPUT_ATTR+' id="nameIn" maxlength="60" style="flex:1;min-width:220px" placeholder="Vorname Nachname"></p>'+
      '<div id="nameFb" role="status"></div><div class="row"><span class="spacer"></span><button type="button" class="primary" id="btnName">Ergebnis anzeigen ➜</button></div></section>';
    const go = () => {
      const n = $('#nameIn').value.trim().replace(/\s+/g,' ');
      if(normName(n).length < 2){ $('#nameFb').innerHTML='<p class="badline">Bitte schreib deinen Namen.</p>'; return; }
      state.name = n; state.finished = new Date().toISOString(); save(); render();
    };
    $('#btnName').addEventListener('click', go);
    $('#nameIn').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
    focusMain('#nameIn'); return;
  }
  const s = stats(); const d = new Date(state.finished);
  const code = makeCode(state.level, state.challenge, s.pct, d, state.name);
  const Lv = L();
  const rows = [
    ['Name', state.name], ['Niveau', state.level+' – '+Lv.titel], ['Modus', state.challenge ? 'Challenge (mit Zeitlimit)' : 'normal'],
    ['Punkte', s.score+' von '+s.max], ['Prozent', s.pct+' %'], ['Zeit', fmtTime(state.elapsed)+' min'], ['Datum', fmtDate(d)],
    ['Richtig', Object.values(state.results).filter(r=>r.ok).length+' von '+s.total+' Aufgaben']
  ];
  if(s.open) rows.push(['Nicht bearbeitet', s.open+' Aufgaben (Zeit abgelaufen)']);
  let h = '<section class="card narrow"><h1>🏆 Dein Ergebnis</h1>'+(state.timeout?'<p class="tipbox">⏳ Die Zeit ist abgelaufen.</p>':'')+
    '<table class="restable">'+rows.map(r => '<tr><th scope="row">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table>'+
    '<p style="margin-bottom:0">Prüfcode:</p><div class="bigcode" id="pcode">'+esc(code)+'</div>'+
    '<p class="small muted">Mach einen Screenshot oder kopiere das Ergebnis und gib es in Google Classroom ab.</p>'+
    '<div class="row"><button type="button" class="primary" id="btnCopy">📋 Ergebnis kopieren</button><button type="button" id="btnNew">↺ Neues Spiel</button><span id="copyFb" role="status" class="okline"></span></div>';
  h += '<h2 style="margin-top:1em">Falsch beantwortete Aufgaben ('+state.wrong.length+')</h2>';
  if(!state.wrong.length) h += '<p class="okline">✓ Keine Fehler – super!</p>';
  else h += '<ol class="wronglist">'+state.wrong.map(w => '<li><span class="muted small">'+esc(w.raum)+' · '+esc(w.thema)+'</span><br>'+esc(w.aufgabe)+
    '<br><span class="badline">✗ Deine Antwort: '+esc(w.deine)+'</span><br><span class="okline">✓ Richtig: '+esc(w.loesung)+'</span></li>').join('')+'</ol>';
  app.innerHTML = h + '</section>';
  $('#btnCopy').addEventListener('click', () => copyText(resultText(code, s, d)));
  $('#btnNew').addEventListener('click', () => {
    if(!window.confirm('Neues Spiel starten? Dieses Ergebnis wird gelöscht. Hast du schon einen Screenshot gemacht?')) return;
    lsDel(LS_GAME); state=null; view='start'; render();
  });
  focusMain('#btnCopy');
}
function resultText(code, s, d){
  const Lv = L();
  let t = 'Kasus-Code – Grammatik-Escape-Room\n'+
    'Name: '+state.name+'\nNiveau: '+state.level+' – '+Lv.titel+'\nModus: '+(state.challenge?'Challenge':'normal')+
    '\nPunkte: '+s.score+' / '+s.max+' ('+s.pct+' %)\nZeit: '+fmtTime(state.elapsed)+' min\nDatum: '+fmtDate(d)+
    (s.open ? '\nNicht bearbeitet: '+s.open : '')+'\nPrüfcode: '+code+'\n';
  t += '\nFalsch beantwortet ('+state.wrong.length+'):\n';
  t += state.wrong.length ? state.wrong.map((w,i) => (i+1)+'. '+w.aufgabe+'\n   Meine Antwort: '+w.deine+'\n   Richtig: '+w.loesung).join('\n') : '–';
  return t;
}
function copyText(t){
  const done = () => { $('#copyFb').textContent = '✓ Kopiert! Jetzt in Google Classroom einfügen (Strg + V).'; };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ $('#copyFb').textContent = 'Kopieren hat nicht geklappt – bitte Screenshot machen.'; }
    ta.remove();
  };
  let settled = false;
  const once = f => () => { if(!settled){ settled = true; f(); } };
  try {
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(t).then(once(done), once(fallback));
      setTimeout(once(fallback), 800);   // falls der Browser nicht antwortet
    } else once(fallback)();
  } catch(e){ once(fallback)(); }
}

    const r = verifyCode($('#tCode').value, $('#tName').value);
    $('#tRes').innerHTML = r.valid
      ? '<div class="feedback ok"><div class="fb-title">✓ Der Code ist gültig.</div><p style="margin:.3em 0 0">Niveau <strong>'+r.level+'</strong>'+(r.challenge?' (Challenge)':'')+' · <strong>'+r.pct+' %</strong> · '+r.date+'</p></div>'
      : '<div class="feedback bad"><div class="fb-title">✗ Der Code ist nicht gültig.</div><p style="margin:.3em 0 0">'+esc(r.reason || 'Name oder Code passen nicht zusammen. Vielleicht ist der Name anders geschrieben oder die Zahlen wurden geändert.')+'</p></div>';
  };
  $('#tCheck').addEventListener('click', go);
  ['#tName','#tCode'].forEach(s => $(s).addEventListener('keydown', e => { if(e.key==='Enter') go(); }));
  $('#tBack').addEventListener('click', () => { history.replaceState(null,'',location.pathname+location.search); view='start'; render(); });
  focusMain('#tName');
}

/* =====================================================================
   START
   ===================================================================== */
try { settings = Object.assign(settings, JSON.parse(lsGet(LS_SET) || '{}')); } catch(e){}
updateSoundBtn();
state = loadGame();
window.addEventListener('hashchange', () => { if(location.hash!=='#lehrer') view='start'; render(); });
render();

/* Testzugang nur mit ?test in der Adresse (für automatische Tests) */
if(/[?&]test\b/.test(location.search)){
  window.__kc = { state:()=>state, q:()=>ui.q, ui:()=>ui, SCENES, check, verifyCode, makeCode, compare };
}
})();
</script>
