<script>
/* =====================================================================
   AB HIER: SPIEL-LOGIK (muss nicht geändert werden)
   ===================================================================== */
const E = EINSTELLUNGEN;
const LEVELS = ['A2','B1','B2','C1'];
const WELTEN = ['atacama','valparaiso','pucon','patagonien'];
const GEGNER = ['sandsturm','moewe','lava','schneesturm'];
const LS_GAME = 'pudusprung.spiel.v1', LS_SET = 'pudusprung.einstellungen.v1';
const TEMPI = [['langsam','🐢 langsam'],['normal','🦌 normal'],['schnell','⚡ schnell']];

const app = document.getElementById('app');
let state=null, view='start', settings={ sound:false, anim:true, tempo:'normal' };
let G=null, raf=0, lastTs=0, ZEITRAFFER=1;

/* ---------- Speicher ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }
function save(){ if(state) lsSet(LS_GAME, JSON.stringify(state)); }
function saveSettings(){ lsSet(LS_SET, JSON.stringify(settings)); }

/* ---------- Helfer ---------- */
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function paras(s){ return String(s||'').split(/\n\s*\n/).map(p => '<p>'+fmt(p)+'</p>').join(''); }
function asList(x){ return x==null ? [] : (Array.isArray(x) ? x : [x]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function range(n){ return Array.from({length:n},(_,i)=>i); }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
function focusEl(sel){ const el = sel ? (typeof sel==='string'?$(sel):sel) : null; (el||app).focus({preventScroll:true}); }
let toastT=null;
function toast(msg, ms){ const t=$('#toast'); t.innerHTML=fmt(msg); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, ms||3000); }
function ruhig(){ return !settings.anim || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function spanish(level){ return !!E.spanischeHilfe[level||(state&&state.level)]; }
function mod(a,n){ return ((a%n)+n)%n; }
function rnd(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }

/* ---------- Eingebettet (z. B. Google Sites) ---------- */
const EINGEBETTET = (()=>{ try { return window.self!==window.top; } catch(e){ return true; } })();
if(EINGEBETTET) document.documentElement.classList.add('eingebettet');
function bestaetigen(msg, ok){
  const d=document.createElement('div'); d.className='confirmbox'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="cb"><p></p><div class="cbrow"><button type="button" class="cbno">Abbrechen</button><button type="button" class="primary cbyes">Ja</button></div></div>';
  d.querySelector('p').textContent=msg; document.body.appendChild(d);
  const close=()=>d.remove();
  d.querySelector('.cbno').addEventListener('click',close);
  d.querySelector('.cbyes').addEventListener('click',()=>{ close(); ok(); });
  d.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  d.querySelector('.cbno').focus();
}

/* ---------- Daten ---------- */
function etappen(level){
  const S=SPIEL[level||state.level];
  return asList(S.etappen).map((e,i)=>({ name:e.name, saetze:asList(e.saetze), boss:false, idx:i }))
    .concat(S.boss ? [{ name:S.boss.name, saetze:asList(S.boss.saetze), boss:true, gegner:S.boss.gegner, idx:asList(S.etappen).length }] : []);
}
function alleSaetze(level){ return etappen(level).reduce((a,e)=>a.concat(e.saetze.map((s,i)=>Object.assign({ id:e.idx+'.'+i },s))),[]); }
function signature(level){ return etappen(level).map(e=>e.saetze.length).join('-'); }
function L(){ return SPIEL[state.level]; }
function fill(s, wort, cls){ return fmt(s.satz).replace('___', '<strong'+(cls?' class="'+cls+'"':'')+'>'+esc(wort)+'</strong>'); }
function satzGap(s){ return esc(s.satz).replace('___','<span class="gap">___</span>'); }
function satzPlain(s, wort){ return plain(s.satz).replace('___', wort); }
function regelHTML(regel, level){
  return asList(regel).map(k=>REGELN[k]).filter(Boolean).map(r=>'<p>'+(r.ausnahme?'<span class="star">⭐</span> ':'📌 ')+fmt(r.text)+'</p>'+(spanish(level)&&r.es?'<p class="es small" lang="es">🇨🇱 '+fmt(r.es)+'</p>':'')).join('');
}
function regelPlain(regel){ return asList(regel).map(k=>REGELN[k]).filter(Boolean).map(r=>(r.ausnahme?'⭐ ':'')+plain(r.text)).join(' / '); }
function regelListe(level){
  return '<ul class="regelliste">'+asList(SPIEL[level].regeln).map(k=>REGELN[k]).filter(Boolean).map(r=>'<li class="'+(r.ausnahme?'ausn':'')+'">'+(r.ausnahme?'<span class="star">⭐</span> ':'📌 ')+fmt(r.text)+(spanish(level)&&r.es?'<br><span class="es small" lang="es">🇨🇱 '+fmt(r.es)+'</span>':'')+'</li>').join('')+'</ul>';
}

function dataWarnings(){
  const w=[];
  Object.keys(REGELN).forEach(k=>{ if(!REGELN[k] || !REGELN[k].text) w.push('REGELN '+k+': text fehlt.'); });
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(S==null) return;
    if(!WELTEN.includes(S.welt)) w.push(lv+': welt muss '+WELTEN.join(', ')+' sein.');
    if(!asList(S.etappen).length) w.push(lv+': „etappen“ fehlt.');
    if(!S.boss || !asList(S.boss.saetze).length) w.push(lv+': „boss“ mit Sätzen fehlt.');
    else if(!GEGNER.includes(S.boss.gegner)) w.push(lv+': boss.gegner muss '+GEGNER.join(', ')+' sein.');
    asList(S.regeln).forEach(k=>{ if(!REGELN[k]) w.push(lv+': Regel „'+k+'“ steht nicht in REGELN.'); });
    etappen(lv).forEach(e=>{
      if(!e.saetze.length) w.push(lv+' · '+e.name+': keine Sätze.');
      e.saetze.forEach((s,i)=>{ const where=lv+' · '+e.name+' · Satz '+(i+1)+': ';
        if(!s || typeof s.satz!=='string' || s.satz.split('___').length!==2) w.push(where+'satz braucht genau eine Lücke ___.');
        if(!s || !s.richtig || !s.falsch) w.push(where+'richtig oder falsch fehlt.');
        else if(String(s.richtig).trim()===String(s.falsch).trim()) w.push(where+'richtig und falsch sind gleich.');
        if(!s || !asList(s.regel).length) w.push(where+'regel fehlt.');
        else asList(s.regel).forEach(k=>{ if(!REGELN[k]) w.push(where+'Regel „'+k+'“ steht nicht in REGELN.'); });
      }); });
  });
  return w;
}

/* ---------- Prüfcode ---------- */
function cyrb53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level,pct,k,d,name){ let n=cyrb53(['PS',level,pct,k,d,normName(name),E.geheimwort].join('|')); let s=''; for(let i=0;i<5;i++){ s+=B32[n%32]; n=Math.floor(n/32); } return s; }
function makeCode(level,pct,k,date,name){ const p=n=>String(n).padStart(2,'0'); const d=p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100); return level+'-'+pct+'-'+k+'-'+d+'-'+checksum(level,pct,k,d,name); }
function verifyCode(code,name){
  const m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)-(\d{1,3})-(\d)-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: A2-86-2-151026-K7QFM' };
  return { valid: checksum(m[1],+m[2],+m[3],m[4],name)===m[5], level:m[1], pct:+m[2], k:+m[3], date:m[4].slice(0,2)+'.'+m[4].slice(2,4)+'.20'+m[4].slice(4) };
}

/* ---------- Ton ---------- */
let actx=null;
const SND={ hop:[[520,.05],[700,.06]], ok:[[660,.1],[880,.18]], bad:[[220,.25]], huh:[[330,.1],[260,.16]], boing:[[300,.06],[600,.08],[1000,.12]], kondor:[[784,.1],[988,.1],[1175,.1],[1568,.3]], fanfare:[[523,.15],[659,.15],[784,.15],[1047,.4]], tick:[[600,.03]] };
function sound(n){ if(!settings.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  (SND[n]||[]).forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }

/* ---------- Spielstand ---------- */
function newGame(level){ state={ v:1, level, sig:signature(level), etappe:0, phase:'intro', res:{}, wrong:[], completos:0, kondore:{}, elapsed:0, name:'', finished:null, letzte:null }; save(); }
function loadSaved(){ try{ const s=JSON.parse(lsGet(LS_GAME)||'null'); if(s && s.v===1 && SPIEL[s.level] && s.sig===signature(s.level)) return s; }catch(e){} return null; }
function stats(){ const all=alleSaetze(), ok=all.filter(s=>state.res[s.id]===1).length; return { ok, total:all.length, pct: all.length?Math.round(ok*100/all.length):0, k:Object.keys(state.kondore).length }; }

/* =====================================================================
   SPIELWELT (Canvas 960 × 540)
   ===================================================================== */
const W=960, H=540, GROUND=455, PX=230, PLAT_Y=GROUND-125, PLAT_H=20, PLAT_L=440, GRAV=2400, JUMP=880, BOUNCE=1320, COP_TOP=GROUND-40;

function speed(){ return (E.tempo && E.tempo[settings.tempo]) || 225; }

function startEtappe(){
  const et=etappen()[state.etappe], n=et.saetze.length, S=et.boss?E.abstandBoss:E.abstand;
  G={ et, n, forks:[], obst:[], cop:null, kondor:null, i:0, cam:0, t:0, started:false, paused:false, modal:null, done:false, ending:0,
      p:{ y:GROUND, vy:0, air:false, onPlat:null, drop:0, stumble:0, coyote:0, buffer:0 },
      hearts:E.herzen, bossDist:0, parts:[], okRun:0, bannerT:0, lockUntil:0, kondorJetzt:false };
  const order=shuffle(range(n));
  let x=950;
  order.forEach((si,k)=>{
    const s=et.saetze[si], up=Math.random()<.5;
    G.forks.push({ x, L:PLAT_L, si, s, up, top: up?s.richtig:s.falsch, bot: up?s.falsch:s.richtig, decided:false, choice:null, ok:null });
    if(k<n-1){
      const gs=x+PLAT_L, free0=gs+260, free1=gs+S-360;
      const len=free1-free0;
      if(len>80){ const a=free0+rnd(state.etappe*31+k*7)*Math.min(len,300); G.obst.push(mkObst(a, k)); if(len>650){ const b=a+380+rnd(k*13+5)*(free1-a-380); if(b<free1) G.obst.push(mkObst(b,k+50)); } }
    }
    x+=PLAT_L+S;
  });
  // Kondor (nicht in der Bossrunde)
  if(!et.boss && n>=5){
    const k=1+Math.floor(Math.random()*(n-3)), gs=G.forks[k].x+PLAT_L;
    G.obst=G.obst.filter(o=>o.x<gs || o.x>gs+S);
    G.cop={ x:gs+330, boing:0 }; G.kondor={ x:gs+330+115, y:95, got:false };
  }
  G.ziel=G.forks[n-1].x+PLAT_L+520;
}
function mkObst(x, seed){ const r=rnd(seed+state.etappe*3); return { x, w:26+Math.round(r*10), h:30+Math.round(rnd(seed+9)*12), hit:false }; }

/* ---------- Steuerung ---------- */
function grounded(){ return !G.p.air; }
function jump(){
  if(!G) return;
  if(G.modal){ continueOverlay(); return; }
  if(!G.started){ return; }
  if(G.paused || G.done) return;
  const p=G.p;
  if(grounded() || p.coyote>0) doJump(); else p.buffer=0.14;
}
function doJump(){ const p=G.p; p.vy=-JUMP; p.air=true; p.onPlat=null; p.buffer=0; p.coyote=0; sound('hop'); }
function dropDown(){
  if(!G || G.modal || !G.started || G.paused) return;
  const p=G.p; if(p.onPlat){ p.onPlat=null; p.air=true; p.vy=80; p.drop=0.3; }
}

/* ---------- Physik ---------- */
function step(dt){
  const p=G.p; G.t+=dt;
  if(G.bannerT>0){ G.bannerT-=dt; if(G.bannerT<=0) setBanner(); }
  G.parts.forEach(q=>{ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.life-=dt; }); G.parts=G.parts.filter(q=>q.life>0);
  if(G.cop && G.cop.boing>0) G.cop.boing-=dt;
  if(G.done){ G.ending+=dt; return; }
  const sp=speed()*(p.stumble>0?.45:1);
  G.cam+=sp*dt;
  const px=G.cam+PX, prevY=p.y;
  p.stumble=Math.max(0,p.stumble-dt); p.drop=Math.max(0,p.drop-dt); p.coyote=Math.max(0,p.coyote-dt); p.buffer=Math.max(0,p.buffer-dt);
  if(p.onPlat && (px>p.onPlat.x+p.onPlat.L || px<p.onPlat.x-12)){ p.onPlat=null; p.air=true; p.vy=0; p.coyote=0.1; }
  if(p.buffer>0 && (grounded()||p.coyote>0)) doJump();
  if(p.air){
    p.vy+=GRAV*dt; p.y+=p.vy*dt;
    if(p.vy>0){
      let landed=false;
      if(p.drop<=0) for(const f of G.forks){ if(px>=f.x-12 && px<=f.x+f.L && prevY<=PLAT_Y && p.y>=PLAT_Y){ p.y=PLAT_Y; p.vy=0; p.air=false; p.onPlat=f; landed=true; break; } }
      if(!landed && G.cop && Math.abs(px-G.cop.x)<26 && prevY<=COP_TOP && p.y>=COP_TOP){ p.y=COP_TOP; p.vy=-BOUNCE; G.cop.boing=.3; sound('boing'); landed=true; }
      if(!landed && p.y>=GROUND){ p.y=GROUND; p.vy=0; p.air=false; }
    }
  }
  // Hindernisse
  for(const o of G.obst){
    if(o.hit || p.stumble>0) continue;
    if(px+16>o.x+6 && px-12<o.x+o.w-6 && p.y>GROUND-o.h+6){
      o.hit=true; p.stumble=.7; sound('huh');
      if(state.completos>0){ state.completos--; puff(PX+10, p.y-60, '−1 🌭'); updateHud(); }
    }
  }
  // Kondor
  const k=G.kondor;
  if(k && !k.got){ const dx=(px+4)-k.x, dy=(p.y-30)-k.y; if(dx*dx+dy*dy<65*65){ k.got=true; state.kondore[G.et.idx]=true; G.hearts=Math.min(E.maxHerzen,G.hearts+1); sound('kondor'); toast('🦅 Du hast den Kondor gefunden! +1 ❤️',3500); feathers(k.x-G.cam,k.y); updateHud(); save(); } }
  // Entscheidung
  const f=G.forks[G.i];
  if(f && !f.decided && px>=f.x+f.L-50){ const oben = p.onPlat===f || (p.air && p.y<PLAT_Y+4 && px>=f.x); decide(f, oben); }
  // Ziel
  if(G.i>=G.n && !G.modal && px>=G.ziel){ G.done=true; sound('fanfare'); setTimeout(etappeFertig, ruhig()?300:1200); }
}

function puff(x,y,txt){ G.parts.push({ x, y, vx:0, vy:-40, g:0, life:1.1, txt }); }
function sparkle(x,y){ if(ruhig()) return; for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2; G.parts.push({ x, y, vx:Math.cos(a)*120, vy:Math.sin(a)*120-80, g:300, life:.7, c:['#ffd23f','#ff7f50','#7bed9f'][i%3] }); } }
function feathers(x,y){ if(ruhig()) return; for(let i=0;i<12;i++){ const a=Math.random()*Math.PI*2; G.parts.push({ x, y, vx:Math.cos(a)*90, vy:Math.sin(a)*60, g:60, life:1.4, c:i%2?'#222':'#fff' }); } }

function decide(f, oben){
  f.decided=true; f.choice=oben?'oben':'unten'; f.ok=(oben===f.up); G.i++;
  const s=f.s, id=G.et.idx+'.'+f.si, gewaehlt=oben?f.top:f.bot;
  if(state.res[id]===undefined) state.res[id]=f.ok?1:0;
  if(f.ok){
    state.completos++; G.okRun++; sound('ok'); sparkle(f.x+f.L-60-G.cam, (oben?PLAT_Y:GROUND)-30);
    showBannerOk(f); save(); updateHud();
  } else {
    if(!state.wrong.some(w=>w.id===id)) state.wrong.push({ id, etappe:G.et.name, satz:s.satz, deine:gewaehlt, richtig:s.richtig, regel:s.regel });
    G.hearts--; G.p.stumble=.5; if(G.et.boss) G.bossDist++; sound('bad'); save(); updateHud();
    const bn=$('#banner'); if(bn){ bn.className='banner bad'; }
    openOverlay('<div class="box bad" role="alertdialog" aria-labelledby="ovT"><p class="big badline" id="ovT">✗ Leider falsch – du hast „'+esc(gewaehlt)+'“ gewählt.</p>'+
      '<div class="satzfull">'+fill(s, s.richtig)+'</div>'+regelHTML(s.regel)+
      (G.hearts<=0?'<p class="badline"><strong>💔 Keine Herzen mehr!</strong> Die Etappe beginnt noch einmal.</p>':'<p class="small muted">❤️ noch '+G.hearts+(G.et.boss?' · Der Gegner kommt näher!':'')+'</p>')+
      '<div class="row"><span class="spacer"></span><button type="button" class="primary" id="ovGo">Weiter ➜ <span class="small">(Leertaste)</span></button></div></div>',
      ()=>{ if(G.hearts<=0){ startEtappe(); renderGameDOM(); } else setBanner(); }, 800);
  }
}

/* ---------- Overlays ---------- */
function openOverlay(html, onGo, lock, menu){
  const ov=$('#overlay'); if(!ov) return;
  G.modal={ onGo, menu:!!menu }; G.lockUntil=performance.now()+(lock||0);
  ov.innerHTML=html; ov.hidden=false;
  const b=$('#ovGo',ov); if(b){ b.addEventListener('click',()=>continueOverlay(true)); setTimeout(()=>{ if(G && G.modal && b.isConnected) b.focus({preventScroll:true}); }, Math.min(lock||0,400)); }
}
function closeOverlay(){ const ov=$('#overlay'); if(ov){ ov.hidden=true; ov.innerHTML=''; } if(G) G.modal=null; const cv=$('#cv'); if(cv) cv.focus({preventScroll:true}); }
function continueOverlay(force){
  if(!G || !G.modal) return;
  if(!force && performance.now()<G.lockUntil) return;
  const fn=G.modal.onGo; closeOverlay(); if(fn) fn();
}
function startOverlay(){
  const et=G.et, nE=etappen().length;
  const head = et.boss ? '⚠️ Bossrunde: '+esc(et.name) : 'Etappe '+(et.idx+1)+' von '+(nE-1)+': '+esc(et.name);
  const txt = et.boss ? '<p>'+bossText(et.gegner)+' Jeder Fehler bringt ihn näher – aber du hast '+G.hearts+' Herzen.</p>'
    : '<p>Lies den Satz oben. <strong>Springen</strong> = das obere Wort, <strong>weiterlaufen</strong> = das untere Wort.</p>'+(state.etappe===0?'<p class="small muted">Spring auch über Hindernisse – sonst verlierst du einen Completo. 🦅 Und irgendwo versteckt sich ein Kondor … Vielleicht hilft dir eine rote Blume?</p>':'');
  openOverlay('<div class="box" role="dialog" aria-labelledby="ovT"><p class="big" id="ovT">'+head+'</p>'+txt+
    '<div class="row"><span class="small muted">❤️ '+G.hearts+' Herzen · '+G.n+' Sätze</span><span class="spacer"></span><button type="button" class="primary" id="ovGo">Los! <span class="small">(Leertaste)</span></button></div></div>',
    ()=>{ G.started=true; lastTs=0; }, 250);
}
function bossText(g){ return { sandsturm:'Ein Sandsturm jagt den Pudú durch die Wüste!', moewe:'Eine riesige Möwe will die Completos klauen!', lava:'Der Vulkan bricht aus – ein Lavastrom fließt ins Tal!', schneesturm:'Der Patagonien-Sturm bläst mit voller Kraft!' }[g]||'Der Boss ist da!'; }
function openPause(){
  if(!G || G.modal || G.done) return;
  G.paused=true;
  openOverlay('<div class="box" role="dialog" aria-labelledby="ovT"><p class="big" id="ovT">⏸ Pause</p>'+
    '<p class="small muted">Tempo:</p><div class="tempo">'+TEMPI.map(t=>'<button type="button" data-t="'+t[0]+'" aria-pressed="'+(settings.tempo===t[0])+'">'+t[1]+'</button>').join('')+'</div>'+
    '<details><summary>📌 Regeln ansehen</summary>'+regelListe(state.level)+'</details>'+
    '<div class="row" style="margin-top:.6em"><button type="button" class="primary" id="ovGo">▶ Weiter <span class="small">(P)</span></button><button type="button" id="ovRestart">↺ Etappe neu</button><span class="spacer"></span><button type="button" id="ovMenu">☰ Menü</button></div></div>',
    ()=>{ G.paused=false; lastTs=0; }, 0, true);
  $$('#overlay .tempo button').forEach(b=>b.addEventListener('click',()=>{ settings.tempo=b.dataset.t; saveSettings(); $$('#overlay .tempo button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }));
  $('#ovRestart').addEventListener('click',()=>{ closeOverlay(); startEtappe(); renderGameDOM(); });
  $('#ovMenu').addEventListener('click',()=>{ closeOverlay(); stopLoop(); view='start'; state=null; render(); });
}

/* ---------- Banner und Knöpfe ---------- */
function currentFork(){ return G && G.forks[G.i]; }

/* ---------- Zeichnen ---------- */
let cv=null, ctx=null, scaleK=1;
function resize(){
  cv=$('#cv'); if(!cv) return;
  const wrap=cv.parentElement, top=$('#top').offsetHeight, bn=$('#banner').offsetHeight, ct=$('.ctrl').offsetHeight;
  const availH=Math.max(200, window.innerHeight-top-bn-ct-34), availW=Math.min(app.clientWidth-8, 1060);
  let w=Math.min(availW, availH*16/9); w=Math.max(280,Math.floor(w)); const h=Math.round(w*9/16);
  cv.style.width=w+'px'; cv.style.height=h+'px'; const ov=$('#overlay'); if(ov) ov.classList.toggle('klein', h<400);
  const dpr=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); scaleK=cv.width/W;
  ctx=cv.getContext('2d'); draw();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function ell(x,y,rx,ry,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); ctx.fill(); }
function circ(x,y,r,c){ ell(x,y,r,r,c); }
function poly(pts,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); ctx.fill(); }

const THEME={
  atacama:{ sky:['#5aa0d8','#f7d9a0'], ground:'#d39a5c', ground2:'#b97c43', plat:'#c88a52', platEdge:'#8a5a2b' },
  valparaiso:{ sky:['#6fbbe9','#d9f1ff'], ground:'#8e8b99', ground2:'#6d6a78', plat:'#c0623a', platEdge:'#7a3a20' },
  pucon:{ sky:['#7fc2ee','#e6f6ff'], ground:'#4f9a3c', ground2:'#6b4a2a', plat:'#9a6a3a', platEdge:'#5a3a1a' },
  patagonien:{ sky:['#a9cde8','#eef6fb'], ground:'#eef4f8', ground2:'#b9cad6', plat:'#bfe3f2', platEdge:'#6aa3c0' },
};
function layer(f){ return ruhig()?0:G.cam*f; }
function each(off, period, fn){ const start=Math.floor(off/period)-1; for(let i=start;i<=start+Math.ceil(W/period)+2;i++) fn(i*period-off, i); }

function drawBg(welt){
  const T=THEME[welt]; const g=ctx.createLinearGradient(0,0,0,GROUND); g.addColorStop(0,T.sky[0]); g.addColorStop(1,T.sky[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,GROUND);
  if(welt==='atacama'){
    circ(820,90,42,'#fff3b0');
    each(layer(.12),900,(x,i)=>{ poly([x,GROUND-40, x+250,GROUND-290, x+500,GROUND-40],'#8a6a7a'); poly([x+215,GROUND-255, x+250,GROUND-290, x+285,GROUND-255],'#f4eef2'); poly([x+430,GROUND-40, x+600,GROUND-200, x+770,GROUND-40],'#9c7b88'); });
    each(layer(.4),600,(x,i)=>{ ell(x+150,GROUND,260,70+rnd(i)*40,'#e2b07a'); ell(x+470,GROUND+10,220,60,'#dba26a'); });
  } else if(welt==='valparaiso'){
    ctx.fillStyle='#2f7fb8'; ctx.fillRect(0,GROUND-120,W,40);
    each(layer(.12),700,(x,i)=>{ ell(x+350,GROUND-40,420,150,'#6e8f6a'); for(let j=0;j<9;j++){ ctx.fillStyle=['#e74c3c','#f1c40f','#3498db','#9b59b6','#1abc9c','#e67e22','#ff7eb6'][mod(i*3+j,7)]; ctx.fillRect(x+90+j*58,GROUND-150+Math.abs(j-4)*16,30,22); } });
    const C=['#e74c3c','#f1c40f','#3498db','#9b59b6','#1abc9c','#e67e22','#ff7eb6','#2ecc71'];
    each(layer(.4),420,(x,i)=>{ for(let j=0;j<3;j++){ const hh=110+rnd(i*3+j)*90, hx=x+j*140; ctx.fillStyle=C[mod(i*3+j,8)]; ctx.fillRect(hx,GROUND-hh,110,hh); poly([hx-8,GROUND-hh, hx+55,GROUND-hh-34, hx+118,GROUND-hh],'#8a3324');
      ctx.fillStyle='rgba(255,255,255,.75)'; for(let r=0;r<Math.floor(hh/45);r++){ ctx.fillRect(hx+18,GROUND-hh+16+r*40,20,22); ctx.fillRect(hx+70,GROUND-hh+16+r*40,20,22); } } });
  } else if(welt==='pucon'){
    each(layer(.1),1100,(x,i)=>{ poly([x+100,GROUND-40, x+420,GROUND-320, x+740,GROUND-40],'#6b7d8f'); poly([x+340,GROUND-250, x+420,GROUND-320, x+500,GROUND-250, x+460,GROUND-240, x+420,GROUND-255, x+380,GROUND-238],'#ffffff');
      for(let s=0;s<4;s++){ const tt=ruhig()?s*.25:((G?G.t:0)*.15+s*.25)%1; circ(x+420+tt*60, GROUND-330-tt*140, 18+tt*30, 'rgba(200,200,205,'+(0.7-tt*.6)+')'); } });
    ctx.fillStyle='#4fa3c7'; ctx.fillRect(0,GROUND-70,W,70);
    each(layer(.35),380,(x,i)=>{ const tx=x+80+rnd(i)*120, th=150+rnd(i+3)*70; ctx.fillStyle='#4a3420'; ctx.fillRect(tx-5,GROUND-th,10,th);
      for(let l=0;l<4;l++){ ell(tx,GROUND-th+l*20,62-l*10,10,'#22502c'); } });
  } else {
    each(layer(.1),1000,(x,i)=>{ poly([x,GROUND-60, x+300,GROUND-220, x+620,GROUND-60],'#8d9fb0');
      [[x+230,90,40],[x+300,70,34],[x+360,100,38]].forEach(([tx,top,w])=>{ poly([tx-w/2,GROUND-150, tx-w/3,top, tx+w/3,top-6, tx+w/2,GROUND-150],'#6d6f7a'); poly([tx-w/3,top, tx+w/3,top-6, tx+w/4,top+14, tx-w/4,top+16],'#ffffff'); }); });
    ctx.fillStyle='#58b8c9'; ctx.fillRect(0,GROUND-60,W,60);
    each(layer(.35),520,(x,i)=>{ poly([x,GROUND-60, x+120,GROUND-110-rnd(i)*30, x+260,GROUND-60],'#e8f6fb'); poly([x+120,GROUND-110-rnd(i)*30, x+150,GROUND-80, x+260,GROUND-60],'#bfe0ee'); });
  }
  // Boden
  ctx.fillStyle=T.ground; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle=T.ground2; ctx.fillRect(0,GROUND+22,W,H-GROUND-22);
  const off=G?G.cam:0;
  each(off,80,(x,i)=>{ ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(x+rnd(i)*40,GROUND+34+rnd(i+1)*30,14,6); if(welt==='valparaiso'){ ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.strokeRect(x,GROUND,40,22); ctx.strokeRect(x+40,GROUND,40,22); } });
}

function drawObst(o, welt){
  const x=o.x-G.cam, b=GROUND; if(x<-80||x>W+80) return;
  if(welt==='atacama'){ ctx.fillStyle='#3f8f4f'; rr(x+o.w/2-8,b-o.h,16,o.h,7); ctx.fill(); rr(x,b-o.h*.75,8,o.h*.4,4); ctx.fill(); rr(x+o.w-8,b-o.h*.85,8,o.h*.45,4); ctx.fill(); ctx.fillRect(x+4,b-o.h*.45,o.w-8,6); }
  else if(welt==='valparaiso'){ ctx.fillStyle='#b07a3a'; ctx.fillRect(x,b-o.h,o.w,o.h); ctx.strokeStyle='#6a4520'; ctx.lineWidth=3; ctx.strokeRect(x+1.5,b-o.h+1.5,o.w-3,o.h-3); ctx.beginPath(); ctx.moveTo(x,b-o.h); ctx.lineTo(x+o.w,b); ctx.stroke(); }

function sign(x,y,txt,state){
  ctx.font='bold 30px Arial'; const w=Math.max(84, ctx.measureText(txt).width+28);
  ctx.fillStyle= state==='ok'?'#c9f7d9':state==='bad'?'#ffd0d0':'#fff7d6'; rr(x,y,w,44,10); ctx.fill();

function drawFork(f, welt){
  const x=f.x-G.cam; if(x>W+60 || x+f.L<-200) return;
  const T=THEME[welt];
  // Pfeiler
  ctx.fillStyle=T.platEdge; ctx.fillRect(x+30,PLAT_Y+PLAT_H,10,GROUND-PLAT_Y-PLAT_H); ctx.fillRect(x+f.L-40,PLAT_Y+PLAT_H,10,GROUND-PLAT_Y-PLAT_H);
  ctx.fillStyle=T.plat; rr(x,PLAT_Y,f.L,PLAT_H,6); ctx.fill(); ctx.fillStyle=T.platEdge; ctx.fillRect(x+4,PLAT_Y+PLAT_H-5,f.L-8,5);
  const st=w=>!f.decided?'':((f.choice===w)?(f.ok?'ok':'bad'):'');
  sign(x+52,PLAT_Y-56,f.top,st('oben'));
  ctx.strokeStyle='#5a4a2a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+70,PLAT_Y+PLAT_H); ctx.lineTo(x+70,PLAT_Y+PLAT_H+16); ctx.moveTo(x+120,PLAT_Y+PLAT_H); ctx.lineTo(x+120,PLAT_Y+PLAT_H+16); ctx.stroke();
  sign(x+52,PLAT_Y+PLAT_H+14,f.bot,st('unten'));
  // Completos am Ende beider Wege
  const cx=x+f.L-60;
  [['oben',PLAT_Y-24],['unten',GROUND-24]].forEach(([w,y])=>{
    if(f.decided && f.choice===w){ if(!f.ok){ ctx.globalAlpha=.35; completo(cx,y); ctx.globalAlpha=1; ctx.font='bold 26px Arial'; ctx.fillStyle='#c0392b'; ctx.fillText('✗',cx-8,y-18); } }
    else completo(cx,y);
  });
}
function completo(x,y){
  ell(x,y+4,26,10,'#e8b56a'); ell(x,y-2,28,6,'#9c4a2e'); ell(x,y-6,22,5,'#8ccf5a');
  for(let i=-2;i<=2;i++) circ(x+i*9,y-9,3.6,'#e23b2e');
  ctx.strokeStyle='#fff'; ctx.lineWidth=2.4; ctx.beginPath(); for(let i=0;i<=8;i++){ ctx.lineTo(x-20+i*5,y-12+(i%2?4:0)); } ctx.stroke();
}
function pudu(x,y,t,run,air,stumble){
  ctx.save();
  if(stumble>0 && !ruhig()){ ctx.translate(x,y); ctx.rotate(Math.sin(t*30)*.12); ctx.translate(-x,-y); }
  if(stumble>0 && Math.floor(t*12)%2===0) ctx.globalAlpha=.55;
  const ph=run&&!air ? Math.sin(t*16) : 0;
  ctx.strokeStyle='#5a3a20'; ctx.lineWidth=5; ctx.lineCap='round';
  const legs=[[-14,ph],[-8,-ph],[10,-ph],[16,ph]];
  legs.forEach(([lx,s])=>{ ctx.beginPath(); ctx.moveTo(x+lx,y-16); ctx.lineTo(x+lx+(air?(lx<0?-6:6):s*7),y-(air?6:0)); ctx.stroke(); });
  ell(x,y-27,25,15,'#8a5a32'); ell(x+2,y-21,17,7,'#a87a4c');
  circ(x-24,y-32,4,'#6e4424');
  ell(x+20,y-42,9,8,'#8a5a32');
  circ(x+25,y-45,12,'#94633a'); ell(x+35,y-40,8,6,'#7a4e2a'); circ(x+41,y-42,3,'#1a1a1a');
  ell(x+14,y-55,4,8,'#7a4e2a');
  circ(x+27,y-48,3.2,'#111'); circ(x+28,y-49,1,'#fff');
  ctx.strokeStyle='#e0cfa6'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+21,y-55); ctx.lineTo(x+19,y-64); ctx.moveTo(x+27,y-56); ctx.lineTo(x+28,y-65); ctx.stroke();
  ctx.restore();
}
function kondorDraw(x,y,t){
  const fl=ruhig()?0:Math.sin(t*4)*14;
  poly([x-6,y-2, x-60,y-10-fl, x-30,y+6],'#1b1b1b'); poly([x+6,y-2, x+58,y-12-fl, x+30,y+6],'#1b1b1b');
  poly([x-40,y-4-fl*.6, x-58,y-9-fl, x-30,y+2],'#f2f2f2'); poly([x+40,y-6-fl*.6, x+56,y-11-fl, x+30,y+2],'#f2f2f2');
  ell(x,y,24,10,'#222'); circ(x+18,y-4,7,'#fafafa'); circ(x+26,y-7,5,'#c9867a'); poly([x+30,y-8, x+37,y-5, x+30,y-4],'#e8d6a0');
}
function cloud(x,y){ circ(x,y,26,'rgba(255,255,255,.92)'); circ(x+28,y-10,30,'rgba(255,255,255,.92)'); circ(x+60,y,24,'rgba(255,255,255,.92)'); ell(x+30,y+10,50,16,'rgba(255,255,255,.92)'); }
function copihue(x,b){
  const sq=b>0?.75:1;
  ctx.strokeStyle='#2f7a35'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x,GROUND); ctx.quadraticCurveTo(x-10,GROUND-20,x,COP_TOP+6); ctx.stroke();
  ell(x-12,GROUND-14,9,4,'#3f9a46'); ell(x+12,GROUND-22,9,4,'#3f9a46');
  ctx.save(); ctx.translate(x,COP_TOP+8); ctx.scale(1,sq);
  poly([-20,-14, 20,-14, 14,10, 0,14, -14,10],'#d62a3d'); poly([-20,-14, 20,-14, 12,-20, -12,-20],'#a51d2d');

function flagge(x){

function bossDraw(g,x,t){
  const w=ruhig()?0:t;
  if(g==='sandsturm'){ for(let i=0;i<9;i++){ const a=w*2+i*.7; circ(x+40+Math.cos(a)*40, GROUND-170+i*19+Math.sin(a)*12, 40-i, 'rgba(165,110,55,'+(.4+i*.05)+')'); } }
  else if(g==='moewe'){ const y=GROUND-200+Math.sin(w*3)*12, fl=Math.sin(w*8)*20;
    poly([x+10,y, x-50,y-40-fl, x+30,y-10],'#cfd6dc'); ell(x+30,y+10,48,24,'#fafafa'); circ(x+78,y-10,22,'#fafafa'); poly([x+96,y-12, x+130,y-4, x+96,y-2],'#f3b51b');
    circ(x+86,y-16,4.5,'#111'); ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+78,y-26); ctx.lineTo(x+94,y-21); ctx.stroke(); poly([x+10,y+6, x-60,y-20+fl, x+20,y+20],'#b9c3cb'); }
  else if(g==='lava'){ ctx.fillStyle='#e8461e'; ctx.beginPath(); ctx.moveTo(-10,H); ctx.lineTo(-10,GROUND-90); for(let i=0;i<=8;i++){ ctx.lineTo(x-60+i*16, GROUND-90+Math.sin(w*4+i)*12+(i===8?60:0)); } ctx.lineTo(x+80,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,210,60,.7)'; for(let i=0;i<5;i++) circ(x-40+i*22, GROUND-60+Math.sin(w*3+i)*8, 6, 'rgba(255,220,80,.8)'); }
  else { for(let i=0;i<10;i++){ const a=w*2.5+i*.6; circ(x+40+Math.cos(a)*44, GROUND-170+i*17+Math.sin(a)*10, 30-i, 'rgba(255,255,255,'+(.35+i*.04)+')'); }
    ctx.fillStyle='#fff'; for(let i=0;i<14;i++) circ(x-20+mod(i*53+w*90,300), 60+mod(i*71+w*60,320), 2.5, '#fff'); }
}

function draw(){
  if(!ctx || !G) return;
  const welt=L().welt;
  ctx.setTransform(scaleK,0,0,scaleK,0,0);
  drawBg(welt);
  if(G.ziel-G.cam<W+120) flagge(G.ziel-G.cam);
  G.forks.forEach(f=>drawFork(f,welt));
  if(G.cop){ const x=G.cop.x-G.cam; if(x>-60&&x<W+60) copihue(x,G.cop.boing); }
  G.obst.forEach(o=>drawObst(o,welt));
  const k=G.kondor; if(k && !k.got){ const x=k.x-G.cam; if(x>-90&&x<W+90){ kondorDraw(x,k.y,G.t); cloud(x-50,k.y+18); } }
  const p=G.p; pudu(PX,p.y,G.t,G.started&&!G.paused&&!G.modal,p.air,p.stumble);
  if(G.et.boss){ const bx=G.done?-30-G.ending*300:-30+Math.min(G.bossDist,4)*36+(ruhig()?0:Math.sin(G.t*2)*8); bossDraw(G.et.gegner,bx,G.t); }
  G.parts.forEach(q=>{ ctx.globalAlpha=Math.max(0,Math.min(1,q.life*1.5)); if(q.txt){ ctx.font='bold 24px Arial'; ctx.fillStyle='#c0392b'; ctx.fillText(q.txt,q.x,q.y); } else circ(q.x,q.y,4,q.c); ctx.globalAlpha=1; });
  // Herzen im Bild
  ctx.font='26px Arial'; for(let i=0;i<Math.max(E.herzen,G.hearts);i++){ ctx.globalAlpha=i<G.hearts?1:.25; ctx.fillText('❤️',W-44-i*34,40); } ctx.globalAlpha=1;
}

/* ---------- Schleife ---------- */
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!G) return;
  if(!lastTs) lastTs=ts;
  let dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts;
  const running=G.started && !G.paused && !G.modal;
  if(running && !document.hidden){ state.elapsed+=dt*1000; let rem=dt*ZEITRAFFER; while(rem>1e-6 && G && !G.modal && !G.paused){ const d=Math.min(rem,1/120); step(d); rem-=d; } }
  else if(G.parts.length){ G.parts.forEach(q=>{ q.life-=dt; }); G.parts=G.parts.filter(q=>q.life>0); }
  draw();
  if(Math.floor(state.elapsed/1000)!==G._sec){ G._sec=Math.floor(state.elapsed/1000); const c=$('#clock'); if(c) c.textContent='⏱ '+fmtTime(state.elapsed); }
}
function startLoop(){ cancelAnimationFrame(raf); lastTs=0; raf=requestAnimationFrame(frame); }
function stopLoop(){ cancelAnimationFrame(raf); raf=0; G=null; }

function etappeFertig(){
  if(!G || !state) return;
  const et=G.et, ids=range(G.n).map(i=>et.idx+'.'+i);
  state.letzte={ name:et.name, boss:et.boss, ok:G.okRun, n:G.n, kondor:!!(G.kondor&&G.kondor.got), mitKondor:!!G.kondor };
  stopLoop();
  state.etappe++;
  state.phase = state.etappe>=etappen().length ? 'name' : 'zwischen';
  save(); render();
}

  const nE=etappen().length, et=Math.min(state.etappe,nE-1), boss=etappen()[et].boss;

}

function render(){
  if(location.hash==='#lehrer'){ stopLoop(); renderTeacher(); updateHud(); return; }
  if(view==='start' || !state){ stopLoop(); renderStart(); }
  else if(state.phase==='intro') renderIntro();
  else if(state.phase==='etappe') renderGame();
  else if(state.phase==='zwischen') renderZwischen();
  else if(state.phase==='name') renderName();

  updateHud();
}

function renderName(){
  app.innerHTML='<section class="card narrow"><h1>🏁 Alle Etappen geschafft!</h1><p>Schreib deinen Namen für das Ergebnis und den Prüfcode.</p>'+
    '<p class="row"><label for="nameIn">Dein Name:</label> <input '+INPUT_ATTR+' id="nameIn" maxlength="60" style="flex:1;min-width:220px" placeholder="Vorname Nachname"></p><div id="nameFb" role="status"></div>'+
    '<div class="row"><span class="spacer"></span><button type="button" class="primary" id="btnName">Ergebnis anzeigen ➜</button></div></section>';
  const go=()=>{ const n=$('#nameIn').value.trim().replace(/\s+/g,' '); if(normName(n).length<2){ $('#nameFb').innerHTML='<p class="badline">Bitte schreib deinen Namen.</p>'; return; } state.name=n; state.finished=new Date().toISOString(); state.phase='end'; save(); render(); };
  $('#btnName').addEventListener('click',go); $('#nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); focusEl('#nameIn');
}
function renderResult(){
  const s=stats(), d=new Date(state.finished), code=makeCode(state.level,s.pct,s.k,d,state.name), nK=etappen().length-1;
  const rows=[['Name',state.name],['Niveau',state.level+' – '+L().titel],['Richtig beim ersten Versuch',s.ok+' von '+s.total+' Sätzen'],['Prozent',s.pct+' %'],['Completos 🌭',state.completos],['Kondore 🦅',s.k+' von '+nK],['Zeit',fmtTime(state.elapsed)+' min'],['Datum',fmtDate(d)]];
  let h='<section class="card narrow"><h1>🏆 Dein Ergebnis</h1>'+
    '<table class="restable">'+rows.map(r=>'<tr><th scope="row">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table>'+
    '<p style="margin-bottom:0">Prüfcode:</p><div class="bigcode">'+esc(code)+'</div><p class="small muted">Mach einen Screenshot oder kopiere das Ergebnis und gib es in Google Classroom ab.</p>'+
    '<div class="row"><button type="button" class="primary" id="btnCopy">📋 Ergebnis kopieren</button><button type="button" id="btnNew">↺ Neues Spiel</button><span id="copyFb" role="status" class="okline"></span></div>'+
    '<h2 style="margin-top:1em">Falsch beim ersten Versuch ('+state.wrong.length+')</h2>';
  h += state.wrong.length ? '<ol class="wronglist">'+state.wrong.map(w=>'<li><span class="muted small">'+esc(w.etappe)+'</span><br>'+fill(w,w.richtig,'okline')+'<br><span class="badline">✗ Deine Antwort: '+esc(w.deine)+'</span>'+regelHTML(w.regel)+'</li>').join('')+'</ol>' : '<p class="okline">✓ Keine Fehler – super!</p>';
  app.innerHTML=h+'</section>';
  $('#btnCopy').addEventListener('click',()=>copyText(resultText(code,s,d)));
  $('#btnNew').addEventListener('click',()=>bestaetigen('Neues Spiel starten? Dieses Ergebnis wird gelöscht. Hast du schon einen Screenshot gemacht?', ()=>{ lsDel(LS_GAME); state=null; view='start'; render(); }));
  focusEl('#btnCopy');
}
function resultText(code,s,d){
  let t='Pudú-Sprung – haben oder sein?\nName: '+state.name+'\nNiveau: '+state.level+' – '+L().titel+
    '\nRichtig beim ersten Versuch: '+s.ok+' / '+s.total+' ('+s.pct+' %)\nCompletos: '+state.completos+'\nKondore: '+s.k+' von '+(etappen().length-1)+'\nZeit: '+fmtTime(state.elapsed)+' min\nDatum: '+fmtDate(d)+'\nPrüfcode: '+code+'\n';
  t+='\nFalsch beim ersten Versuch ('+state.wrong.length+'):\n'+(state.wrong.length?state.wrong.map((w,i)=>(i+1)+'. '+satzPlain(w,w.richtig)+'\n   Meine Antwort: '+w.deine+'\n   Regel: '+regelPlain(w.regel)).join('\n'):'–');
  return t;
}
function copyText(t){
  const done=()=>{ $('#copyFb').textContent='✓ Kopiert! Jetzt in Google Classroom einfügen (Strg + V).'; };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('#copyFb').textContent='Kopieren hat nicht geklappt – bitte Screenshot machen.'; } ta.remove(); };
  let settled=false; const once=f=>()=>{ if(!settled){ settled=true; f(); } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(once(done),once(fallback)); setTimeout(once(fallback),800); } else once(fallback)(); }catch(e){ once(fallback)(); }
}

/* ---------- Lehrkraft ---------- */
function renderTeacher(){
  app.innerHTML='<section class="card narrow"><h1>🔎 Prüfcode kontrollieren</h1><p class="muted">Für Lehrkräfte. Name so eingeben, wie er im Ergebnis steht (Groß-/Kleinschreibung, Akzente und Leerzeichen sind egal).</p>'+
    '<p><label for="tName">Name</label><br><input '+INPUT_ATTR+' id="tName" style="width:100%"></p><p><label for="tCode">Prüfcode</label><br><input '+INPUT_ATTR+' id="tCode" style="width:100%" placeholder="z. B. A2-86-2-151026-K7QFM"></p>'+
    '<div class="row"><button type="button" class="primary" id="tCheck">Prüfen</button><span class="spacer"></span><button type="button" id="tBack">← Zurück zum Spiel</button></div><div id="tRes" role="status" aria-live="polite" style="margin-top:.8em"></div></section>'+
    '<section class="card narrow"><h2>ℹ️ Gut zu wissen</h2><ul>'+
    '<li><strong>Prüfcode:</strong> Niveau – Prozent – Zahl der gefundenen Kondore – Datum – Kontrollzeichen.</li>'+
    '<li><strong>Prozent:</strong> Sätze, die beim <em>ersten</em> Versuch richtig waren. Muss eine Etappe wiederholt werden (alle Herzen weg), zählen die Wiederholungen nicht mehr.</li>'+
    '<li><strong>Completos</strong> sind nur zum Spaß: einer pro richtigem Sprung, einer weniger bei jedem Hindernis.</li>'+
    '<li><strong>Kondore</strong> sind versteckt (auf die rote Copihue-Blume springen) und für das Ergebnis nicht nötig.</li>'+
    '<li><strong>Tempo</strong> (langsam/normal/schnell) können die Lernenden jederzeit in der Pause ändern; es beeinflusst die Punkte nicht.</li></ul></section>'+
    '<section class="card narrow"><h2>📚 Alle Sätze</h2>'+LEVELS.filter(lv=>SPIEL[lv]).map(lv=>'<details><summary>'+lv+' · '+esc(SPIEL[lv].titel)+' ('+alleSaetze(lv).length+' Sätze)</summary>'+
      etappen(lv).map(e=>'<h3>'+(e.boss?'⚠️ Boss: ':'')+esc(e.name)+'</h3><ol class="lsatz">'+e.saetze.map(s=>'<li>'+fill(s,s.richtig,'okline')+' <span class="small muted">(falsch: '+esc(s.falsch)+' · '+esc(regelPlain(s.regel))+')</span></li>').join('')+'</ol>').join('')+'</details>').join('')+'</section>';
  const go=()=>{ const r=verifyCode($('#tCode').value,$('#tName').value);
    $('#tRes').innerHTML = r.valid ? '<p class="tipbox ok"><strong>✓ Der Code ist gültig.</strong><br>Niveau <strong>'+r.level+'</strong> · <strong>'+r.pct+' %</strong> · <strong>'+r.k+' Kondore</strong> · '+r.date+'</p>'
      : '<p class="tipbox bad"><strong>✗ Der Code ist nicht gültig.</strong><br>'+esc(r.reason||'Name oder Code passen nicht zusammen.')+'</p>'; };
  $('#tCheck').addEventListener('click',go); ['#tName','#tCode'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
  $('#tBack').addEventListener('click',()=>{ history.replaceState(null,'',location.pathname+location.search); render(); });
  focusEl('#tName');
}

/* ---------- Tastatur ---------- */
document.addEventListener('keydown',e=>{
  if(!G || view!=='game' || state.phase!=='etappe' || location.hash) return;
  const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(document.querySelector('.confirmbox')) return;
  const k=e.key;
  if(G.modal && G.modal.menu){
    if(k==='Escape'||k==='p'||k==='P'){ e.preventDefault(); continueOverlay(true); }
    return;
  }
  if(k===' '||k==='Spacebar'||k==='ArrowUp'||k==='w'||k==='W'||k==='Enter'){ e.preventDefault(); if(e.repeat) return; jump(); }
  else if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); dropDown(); }
  else if(k==='Escape'||k==='p'||k==='P'){ e.preventDefault(); if(G.started) openPause(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden && G && G.started && !G.modal && !G.done) openPause(); });
window.addEventListener('blur',()=>{ if(G && G.started && !G.modal && !G.done && !EINGEBETTET) openPause(); });
window.addEventListener('resize',()=>{ if(G) resize(); });

/* ---------- Start ---------- */
(function init(){
  try{ const s=JSON.parse(lsGet(LS_SET)||'{}'); if(s.sound) settings.sound=true; if(s.anim===false) settings.anim=false; if(E.tempo[s.tempo]) settings.tempo=s.tempo; }catch(e){}
  const sb=$('#btnSound'), ab=$('#btnAnim');
  const upd=()=>{ sb.textContent=settings.sound?'🔊 Ton an':'🔇 Ton aus'; sb.setAttribute('aria-pressed',String(settings.sound));
    ab.textContent=settings.anim?'🎞 Animationen an':'🎞 Animationen aus'; ab.setAttribute('aria-pressed',String(!settings.anim)); };
  upd();
  sb.addEventListener('click',()=>{ settings.sound=!settings.sound; saveSettings(); upd(); sound('ok'); });
  ab.addEventListener('click',()=>{ settings.anim=!settings.anim; saveSettings(); upd(); toast(settings.anim?'🎞 Animationen sind wieder an.':'🎞 Animationen sind aus – der Hintergrund bewegt sich nicht mehr, keine Effekte.'); });
  $('#btnMenu').addEventListener('click',()=>{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); stopLoop(); view='start'; state=null; render(); });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
