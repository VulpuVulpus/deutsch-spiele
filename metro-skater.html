<script>
/* =====================================================================
   AB HIER: SPIEL-LOGIK (muss nicht geändert werden)
   ===================================================================== */
const E = EINSTELLUNGEN;
const LEVELS = ['A2','B1','B2','C1'];
const LS_GAME = 'metroskater.spiel.v1', LS_SET = 'metroskater.einstellungen.v1', LS_REK = 'metroskater.rekord.v1';
const TEMPI = [['langsam','🐢 langsam'],['normal','🛹 normal'],['schnell','⚡ schnell']];
const TEMPO_ZIFFER = { langsam:1, normal:2, schnell:3 };
const LANE_NAME = ['links','Mitte','rechts'];

const app = document.getElementById('app');
let state=null, view='start', settings={ sound:false, anim:true, tempo:'normal' };
let G=null, raf=0, lastTs=0, ZEITRAFFER=1, endlosLevel=null, endlosErgebnis=null;

/* ---------- Speicher ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }
function save(){ if(state) lsSet(LS_GAME, JSON.stringify(state)); }
function saveSettings(){ lsSet(LS_SET, JSON.stringify(settings)); }
function rekorde(){ try{ return JSON.parse(lsGet(LS_REK)||'{}')||{}; }catch(e){ return {}; } }

/* ---------- Helfer ---------- */
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function paras(s){ return String(s||'').split(/\n\s*\n/).map(p => '<p>'+fmt(p)+'</p>').join(''); }
function asList(x){ return x==null ? [] : (Array.isArray(x) ? x : [x]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function range(n){ return Array.from({length:n},(_,i)=>i); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function mod(a,n){ return ((a%n)+n)%n; }
function rnd(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
function focusEl(sel){ const el = sel ? (typeof sel==='string'?$(sel):sel) : null; (el||app).focus({preventScroll:true}); }
let toastT=null;
function toast(msg, ms){ const t=$('#toast'); t.innerHTML=fmt(msg); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, ms||2500); }
function ruhig(){ return !settings.anim || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function spanish(level){ return !!E.spanischeHilfe[level]; }

/* ---------- Eingebettet (z. B. Google Sites) ---------- */
const EINGEBETTET = (()=>{ try { return window.self!==window.top; } catch(e){ return true; } })();
if(EINGEBETTET) document.documentElement.classList.add('eingebettet');
function bestaetigen(msg, ok){
  const d=document.createElement('div'); d.className='confirmbox'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="cb"><p></p><div class="cbrow"><button type="button" class="cbno">Abbrechen</button><button type="button" class="primary cbyes">Ja</button></div></div>';
  d.querySelector('p').textContent=msg; document.body.appendChild(d);
  const close=()=>d.remove();
  d.querySelector('.cbno').addEventListener('click',close);
  d.querySelector('.cbyes').addEventListener('click',()=>{ close(); ok(); });
  d.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  d.querySelector('.cbno').focus();
}

/* ---------- Daten ---------- */
function items(level){ return asList(SPIEL[level].aufgaben).map((a,i)=>Object.assign({ id:String(i) },a)); }
function item(level,id){ return items(level)[+id]; }
function signature(level){ return String(items(level).length); }
function teile(w){ return String(w).split(' … '); }
function fill(a, wort, cls){
  const t=teile(wort); let i=0;
  return fmt(a.satz).replace(/___/g, ()=>'<strong'+(cls?' class="'+cls+'"':'')+'>'+esc(t[Math.min(i++,t.length-1)])+'</strong>');
}
function fillPlain(a, wort){ const t=teile(wort); let i=0; return plain(a.satz).replace(/___/g, ()=>t[Math.min(i++,t.length-1)]); }
function satzGap(a){ return esc(a.satz).replace(/___/g,'<span class="gap">___</span>'); }
function erklaerung(a, level){ return (a.info?'<span>📌 '+fmt(a.info)+'</span>':'')+(a.es&&spanish(level)?'<br><span class="es" lang="es">🇨🇱 '+fmt(a.es)+'</span>':''); }
function startIdx(level){ const i=LINIE.indexOf(SPIEL[level].start); return i<0?0:i; }

function dataWarnings(){
  const w=[];
  if(!Array.isArray(LINIE) || LINIE.length<2) w.push('LINIE braucht mindestens zwei Stationen.');
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(S==null) return;
    if(!asList(S.aufgaben).length) w.push(lv+': „aufgaben“ fehlt.');
    if(S.start && LINIE.indexOf(S.start)<0) w.push(lv+': Station „'+S.start+'“ steht nicht in LINIE.');
    asList(S.aufgaben).forEach((a,i)=>{ const where=lv+' · Aufgabe '+(i+1)+': ';
      const n=a&&typeof a.satz==='string' ? a.satz.split('___').length-1 : 0;
      if(n<1 || n>2) w.push(where+'satz braucht ___ (eine oder zwei Lücken).');
      if(!a || !a.richtig) w.push(where+'richtig fehlt.');
      const f=asList(a&&a.falsch); if(f.length!==2) w.push(where+'falsch braucht genau zwei Antworten.');
      if(a && f.some(x=>String(x).trim()===String(a.richtig).trim())) w.push(where+'eine falsche Antwort ist gleich der richtigen.');
      if(a && f[0]===f[1]) w.push(where+'die beiden falschen Antworten sind gleich.');
      if(a && n===2 && [a.richtig].concat(f).some(x=>teile(x).length!==2)) w.push(where+'bei zwei Lücken bitte die Antworten mit " … " trennen.');
      if(a && !a.info) w.push(where+'info (Erklärung) fehlt.');
    }); });
  return w;
}

/* ---------- Prüfcode ---------- */
function cyrb53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level,pct,k,d,name){ let n=cyrb53(['MS',level,pct,k,d,normName(name),E.geheimwort].join('|')); let s=''; for(let i=0;i<5;i++){ s+=B32[n%32]; n=Math.floor(n/32); } return s; }
function makeCode(level,pct,k,date,name){ const p=n=>String(n).padStart(2,'0'); const d=p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100); return level+'-'+pct+'-'+k+'-'+d+'-'+checksum(level,pct,k,d,name); }
function verifyCode(code,name){
  const m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)-(\d{1,3})-(\d)-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: A2-87-2-211026-K7QFM' };
  return { valid: checksum(m[1],+m[2],+m[3],m[4],name)===m[5], level:m[1], pct:+m[2], k:+m[3], date:m[4].slice(0,2)+'.'+m[4].slice(2,4)+'.20'+m[4].slice(4) };
}

/* ---------- Ton ---------- */
let actx=null;
const SND={ hop:[[520,.05],[700,.06]], swish:[[400,.04]], ok:[[660,.1],[880,.18]], bad:[[220,.25]], crash:[[180,.12],[120,.2]], pick:[[880,.05]], mote:[[523,.08],[659,.08],[784,.15]], station:[[659,.15],[523,.25]], fanfare:[[523,.15],[659,.15],[784,.15],[1047,.4]] };
function sound(n){ if(!settings.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  (SND[n]||[]).forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }

/* ---------- Spielstand (Unterricht) ---------- */
function newGame(level){ state={ v:1, level, sig:signature(level), phase:'intro', queue:shuffle(items(level).map(a=>a.id)), pos:0, repeated:{}, res:{}, wrong:[], completos:0, elapsed:0, name:'', finished:null }; save(); }
function loadSaved(){ try{ const s=JSON.parse(lsGet(LS_GAME)||'null'); if(s && s.v===1 && SPIEL[s.level] && s.sig===signature(s.level)) return s; }catch(e){} return null; }
function stats(){ const all=items(state.level), ok=all.filter(a=>state.res[a.id]===1).length; return { ok, total:all.length, pct: all.length?Math.round(ok*100/all.length):0 }; }

/* =====================================================================
   3D-METRO (Canvas 960 × 540, einfache Perspektive)
   ===================================================================== */
const W=960, H=540, HY=150, K=418, CAMH=3.83, ZP=5, ZN=1.3, ZF=105, WALL=4.1, CEIL=4.6, LX=[-2.2,0,2.2];
function proj(X,h,z){ return [W/2+X*K/z, HY+(CAMH-h)*K/z]; }
function sc(z){ return K/z; }

function startFahrt(mode, level){
  const lv=level||state.level;
  G={ mode, level:lv, d:0, v:0, X:0, lane:1, h:0, vh:0, duck:0, stumble:0, inv:0, slow:0, objs:[], stations:[], gate:null, q:null, t:0,
      started:false, paused:false, modal:null, done:false, parts:[], hearts:E.endlos.herzen, okCount:0, wrongCount:0, score:0, completos:0,
      answered:0, stationNr:0, bannerT:0, lockUntil:0, pool:[], seq:0, lastSpawnEnd:12 };
  if(mode==='endlos'){ G.v=E.endlos.startV; G.pool=shuffle(items(lv).map(a=>a.id)); }
  else { G.v=tempoCfg().v; G.answered=state.pos; G.stationNr=Math.floor(state.pos/E.aufgabenProStation); }
  neueAufgabe(true);
}
function tempoCfg(){ return E.tempo[settings.tempo]||E.tempo.normal; }
function lesezeit(){ return G.mode==='endlos' ? Math.max(E.endlos.minLesen, tempoCfg().lesen - G.okCount*0.08) : tempoCfg().lesen; }
function currentV(){ return (G.mode==='endlos'?G.v:tempoCfg().v)*(G.slow>0?.65:1)*(G.stumble>0?.55:1); }
function stationName(nr){
  const s=startIdx(G.level), L=LINIE.length;
  if(G.mode!=='endlos') return LINIE[Math.min(L-1, s+nr)];
  const p=mod(s+nr, 2*(L-1)); return LINIE[p<L ? p : 2*(L-1)-p];
}

function naechsteId(){
  if(G.mode==='endlos'){ if(!G.pool.length) G.pool=shuffle(items(G.level).map(a=>a.id)); return G.pool.shift(); }
  return state.pos<state.queue.length ? state.queue[state.pos] : null;
}
function neueAufgabe(first){
  const id=naechsteId();
  if(id==null){ fahrtEnde(); return; }
  const a=item(G.level,id), opts=shuffle([a.richtig].concat(asList(a.falsch)));
  const dist=Math.max(40, (G.mode==='endlos'?G.v:tempoCfg().v)*lesezeit()) + (first?20:0);
  const gs=G.d+dist;
  G.q={ id, a, opts, wiederholung: G.mode!=='endlos' && state.res[id]!==undefined };
  G.gate={ type:'gate', s:gs, opts, passed:false };
  G.objs=G.objs.filter(o=>o.s>G.d-8);
  G.objs.push(G.gate);
  spawnHindernisse(Math.max(G.d+14, G.lastSpawnEnd), gs-24);
  G.lastSpawnEnd=gs+10;
  setBanner();
}
function spawnHindernisse(a, b){
  const dichte = G.mode==='endlos' ? Math.min(.85, .45+G.okCount*.02) : .5;
  let s=a;
  while(s<b-4){
    const gap=16+Math.random()*10*(1.2-dichte); s+=gap; if(s>b-4) break;
    if(Math.random()>dichte+.25){ // Completo-Reihe
      const ln=Math.floor(Math.random()*3); for(let k=0;k<5;k++) G.objs.push({ type:'completo', s:s+k*2.2, lane:ln }); s+=10; continue; }
    const zwei = Math.random()<(G.mode==='endlos'?.25+G.okCount*.01:.2);
    const lanes=shuffle([0,1,2]).slice(0, zwei?2:1), frei=[0,1,2].find(l=>!lanes.includes(l));
    let maxLen=0.6;
    lanes.forEach(ln=>{ const r=Math.random(); let type= r<.32?'barrera': r<.58?'balken': r<.78?'stuhl':'zug';
      if(type==='zug' && s+14>b) type='barrera';
      const len = type==='zug'?14 : .7; maxLen=Math.max(maxLen,len);
      G.objs.push({ type, s, lane:ln, len, hit:false }); });
    if(Math.random()<.5){ for(let k=0;k<3;k++) G.objs.push({ type:'completo', s:s+k*2.2, lane:frei }); }
    if(Math.random()<.06) G.objs.push({ type:'mote', s:s+6, lane:frei });
    s+=maxLen;
  }
}
function spawnStation(){
  G.stationNr++; const name=stationName(G.stationNr);
  G.stations.push({ s0:G.d+16, s1:G.d+76, name });
  toast('🚇 Estación '+name, 2200); sound('station');
}

/* ---------- Steuerung ---------- */
function spur(dir){ if(!aktiv()) return; const nl=clamp(G.lane+dir,0,2); if(nl!==G.lane){ G.lane=nl; sound('swish'); } }
function springen(){ if(!G) return; if(G.modal){ continueOverlay(); return; } if(!aktiv()) return; if(G.h<=0.001){ G.vh=7.5; G.duck=0; sound('hop'); } }
function ducken(){ if(!aktiv()) return; G.duck=0.8; if(G.h>0.01) G.vh=Math.min(G.vh,-9); }
function aktiv(){ return G && G.started && !G.paused && !G.modal && !G.done; }

/* ---------- Physik ---------- */
function step(dt){
  G.t+=dt;
  G.parts.forEach(q=>{ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.life-=dt; }); G.parts=G.parts.filter(q=>q.life>0);
  if(G.bannerT>0){ G.bannerT-=dt; if(G.bannerT<=0 && !G.done) setBanner(); }
  if(G.done){ return; }
  G.stumble=Math.max(0,G.stumble-dt); G.inv=Math.max(0,G.inv-dt); G.slow=Math.max(0,G.slow-dt); G.duck=Math.max(0,G.duck-dt);
  G.d+=currentV()*dt;
  const tx=LX[G.lane], dx=tx-G.X, mx=13*dt; G.X+=clamp(dx,-mx,mx);
  if(G.h>0 || G.vh>0){ G.vh-=20*dt; G.h+=G.vh*dt; if(G.h<=0){ G.h=0; G.vh=0; } }
  // Kollisionen
  for(const o of G.objs){
    const near = o.type==='zug' ? (G.d>o.s-0.5 && G.d<o.s+o.len+0.3) : Math.abs(o.s-G.d)<0.55;
    if(!near || o.type==='gate') continue;
    const sameLane=Math.abs(G.X-LX[o.lane])<1.15;
    if(!sameLane) continue;
    if(o.type==='completo'){ if(!o.got && G.h<1.6){ o.got=true; pickup(); } continue; }
    if(o.type==='mote'){ if(!o.got){ o.got=true; G.slow=7; sound('mote'); toast('🥤 Mote con huesillo! Alles läuft kurz langsamer.',2200); } continue; }
    if(o.hit || G.inv>0) continue;
    let hit=false;
    if(o.type==='barrera') hit=G.h<0.95; else if(o.type==='stuhl') hit=G.h<0.95; else if(o.type==='balken') hit=G.duck<=0; else if(o.type==='zug') hit=true;
    if(hit){ o.hit=true; crash(o); if(!G || G.modal) return; }
  }
  // Tor
  const g=G.gate;
  if(g && !g.passed && G.d>=g.s){ g.passed=true; torErreicht(g); }
}
function pickup(){
  G.completos++; if(G.mode!=='endlos'){ state.completos++; } else G.score+=10; sound('pick');
  if(!ruhig()){ const [x,y]=proj(G.X,1,ZP); G.parts.push({ x, y:y-60, vx:0, vy:-60, g:0, life:.6, txt:'+1 🌭' }); }
  updateHud();
}
function crash(o){
  sound('crash'); G.stumble=.8; G.inv=1.2;
  const was = o.type==='zug'?'der Zug':o.type==='balken'?'das Schild':o.type==='stuhl'?'der Stuhl':'die Absperrung';
  const mitWem = o.type==='zug'?'dem Zug':o.type==='balken'?'dem Schild':o.type==='stuhl'?'dem Stuhl':'der Absperrung';
  if(G.mode==='endlos'){
    G.hearts--; updateHud();
    if(G.hearts<=0){ gameOver('💥 Zusammenstoß mit '+mitWem+'!'); return; }
    toast('💥 Autsch! ❤️ noch '+G.hearts, 1800);
  } else {
    if(state.completos>0){ state.completos--; } toast('💥 Autsch – '+was+'! −1 🌭', 1800); updateHud();
  }
  if(o.type==='zug'){ // auf eine freie Spur ausweichen
    const frei=[0,1,2].filter(l=>!G.objs.some(q=>q.type==='zug' && q.lane===l && G.d>q.s-1 && G.d<q.s+q.len)); if(frei.length){ G.lane=frei.sort((a,b)=>Math.abs(a-G.lane)-Math.abs(b-G.lane))[0]; G.X=LX[G.lane]; } }
}
function torErreicht(g){
  const lane = G.X< -1.1 ? 0 : G.X>1.1 ? 2 : 1, gew=g.opts[lane], a=G.q.a, ok=gew===a.richtig, id=G.q.id;
  if(G.mode!=='endlos'){
    if(state.res[id]===undefined){ state.res[id]=ok?1:0; if(!ok){ state.wrong.push({ id, deine:gew }); if(!state.repeated[id]){ state.repeated[id]=1; state.queue.push(id); } } }
    state.pos++; save();
  }
  G.answered++;
  if(ok){
    G.okCount++; sound('ok');
    if(G.mode==='endlos'){ G.score+=100; G.v=Math.min(E.endlos.maxV, G.v+E.endlos.plusV); }
    burst();
    setBannerOk(); G.bannerT=1.4;
    weiter();
  } else {
    G.wrongCount++; sound('bad'); G.stumble=.6;
    if(G.mode==='endlos'){ G.hearts--; updateHud(); }
    const bn=$('#banner'); if(bn) bn.className='banner bad';
    openOverlay('<div class="box bad" role="alertdialog" aria-labelledby="ovT"><p class="big badline" id="ovT">✗ Falsches Tor – du bist durch „'+esc(gew)+'“ gefahren.</p>'+
      '<div class="satzfull">'+fill(a,a.richtig)+'</div><p>'+erklaerung(a,G.level)+'</p>'+
      (G.mode==='endlos'?(G.hearts>0?'<p class="small muted">❤️ noch '+G.hearts+'</p>':'<p class="badline"><strong>💔 Keine Herzen mehr!</strong></p>'):(G.q.wiederholung?'':'<p class="small muted">Diese Aufgabe kommt am Ende noch einmal.</p>'))+
      '<div class="row"><span class="spacer"></span><button type="button" class="primary" id="ovGo">Weiter ➜ <span class="small">(Leertaste)</span></button></div></div>',
      ()=>{ if(G.mode==='endlos' && G.hearts<=0){ gameOver('Keine Herzen mehr.'); return; } weiter(); }, 1200);
  }
  updateHud();
}
function weiter(){
  if(G.mode!=='endlos' && G.answered%E.aufgabenProStation===0) spawnStation();
  else if(G.mode==='endlos' && G.answered%5===0) spawnStation();
  if(G.mode==='endlos' && G.bannerT>0){ neueAufgabeSpaeter(); return; }
  if(G.bannerT>0) neueAufgabeSpaeter(); else neueAufgabe();
}
function neueAufgabeSpaeter(){ // Tor sofort platzieren, Banner nach der Rückmeldung zeigen
  const t=G.bannerT; neueAufgabe(); if(!G || G.done) return; G.bannerT=t; setBannerOk(true);
}
function burst(){ if(ruhig()) return; const [x,y]=proj(G.X,2.6,ZP+1.5); for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2; G.parts.push({ x, y, vx:Math.cos(a)*170, vy:Math.sin(a)*170-80, g:340, life:.8, c:['#5ee08f','#ffd23f','#fff','#ff7f50'][i%4] }); } }
function fahrtEnde(){
  G.done=true; G.gate=null; sound('fanfare'); setBannerEnde();
  setTimeout(()=>{ if(!G) return; stopLoop(); state.phase='name'; save(); render(); }, ruhig()?600:2200);
}
function gameOver(grund){
  G.done=true; sound('crash');
  const lv=G.level, rek=rekorde(), dist=Math.round(G.d), punkte=G.score+dist, neu=!(rek[lv]>=punkte);
  if(neu){ rek[lv]=punkte; lsSet(LS_REK, JSON.stringify(rek)); }
  endlosErgebnis={ level:lv, grund, dist, punkte, ok:G.okCount, falsch:G.wrongCount, completos:G.completos, neu, rekord:rek[lv], station:stationName(G.stationNr) };
  setTimeout(()=>{ stopLoop(); view='endlosEnde'; render(); }, ruhig()?300:900);
}

/* ---------- Overlays ---------- */
function openOverlay(html, onGo, lock, menu){
  const ov=$('#overlay'); if(!ov) return;
  G.modal={ onGo, menu:!!menu }; G.lockUntil=performance.now()+(lock||0);
  ov.innerHTML=html; ov.hidden=false;
  const b=$('#ovGo',ov); if(b){ b.addEventListener('click',()=>continueOverlay(true)); setTimeout(()=>{ if(G && G.modal && b.isConnected) b.focus({preventScroll:true}); }, Math.min(lock||0,400)); }
}
function closeOverlay(){ const ov=$('#overlay'); if(ov){ ov.hidden=true; ov.innerHTML=''; } if(G) G.modal=null; const cv=$('#cv'); if(cv) cv.focus({preventScroll:true}); }
function continueOverlay(force){
  if(!G || !G.modal) return;

}
function startOverlay(){

    '<p>Lies die Aufgabe oben und fahr durch das <strong>Tor mit der richtigen Antwort</strong>. Spur wechseln mit <kbd>←</kbd> <kbd>→</kbd>, springen mit <kbd>↑</kbd>, ducken mit <kbd>↓</kbd> – auf dem Tablet wischen.</p>'+
    '<p class="small muted">'+(endlos?'Jedes richtige Tor macht dich schneller. Fehler und Zusammenstöße kosten ein Herz. 🥤 Mote con huesillo macht alles kurz langsamer.':'Hindernisse kosten einen Completo 🌭. Falsche Antworten kommen am Ende noch einmal.')+'</p>'+
    '<div class="row"><span class="spacer"></span><button type="button" class="primary" id="ovGo">Los! <span class="small">(Leertaste)</span></button></div></div>',
    ()=>{ G.started=true; lastTs=0; }, 250);
}
function openPause(){
  if(!G || G.modal || G.done || !G.started) return;
  G.paused=true;
  openOverlay('<div class="box" role="dialog" aria-labelledby="ovT"><p class="big" id="ovT">⏸ Pause</p>'+
    (G.mode!=='endlos'?'<p class="small muted">Tempo:</p><div class="tempo">'+TEMPI.map(t=>'<button type="button" data-t="'+t[0]+'" aria-pressed="'+(settings.tempo===t[0])+'">'+t[1]+'</button>').join('')+'</div>':'<p class="small muted">Im Endlos-Modus wird es mit jedem richtigen Tor schneller.</p>')+
    '<div class="row" style="margin-top:.6em"><button type="button" class="primary" id="ovGo">▶ Weiter <span class="small">(P)</span></button><span class="spacer"></span><button type="button" id="ovMenu">☰ Menü</button></div></div>',
    ()=>{ G.paused=false; lastTs=0; }, 0, true);

  $('#ovMenu').addEventListener('click',()=>{ closeOverlay(); stopLoop(); view='start'; state=null; render(); });

/* ---------- Stationen ---------- */
const PE=3.5, PH=1.0, BW=6.6;   // Bahnsteigkante, Bahnsteighöhe, Rückwand
let WERB_RECHTS=false;
const WERBUNG=['torres','empanada','atacama','valpo','rapanui','palta','mote'];
function zeichneWerbung(typ,x,y,w,h){
  const T=(t,t2)=>{ if(w<70) return; ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(x,y+h*.72,w,h*.28);
    let fs=Math.max(8,h*.13); ctx.font='bold '+fs+'px Arial'; while(ctx.measureText(t).width>w*.92 && fs>7){ fs--; ctx.font='bold '+fs+'px Arial'; }

function drawStation(st){
  const z0=Math.max(ZN,zOf(st.s0)), z1=Math.min(ZF,zOf(st.s1)); if(z1<=z0) return;
  const deko=[];
  [-1,1].forEach(sd=>{
    poly([proj(sd*WALL,0,z0),proj(sd*WALL,CEIL,z0),proj(sd*WALL,CEIL,z1),proj(sd*WALL,0,z1)],'#1a1c26');
    if(zOf(st.s1)<ZF) poly([proj(sd*WALL,0,z1),proj(sd*BW,0,z1),proj(sd*BW,CEIL,z1),proj(sd*WALL,CEIL,z1)],'#b9b2a0');
    poly([proj(sd*WALL,CEIL,z0),proj(sd*BW,CEIL,z0),proj(sd*BW,CEIL,z1),proj(sd*WALL,CEIL,z1)],'#d6cfbb');
    poly([proj(sd*BW,PH,z0),proj(sd*BW,CEIL,z0),proj(sd*BW,CEIL,z1),proj(sd*BW,PH,z1)],'#efe8d6');
    poly([proj(sd*BW,3.6,z0),proj(sd*BW,3.85,z0),proj(sd*BW,3.85,z1),proj(sd*BW,3.6,z1)],'#c8102e');
    // Werbetafeln und Stationsschilder an der Rückwand
    let n=0;
    for(let s=st.s0+2; s+5<st.s1; s+=7.5, n++){
      const za=zOf(s), zb=zOf(s+5); if(zb<=ZN || za>=ZF) continue;
      const a1=Math.max(ZN,za), b1=Math.min(ZF,zb);
      const P=[proj(sd*BW,3.2,a1),proj(sd*BW,3.2,b1),proj(sd*BW,1.55,b1),proj(sd*BW,1.55,a1)];
      const xs=P.map(q=>q[0]), ys=P.map(q=>q[1]), bx=Math.min(...xs), by=Math.min(...ys), bw=Math.max(...xs)-bx, bh=Math.max(...ys)-by;
      if(bw<2) continue;
      ctx.save(); ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]); P.slice(1).forEach(q=>ctx.lineTo(q[0],q[1])); ctx.closePath(); ctx.clip();
      if(n%3===1){ ctx.fillStyle='#fff'; ctx.fillRect(bx,by,bw,bh); ctx.fillStyle='#c8102e'; ctx.fillRect(bx,by,bw,bh*.18);
        if(bw>40){ let fs=Math.max(8,bh*.3); ctx.font='bold '+fs+'px Arial'; while(ctx.measureText(st.name).width>Math.max(40,Math.min(bx+bw,W)-Math.max(bx,0))*.85 && fs>7){ fs--; ctx.font='bold '+fs+'px Arial'; }
          const vx0=Math.max(bx,0), vx1=Math.min(bx+bw,W), cx=(vx0+vx1)/2; ctx.textAlign='center';
          ctx.fillStyle='#1d1d1d'; ctx.textBaseline='middle'; ctx.fillText(st.name,cx,by+bh*.6); ctx.textBaseline='alphabetic'; ctx.textAlign='left'; } }
      else { WERB_RECHTS=sd>0; zeichneWerbung(WERBUNG[mod(Math.floor(st.s0)+n*3+(sd>0?2:0),WERBUNG.length)],bx,by,bw,bh); WERB_RECHTS=false; }
      ctx.restore();

    }

    poly([proj(sd*PE,PH,z0),proj(sd*BW,PH,z0),proj(sd*BW,PH,z1),proj(sd*PE,PH,z1)],'#9e9a94');
    poly([proj(sd*(PE+.08),PH+.01,z0),proj(sd*(PE+.32),PH+.01,z0),proj(sd*(PE+.32),PH+.01,z1),proj(sd*(PE+.08),PH+.01,z1)],'#ffd23f');
    poly([proj(sd*PE,0,z0),proj(sd*PE,PH,z0),proj(sd*PE,PH,z1),proj(sd*PE,0,z1)],'#5d5a57');
    // Säulen und Menschen (später nach Entfernung sortiert)
    for(let s=st.s0+6; s<st.s1-2; s+=12) deko.push({ s, sd, typ:'saeule' });
    const N=Math.floor((st.s1-st.s0)/5.5);
    for(let i=0;i<N;i++){ const seed=Math.floor(st.s0)*13+i*5+(sd>0?101:0); deko.push({ s:st.s0+3+rnd(seed)*(st.s1-st.s0-6), sd, X:4.0+rnd(seed+1)*2.1, typ:'person', seed }); }
  });

    const u=sc(d.z);

  if(o.type==='zug'){ const zf=Math.max(ZN,z), zb=Math.min(ZF,zOf(o.s+o.len)); if(zb<=zf) return;
    const sd = lx<0?1:lx>0?-1:(G.X<0?-1:1); // sichtbare Seite zur Mitte
    poly([proj(lx+sd*1.0,0,zf),proj(lx+sd*1.0,3.0,zf),proj(lx+sd*1.0,3.0,zb),proj(lx+sd*1.0,0,zb)],'#c9ced8');
    poly([proj(lx+sd*1.0,1.0,zf),proj(lx+sd*1.0,1.25,zf),proj(lx+sd*1.0,1.25,zb),proj(lx+sd*1.0,1.0,zb)],'#c8102e');
    if(z<ZN) return;
    poly([proj(lx-1.0,3.0,zf),proj(lx+1.0,3.0,zf),proj(lx+1.0,3.0,zb),proj(lx-1.0,3.0,zb)],'#a9afbb');
    const a=proj(lx-1.0,3.0,z), b=proj(lx+1.0,0,z); ctx.fillStyle='#eef1f6'; rr(a[0],a[1],b[0]-a[0],b[1]-a[1],Math.max(2,k*.2)); ctx.fill();
    const w1=proj(lx-0.8,2.6,z), w2=proj(lx+0.8,1.7,z); ctx.fillStyle='#1d2a3a'; ctx.fillRect(w1[0],w1[1],w2[0]-w1[0],w2[1]-w1[1]);
    const r1=proj(lx-1.0,1.25,z), r2=proj(lx+1.0,1.0,z); ctx.fillStyle='#c8102e'; ctx.fillRect(r1[0],r1[1],r2[0]-r1[0],r2[1]-r1[1]);
    const l1=proj(lx-0.6,0.6,z), l2=proj(lx+0.6,0.6,z); circ(l1[0],l1[1],Math.max(1.5,k*.1),'#fff6c2'); circ(l2[0],l2[1],Math.max(1.5,k*.1),'#fff6c2');
    if(k>20){ ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(k*.28)+'px Arial'; ctx.textAlign='center'; ctx.fillText('L1',(a[0]+b[0])/2,w1[1]-k*.1); ctx.textAlign='left'; }
    return; }
}
function drawMatias(){
  const k=sc(ZP), [x,yg]=proj(G.X,G.h,ZP), lean=clamp((LX[G.lane]-G.X)*.18,-.25,.25), duck=G.duck>0;
  ctx.save(); ctx.translate(x,yg);
  if(G.inv>0 && Math.floor(G.t*14)%2===0) ctx.globalAlpha=.5;
  // Schatten
  if(G.h>0){ ctx.save(); ctx.translate(0,G.h*k); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,0,.5*k,.12*k,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  ctx.rotate(lean);
  // Skateboard
  ctx.fillStyle='#222'; circ(-.32*k,0,.07*k,'#222'); circ(.32*k,0,.07*k,'#222');
  ctx.fillStyle='#e85d2a'; rr(-.5*k,-.13*k,1.0*k,.09*k,.04*k); ctx.fill();
  // Düsen mit Dampf
  const alpha0=ctx.globalAlpha;
  [-.44,.44].forEach((nx,ni)=>{
    const n=ruhig()?2:6, staerke=G.h>0?1.5:1;
    for(let i=0;i<n;i++){ const ph=ruhig()?(i+1)/(n+1):((G.t*2.6+i/n+ni*.13)%1);
      ctx.globalAlpha=alpha0*Math.max(0,(1-ph)*.55);
      circ(nx*k+Math.sign(nx)*ph*.22*k, (-.02+ph*.38*staerke)*k, (.05+ph*.17)*k, '#e8eef5'); }
    ctx.globalAlpha=alpha0;
    ctx.fillStyle='#6b7280'; rr(nx*k-.06*k,-.07*k,.12*k,.09*k,.03*k); ctx.fill();
    circ(nx*k,0,.035*k,'#ffb347'); });
  const hb = duck ? .55 : 1;
  // Beine
  ctx.fillStyle='#2c3e66'; ctx.fillRect(-.22*k,-(.13+.75*hb)*k,.17*k,.75*hb*k); ctx.fillRect(.05*k,-(.13+.75*hb)*k,.17*k,.75*hb*k);
  ctx.fillStyle='#f2f2f2'; ctx.fillRect(-.25*k,-.2*k,.22*k,.08*k); ctx.fillRect(.03*k,-.2*k,.22*k,.08*k);
  const yb=-(.13+.75*hb)*k;
  // Körper (Kapuzenpulli) und Rucksack
  ctx.fillStyle='#c8102e'; rr(-.3*k,yb-.62*k,.6*k,.66*k,.12*k); ctx.fill();
  ctx.fillStyle='#1f5fa8'; rr(-.22*k,yb-.55*k,.44*k,.42*k,.08*k); ctx.fill(); ctx.fillStyle='#174a85'; ctx.fillRect(-.16*k,yb-.3*k,.32*k,.05*k);
  // Arme
  ctx.strokeStyle='#c8102e'; ctx.lineWidth=.13*k; ctx.lineCap='round'; const sw=ruhig()?0:Math.sin(G.t*6)*.08*k;
  ctx.beginPath(); ctx.moveTo(-.28*k,yb-.5*k); ctx.lineTo(-.48*k,yb-.15*k+sw); ctx.moveTo(.28*k,yb-.5*k); ctx.lineTo(.48*k,yb-.15*k-sw); ctx.stroke();
  // Kopf von hinten
  circ(0,yb-.78*k,.2*k,'#d9a07a'); circ(0,yb-.82*k,.2*k,'#1e1e1e'); ctx.fillStyle='#1e1e1e'; ctx.fillRect(-.2*k,yb-.82*k,.4*k,.08*k);
  ctx.restore(); ctx.globalAlpha=1;
}
function draw(){
  if(!ctx || !G) return;
  ctx.setTransform(scaleK,0,0,scaleK,0,0);
  drawTunnel();
  const list=G.objs.map(o=>({ o, z: zOf(o.s) })).filter(e=>e.z<ZF && (e.o.type==='zug' ? zOf(e.o.s+e.o.len)>ZN : e.z>Math.max(ZN,ZP-0.8)) && !(e.o.type==='gate' && e.o.passed));
  list.push({ o:null, z:ZP });
  list.sort((a,b)=>b.z-a.z);
  list.forEach(e=>{ if(e.o) drawObj(e.o,e.z); else drawMatias(); });
  G.parts.forEach(q=>{ ctx.globalAlpha=Math.max(0,Math.min(1,q.life*1.6)); if(q.txt){ ctx.font='bold 24px Arial'; ctx.fillStyle='#ffd23f'; ctx.fillText(q.txt,q.x-20,q.y); } else circ(q.x,q.y,4,q.c); ctx.globalAlpha=1; });
  if(G.slow>0){ ctx.fillStyle='rgba(255,180,71,.12)'; ctx.fillRect(0,0,W,H); ctx.font='bold 20px Arial'; ctx.fillStyle='#ffb347'; ctx.fillText('🥤 '+Math.ceil(G.slow),16,H-16); }
  if(G.mode==='endlos'){ ctx.font='24px Arial'; for(let i=0;i<E.endlos.herzen;i++){ ctx.globalAlpha=i<G.hearts?1:.25; ctx.fillText('❤️',W-40-i*32,36); } ctx.globalAlpha=1;
    ctx.font='bold 22px Arial'; ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.fillText(Math.round(G.d)+' m · '+(G.score+Math.round(G.d))+' P',W-16,68); ctx.textAlign='left'; }
  else { ctx.font='bold 22px Arial'; ctx.fillStyle='#ffd23f'; ctx.textAlign='right'; ctx.fillText('🌭 '+state.completos,W-16,36); ctx.textAlign='left'; }
}

/* ---------- Schleife ---------- */
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!G) return;
  if(!lastTs) lastTs=ts;
  const dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts;
  if(G.started && !G.paused && !G.modal && !document.hidden){ if(state) state.elapsed+=dt*1000; let rem=dt*ZEITRAFFER; while(rem>1e-6 && G && !G.modal && !G.paused && !G.done){ const d=Math.min(rem,1/120); step(d); rem-=d; } if(G && G.done) step(0); }
  else if(G.parts.length){ G.parts.forEach(q=>{ q.life-=dt; }); G.parts=G.parts.filter(q=>q.life>0); }
  if(!G) return;
  draw();
  if(state && Math.floor(state.elapsed/1000)!==G._sec){ G._sec=Math.floor(state.elapsed/1000); const c=$('#clock'); if(c) c.textContent='⏱ '+fmtTime(state.elapsed); }
}
function startLoop(){ cancelAnimationFrame(raf); lastTs=0; raf=requestAnimationFrame(frame); }
function stopLoop(){ cancelAnimationFrame(raf); raf=0; G=null; }

function updateHud(){
  const hud=$('#hud');
  if(view==='endlos' && G){ hud.innerHTML='<span class="pill">♾️ '+esc(G.level)+'</span><span class="pill">❤️ '+G.hearts+'</span><span class="pill">✓ '+G.okCount+'</span><span class="pill">🌭 '+G.completos+'</span>'; return; }
  if(!state || view!=='game' || location.hash==='#lehrer' || ['name','end'].includes(state.phase)){ hud.innerHTML=''; return; }
  const n=state.queue.length;
  hud.innerHTML='<span class="pill">🎓 '+esc(state.level)+'</span><span class="pill">🚇 '+Math.min(state.pos,n)+'/'+n+'</span><span class="pill" title="Completos">🌭 '+state.completos+'</span><span class="pill" id="clock">⏱ '+fmtTime(state.elapsed)+'</span>';
}

function render(){
  if(location.hash==='#lehrer'){ stopLoop(); renderTeacher(); updateHud(); return; }
  if(view==='endlos'){ renderEndlos(); }
  else if(view==='endlosEnde'){ renderEndlosEnde(); }
  else if(view==='start' || !state){ stopLoop(); renderStart(); }
  else if(state.phase==='intro') renderIntro();
  else if(state.phase==='fahrt') renderGame();
  else if(state.phase==='name') renderName();
  else renderResult();
  updateHud();
}

  return t;
}
function copyText(t){
  const done=()=>{ $('#copyFb').textContent='✓ Kopiert! Jetzt in Google Classroom einfügen (Strg + V).'; };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('#copyFb').textContent='Kopieren hat nicht geklappt – bitte Screenshot machen.'; } ta.remove(); };
  let settled=false; const once=f=>()=>{ if(!settled){ settled=true; f(); } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(once(done),once(fallback)); setTimeout(once(fallback),800); } else once(fallback)(); }catch(e){ once(fallback)(); }
}

/* ---------- Lehrkraft ---------- */
function renderTeacher(){
  app.innerHTML='<section class="card narrow"><h1>🔎 Prüfcode kontrollieren</h1><p class="muted">Für Lehrkräfte. Name so eingeben, wie er im Ergebnis steht (Groß-/Kleinschreibung, Akzente und Leerzeichen sind egal).</p>'+
    '<p><label for="tName">Name</label><br><input '+INPUT_ATTR+' id="tName" style="width:100%"></p><p><label for="tCode">Prüfcode</label><br><input '+INPUT_ATTR+' id="tCode" style="width:100%" placeholder="z. B. A2-87-2-211026-K7QFM"></p>'+
    '<div class="row"><button type="button" class="primary" id="tCheck">Prüfen</button><span class="spacer"></span><button type="button" id="tBack">← Zurück zum Spiel</button></div><div id="tRes" role="status" aria-live="polite" style="margin-top:.8em"></div></section>'+
    '<section class="card narrow"><h2>ℹ️ Gut zu wissen</h2><ul>'+
    '<li><strong>Prüfcode</strong> (nur Unterrichtsmodus): Niveau – Prozent – Tempo (1 = langsam, 2 = normal, 3 = schnell) – Datum – Kontrollzeichen.</li>'+
    '<li><strong>Prozent:</strong> Aufgaben, die beim <em>ersten</em> Versuch richtig waren. Falsche Aufgaben werden am Ende wiederholt – das zählt nicht mehr für die Prozente.</li>'+
    '<li><strong>Nach einem Fehler</strong> bleibt die Erklärung stehen, bis sie aktiv weggeklickt wird.</li>'+
    '<li><strong>Hindernisse</strong> kosten im Unterrichtsmodus nur einen Completo, keine Punkte. Im <strong>Endlos-Modus</strong> kosten Fehler und Zusammenstöße ein Herz; der Rekord wird nur im Browser gespeichert (kein Prüfcode).</li></ul></section>'+
    '<section class="card narrow"><h2>📚 Alle Aufgaben</h2>'+LEVELS.filter(lv=>SPIEL[lv]).map(lv=>'<details><summary>'+lv+' · '+esc(SPIEL[lv].titel)+' ('+items(lv).length+' Aufgaben)</summary><ol class="lsatz">'+
      items(lv).map(a=>'<li>'+fill(a,a.richtig,'okline')+' <span class="small muted">(falsch: '+esc(asList(a.falsch).join(' / '))+' · '+esc(plain(a.info||''))+')</span></li>').join('')+'</ol></details>').join('')+'</section>';
  const go=()=>{ const r=verifyCode($('#tCode').value,$('#tName').value);
    $('#tRes').innerHTML = r.valid ? '<p class="tipbox ok"><strong>✓ Der Code ist gültig.</strong><br>Niveau <strong>'+r.level+'</strong> · <strong>'+r.pct+' %</strong> · Tempo <strong>'+(['','langsam','normal','schnell'][r.k]||r.k)+'</strong> · '+r.date+'</p>'
      : '<p class="tipbox bad"><strong>✗ Der Code ist nicht gültig.</strong><br>'+esc(r.reason||'Name oder Code passen nicht zusammen.')+'</p>'; };
  $('#tCheck').addEventListener('click',go); ['#tName','#tCode'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
  $('#tBack').addEventListener('click',()=>{ history.replaceState(null,'',location.pathname+location.search); render(); });
  focusEl('#tName');
}

/* ---------- Tastatur ---------- */
document.addEventListener('keydown',e=>{
  if(!G || !(view==='game'||view==='endlos') || location.hash) return;
  const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(document.querySelector('.confirmbox')) return;
  const k=e.key;
  if(G.modal && G.modal.menu){ if(k==='Escape'||k==='p'||k==='P'){ e.preventDefault(); continueOverlay(true); } return; }
  if(G.modal){ if(k===' '||k==='Enter'){ e.preventDefault(); if(!e.repeat) continueOverlay(); } return; }
  if(k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); if(!e.repeat) spur(-1); }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); if(!e.repeat) spur(1); }
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); if(!e.repeat) springen(); }
  else if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); if(!e.repeat) ducken(); }
  else if(k==='Escape'||k==='p'||k==='P'){ e.preventDefault(); openPause(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden && G && G.started && !G.modal && !G.done) openPause(); });
window.addEventListener('blur',()=>{ if(G && G.started && !G.modal && !G.done && !EINGEBETTET) openPause(); });
window.addEventListener('resize',()=>{ if(G) resize(); });

/* ---------- Start ---------- */
(function init(){
  try{ const s=JSON.parse(lsGet(LS_SET)||'{}'); if(s.sound) settings.sound=true; if(s.anim===false) settings.anim=false; if(E.tempo[s.tempo]) settings.tempo=s.tempo; }catch(e){}
  const sb=$('#btnSound'), ab=$('#btnAnim');
  const upd=()=>{ sb.textContent=settings.sound?'🔊 Ton an':'🔇 Ton aus'; sb.setAttribute('aria-pressed',String(settings.sound));
    ab.textContent=settings.anim?'🎞 Animationen an':'🎞 Animationen aus'; ab.setAttribute('aria-pressed',String(!settings.anim)); };
  upd();
  sb.addEventListener('click',()=>{ settings.sound=!settings.sound; saveSettings(); upd(); sound('ok'); });
  ab.addEventListener('click',()=>{ settings.anim=!settings.anim; saveSettings(); upd(); toast(settings.anim?'🎞 Animationen sind wieder an.':'🎞 Animationen sind aus – keine Effekte.'); });
  $('#btnMenu').addEventListener('click',()=>{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); stopLoop(); view='start'; state=null; render(); });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
