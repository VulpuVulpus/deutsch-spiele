   ANLEITUNG FÜR LEHRKRÄFTE
   ---------------------------------------------------------------------
   Alles, was Sie ändern können, steht in diesem ersten Abschnitt
   (EINSTELLUNGEN, REGELN, SPIEL). Die Spiel-Logik weiter unten müssen
   Sie nicht anfassen.

   IDEE
   Über dem Spielfeld steht ein Satz mit Lücke. Oben im Spielfeld liegen
   3 oder 4 Wortfelder. Mit dem Balken unten lenkt man den Ball in das
   richtige Feld. Wo der Ball den Balken trifft, bestimmt den Winkel
   (Mitte = gerade nach oben, Rand = schräg).
   Falsches Feld: Es wird gesperrt, man versucht es noch einmal.
   Ball fällt unten heraus: ein Herz weniger.

   AUFBAU
   SPIEL → Niveau (A2, B1, B2, C1) → runden (je 8 Sätze)

   FELDER EINES SATZES
     satz    : Satz mit ___ (genau eine Lücke)

     regel   : (optional) Name einer Regel aus REGELN

     { satz:"Ich warte ___ den Bus.", richtig:"auf", falsch:["für","an","nach"],
       info:"warten **auf** + Akkusativ", es:"esperar a alguien → warten AUF" },

   WICHTIG: Bitte nur falsche Wörter wählen, die wirklich nicht passen.

     · Texte immer in "Anführungszeichen"; im Text selbst „…“ verwenden.

     · Fehler in den Daten zeigt die Startseite als gelben Hinweis an.
   ===================================================================== */

      { satz:"Unsere Schule ___ großen Wert auf Pünktlichkeit.", richtig:"legt", falsch:["gibt","macht","nimmt"], info:"Wert **legen** auf + Akk. – nicht „geben“ wie span. „dar importancia“" },
      { satz:"Bitte ___ Sie Rücksicht auf die Nachbarn.", richtig:"nehmen", falsch:["geben","machen","legen"], info:"Rücksicht **nehmen** auf + Akkusativ (span. „tener consideración“)" },
      { satz:"Ich möchte mit meiner Gastfamilie Kontakt ___.", richtig:"aufnehmen", falsch:["nehmen","machen","geben"], info:"Kontakt **aufnehmen** mit/zu (span. „ponerse en contacto“)" },
      { satz:"Soziale Medien ___ im Leben vieler Jugendlicher eine große Rolle.", richtig:"spielen", falsch:["machen","geben","halten"], info:"eine Rolle **spielen** (span. „desempeñar un papel“)" },
      { satz:"Für dieses Problem müssen wir eine Lösung ___.", richtig:"finden", falsch:["treffen","machen","nehmen"], info:"eine Lösung **finden** (auch: erarbeiten)" },
      { satz:"Vor der Reise haben wir alle nötigen Vorbereitungen ___.", richtig:"getroffen", falsch:["genommen","gestellt","gegeben"], info:"Vorbereitungen **treffen**" },
      { satz:"Nach drei Wochen musste Matías Abschied von seiner Gastfamilie ___.", richtig:"nehmen", falsch:["machen","geben","treffen"], info:"Abschied **nehmen** von + Dativ = sich verabschieden" },
      { satz:"In der Diskussion hat Sofía das Thema Rassismus zur Sprache ___.", richtig:"gebracht", falsch:["gestellt","gemacht","genommen"], info:"etwas zur Sprache **bringen** = ein Thema ansprechen" },
    ]},
  ],
},

};

  <a class="homelink" href="index.html" title="Zur Startseite mit allen Spielen">← Alle Spiele</a>

  </div>

<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* =====================================================================
   AB HIER: SPIEL-LOGIK (muss nicht geändert werden)
   ===================================================================== */
const E = EINSTELLUNGEN;
const LEVELS = ['A2','B1','B2','C1'];
const WELTEN = ['atacama','valparaiso','pucon','patagonien'];
const LS_GAME = 'wortpong.spiel.v1', LS_SET = 'wortpong.einstellungen.v1';
const TEMPI = [['langsam','🐢 langsam'],['normal','🏓 normal'],['schnell','⚡ schnell']];

const app = document.getElementById('app');
let state=null, view='start', settings={ sound:false, anim:true, tempo:'normal', ziel:true };
let G=null, raf=0, lastTs=0, ZEITRAFFER=1;

/* ---------- Speicher ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }
function save(){ if(state) lsSet(LS_GAME, JSON.stringify(state)); }
function saveSettings(){ lsSet(LS_SET, JSON.stringify(settings)); }

/* ---------- Helfer ---------- */
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function paras(s){ return String(s||'').split(/\n\s*\n/).map(p => '<p>'+fmt(p)+'</p>').join(''); }
function asList(x){ return x==null ? [] : (Array.isArray(x) ? x : [x]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function range(n){ return Array.from({length:n},(_,i)=>i); }
function mod(a,n){ return ((a%n)+n)%n; }
function rnd(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
function focusEl(sel){ const el = sel ? (typeof sel==='string'?$(sel):sel) : null; (el||app).focus({preventScroll:true}); }
let toastT=null;
function toast(msg, ms){ const t=$('#toast'); t.innerHTML=fmt(msg); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, ms||3000); }
function ruhig(){ return !settings.anim || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function spanish(level){ return !!E.spanischeHilfe[level||(state&&state.level)]; }

/* ---------- Eingebettet (z. B. Google Sites) ---------- */
const EINGEBETTET = (()=>{ try { return window.self!==window.top; } catch(e){ return true; } })();
if(EINGEBETTET) document.documentElement.classList.add('eingebettet');
function bestaetigen(msg, ok){
  const d=document.createElement('div'); d.className='confirmbox'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="cb"><p></p><div class="cbrow"><button type="button" class="cbno">Abbrechen</button><button type="button" class="primary cbyes">Ja</button></div></div>';
  d.querySelector('p').textContent=msg; document.body.appendChild(d);
  const close=()=>d.remove();
  d.querySelector('.cbno').addEventListener('click',close);
  d.querySelector('.cbyes').addEventListener('click',()=>{ close(); ok(); });
  d.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  d.querySelector('.cbno').focus();
}

/* ---------- Daten ---------- */
function runden(level){ return asList(SPIEL[level||state.level].runden).map((r,i)=>({ name:r.name, saetze:asList(r.saetze), idx:i })); }
function alleSaetze(level){ return runden(level).reduce((a,r)=>a.concat(r.saetze.map((s,i)=>Object.assign({ id:r.idx+'.'+i, runde:r.name },s))),[]); }
function signature(level){ return runden(level).map(r=>r.saetze.length).join('-'); }
function L(){ return SPIEL[state.level]; }
function fill(s, wort, cls){ return fmt(s.satz).replace('___', '<strong'+(cls?' class="'+cls+'"':'')+'>'+esc(wort)+'</strong>'); }
function satzGap(s){ return esc(s.satz).replace('___','<span class="gap">___</span>'); }
function satzPlain(s, wort){ return plain(s.satz).replace('___', wort); }
function erklaerung(s, level, kurz){
  let h='';
  asList(s.regel).map(k=>REGELN[k]).filter(Boolean).forEach(r=>{ h+='<span>📌 '+fmt(r.text)+'</span>'+(spanish(level)&&r.es&&!s.es?'<br><span class="es" lang="es">🇨🇱 '+fmt(r.es)+'</span>':''); });
  if(s.info) h+=(h?'<br>':'')+'<span>📌 '+fmt(s.info)+'</span>';
  if(s.es && spanish(level)) h+='<br><span class="es" lang="es">🇨🇱 '+fmt(s.es)+'</span>';
  return h;
}
function erklaerungPlain(s){ return asList(s.regel).map(k=>REGELN[k]).filter(Boolean).map(r=>plain(r.text)).concat(s.info?[plain(s.info)]:[]).join(' / '); }
function regelListe(level){
  const ks=asList(SPIEL[level].regeln); if(!ks.length) return '';
  return '<ul class="regelliste">'+ks.map(k=>REGELN[k]).filter(Boolean).map(r=>'<li>📌 '+fmt(r.text)+(spanish(level)&&r.es?'<br><span class="es small" lang="es">🇨🇱 '+fmt(r.es)+'</span>':'')+'</li>').join('')+'</ul>';
}

function dataWarnings(){
  const w=[];
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(S==null) return;
    if(!WELTEN.includes(S.welt)) w.push(lv+': welt muss '+WELTEN.join(', ')+' sein.');
    if(!asList(S.runden).length) w.push(lv+': „runden“ fehlt.');
    asList(S.regeln).forEach(k=>{ if(!REGELN[k]) w.push(lv+': Regel „'+k+'“ steht nicht in REGELN.'); });
    runden(lv).forEach(r=>{
      if(!r.saetze.length) w.push(lv+' · '+r.name+': keine Sätze.');
      r.saetze.forEach((s,i)=>{ const where=lv+' · '+r.name+' · Satz '+(i+1)+': ';
        if(!s || typeof s.satz!=='string' || s.satz.split('___').length!==2) w.push(where+'satz braucht genau eine Lücke ___.');
        if(!s || !s.richtig) w.push(where+'richtig fehlt.');
        const f=asList(s&&s.falsch);
        if(f.length<2 || f.length>3) w.push(where+'falsch braucht 2 oder 3 Wörter.');
        if(s && f.some(x=>String(x).trim()===String(s.richtig).trim())) w.push(where+'ein falsches Wort ist gleich dem richtigen.');
        if(new Set(f).size!==f.length) w.push(where+'ein falsches Wort steht doppelt.');
        asList(s&&s.regel).forEach(k=>{ if(!REGELN[k]) w.push(where+'Regel „'+k+'“ steht nicht in REGELN.'); });
        if(s && !s.info && !asList(s.regel).length) w.push(where+'info oder regel fehlt (Erklärung).');
      }); });
  });
  return w;
}

/* ---------- Prüfcode ---------- */
function cyrb53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level,pct,k,d,name){ let n=cyrb53(['WP',level,pct,k,d,normName(name),E.geheimwort].join('|')); let s=''; for(let i=0;i<5;i++){ s+=B32[n%32]; n=Math.floor(n/32); } return s; }
function makeCode(level,pct,k,date,name){ const p=n=>String(n).padStart(2,'0'); const d=p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100); return level+'-'+pct+'-'+k+'-'+d+'-'+checksum(level,pct,k,d,name); }
function verifyCode(code,name){
  const m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)-(\d{1,3})-(\d)-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: B1-83-2-161026-K7QFM' };
  return { valid: checksum(m[1],+m[2],+m[3],m[4],name)===m[5], level:m[1], pct:+m[2], k:+m[3], date:m[4].slice(0,2)+'.'+m[4].slice(2,4)+'.20'+m[4].slice(4) };
}

/* ---------- Ton ---------- */
let actx=null;
const SND={ pong:[[440,.04]], wand:[[330,.03]], ok:[[660,.1],[880,.18]], bad:[[220,.22]], weg:[[300,.1],[200,.25]], stern:[[784,.1],[988,.1],[1175,.1],[1568,.3]], fanfare:[[523,.15],[659,.15],[784,.15],[1047,.4]], start:[[523,.06],[784,.08]] };
function sound(n){ if(!settings.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  (SND[n]||[]).forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }

/* ---------- Spielstand ---------- */
function newGame(level){ state={ v:1, level, sig:signature(level), runde:0, phase:'intro', res:{}, punkte:0, wrong:[], sterne:{}, elapsed:0, name:'', finished:null, letzte:null }; save(); }
function loadSaved(){ try{ const s=JSON.parse(lsGet(LS_GAME)||'null'); if(s && s.v===1 && SPIEL[s.level] && s.sig===signature(s.level)) return s; }catch(e){} return null; }
function stats(){ const all=alleSaetze(), ok=all.filter(s=>state.res[s.id]===1).length; return { ok, total:all.length, pct: all.length?Math.round(ok*100/all.length):0, k:Object.keys(state.sterne).length, max:all.length*E.punkte[0] }; }

/* =====================================================================
   SPIELFELD (Canvas 960 × 540)
   ===================================================================== */
const W=960, H=540, FT=12, FB=104, PY=496, PH=14, PW=160, BR=10, MARGIN=12;
function tempo(){ return E.tempo[settings.tempo] || E.tempo.normal; }
function ballSpeed(){ return tempo().ball*(G?G.speedMul:1); }

function startRunde(){
  const r=runden()[state.runde];
  G={ r, n:r.saetze.length, order:shuffle(range(r.saetze.length)), i:0, fields:[], s:null, lockT:0, lockMax:1, okT:0, tries:0, first:true,
      ball:{ x:W/2, y:PY-BR, vx:0, vy:0, rest:true }, fangen:false, paddle:{ x:W/2, tx:W/2, vx:0 }, keys:{ l:false, r:false },
      hearts:E.herzen, speedMul:1, started:false, paused:false, modal:null, done:false, star:null, starDone:false, parts:[], trail:[], t:0, okFirst:0, lockUntil:0 };

}
function setupSatz(){
  const si=G.order[G.i], s=G.r.saetze[si], id=G.r.idx+'.'+si;
  G.s=s; G.si=si; G.id=id; G.first=state.res[id]===undefined; G.tries=0; G.okT=0;
  const opts=shuffle([s.richtig].concat(asList(s.falsch))), n=opts.length, fw=(W-2*MARGIN)/n;
  G.fields=opts.map((w,k)=>({ w, x:MARGIN+k*fw, w2:fw, state:'' }));

}
function fieldAt(x){ return G.fields.find(f=>x>=f.x && x<f.x+f.w2) || (x<MARGIN?G.fields[0]:G.fields[G.fields.length-1]); }

/* ---------- Steuerung ---------- */
function launch(){
  if(!G) return;
  if(G.modal){ continueOverlay(); return; }
  if(!G.started || G.paused || G.done) return;
  const b=G.ball; if(!b.rest) return;
  b.x=G.paddle.x; b.y=PY-BR; b.rest=false; b.vx=0; b.vy=-ballSpeed(); G.fangen=false; setCtrl(); sound('start');
}

function fangen(){

  G.fangen=!G.fangen; sound('wand'); setCtrl();
}
function setCtrl(){ const b=$('#bFang'); if(b){ b.setAttribute('aria-pressed',String(!!(G&&G.fangen))); b.innerHTML='🧲 Fangen'+(G&&G.fangen?' <b>bereit</b>':'')+' <span class="small">(↓)</span>'; } }

/* ---------- Physik ---------- */
function step(dt){
  G.t+=dt;
  G.parts.forEach(q=>{ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.life-=dt; }); G.parts=G.parts.filter(q=>q.life>0);
  if(G.done) return;
  if(G.lockT>0 && G.okT<=0) G.lockT=Math.max(0,G.lockT-dt);
  if(G.okT>0){ G.okT-=dt; if(G.okT<=0) naechsterSatz(); if(!G || G.done) return; }
  // Balken
  const p=G.paddle, before=p.x;
  if(G.keys.l || G.keys.r){ p.x+=(G.keys.r?1:-1)*(G.keys.l&&G.keys.r?0:1)*780*dt; p.tx=p.x; }
  else { const d=p.tx-p.x, mx=1600*dt; p.x+=clamp(d,-mx,mx); }
  p.x=clamp(p.x, PW/4, W-PW/4); p.vx=(p.x-before)/Math.max(dt,1e-6);
  // Stern
  if(!G.starDone && !G.star && G.i>=2 && !state.sterne[G.r.idx]){ G.star={ x:-30, y:220+Math.random()*90, vx:70+Math.random()*30 }; }
  if(G.star){ const st=G.star; st.x+=st.vx*dt; st.y+=Math.sin(G.t*2)*12*dt; if(st.x>W+40){ st.x=-30; } }
  // Ball
  const b=G.ball;
  if(b.rest){ b.x=p.x; b.y=PY-BR; return; }
  if(!ruhig()){ G.trail.push([b.x,b.y]); if(G.trail.length>8) G.trail.shift(); }
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(b.x<BR){ b.x=BR; b.vx=Math.abs(b.vx); sound('wand'); }
  if(b.x>W-BR){ b.x=W-BR; b.vx=-Math.abs(b.vx); sound('wand'); }
  if(b.vy<0 && b.y-BR<=FB){ b.y=FB+BR; b.vy=Math.abs(b.vy); const f=fieldAt(b.x); if(G.lockT<=0 && G.okT<=0 && f && f.state==='') waehle(f); else sound('wand'); }
  if(b.vy>0 && b.y+BR>=PY && b.y+BR<=PY+PH+12 && Math.abs(b.x-p.x)<=PW/2+BR){
    const rel=clamp((b.x-p.x)/(PW/2+BR),-1,1), ang=rel*1.05, sp=ballSpeed();
    if(G.fangen){ G.fangen=false; b.rest=true; b.vx=b.vy=0; b.y=PY-BR; G.paddle.tx=b.x; G.paddle.x=clamp(b.x,PW/4,W-PW/4); G.trail=[]; sound('start'); setCtrl(); return; }
    b.vx=sp*Math.sin(ang); b.vy=-sp*Math.cos(ang); b.y=PY-BR; sound('pong');
  }
  const st=G.star;
  if(st){ const dx=b.x-st.x, dy=b.y-st.y; if(dx*dx+dy*dy<(BR+24)*(BR+24)){ G.star=null; G.starDone=true; state.sterne[G.r.idx]=true; G.hearts=Math.min(E.maxHerzen,G.hearts+1); sound('stern'); toast('⭐ Stern gefangen! +1 ❤️',3000); burst(st.x,st.y,['#fff','#ffd23f','#5aa0ff']); updateHud(); save(); } }
  if(b.y-BR>H){ ballWeg(); }
}
function burst(x,y,cols){ if(ruhig()) return; for(let i=0;i<14;i++){ const a=Math.random()*Math.PI*2; G.parts.push({ x, y, vx:Math.cos(a)*150, vy:Math.sin(a)*150-60, g:300, life:.8, c:cols[i%cols.length] }); } }

function waehle(f){
  G.tries++;
  const s=G.s, ok=f.w===s.richtig;
  if(ok){
    f.state='ok';
    if(G.first){ state.punkte+=E.punkte[Math.min(G.tries-1,E.punkte.length-1)]||0; state.res[G.id]=G.tries===1?1:0; if(G.tries===1) G.okFirst++; }
    G.speedMul=Math.min(1.25,G.speedMul*1.03);
    sound('ok'); burst(f.x+f.w2/2, FB-20, ['#5ee08f','#ffd23f','#fff']);
    G.okT=1.8; setBannerOk(); save(); updateHud();
  } else {
    f.state='bad';
    if(G.first && G.tries===1){ state.res[G.id]=0; if(!state.wrong.some(w=>w.id===G.id)) state.wrong.push(Object.assign({ id:G.id, runde:G.r.name, deine:f.w }, s)); save(); }

  }
}
function naechsterSatz(){

  setupSatz();
}
function ballWeg(){
  const b=G.ball; b.rest=true; b.vx=0; b.vy=0; G.trail=[];
  G.hearts--; sound('weg'); updateHud();
  if(G.hearts<=0){
    openOverlay('<div class="box bad" role="alertdialog" aria-labelledby="ovT"><p class="big badline" id="ovT">💔 Keine Herzen mehr!</p><p>Die Runde beginnt noch einmal. Deine Punkte vom ersten Versuch bleiben gespeichert.</p>'+
      '<div class="row"><span class="spacer"></span><button type="button" class="primary" id="ovGo">Neu starten ➜ <span class="small">(Leertaste)</span></button></div></div>',
      ()=>{ startRunde(); renderGameDOM(); }, 700);
  } else toast('Ball verloren – ❤️ noch '+G.hearts+'. Leertaste oder Klick: neuer Ball.',2500);
}

/* ---------- Zeichnen ---------- */
let cv=null, ctx=null, scaleK=1;
function resize(){
  cv=$('#cv'); if(!cv) return;
  const top=$('#top').offsetHeight, bn=$('#banner').offsetHeight, ct=$('.ctrl').offsetHeight, hi=($('.hint')||{offsetHeight:0}).offsetHeight;
  const availH=Math.max(200, window.innerHeight-top-bn-ct-hi-40), availW=Math.min(app.clientWidth-8, 1060);
  let w=Math.min(availW, availH*16/9); w=Math.max(280,Math.floor(w)); const h=Math.round(w*9/16);
  cv.style.width=w+'px'; cv.style.height=h+'px'; const ov=$('#overlay'); if(ov) ov.classList.toggle('klein', h<400);
  const dpr=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); scaleK=cv.width/W;

}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circ(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2); ctx.fill(); }
function ell(x,y,rx,ry,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); ctx.fill(); }
function poly(pts,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); ctx.fill(); }

const THEME={
  atacama:{ sky:['#0b1033','#2a1f4a'], far:'#3a2a4a', near:'#4a3345', paddle:['#ffcf5a','#e0912f'] },
  valparaiso:{ sky:['#0a1630','#1c2f55'], far:'#1d2b45', near:'#26344f', paddle:['#7ee0ff','#2e8fd0'] },
  pucon:{ sky:['#0c1a24','#1e3340'], far:'#22303a', near:'#1a2a24', paddle:['#9ff07a','#3e9e3c'] },
  patagonien:{ sky:['#0d1730','#2b4466'], far:'#3a4a63', near:'#cfe3f0', paddle:['#d7f2ff','#6aa3c0'] },
};
function drawBg(welt){
  const T=THEME[welt], t=G?G.t:0;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,T.sky[0]); g.addColorStop(1,T.sky[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){ const tw=ruhig()?1:.6+.4*Math.sin(t*2+i); ctx.globalAlpha=tw*(.4+rnd(i+7)*.6); circ(rnd(i)*W, 110+rnd(i+3)*300, rnd(i+5)<.15?1.8:1.1, '#fff'); } ctx.globalAlpha=1;
  if(welt==='atacama'){
    circ(820,170,28,'#f6f0d8'); circ(808,162,28,T.sky[0]);
    poly([0,H, 0,420, 200,330, 380,400, 560,300, 760,390, 960,340, 960,H],T.far);
    ctx.fillStyle=T.near; ctx.beginPath(); ctx.moveTo(0,H); for(let x=0;x<=W;x+=40) ctx.lineTo(x,450+Math.sin(x/90)*18); ctx.lineTo(W,H); ctx.fill();
    circ(650,352,22,'#5b4a66'); ctx.fillStyle='#5b4a66'; ctx.fillRect(628,352,44,20); circ(720,362,14,'#5b4a66'); ctx.fillRect(706,362,28,14);
  } else if(welt==='valparaiso'){
    ctx.fillStyle='#0d1f3d'; ctx.fillRect(0,440,W,H-440);
    for(let x=0;x<W;x+=8){ ctx.globalAlpha=.25; ctx.fillStyle='#ffd27a'; ctx.fillRect(x,446+mod(x*7,60),4,2); } ctx.globalAlpha=1;
    ctx.fillStyle=T.far; ctx.beginPath(); ctx.moveTo(0,440); ctx.quadraticCurveTo(240,250,480,330); ctx.quadraticCurveTo(720,230,960,320); ctx.lineTo(960,440); ctx.fill();
    for(let i=0;i<120;i++){ const x=rnd(i+11)*W, y=300+rnd(i+13)*130; const yMax=440; if(y<yMax-5){ ctx.fillStyle=['#ffd27a','#ffb35a','#fff1b0'][i%3]; ctx.globalAlpha=.85; ctx.fillRect(x,y,3,3); } } ctx.globalAlpha=1;
  } else if(welt==='pucon'){
    poly([200,H, 480,250, 520,250, 800,H],T.far); poly([455,290, 480,250, 520,250, 545,290, 520,282, 500,292, 480,282],'#d8e2ea');
    const gl=ruhig()?.5:.4+.2*Math.sin(t*3); ctx.globalAlpha=gl; ell(500,252,26,6,'#ff6a2a'); ctx.globalAlpha=1;
    ctx.fillStyle='#163447'; ctx.fillRect(0,430,W,40);
    for(let i=0;i<9;i++){ const x=40+i*115+rnd(i)*30, h=110+rnd(i+2)*60; ctx.fillStyle=T.near; ctx.fillRect(x-4,H-h,8,h); for(let l=0;l<3;l++) ell(x,H-h+l*16,46-l*9,8,T.near); }
  } else {
    circ(150,170,30,'#f3f6ff');
    [[600,180,46],[680,150,40],[750,190,44]].forEach(([x,top,w])=>{ poly([x-w/2,H-110, x-w/3,top, x+w/3,top-6, x+w/2,H-110],T.far); poly([x-w/3,top, x+w/3,top-6, x+w/4,top+16, x-w/4,top+18],'#e6f0ff'); });
    poly([0,H-110, 960,H-110, 960,H, 0,H],'#22405f'); ctx.fillStyle=T.near; ctx.beginPath(); ctx.moveTo(0,H); for(let x=0;x<=W;x+=48) ctx.lineTo(x,470+((x/48)%2?-12:6)); ctx.lineTo(W,H); ctx.fill();
  }
}
const FCOL=['#3e7bd6','#c0507a','#2f9e8f','#c78a2c'];
function zielX(){
  const b=G.ball; if(b.rest) return b.x;
  if(b.vy>=0) return null;
  const t=(b.y-(FB+BR))/(-b.vy); let x=b.x+b.vx*t; const span=W-2*BR; x=mod(x-BR,2*span); if(x>span) x=2*span-x; return x+BR;
}
function zielPfad(){
  const b=G.ball, pts=[[b.x,b.y]]; let x=b.x, y=b.y, vx=b.rest?0:b.vx, vy=b.rest?-1:b.vy;
  for(let k=0;k<4;k++){ const tTop=(y-(FB+BR))/(-vy); let tWall=Infinity; if(vx>0) tWall=(W-BR-x)/vx; else if(vx<0) tWall=(BR-x)/vx;
    if(tTop<=tWall){ pts.push([x+vx*tTop, FB+BR]); break; } x+=vx*tWall; y+=vy*tWall; pts.push([x,y]); vx=-vx; }
  return pts;
}
function drawFields(){
  const target = settings.ziel && G.started ? zielX() : null, tf = target!=null ? fieldAt(target) : null;
  const locked = G.lockT>0 && G.okT<=0;
  G.fields.forEach((f,k)=>{
    const x=f.x+3, w=f.w2-6;
    let bg=FCOL[k%4]; if(f.state==='bad') bg='#5a2026'; else if(f.state==='ok') bg='#1e9e50'; else if(G.okT>0) bg='#3a3f5c'; else if(locked) bg='#4a5070';
    ctx.fillStyle=bg; rr(x,FT,w,FB-FT,12); ctx.fill();
    if(f===tf && f.state==='' && !locked && G.okT<=0){ ctx.lineWidth=5; ctx.strokeStyle='#ffe066'; rr(x,FT,w,FB-FT,12); ctx.stroke(); }
    else { ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.35)'; rr(x,FT,w,FB-FT,12); ctx.stroke(); }
    let fs=40; ctx.font='bold '+fs+'px Arial'; while(ctx.measureText(f.w).width>w-24 && fs>18){ fs-=2; ctx.font='bold '+fs+'px Arial'; }
    ctx.fillStyle= f.state==='bad' ? 'rgba(255,255,255,.45)' : '#fff'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(f.w, x+w/2, (FT+FB)/2+2);
    if(f.state==='bad'){ ctx.strokeStyle='#ff8a8a'; ctx.lineWidth=4; const tw=ctx.measureText(f.w).width; ctx.beginPath(); ctx.moveTo(x+w/2-tw/2-6,(FT+FB)/2+2); ctx.lineTo(x+w/2+tw/2+6,(FT+FB)/2+2); ctx.stroke(); }
    if(f.state==='ok'){ ctx.font='bold 26px Arial'; ctx.fillText('✓', x+w-22, FT+22); }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  });
  if(locked){ const frac=G.lockT/G.lockMax; ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(MARGIN,FB+6,W-2*MARGIN,8); ctx.fillStyle='#ffd23f'; ctx.fillRect(MARGIN,FB+6,(W-2*MARGIN)*frac,8);
    ctx.font='bold 16px Arial'; ctx.fillStyle='#ffe9a6'; ctx.textAlign='center'; ctx.fillText('📖 Lies den Satz …', W/2, FB+34); ctx.textAlign='left'; }
}
function drawZiel(){
  if(!settings.ziel || !G.started || G.done) return;
  const b=G.ball; if(!b.rest && b.vy>=0) return;
  const pts=zielPfad(); ctx.save(); ctx.setLineDash([6,10]); ctx.strokeStyle='rgba(255,230,102,.45)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1])); ctx.stroke(); ctx.restore();
}
function drawStar(st){
  circ(st.x,st.y,22,'#0039a6'); ctx.fillStyle='#fff'; ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?7:16, a=-Math.PI/2+i*Math.PI/5+(ruhig()?0:G.t); ctx.lineTo(st.x+Math.cos(a)*r, st.y+Math.sin(a)*r); } ctx.closePath(); ctx.fill();
}
function draw(){
  if(!ctx || !G) return;
  const welt=L().welt, T=THEME[welt];
  ctx.setTransform(scaleK,0,0,scaleK,0,0);
  drawBg(welt);
  drawFields();
  drawZiel();
  if(G.star) drawStar(G.star);
  // Balken
  const p=G.paddle, g=ctx.createLinearGradient(0,PY,0,PY+PH); g.addColorStop(0,T.paddle[0]); g.addColorStop(1,T.paddle[1]);
  ctx.fillStyle=g; rr(p.x-PW/2,PY,PW,PH,7); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(p.x-2,PY+2,4,PH-4);
  if(G.fangen){ ctx.lineWidth=3; ctx.strokeStyle='#ff5c8a'; rr(p.x-PW/2-3,PY-3,PW+6,PH+6,9); ctx.stroke(); ctx.font='20px Arial'; ctx.textAlign='center'; ctx.fillText('🧲',p.x,PY+36); ctx.textAlign='left'; }
  // Ball
  const b=G.ball;
  G.trail.forEach((q,i)=>{ ctx.globalAlpha=(i+1)/G.trail.length*.25; circ(q[0],q[1],BR*(.5+i/G.trail.length*.5),'#ffe9a6'); }); ctx.globalAlpha=1;
  if(!ruhig()){ ctx.globalAlpha=.3; circ(b.x,b.y,BR*2,'#ffe9a6'); ctx.globalAlpha=1; }
  circ(b.x,b.y,BR,'#fffdf2'); circ(b.x-3,b.y-3,3,'#fff');
  if(b.rest && G.started && !G.modal && !G.paused && !G.done){ ctx.font='bold 18px Arial'; ctx.fillStyle='#ffe9a6'; ctx.textAlign='center'; ctx.fillText('Leertaste oder Klick: Ball abschießen', W/2, PY-34); ctx.textAlign='left'; }
  G.parts.forEach(q=>{ ctx.globalAlpha=Math.max(0,Math.min(1,q.life*1.5)); circ(q.x,q.y,3.5,q.c); ctx.globalAlpha=1; });
  ctx.font='24px Arial'; for(let i=0;i<Math.max(E.herzen,G.hearts);i++){ ctx.globalAlpha=i<G.hearts?1:.25; ctx.fillText('❤️',W-40-i*32,H-14); } ctx.globalAlpha=1;
}

/* ---------- Schleife ---------- */
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!G) return;
  if(!lastTs) lastTs=ts;
  let dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts;
  if(G.started && !G.paused && !G.modal && !document.hidden){ state.elapsed+=dt*1000; let rem=dt*ZEITRAFFER; while(rem>1e-6 && G && !G.modal && !G.paused){ const d=Math.min(rem,1/240); step(d); rem-=d; } }
  else if(G.parts.length){ G.parts.forEach(q=>{ q.life-=dt; }); G.parts=G.parts.filter(q=>q.life>0); }
  if(!G) return;
  draw();
  if(Math.floor(state.elapsed/1000)!==G._sec){ G._sec=Math.floor(state.elapsed/1000); const c=$('#clock'); if(c) c.textContent='⏱ '+fmtTime(state.elapsed); }
}
function startLoop(){ cancelAnimationFrame(raf); lastTs=0; raf=requestAnimationFrame(frame); }
function stopLoop(){ cancelAnimationFrame(raf); raf=0; G=null; }

function rundeFertig(){
  if(!G || !state) return;
  state.letzte={ name:G.r.name, ok:G.okFirst, n:G.n, stern:!!state.sterne[G.r.idx] };
  stopLoop();
  state.runde++;
  state.phase = state.runde>=runden().length ? 'name' : 'zwischen';
  save(); render();
}

function updateHud(){
  const hud=$('#hud');
  if(!state || view!=='game' || location.hash==='#lehrer' || ['name','end'].includes(state.phase)){ hud.innerHTML=''; return; }
  const nR=runden().length, r=Math.min(state.runde,nR-1);
  hud.innerHTML='<span class="pill">'+esc(state.level)+'</span><span class="pill">🏓 Runde '+(r+1)+'/'+nR+'</span>'+
    (G&&state.phase==='runde'?'<span class="pill" title="Herzen">❤️ '+G.hearts+'</span>':'')+
    '<span class="pill" title="Punkte">⭐ '+state.punkte+'</span><span class="pill" title="Sterne">🌟 '+Object.keys(state.sterne).length+'/'+nR+'</span><span class="pill" id="clock">⏱ '+fmtTime(state.elapsed)+'</span>';
}

function render(){
  if(location.hash==='#lehrer'){ stopLoop(); renderTeacher(); updateHud(); return; }
  if(view==='start' || !state){ stopLoop(); renderStart(); }
  else if(state.phase==='intro') renderIntro();
  else if(state.phase==='runde') renderGame();
  else if(state.phase==='zwischen') renderZwischen();
  else if(state.phase==='name') renderName();
  else renderResult();
  updateHud();
}

  if(!G || view!=='game' || state.phase!=='runde' || location.hash) return;
  const tag=(e.target&&e.target.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(document.querySelector('.confirmbox')) return;
  const k=e.key;
  if(G.modal && G.modal.menu){ if(k==='Escape'||k==='p'||k==='P'){ e.preventDefault(); continueOverlay(true); } return; }
  if(k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); G.keys.l=true; }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); G.keys.r=true; }
  else if(k===' '||k==='Spacebar'||k==='ArrowUp'||k==='Enter'){ e.preventDefault(); if(e.repeat) return; launch(); }
  else if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); if(e.repeat) return; fangen(); }
  else if(k==='Escape'||k==='p'||k==='P'){ e.preventDefault(); if(G.started) openPause(); }
});
document.addEventListener('keyup',e=>{ if(!G) return; const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A') G.keys.l=false; if(k==='ArrowRight'||k==='d'||k==='D') G.keys.r=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && G && G.started && !G.modal && !G.done) openPause(); });
window.addEventListener('blur',()=>{ if(G){ G.keys.l=G.keys.r=false; } if(G && G.started && !G.modal && !G.done && !EINGEBETTET) openPause(); });
window.addEventListener('resize',()=>{ if(G) resize(); });

/* ---------- Start ---------- */
(function init(){
  try{ const s=JSON.parse(lsGet(LS_SET)||'{}'); if(s.sound) settings.sound=true; if(s.anim===false) settings.anim=false; if(E.tempo[s.tempo]) settings.tempo=s.tempo; if(s.ziel===false) settings.ziel=false; }catch(e){}
  const sb=$('#btnSound'), ab=$('#btnAnim');
  const upd=()=>{ sb.textContent=settings.sound?'🔊 Ton an':'🔇 Ton aus'; sb.setAttribute('aria-pressed',String(settings.sound));
    ab.textContent=settings.anim?'🎞 Animationen an':'🎞 Animationen aus'; ab.setAttribute('aria-pressed',String(!settings.anim)); };
  upd();
  sb.addEventListener('click',()=>{ settings.sound=!settings.sound; saveSettings(); upd(); sound('ok'); });
  ab.addEventListener('click',()=>{ settings.anim=!settings.anim; saveSettings(); upd(); toast(settings.anim?'🎞 Animationen sind wieder an.':'🎞 Animationen sind aus – keine Effekte, kein Funkeln.'); });
  $('#btnMenu').addEventListener('click',()=>{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); stopLoop(); view='start'; state=null; render(); });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
