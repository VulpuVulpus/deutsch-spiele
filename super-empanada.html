<script>
/* =====================================================================
   AB HIER: SPIEL-LOGIK (muss nicht geändert werden)
   ===================================================================== */
const E = EINSTELLUNGEN;
const LEVELS = ['A2','B1','B2','C1'];
const LS_GAME = 'superempanada.spiel.v1', LS_SET = 'superempanada.einstellungen.v1';
const TYPEN = ['kleben','schreiben','raetsel','falle','kette','konter'];
const GETIMT = ['kleben','falle','konter'];
const SZENEN = ['toepferei','markt','turm','plaza','gipfel'];
const OHNEZEIT_PARAM = /[?&]ohnezeit(=|&|$)/i.test(location.search);
const INPUT_ATTR = 'type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';

const app = document.getElementById('app');
let state=null, view='start', ui={}, settings={ sound:false };
const optOrder={};

/* ---------- Speicher ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }
function save(){ if(state) lsSet(LS_GAME, JSON.stringify(state)); }

/* ---------- Hilfen ---------- */
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function paras(s){ return String(s||'').split(/\n\s*\n/).map(p => '<p>'+fmt(p)+'</p>').join(''); }
function asList(x){ return x==null ? [] : (Array.isArray(x) ? x : [x]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function range(n){ return Array.from({length:n},(_,i)=>i); }
function cap(s){ s=String(s); return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
function focusEl(sel){ const el = sel ? $(sel) : null; (el||app).focus({preventScroll:true}); }
let toastT=null;
function toast(msg, ms){ const t=$('#toast'); t.innerHTML=fmt(msg); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, ms||3000); }
function spanish(){ return state && E.spanischeHilfe[state.level]; }

/* ---------- Eingebettet (z. B. Google Sites) ---------- */
const EINGEBETTET = (()=>{ try { return window.self!==window.top; } catch(e){ return true; } })();
if(EINGEBETTET) document.documentElement.classList.add('eingebettet');
function bestaetigen(msg, ok){
  const d=document.createElement('div'); d.className='confirmbox'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="cb"><p></p><div class="cbrow"><button type="button" class="cbno">Abbrechen</button><button type="button" class="primary cbyes">Ja</button></div></div>';
  d.querySelector('p').textContent=msg; document.body.appendChild(d);
  const close=()=>d.remove();
  d.querySelector('.cbno').addEventListener('click',close);
  d.querySelector('.cbyes').addEventListener('click',()=>{ close(); ok(); });
  d.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } });
  d.querySelector('.cbno').focus();
}

/* ---------- Antworten vergleichen (ae/oe/ue/ss werden akzeptiert) ---------- */
function canon(s){
  return String(s==null?'':s).normalize('NFC').toLowerCase().replace(/[„“”‟"«»‚‘’']/g,' ').replace(/[.,!?;:…–-]/g,' ')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,' ').trim();
}

/* ---------- Steine ---------- */
function formOf(k){ const w=String(k||'').toLowerCase().trim(); for(const f of ['flach','keil','haken']) if(STEINE[f].includes(w)) return f; return null; }
function steinHTML(k, cls, attrs){ const f=formOf(k)||'flach'; return '<button type="button" class="stein '+f+(cls?' '+cls:'')+'" '+(attrs||'')+' title="'+esc(FORMEN[f].name+': '+FORMEN[f].kurz)+'">'+esc(k)+'</button>'; }
function steinWrap(k, cls, attrs){ return '<span class="sw">'+steinHTML(k,cls,attrs)+steinTag(k)+'</span>'; }
function steinTag(k){ const f=formOf(k); return f ? '<span class="formtag">'+(f==='flach'?'▬':f==='keil'?'◢':'⌐')+' '+esc(FORMEN[f].name)+'</span>' : ''; }

/* Satzglieder lesen: "er | [hat] | Fieber" */
function parseGlieder(s){ return String(s||'').split('|').map(b=>b.trim()).filter(Boolean).map(b=>{ const m=b.match(/^\[(.+)\](.*)$/); return m?{t:m[1]+m[2],v:true}:{t:b,v:false}; }); }
/* Reihenfolge nach Steinform */
function orderFor(toks, form){
  const idx=range(toks.length), fin=toks.findIndex(x=>x.v);
  if(form==='flach' || fin<0) return idx;
  const rest=idx.filter(i=>i!==fin);
  return form==='keil' ? [fin].concat(rest) : rest.concat([fin]);
}
function satz2Text(t, conn){
  const f=formOf(conn);
  if(f==='haken' && t.nebensatz) return t.nebensatz;
  if(f==='keil' && t.keil) return t.keil;
  return orderFor(t.toks, f).map(i=>t.toks[i].t).join(' ');
}
function verbinden(s1, conn, s2, opts){
  const f=formOf(conn), a=String(s1).trim().replace(/[.!?]$/,''), K=opts&&opts.html ? '<span class="kon">'+esc(conn)+'</span>' : conn, KC=opts&&opts.html ? '<span class="kon">'+esc(cap(conn))+'</span>' : cap(conn);
  const A=opts&&opts.html?esc(a):a, B=opts&&opts.html?esc(s2):s2;
  if(f==='keil') return A+'. '+KC+' '+B+'.';
  if(f==='flach' && (conn==='und'||conn==='oder')) return A+' '+K+' '+B+'.';
  return A+', '+K+' '+B+'.';
}

function ortSym(o){ const m=String(o).match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s+/u); return m?m[1]:'📍'; }
function normTask(a, id, ri){
  const t=Object.assign({}, a, { id, ri });
  if(t.typ==='kleben') t.toks=parseGlieder(t.satz2);
  return t;
}
function normRoom(R, r){
  let tasks=[];
  asList(R.aufgaben).forEach((a,i)=>{
    if(a.typ==='kette'){ asList(a.schritte).forEach((s,k)=>{ tasks.push(Object.assign({}, s, { typ:'kette', id:r+'.'+i+'.'+k, kette:r+'.'+i, k, n:a.schritte.length, K:a, toks:parseGlieder(s.baustein) })); }); }
    else tasks.push(normTask(a, r+'.'+i));
  });
  const reserve=asList(R.reserve).map((a,i)=>normTask(a,'r'+r+'.'+i,i));
  tasks.forEach((t,i)=>{ t.r=r; t.ti=i; });
  return { R, tasks, reserve };
}

/* ---------- Daten prüfen ---------- */
function kettenLoesbar(K){
  // Gibt es eine Zuordnung, bei der jeder Stein nur einmal benutzt wird?
  const steps=K.schritte.map(s=>asList(s.passend).filter(p=>K.steine.includes(p)));
  const used=new Set();
  const go=i=>{ if(i===steps.length) return true; for(const p of steps[i]){ if(!used.has(p)){ used.add(p); if(go(i+1)) return true; used.delete(p); } } return false; };
  return go(0);
}
function checkTask(a, where, w, lv){
  const tw=where+': ';
  if(!TYPEN.includes(a.typ)){ w.push(tw+'unbekannter typ „'+a.typ+'“.'); return; }
  if(a.typ==='kleben'){
    if(!a.satz1||!a.satz2) w.push(tw+'satz1 oder satz2 fehlt.');
    if(!parseGlieder(a.satz2).some(x=>x.v)) w.push(tw+'In satz2 fehlt das Verb in [eckigen Klammern].');
    asList(a.optionen).forEach(o=>{ if(!formOf(o)) w.push(tw+'Stein „'+o+'“ steht nicht in STEINE.'); });
    asList(a.loesung).forEach(o=>{ if(!asList(a.optionen).includes(o)) w.push(tw+'loesung „'+o+'“ steht nicht in optionen.'); });
  }
  if(a.typ==='schreiben'){ if(!String(a.satz||'').includes('___')) w.push(tw+'satz braucht ___ als Lücke.'); if(!asList(a.loesung).length) w.push(tw+'loesung fehlt.'); }
  if(a.typ==='falle'){ asList(a.loesung).forEach(o=>{ if(!asList(a.optionen).includes(o)) w.push(tw+'loesung steht nicht genau so in optionen.'); }); }
  if(a.typ==='raetsel'){
    if(asList(a.personen).length<2) w.push(tw+'Es braucht mindestens zwei personen.');
    if(a.antwort==='person'){ if(!asList(a.personen).some(p=>p.name===a.loesung)) w.push(tw+'loesung ist kein Name aus personen.'); }
    else if(!asList(a.orte).map(ortName).includes(a.loesung)) w.push(tw+'loesung ist kein Ort aus orte.');
  }
  if(a.typ==='kette'){
    if(!asList(a.schritte).length) w.push(tw+'schritte fehlen.');
    asList(a.schritte).forEach((s,k)=>{ asList(s.passend).forEach(p=>{ if(!asList(a.steine).includes(p)) w.push(tw+'Schritt '+(k+1)+': „'+p+'“ ist nicht in steine.'); if(!formOf(p)) w.push(tw+'Schritt '+(k+1)+': „'+p+'“ steht nicht in STEINE.'); }); if(!parseGlieder(s.baustein).some(x=>x.v)) w.push(tw+'Schritt '+(k+1)+': Verb in [ ] fehlt.'); });
    if(asList(a.schritte).length && !kettenLoesbar(a)) w.push(tw+'Die Kette ist nicht lösbar, wenn jeder Stein nur einmal benutzt wird.');
  }
  if(a.typ==='konter'){ const opts=asList(a.optionen).length?asList(a.optionen):Object.keys(FUNKTIONEN); asList(a.loesung).forEach(l=>{ if(!opts.includes(l)) w.push(tw+'loesung „'+l+'“ ist keine Funktion aus FUNKTIONEN.'); }); }
  if(a.typ!=='kette' && a.typ!=='raetsel' && !a.erklaerung_de) w.push(tw+'erklaerung_de fehlt.');
}
function dataWarnings(){
  const w=[];
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(S==null) return;
    if(!Array.isArray(S.raeume)||!S.raeume.length){ w.push(lv+': „raeume“ fehlt.'); return; }
    S.raeume.forEach((R,r)=>{
      const where=lv+' · Raum '+(r+1)+' ('+(R.name||'?')+')';
      if(!SZENEN.includes(R.szene)) w.push(where+': unbekannte szene „'+R.szene+'“.');
      if(!asList(R.aufgaben).length) w.push(where+': keine Aufgaben.');
      asList(R.aufgaben).forEach((a,i)=>checkTask(a, where+', Aufgabe '+(i+1), w, lv));
      asList(R.reserve).forEach((a,i)=>checkTask(a, where+', Reserve '+(i+1), w, lv));
    });
  });
  return w;
}

/* ---------- Prüfcode ---------- */
function cyrb53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level,o,pct,d,name){ let n=cyrb53([level,o?'O':'Z',pct,d,normName(name),E.geheimwort].join('|')); let s=''; for(let i=0;i<5;i++){ s+=B32[n%32]; n=Math.floor(n/32); } return s; }
function makeCode(level,o,pct,date,name){ const p=n=>String(n).padStart(2,'0'); const d=p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100); return level+(o?'O':'')+'-'+pct+'-'+d+'-'+checksum(level,o,pct,d,name); }
function verifyCode(code,name){
  const m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)(O?)-(\d{1,3})-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: B1-85-131026-K7QFM' };
  return { valid: checksum(m[1],!!m[2],+m[3],m[4],name)===m[5], level:m[1], ohnezeit:!!m[2], pct:+m[3], date:m[4].slice(0,2)+'.'+m[4].slice(2,4)+'.20'+m[4].slice(4) };
}

function newGame(level){
  state={ v:1, level, sig:signature(level), room:0, phase:'intro', done:{}, tries:{}, tips:{}, tipsUsed:SPIEL[level].raeume.map(()=>0),
    cracks:{}, swap:{}, reserveUsed:{}, burned:{}, kettenText:{}, bonus:{}, wrong:[], scherben:0, elapsed:0, name:'', finished:null,
    ohnezeit: !E.zeitdruck || OHNEZEIT_PARAM };
  ui={}; save();
}
function loadSaved(){
  let s=null; try{ s=JSON.parse(lsGet(LS_GAME)||'null'); }catch(e){ s=null; }
  if(!s || s.v!==1 || !SPIEL[s.level]) return null;
  try { if(s.sig!==signature(s.level)) return null; } catch(e){ return null; }
  return s;
}
function zeitAktiv(){ return E.zeitdruck && !OHNEZEIT_PARAM && !(state && state.ohnezeit); }
function stats(){
  const all=allTasks(state.level); let score=0, ok=0;
  all.forEach(t=>{ const r=state.done[t.id]; if(r){ score+=r.pts; if(r.ok) ok++; } });
  Object.values(state.bonus||{}).forEach(b=>{ score+=b; });
  const max=all.length*E.punkteErsterVersuch + kettenAnzahl(state.level)*3*E.kettenBonusProForm;
  return { score, max, pct: max? Math.min(100,Math.round(score/max*100)) : 0, total:all.length, ok, open: all.filter(t=>!state.done[t.id]).length };
}
function curRoom(){ return D()[state.room]; }
function shown(t){ const s=state.swap[t.id]; return s!=null ? curRoom().reserve[s] : t; }

/* Versuch: 'ok' | 'retry' | 'fail' */
function attempt(t, ok, given, show){
  show=show||t; const tries=state.tries[t.id]||0;
  if(ok){
    let pts = tries===0 ? E.punkteErsterVersuch : E.punkteZweiterVersuch;
    if(state.tips[t.id]) pts=Math.max(0, pts-E.tippKosten);
    state.done[t.id]={ ok:true, pts }; sound('ok'); save(); return 'ok';
  }
  state.tries[t.id]=tries+1;
  if(tries+1>=2){
    state.done[t.id]={ ok:false, pts:0 };
    state.wrong.push({ raum:curRoom().R.name, aufgabe:taskLabel(show), deine:given, loesung:solutionText(show) });
    sound('bad'); save(); return 'fail';
  }
  sound('bad'); save(); return 'retry';
}
function taskLabel(t){
  if(t.typ==='kleben') return t.satz1+' + '+t.toks.map(x=>x.t).join(' ');
  if(t.typ==='schreiben') return plain(t.satz)+(t.hinweis?' ('+t.hinweis+')':'');
  if(t.typ==='raetsel') return plain(t.frage);
  if(t.typ==='falle') return (t.frage?plain(t.frage)+' ':'')+plain(t.satz);
  if(t.typ==='kette') return 'Wortduell, Schritt '+(t.k+1)+': '+t.toks.map(x=>x.t).join(' ');
  if(t.typ==='konter') return t.satzpaar;
  return '';
}
function solutionText(t){
  if(t.typ==='kleben'){ const c=asList(t.loesung)[0]; return plain(verbinden(t.satz1, c, satz2Text(t,c))); }
  if(t.typ==='schreiben') return plain(String(t.satz).replace('___', asList(t.loesung)[0]));
  if(t.typ==='falle') return asList(t.loesung).join(' / ');
  if(t.typ==='kette') return asList(t.passend).join(' / ');
  if(t.typ==='konter') return asList(t.loesung).join(' / ')+' – '+plain(t.verbunden||'');
  return String(t.loesung);
}

/* ---------- Haupt-Render ---------- */
let timerInt=null;
function stopTimers(){ if(timerInt){ clearInterval(timerInt); timerInt=null; } }
function render(){

function renderGame(){
  const play = state.phase==='play';
  app.innerHTML='<div class="stage'+(play?' compact':'')+'" id="stage"></div><section class="card" id="panel"></section>';

function renderStage(bubble){

function bossHP(){ const { tasks }=curRoom(); let dmg=0; tasks.forEach(t=>{ const r=state.done[t.id]; if(r) dmg+= r.ok?1:0.5; }); return Math.max(0,1-dmg/tasks.length); }
function zap(){ const s=$('#stage'); if(!s) return; const d=document.createElement('div'); d.className='zap'; s.appendChild(d); setTimeout(()=>d.remove(),800); const hp=$('#hp'); if(hp) hp.style.width=(bossHP()*100)+'%'; sound('zap'); }
function pigSays(t){ const s=$('#stage'); if(!s) return; const old=$('.bubble.pig',s); if(old) old.remove(); const b=document.createElement('div'); b.className='bubble pig'; b.style.left='4%'; b.style.top='14%'; b.innerHTML='🐷 '+fmt(t); s.appendChild(b); }

function refreshPanel(){
  stopTimers();
  const P=$('#panel'); if(!P) return;
  const { R } = curRoom();
  if(state.phase==='intro') return renderIntro(R,P);
  if(state.phase==='roomdone') return renderRoomDone(R,P);
  if(state.phase==='final') return renderFinal(P);
  renderPlay(P);
}
function roomHead(R){ return '<div class="panelhead"><span class="chip">Raum '+(state.room+1)+' von '+D().length+'</span>'+(R.thema?'<span class="chip">🎯 '+esc(R.thema)+'</span>':'')+'<span class="chip" id="tipChip">🐷 Tipps: '+(E.tippsProRaum-state.tipsUsed[state.room])+'/'+E.tippsProRaum+'</span></div>'; }
function steinKunde(){
  return '<h3>🪨 Die drei Konnektor-Steine</h3><div class="kunde">'+['flach','keil','haken'].map(f=>{ const ex={flach:'denn',keil:'deshalb',haken:'weil'}[f];
    return '<div>'+steinHTML(ex,'','tabindex="-1"')+'<p style="margin:.2em 0"><strong>'+esc(FORMEN[f].name)+'</strong> – '+esc(FORMEN[f].kurz)+'</p><p class="small" style="margin:0">'+fmt(FORMEN[f].de)+'</p>'+(spanish()?'<p class="small" style="color:#9fd0ff;margin:.2em 0 0">🇨🇱 '+fmt(FORMEN[f].es)+'</p>':'')+'</div>'; }).join('')+'</div>';
}
function renderIntro(R,P){
  P.innerHTML=roomHead(R)+(state.room===0?'<h2>Pomaire in Gefahr</h2>'+paras(L().intro)+steinKunde()+'<hr style="border-color:var(--line)">':'')+

  focusEl('#btnGo');
}
function completeRoom(){
  stopTimers();
  state.scherben=Math.max(state.scherben, state.room+1);

  state.phase = last ? 'final' : 'roomdone'; ui={}; save();

}
function rezeptListe(n){ return '<ol class="rezept">'+SPIEL[state.level].raeume.slice(0,n).map(R=>'<li>'+fmt(R.scherbe||'')+'</li>').join('')+'</ol>'; }
function renderRoomDone(R,P){
  P.innerHTML='<h2>🏺 Scherbe '+(state.room+1)+' gefunden!</h2>'+paras(R.geschafft)+
    '<div class="tafelbox"><div class="ingpop">'+tafelSVG(state.room+1)+'</div><div class="rezept"><p><strong>Auf der Scherbe steht:</strong></p><p class="preview">'+fmt(R.scherbe||'')+'</p></div></div>'+
    '<div class="row"><span class="spacer"></span><button type="button" class="primary" id="btnNext">Weiter ➜</button></div>';

function renderFinal(P){

/* ---------- Spielen ---------- */
function renderPlay(P){
  const { R, tasks } = curRoom();
  let t = ui.resolved ? tasks.find(x=>x.id===ui.resolved) : tasks.find(x=>!state.done[x.id]);
  if(!t){ return completeRoom(); }
  if(ui.id!==t.id) ui={ id:t.id, resolved:ui.resolved };
  const dots='<div class="dots" aria-label="Fortschritt">'+tasks.map(x=>{ const r=state.done[x.id]; return '<span class="'+(r?(r.ok?(state.cracks[x.id]?'crack':'ok'):'bad'):(x.id===t.id?'cur':''))+'"></span>'; }).join('')+'</div>';
  P.innerHTML=roomHead(R)+'<div class="panelhead"><strong>Aufgabe '+(t.ti+1)+' von '+tasks.length+'</strong>'+dots+'</div><div id="task"></div>';
  const el=$('#task');
  const onNext=()=>{ ui={ }; refreshPanel(); };
  const S=shown(t);
  const R_=T[S.typ]; R_(t, S, el, onNext);
}
function timedNow(t){ return GETIMT.includes(t.typ) && zeitAktiv() && !(state.tries[t.id]) && state.swap[t.id]==null && !state.done[t.id]; }
function timerHTML(t){ return timedNow(t) ? '<div class="feucht" aria-hidden="true">💧 Der Ton trocknet …<div class="bar"><div id="tbar"></div></div></div>' : ''; }
function startTimer(t, rerender){
  if(!timedNow(t)) return;
  const sec=((E.sekunden[t.typ]||{})[state.level]||30)*1000;
  if(!ui.timerEnd) ui.timerEnd=Date.now()+sec;
  const bar=$('#tbar');
  stopTimers();
  timerInt=setInterval(()=>{ if(document.hidden) { ui.timerEnd+=100; return; } const left=ui.timerEnd-Date.now(); if(bar) bar.style.width=Math.max(0,left/sec*100)+'%'; if(left<=0){ stopTimers(); timeout(t); } },100);
}
function timeout(t){
  state.tries[t.id]=1; state.cracks[t.id]=true;
  const room=curRoom(), used=state.reserveUsed[state.room]||[];
  const ri=room.reserve.findIndex((r,i)=>r.typ===t.typ && !used.includes(i));
  if(ri>=0){ state.swap[t.id]=ri; state.reserveUsed[state.room]=used.concat([ri]); }
  sound('crack'); save();
  ui={ id:t.id, crackMsg:true }; refreshPanel();
}
function crackHTML(){ return ui.crackMsg ? '<div class="crackmsg">💧 <strong>Der Ton ist getrocknet – die Scherbe hat einen Riss!</strong> Neuer Versuch'+(ui.id&&state.swap[ui.id]!=null?' mit anderen Sätzen':'')+', jetzt ohne Zeit (höchstens '+E.punkteZweiterVersuch+' Punkte).</div>' : ''; }
function tipHTML(t,S){
  const left=E.tippsProRaum-state.tipsUsed[state.room];
  if(state.done[t.id] || state.tips[t.id] || !S.tipp) return '';
  return '<button type="button" id="btnTip"'+(left<=0?' disabled':'')+'>🐷 Tipp (−'+E.tippKosten+')</button>';
}
function bindTip(t,S){ const b=$('#btnTip'); if(!b) return; b.addEventListener('click',()=>{ if(state.tipsUsed[state.room]>=E.tippsProRaum) return; state.tips[t.id]=true; state.tipsUsed[state.room]++; save(); pigSays(S.tipp); toast('🐷 '+S.tipp,6000); b.remove(); const c=$('#tipChip'); if(c) c.textContent='🐷 Tipps: '+(E.tippsProRaum-state.tipsUsed[state.room])+'/'+E.tippsProRaum; renderHud(); }); }
function feedbackHTML(t,S){
  const f=ui.fb; if(!f) return '';
  const es = spanish() && S.erklaerung_es ? '<p class="small" style="color:#9fd0ff">🇨🇱 <strong>Ayuda:</strong> '+fmt(S.erklaerung_es)+'</p>' : '';
  if(f.type==='ok') return '<div class="tipbox ok"><p><strong>✓ Richtig!</strong> '+(f.msg?fmt(f.msg):'')+' <span class="small">+'+f.pts+' Punkte</span></p>'+(S.erklaerung_de?'<p>'+fmt(S.erklaerung_de)+'</p>':'')+es+'</div>';
  if(f.type==='retry') return '<div class="tipbox bad"><p><strong>✗ Noch nicht.</strong> '+fmt(f.msg||'')+'</p>'+(S.thema?'<p>💡 Denkhilfe: <strong>'+esc(S.thema)+'</strong></p>':'')+'<p class="small">Du hast noch einen Versuch.</p></div>';
  return '<div class="tipbox bad"><p><strong>✗ Leider falsch.</strong> '+fmt(f.msg||'')+'</p><p>Richtig: <strong>'+esc(solutionText(S))+'</strong></p>'+(S.erklaerung_de?'<p>'+fmt(S.erklaerung_de)+'</p>':'')+es+'</div>';
}
function nextBtn(label){ return '<div class="row" style="margin-top:.6em"><span class="spacer"></span><button type="button" class="primary" id="btnNextTask">'+(label||'Weiter ➜')+'</button></div>'; }
function afterAnswer(t, out, el, rerender){
  if(out==='ok'||out==='fail'){ ui.resolved=t.id; stopTimers(); if(curRoom().R.boss) zap(); renderHud(); }
  rerender();
  const fb=$('.tipbox.ok, .tipbox.bad', el); if(fb) setTimeout(()=>fb.scrollIntoView({block:'nearest',behavior:'smooth'}),30);
  if(out!=='retry'){ const nb=$('#btnNextTask',el); if(nb) nb.focus({preventScroll:true}); }
}

/* ---------- Aufgabentypen ---------- */
const T = {
  /* kleben: Stein wählen + zweiten Satz ordnen */
  kleben(t, S, el, onNext){
    const res=state.done[t.id], n=S.toks.length;
    if(!optOrder[S.id]) optOrder[S.id]=shuffle(range(S.optionen.length));
    ui.placed=ui.placed||[]; ui.lehm=ui.lehm||[];
    const rerender=()=>T.kleben(t,S,el,onNext);
    if(!ui.pool){ let o, k=0; do { o=shuffle(range(n)); k++; } while(k<20 && n>1 && o.every((v,i)=>v===i)); ui.pool=o; }
    let h=crackHTML()+timerHTML(t);
    const conn = res ? (ui.conn||asList(S.loesung)[0]) : ui.conn;
    if(!res){
      h+='<p class="small muted" style="margin:.2em 0">1 · Wähle einen Stein:</p><div class="stones">'+optOrder[S.id].map(i=>{ const o=S.optionen[i]; return steinWrap(o,(ui.conn===o?'sel':'')+(ui.lehm.includes(o)?' lehm':''),'data-c="'+esc(o)+'"'+(ui.lehm.includes(o)?' disabled':'')); }).join('')+'</div>';
      h+='<p class="small muted" style="margin:.2em 0">2 · Bau aus den Scherben einen richtigen Satz'+(conn?' ('+esc(FORMEN[formOf(conn)].name)+': '+esc(FORMEN[formOf(conn)].kurz)+')':'')+':</p>';
    }
    const placed = res ? (res.ok && ui.placed.length===n ? ui.placed : orderFor(S.toks, formOf(conn))) : ui.placed;
    const tile=(i,w)=>'<button type="button" class="tile scherbe'+(S.toks[i].v?' v':'')+'" data-'+w+'="'+i+'"'+(res?' disabled':'')+'>'+esc(S.toks[i].t)+'</button>';
    h+='<div class="answer'+(res&&res.ok?' ok':'')+'" aria-label="Dein Satz"><span class="scherbe fest">'+esc(String(S.satz1).replace(/[.!?]$/,''))+'</span>'+
      '<span class="slot">'+(conn?steinHTML(conn,'sel','tabindex="-1" disabled'):'Stein?')+'</span>'+placed.map(i=>tile(i,'a')).join('')+'</div>';
    if(!res && ui.placed.length<n) h+='<div class="pool">'+ui.pool.filter(i=>!ui.placed.includes(i)).map(i=>tile(i,'p')).join('')+'</div>';
    if(conn && placed.length) h+='<div class="preview">'+verbinden(S.satz1, conn, placed.map(i=>S.toks[i].t).join(' ')+(placed.length<n?' …':''), {html:true})+'</div>';
    if(!res) h+='<div class="row"><button type="button" class="primary" id="btnCheck"'+(conn&&ui.placed.length===n?'':' disabled')+'>🏺 Kleben</button><button type="button" id="btnReset"'+(ui.placed.length?'':' disabled')+'>↺ Satz zurücksetzen</button>'+tipHTML(t,S)+'</div>';
    if(res && res.ok && ui.fb && ui.fb.type==='ok') h+='<div class="potrow">'+potSVG(n+2)+'<p class="pottxt">🏺 Die Scherben werden zu einem Tontopf!</p></div>';
    h+=feedbackHTML(t,S);
    if(res) h+=nextBtn();
    el.innerHTML=h;
    $$('[data-c]',el).forEach(b=>b.addEventListener('click',()=>{ ui.conn=b.dataset.c; rerender(); }));
    $$('[data-p]',el).forEach(b=>b.addEventListener('click',()=>{ ui.placed.push(+b.dataset.p); rerender(); const nb=$('.pool .tile',el); if(nb) nb.focus(); else if($('#btnCheck',el)&&!$('#btnCheck',el).disabled) $('#btnCheck',el).focus(); }));
    $$('[data-a]',el).forEach(b=>b.addEventListener('click',()=>{ if(res) return; const i=+b.dataset.a; ui.placed=ui.placed.filter(x=>x!==i); rerender(); }));
    if($('#btnReset',el)) $('#btnReset',el).addEventListener('click',()=>{ ui.placed=[]; rerender(); });
    bindTip(t,S);
    if($('#btnCheck',el)) $('#btnCheck',el).addEventListener('click',()=>{
      const c=ui.conn, built=ui.placed.map(i=>S.toks[i].t).join(' ');
      const meaning=asList(S.loesung).includes(c), form=canon(built)===canon(satz2Text(S,c));
      const out=attempt(t, meaning&&form, plain(verbinden(S.satz1,c,built)), S);
      if(out==='ok') ui.fb={type:'ok', pts:state.done[t.id].pts};
      else {
        let msg = !meaning ? 'Der Stein „'+c+'“ passt nicht zur Bedeutung.' : 'Der Stein passt – aber die Wortstellung nicht. '+FORMEN[formOf(c)].de;
        if(!meaning){ ui.lehm.push(c); ui.conn=null; }
        ui.placed=[]; ui.fb={ type:out, msg };
      }
      afterAnswer(t,out,el,rerender);
    });
    if($('#btnNextTask',el)) $('#btnNextTask',el).addEventListener('click',onNext);
    if(!res) startTimer(t, rerender);
  },

  /* schreiben: Lücke mit Texteingabe */
  schreiben(t, S, el, onNext){
    const res=state.done[t.id];
    const rerender=()=>T.schreiben(t,S,el,onNext);
    const parts=String(S.satz).split('___');
    let h=crackHTML()+'<p class="auftrag">Ergänze den Satz.</p>';
    h+='<p class="satz">'+fmt(parts[0])+(res?'<strong>'+esc(asList(S.loesung)[0])+'</strong>':'<input '+INPUT_ATTR+' id="ans" style="width:'+Math.max(14,String(asList(S.loesung)[0]).length+4)+'ch" aria-label="Lücke" value="'+esc(ui.val||'')+'">')+fmt(parts[1]||'')+'</p>';
    if(S.hinweis) h+='<p class="muted">('+fmt(S.hinweis)+')</p>';
    if(!res) h+=umlautBar()+'<div class="row"><button type="button" class="primary" id="btnCheck">✓ Prüfen</button>'+tipHTML(t,S)+'</div>';
    h+=feedbackHTML(t,S);
    if(res) h+=nextBtn();
    el.innerHTML=h;
    bindTip(t,S); bindUmlauts(el);
    const inp=$('#ans',el);
    const check=()=>{ const v=inp.value.trim(); if(!v){ toast('Bitte schreib deine Antwort in die Lücke.'); return; } ui.val='';
      const ok=asList(S.loesung).some(l=>canon(l)===canon(v));
      const out=attempt(t, ok, plain(String(S.satz).replace('___',v)), S);
      ui.fb = out==='ok' ? {type:'ok',pts:state.done[t.id].pts} : {type:out, msg:'„'+v+'“ stimmt noch nicht.'};
      afterAnswer(t,out,el,rerender); };
    if(inp){ inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } }); inp.addEventListener('input',()=>{ ui.val=inp.value; }); setTimeout(()=>inp.focus({preventScroll:true}),20); }
    if($('#btnCheck',el)) $('#btnCheck',el).addEventListener('click',check);
    if($('#btnNextTask',el)) $('#btnNextTask',el).addEventListener('click',onNext);
  },

  /* raetsel: Ort oder Person anklicken */
  raetsel(t, S, el, onNext){
    const res=state.done[t.id]; ui.wrong=ui.wrong||[];
    const rerender=()=>T.raetsel(t,S,el,onNext);
    const pers=S.antwort==='person';
    let h='<p>'+fmt(S.einleitung||'')+'</p><div class="people">'+S.personen.map((p,i)=>{
      const right=pers&&res&&p.name===S.loesung, w=pers&&ui.wrong.includes(p.name);
      const inner='<span class="face">'+p.bild+'</span><span><strong>'+esc(p.name)+'</strong><span class="said" style="display:block;margin-top:.2em">„'+fmt(p.text)+'“</span></span>';
      return pers ? '<button type="button" class="person opt'+(right?' right':'')+(w?' wrong':'')+'" data-p="'+esc(p.name)+'"'+(res||w?' disabled':'')+'>'+inner+'</button>' : '<div class="person">'+inner+'</div>'; }).join('')+'</div>';
    h+='<p class="auftrag">❓ '+fmt(S.frage)+'</p>';
    if(!pers) h+='<div class="map">'+S.orte.map(o=>{ const nm=ortName(o), right=res&&nm===S.loesung, w=ui.wrong.includes(nm);
      return '<button type="button" class="place'+(right?' right':'')+(w?' wrong':'')+'" data-o="'+esc(nm)+'"'+(res||w?' disabled':'')+'><span class="sym">'+ortSym(o)+'</span>'+esc(nm)+'</button>'; }).join('')+'</div>';
    if(!res) h+='<div class="row">'+tipHTML(t,S)+'</div>';
    h+=feedbackHTML(t,S);
    if(res) h+=nextBtn();
    el.innerHTML=h;
    bindTip(t,S);
    $$(pers?'[data-p]':'[data-o]',el).forEach(b=>b.addEventListener('click',()=>{
      const v=b.dataset.p||b.dataset.o, ok=v===S.loesung;
      const out=attempt(t, ok, v, S);
      if(!ok) ui.wrong.push(v);
      ui.fb = out==='ok' ? {type:'ok',pts:state.done[t.id].pts} : {type:out, msg: pers ? v+' sagt die Wahrheit.' : 'Dort ist es nicht.'};
      afterAnswer(t,out,el,rerender);
    }));
    if($('#btnNextTask',el)) $('#btnNextTask',el).addEventListener('click',onNext);
  },

  /* falle: verzauberte Steine – nur die Bedeutung entscheidet */
  falle(t, S, el, onNext){
    const res=state.done[t.id]; ui.lehm=ui.lehm||[];
    if(!optOrder[S.id]) optOrder[S.id]=shuffle(range(S.optionen.length));
    const rerender=()=>T.falle(t,S,el,onNext);
    const sol=asList(S.loesung);
    let satz=fmt(S.satz);
    const gaps=String(S.satz).split('___').length-1;
    if(gaps){ const fill = res ? sol[0] : null; const pp=String(S.satz).split('___'); const fp=fill?String(fill).split('…').map(x=>x.trim()):[];
      satz=pp.map((p,i)=>fmt(p)+(i<gaps?'<span class="gap">'+(fp[i]!=null?esc(fp[i]):(fill?esc(fill):'&nbsp;'))+'</span>':'')).join(''); }
    let h=crackHTML()+timerHTML(t)+'<p class="auftrag">🧙 Lehmanns verzauberte Steine: '+(S.frage?fmt(S.frage):'Welcher passt zur Bedeutung?')+'</p><p class="satz">'+satz+'</p>';
    const simple=S.optionen.every(o=>formOf(o));
    h+=simple ? '<div class="stones">'+optOrder[S.id].map(i=>{ const o=S.optionen[i], right=res&&sol.includes(o), l=ui.lehm.includes(o); return steinHTML(o,(right?'right':'')+(l?' lehm':''),'data-o="'+esc(o)+'"'+(res||l?' disabled':'')); }).join('')+'</div>'
      : '<div class="opts">'+optOrder[S.id].map(i=>{ const o=S.optionen[i], right=res&&sol.includes(o), l=ui.lehm.includes(o); return '<button type="button" class="opt'+(right?' right':'')+(l?' lehm':'')+'" data-o="'+esc(o)+'"'+(res||l?' disabled':'')+'>'+esc(o)+'</button>'; }).join('')+'</div>';
    if(!res) h+='<div class="row" style="margin-top:.5em">'+tipHTML(t,S)+'</div>';
    h+=feedbackHTML(t,S);
    if(res) h+=nextBtn();
    el.innerHTML=h;
    bindTip(t,S);
    $$('[data-o]',el).forEach(b=>b.addEventListener('click',()=>{
      const o=b.dataset.o, ok=sol.includes(o);
      const out=attempt(t, ok, o, S);
      if(!ok) ui.lehm.push(o);
      ui.fb = out==='ok' ? {type:'ok',pts:state.done[t.id].pts} : {type:out, msg:'„'+o+'“ wird zu Lehm! Der Stein passt nicht zur Bedeutung.'};
      afterAnswer(t,out,el,rerender);
    }));
    if($('#btnNextTask',el)) $('#btnNextTask',el).addEventListener('click',onNext);
    if(!res) startTimer(t, rerender);
  },

  /* kette: Wortduell */
  kette(t, S, el, onNext){
    const res=state.done[t.id], K=t.K, key=t.kette;
    const burned=state.burned[key]||[], text=state.kettenText[key]||[esc(K.start)];
    ui.wrongStones=ui.wrongStones||[];
    const rerender=()=>T.kette(t,S,el,onNext);
    let h='<div class="claim">🧙 <strong>Lehmann behauptet:</strong> „'+fmt(K.behauptung)+'“</div>';
    h+='<p class="auftrag">Schritt '+(t.k+1)+' von '+t.n+': Wähle einen Stein für den nächsten Satz.'+(t.funktion&&res?' <span class="chip">'+esc(t.funktion)+'</span>':'')+'</p>';
    h+='<div class="text">'+text.map(s=>res?s:s.replace(/ class="new"/g,'')).join(' ')+'</div>';
    if(!res){
      const prev = t.basis ? t.basis : plain(text[text.length-1]).replace(/^.*?([^.!?]*[.!?])\s*$/,'$1');
      h+='<div class="shards">'+(t.basis?'<div class="shard">'+esc(t.basis.replace(/[.!?]$/,''))+'</div>':'<div class="shard">…</div>')+'<div class="slot">Stein?</div><div class="shard">'+esc(t.toks.map(x=>x.t).join(' '))+'</div></div>';
      h+='<div class="stones">'+K.steine.map(s=>{ const b=burned.includes(s), w=ui.wrongStones.includes(s); return steinWrap(s,(b?'burnt':'')+(w?' lehm':''),'data-s="'+esc(s)+'"'+(b||w?' disabled':'')); }).join('')+'</div>';
      h+='<p class="small muted">Zerbröckelte Steine kannst du nicht mehr benutzen. Bonus: '+E.kettenBonusProForm+' Punkte pro Steinform, die du benutzt.</p>';
    }
    h+=feedbackHTML(t,S);
    if(res){
      if(t.k===t.n-1){ const b=state.bonus[key]||0; const forms=[...new Set(burned.map(formOf))].map(f=>FORMEN[f].name).join(', ');
        h+='<div class="tipbox pig"><p>🐷 <strong>Abwechslungs-Bonus: +'+b+' Punkte</strong> – du hast diese Steinformen benutzt: '+esc(forms)+'.</p></div>'; }
      h+=nextBtn(t.k===t.n-1?'Weiter ➜':'Nächster Satz ➜');
    }
    el.innerHTML=h;
    $$('[data-s]',el).forEach(b=>b.addEventListener('click',()=>{
      const s=b.dataset.s, ok=asList(t.passend).includes(s) && !burned.includes(s);
      const out=attempt(t, ok, s, S);
      if(out==='ok' || out==='fail'){
        const use = ok ? s : (asList(t.passend).find(p=>!burned.includes(p)) || asList(t.passend)[0]);
        const newBurn=burned.concat([use]); state.burned[key]=newBurn;
        const s2=satz2Text(t, use);
        let txt=text.map(x=>x.replace(/ class="new"/g,''));
        if(t.basis){ txt.push('<span class="new">'+verbinden(t.basis, use, s2, {html:true})+'</span>'); }
        else { const last=txt.pop(); const lastPlain=last; txt.push(verbindenKette(lastPlain, use, s2)); }
        state.kettenText[key]=txt;
        if(t.k===t.n-1){ const forms=new Set(newBurn.map(formOf)); state.bonus[key]=forms.size*E.kettenBonusProForm; }
        sound('burn'); save();
        ui.fb = out==='ok' ? {type:'ok',pts:state.done[t.id].pts, msg:'Der Stein „'+use+'“ zerbröckelt nach dem Benutzen.'} : {type:'fail', msg:'Hier passt: „'+use+'“.'};
      } else { ui.wrongStones.push(s); ui.fb={type:'retry', msg: burned.includes(s)?'Dieser Stein ist schon zerbröckelt.':'Der Stein „'+s+'“ passt hier nicht zur Bedeutung.'}; }
      afterAnswer(t,out,el,rerender);
    }));
    if($('#btnNextTask',el)) $('#btnNextTask',el).addEventListener('click',onNext);
  },

  /* konter: Funktion erkennen */
  konter(t, S, el, onNext){
    const res=state.done[t.id]; ui.wrong=ui.wrong||[];
    const rerender=()=>T.konter(t,S,el,onNext);
    const opts=asList(S.optionen).length?asList(S.optionen):Object.keys(FUNKTIONEN), sol=asList(S.loesung);
    let h=crackHTML()+timerHTML(t)+'<p class="auftrag">🧙 Lehmann schleudert dir zwei Sätze entgegen. Welche Verbindung brauchen sie?</p><div class="pair">„'+esc(S.satzpaar)+'“</div>';
    h+='<div class="types">'+opts.map(o=>{ const F=FUNKTIONEN[o]||{}, right=res&&sol.includes(o), w=ui.wrong.includes(o);
      return '<button type="button" class="type'+(right?' right':'')+(w?' wrong':'')+'" data-f="'+esc(o)+'"'+(res||w?' disabled':'')+'><span class="tn">'+esc(o)+'</span><span class="tb">'+esc(F.beispiele||'')+'</span></button>'; }).join('')+'</div>';
    if(res && S.verbunden) h+='<p style="margin-top:.6em">⚡ <strong>Gegenzauber:</strong></p><div class="preview">'+fmt(S.verbunden)+'</div>';
    h+=feedbackHTML(t,S);
    if(res) h+=nextBtn(curRoom().tasks.every(x=>state.done[x.id])?'⚡ Letzter Gegenzauber ➜':'Weiter kämpfen ➜');
    el.innerHTML=h;
    $$('[data-f]',el).forEach(b=>b.addEventListener('click',()=>{
      const f=b.dataset.f, ok=sol.includes(f);
      const out=attempt(t, ok, f, S);
      if(!ok) ui.wrong.push(f);
      ui.fb = out==='ok' ? {type:'ok',pts:state.done[t.id].pts, msg:'Treffer!'} : {type:out, msg:'„'+f+'“ passt nicht.'};
      afterAnswer(t,out,el,rerender);
    }));
    if($('#btnNextTask',el)) $('#btnNextTask',el).addEventListener('click',onNext);
    if(!res) startTimer(t, rerender);
  }
};
function verbindenKette(lastHTML, conn, s2){
  const f=formOf(conn);
  if(f==='keil' || (f==='flach' && !['und','oder','sondern'].includes(conn))) return lastHTML+' <span class="new"><span class="kon">'+esc(cap(conn))+'</span> '+esc(s2)+'.</span>';
  return lastHTML.replace(/\.(<\/span>)?$/,'$1')+'<span class="new">, <span class="kon">'+esc(conn)+'</span> '+esc(s2)+'.</span>';
}
function umlautBar(){ return '<div class="umlauts" aria-label="Sonderzeichen">'+['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>'<button type="button" class="uml" data-u="'+c+'" tabindex="-1">'+c+'</button>').join('')+'<span class="small muted">oder ae, oe, ue, ss</span></div>'; }
function bindUmlauts(el){
  const inp=$('#ans',el); if(!inp) return;
  $$('.uml',el).forEach(b=>{ b.addEventListener('mousedown',e=>e.preventDefault()); b.addEventListener('click',()=>{ const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??inp.value.length; inp.value=inp.value.slice(0,s)+b.dataset.u+inp.value.slice(en); ui.val=inp.value; inp.focus(); inp.setSelectionRange(s+1,s+1); }); });
}

function resultText(code,s,d){
  let t='Magister Lehmann und die Super-Empanada – Konnektoren-Escape-Room\nName: '+state.name+'\nNiveau: '+state.level+' – '+L().titel+'\nModus: '+(state.ohnezeit?'ohne Zeitdruck':'mit Zeitdruck')+

  t+='\nFalsch beantwortet ('+state.wrong.length+'):\n'+(state.wrong.length?state.wrong.map((w,i)=>(i+1)+'. '+w.aufgabe+'\n   Meine Antwort: '+w.deine+'\n   Richtig: '+w.loesung).join('\n'):'–');

function copyText(t){
  const done=()=>{ $('#copyFb').textContent='✓ Kopiert! Jetzt in Google Classroom einfügen (Strg + V).'; };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('#copyFb').textContent='Kopieren hat nicht geklappt – bitte Screenshot machen.'; } ta.remove(); };
  let settled=false; const once=f=>()=>{ if(!settled){ settled=true; f(); } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(once(done),once(fallback)); setTimeout(once(fallback),800); } else once(fallback)(); }catch(e){ once(fallback)(); }
}

function renderTeacher(){
  const base=location.href.split('#')[0].split('?')[0];
  app.innerHTML='<section class="card narrow"><h1>🔎 Prüfcode kontrollieren</h1><p class="muted">Für Lehrkräfte. Name so eingeben, wie er im Ergebnis steht (Groß-/Kleinschreibung, Akzente und Leerzeichen sind egal). Ein „O“ nach dem Niveau bedeutet: ohne Zeitdruck gespielt.</p>'+
    '<p><label for="tName">Name</label><br><input '+INPUT_ATTR+' id="tName" class="fullin"></p><p><label for="tCode">Prüfcode</label><br><input '+INPUT_ATTR+' id="tCode" class="fullin" placeholder="z. B. B1-85-131026-K7QFM"></p>'+
    '<div class="row"><button type="button" class="primary" id="tCheck">Prüfen</button><span class="spacer"></span><button type="button" id="tBack">← Zurück zum Spiel</button></div><div id="tRes" role="status" aria-live="polite" style="margin-top:.8em"></div></section>'+
    '<section class="card narrow"><h2>⏳ Ohne Zeitdruck spielen (Nachteilsausgleich)</h2>'+
    '<p>In den Räumen 1, 3 und 5 „trocknet der Ton“: Beim ersten Versuch läuft eine Zeit. Läuft sie ab, bekommt die Scherbe einen Riss und es kommt eine Ersatzaufgabe ohne Zeit.</p>'+
    '<p><strong>Für einzelne Lernende:</strong> Schicken Sie diesen Link (z. B. in Google Classroom):</p><p><code>'+esc(base)+'?ohnezeit</code></p>'+
    '<p><strong>Für alle:</strong> In der Datei oben bei EINSTELLUNGEN <code>zeitdruck: false</code> eintragen.</p>'+
    (EINGEBETTET?'<p class="small muted">Hinweis: Eingebettet in Google Sites kann man keinen Link-Parameter anhängen. Legen Sie dafür eine zweite Seite mit einer Kopie des Spiels an, in der <code>zeitdruck: false</code> steht.</p>':'')+
    '<p class="small muted">Im Prüfcode steht dann ein „O“ (z. B. B1O-…).</p></section>';
  const go=()=>{ const r=verifyCode($('#tCode').value,$('#tName').value);
    $('#tRes').innerHTML = r.valid ? '<p class="tipbox ok"><strong>✓ Der Code ist gültig.</strong><br>Niveau <strong>'+r.level+'</strong>'+(r.ohnezeit?' (ohne Zeitdruck)':'')+' · <strong>'+r.pct+' %</strong> · '+r.date+'</p>'
      : '<p class="tipbox bad"><strong>✗ Der Code ist nicht gültig.</strong><br>'+esc(r.reason||'Name oder Code passen nicht zusammen.')+'</p>'; };
  $('#tCheck').addEventListener('click',go); ['#tName','#tCode'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
  $('#tBack').addEventListener('click',()=>{ history.replaceState(null,'',location.pathname+location.search); render(); });
  focusEl('#tName');
}

/* ---------- Uhr ---------- */
setInterval(()=>{
  if(!state || view!=='game' || state.phase!=='play' || document.hidden || location.hash==='#lehrer') return;
  state.elapsed+=1000;
  const c=$('#clock'); if(c) c.textContent='⏱ '+fmtTime(state.elapsed);
  if(state.elapsed%5000===0) save();
},1000);

/* ---------- Start ---------- */
(function init(){
  try{ const s=JSON.parse(lsGet(LS_SET)||'{}'); if(s.sound) settings.sound=true; }catch(e){}
  const sb=$('#btnSound');
  const upd=()=>{ sb.textContent=settings.sound?'🔊 Ton an':'🔇 Ton aus'; sb.setAttribute('aria-pressed',String(settings.sound)); };
  upd(); sb.addEventListener('click',()=>{ settings.sound=!settings.sound; lsSet(LS_SET,JSON.stringify(settings)); upd(); sound('ok'); });
  $('#btnMenu').addEventListener('click',()=>{ if(location.hash==='#lehrer') history.replaceState(null,'',location.pathname+location.search); stopTimers(); view='start'; state=null; ui={}; render(); });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>
