   AUFBAU
   SPIEL → Niveau (A2, B1 …) → kapitel → aufgaben

   FELDER EINES KAPITELS
     name       : Überschrift
     szene      : Bild: "flughafen" | "kueche" | "klasse" | "schulhof" |

     aufgaben   : Liste der Aufgaben

     typ           : siehe AUFGABENTYPEN
     figur         : wessen Freundschaft zählt ("brandt", "lena" …)
     szene         : (optional) anderes Bild nur für diese Aufgabe

     wort          : (optional) Eintrag aus WOERTER → Seite im Freundebuch
     thema         : Denkhilfe nach dem 1. Fehlversuch

     reaktion      : was die Figur sagt, wenn die Antwort stimmt
     Jede Aufgabe hat 2 Versuche: 10 Punkte beim 1., 5 beim 2. Versuch.
     Freundschaft: richtig beim 1. Versuch +2, beim 2. Versuch +1,
     falsch −1 (nie unter 0).

     chat    – Gespräch: Die Spieler wählen, was gesagt wird.

               hinweis   : (optional) Hilfe in Klammern
               loesung   : alle richtigen Varianten als Liste
               Groß-/Kleinschreibung ist egal; das Feedback zeigt die
               richtige Schreibung (die erste Variante).
     kino    – Missverständnis-Kino: Ein Satz ging schief.
               satz      : der Satz mit dem falschen Freund
               ausloeser : das Wort, das man anklicken muss (genau wie im Satz)
               bild      : Emoji für die falsche Bedeutung

     · Fehler in den Daten zeigt die Startseite als gelben Hinweis an.
   ===================================================================== */

<style>

*{box-sizing:border-box}

button:hover:not(:disabled){background:var(--btnh)}

.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}

.muted{color:var(--muted)} .small{font-size:.85em} .center{text-align:center}

.tok:hover:not(:disabled){background:#ffffff22;border-color:#ffcf5a88}
.tok.hit,.tok.hit:disabled{background:#c0392b;border-color:#ff8a8a;color:#fff;opacity:1}
.tok.miss{animation:shakeh .4s}
.tok:disabled{cursor:default;opacity:1}
.thought{display:flex;gap:.6em;align-items:center;background:#fff;color:#222;border-radius:16px;padding:.3em .8em;margin:.3em 0}
.thought .tb{font-size:2.4em}

/* Sortieren */
.pool{display:flex;flex-wrap:wrap;gap:.45em;margin:.3em 0 .6em;min-height:52px}
.wcard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:.25em .7em;border-radius:12px;background:#f5f2ff;color:#1b1f3a;border:3px solid #9aa6e0;min-height:52px}
.wcard small{color:#5a62a0;font-size:.75em}
.wcard:hover:not(:disabled){background:#fff}
.wcard.sel{outline:4px solid var(--accent);outline-offset:2px}
.wcard.ok,.wcard.ok:disabled{border-color:var(--ok);opacity:1}
.wcard.bad,.wcard.bad:disabled{border-color:var(--bad);background:#ffe0e0;opacity:1}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.bin{display:flex;flex-direction:column;align-items:stretch;gap:.35em;min-height:120px;padding:.4em;border-radius:14px;border:3px dashed;text-align:left;background:rgba(255,255,255,.04);cursor:pointer}
.binbtn{text-align:left;background:transparent;border:none;padding:.1em .2em;min-height:40px}
.binbtn:hover:not(:disabled){background:rgba(255,255,255,.08)}
.bin .bh{font-weight:800;font-size:.9em}
.bin.echt{border-color:var(--echt)} .bin.falsch{border-color:var(--falsch)} .bin.halb{border-color:var(--halb)}
.bin:hover:not(:disabled){background:rgba(255,255,255,.1)}
.bin .wcard{font-size:.85em;min-height:0}
@media (max-width:700px){ .bins{grid-template-columns:1fr} }

/* Freundebuch */
.buch{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.9em;align-items:start}
.seite{position:relative;background:#fffdf4;color:#2b2540;border-radius:6px 16px 16px 6px;padding:.7em .9em .8em 1.4em;box-shadow:0 6px 16px rgba(0,0,0,.35);border-left:10px solid #e86a92;font-size:.92em}
.seite::before{content:"";position:absolute;left:-2px;top:12px;bottom:12px;width:6px;background:repeating-linear-gradient(180deg,#fff 0 6px,transparent 6px 18px);opacity:.7}
.seite h3{margin:.1em 0 .3em;font-size:1.2em;color:#a0305a}
.seite .bild{position:absolute;right:.6em;top:.4em;font-size:2.4em}
.seite dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.15em .6em}
.seite dt{font-weight:700;color:#6a5a9a;font-size:.85em}
.seite dd{margin:0}
.seite .kat{display:inline-block;border-radius:999px;padding:0 .5em;font-size:.8em;font-weight:800;color:#fff}
.kat.echt{background:var(--echt)} .kat.falsch{background:var(--falsch)} .kat.halb{background:#c9a10d}
.seite.leer{background:repeating-linear-gradient(45deg,#2b3260,#2b3260 10px,#262c56 10px,#262c56 20px);color:#8890c0;border-left-color:#4a5694;min-height:110px;display:flex;align-items:center;justify-content:center;font-size:1.1em}
.seite.geheim{border-left-color:#8e44ad;background:#f7f0ff}
.seite.neu{animation:cardin .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cardin{from{transform:translateY(30px) rotate(-8deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.facher{display:flex;gap:.6em;flex-wrap:wrap;margin:.4em 0}
.facher .f{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:.3em .8em;min-width:120px;text-align:center}
.facher .f b{display:block;font-size:1.5em;color:var(--accent)}

/* Fest */
.fest{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center;margin:.6em 0}
.gast{display:flex;flex-direction:column;align-items:center;gap:.2em;width:120px;text-align:center;font-size:.85em}
.gast .ava{width:90px}
.gast.da{animation:arrive .7s cubic-bezier(.3,1.4,.5,1) both}
.gast.weg{opacity:.35;filter:grayscale(1)}
@keyframes arrive{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;top:-20px;z-index:1400;width:10px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* Sonstiges */
.restable{border-collapse:collapse;margin:.5em 0} .restable th,.restable td{text-align:left;padding:.2em .8em .2em 0;border-bottom:1px solid var(--line)}
.bigcode{font-family:"Courier New",monospace;font-size:1.6em;font-weight:800;letter-spacing:.06em;background:#fff;color:#111;border-radius:12px;padding:.2em .6em;display:inline-block;margin:.2em 0}
.wronglist li{margin-bottom:.6em}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#222;border-radius:12px;padding:.5em 1em;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:1500;max-width:90vw}
code{font-family:"Courier New",monospace;background:#00000055;padding:0 .3em;border-radius:4px}
.confirmbox{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:1em}
.confirmbox .cb{background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:1em 1.2em;max-width:520px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.confirmbox .cbrow{display:flex;gap:.6em;justify-content:flex-end;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:1200;background:rgba(5,6,15,.6);display:flex;align-items:center;justify-content:center;padding:1em}
.modal .card{max-width:520px;width:100%;animation:pop .3s ease-out both}

/* Ruhiger Modus */
html.ruhig *,html.ruhig *::before,html.ruhig *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-property:opacity,background-color,border-color,color,width !important}
html.ruhig .line,html.ruhig .bubble,html.ruhig .modal .card{animation:fadein .35s ease-out both !important}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-property:opacity,background-color,border-color,color,width !important}
  .line,.bubble,.modal .card{animation:fadein .35s ease-out both !important}
}
@media (max-width:700px){ body{font-size:17px} }

<body>
<header id="top">
  <a class="homelink" href="index.html" title="Zur Startseite mit allen Spielen">← Alle Spiele</a>
  <span class="brand">🤝 Falsche Freunde</span>
  <div id="hud" aria-live="polite"></div>
  <div class="tools">
    <button type="button" id="btnMenu" title="Zum Menü">☰ Menü</button>
    <button type="button" id="btnAnim" aria-pressed="false" title="Animationen an/aus">🎞 Animationen an</button>
    <button type="button" id="btnSound" aria-pressed="false" title="Ton an/aus">🔇 Ton aus</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =====================================================================
   AB HIER: SPIEL-LOGIK (muss nicht geändert werden)
   ===================================================================== */
const E = EINSTELLUNGEN;
const LEVELS = ['A2','B1','B2','C1'];
const LS_GAME = 'falschefreunde.spiel.v1', LS_BUCH = 'falschefreunde.buch.v1', LS_SET = 'falschefreunde.einstellungen.v1';
const TYPEN = ['chat','schreiben','kino','sortieren','auswahl','luecke'];
const KINDER = ['sofia','matias','benja'];
const DEUTSCHE = Object.keys(FIGUREN).filter(k=>FIGUREN[k].deutsch);
const KAT = { echt:{ name:'echter Freund', kurz:'🟢 echt', farbe:'echt', taste:'1' }, falsch:{ name:'falscher Freund', kurz:'🔴 falsch', farbe:'falsch', taste:'2' }, halb:{ name:'halber Freund', kurz:'🟡 halb', farbe:'halb', taste:'3' } };
const INPUT_ATTR = 'type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';

const app = document.getElementById('app');
let state=null, view='start', ui={}, settings={ sound:false, anim:true };
const optOrder={};

/* ---------- Speicher ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }
function save(){ if(state) lsSet(LS_GAME, JSON.stringify(state)); }
function saveSettings(){ lsSet(LS_SET, JSON.stringify(settings)); }

/* ---------- Hilfen ---------- */
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function paras(s){ return String(s||'').split(/\n\s*\n/).map(p => '<p>'+fmt(p)+'</p>').join(''); }
function asList(x){ return x==null ? [] : (Array.isArray(x) ? x : [x]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function range(n){ return Array.from({length:n},(_,i)=>i); }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
function focusEl(sel){ const el = sel ? (typeof sel==='string'?$(sel):sel) : null; (el||app).focus({preventScroll:true}); }
let toastT=null;
function toast(msg, ms){ const t=$('#toast'); t.innerHTML=fmt(msg); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, ms||3000); }
function spanish(){ return state && E.spanischeHilfe[state.level]; }
function ruhig(){ return !settings.anim || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function fname(id){ return (FIGUREN[id]||{}).name || id; }

/* ---------- Eingebettet (z. B. Google Sites) ---------- */
const EINGEBETTET = (()=>{ try { return window.self!==window.top; } catch(e){ return true; } })();
if(EINGEBETTET) document.documentElement.classList.add('eingebettet');
function bestaetigen(msg, ok){
  const d=document.createElement('div'); d.className='confirmbox'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="cb"><p></p><div class="cbrow"><button type="button" class="cbno">Abbrechen</button><button type="button" class="primary cbyes">Ja</button></div></div>';
  d.querySelector('p').textContent=msg; document.body.appendChild(d);
  const close=()=>d.remove();
  d.querySelector('.cbno').addEventListener('click',close);
  d.querySelector('.cbyes').addEventListener('click',()=>{ close(); ok(); });
  d.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } });
  d.querySelector('.cbno').focus();
}

/* ---------- Antworten vergleichen (ae/oe/ue/ss werden akzeptiert) ---------- */
function canon(s){
  return String(s==null?'':s).normalize('NFC').toLowerCase().replace(/[„“”‟"«»‚‘’']/g,' ').replace(/[.,!?;:…–-]/g,' ')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}
function matches(val, list){ const c=canon(val); return c!=='' && asList(list).some(l=>canon(l)===c); }

/* ---------- Vorlesen ---------- */
let stimme=null;
function ladeStimme(){ try{ const v=speechSynthesis.getVoices(); stimme=v.find(x=>/^de(-|_)DE/i.test(x.lang))||v.find(x=>/^de/i.test(x.lang))||null; }catch(e){} }
try{ if('speechSynthesis' in window){ ladeStimme(); speechSynthesis.onvoiceschanged=ladeStimme; } }catch(e){}
function vorlesen(text, wer){
  try{ if(!('speechSynthesis' in window)) { toast('Vorlesen geht in diesem Browser leider nicht.'); return; }
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(plain(text)); u.lang='de-DE'; if(stimme) u.voice=stimme;
    u.rate=0.95; u.pitch={ kaya:0.8, brandt:1.0, weber:1.05, jonas:0.95, lena:1.2, sofia:1.25, matias:0.95, benja:1.3 }[wer]||1; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- Wörter ---------- */
const WORT={}; WOERTER.forEach(w=>{ if(w && w.id) WORT[w.id]=w; });
function buchWoerter(){
  const ids=new Set();
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(!S) return; asList(S.kapitel).forEach(K=>{ asList(K.aufgaben).forEach(a=>{ if(a.wort) ids.add(a.wort); asList(a.woerter).forEach(x=>ids.add(x)); }); asList(K.geheimnisse).forEach(g=>ids.add(g.seite)); }); });
  return WOERTER.filter(w=>ids.has(w.id) && (w.geheim || w.kat!=='echt'));
}

/* ---------- Freundebuch (bleibt über alle Spiele erhalten) ---------- */
function loadBuch(){ try{ const a=JSON.parse(lsGet(LS_BUCH)||'null'); if(a && a.v===1 && a.seiten && typeof a.seiten==='object') return a; }catch(e){} return { v:1, seiten:{} }; }
function saveBuch(a){ lsSet(LS_BUCH, JSON.stringify(a)); }
function buchAdd(id){ const w=WORT[id]; if(!w || (!w.geheim && w.kat==='echt')) return false; const a=loadBuch(); if(a.seiten[id]) return false; a.seiten[id]={ fach:1, seit:new Date().toISOString().slice(0,10) }; saveBuch(a); return true; }
function buchCount(){ const a=loadBuch(); return Object.keys(a.seiten).filter(k=>WORT[k]).length; }

/* ---------- Daten vorbereiten ---------- */
const DATA={};
function D(level){ level=level||state.level; if(!DATA[level]){ DATA[level]=asList(SPIEL[level].kapitel).map((K,k)=>({ K, k, tasks:asList(K.aufgaben).map((a,i)=>Object.assign({},a,{ id:k+'.'+i, k, i })) })); } return DATA[level]; }
function allTasks(level){ return D(level).reduce((a,x)=>a.concat(x.tasks),[]); }
function signature(level){ return D(level).map(x=>x.tasks.map(t=>t.typ.slice(0,2)+(t.figur||'')).join(',')).join('|'); }
function L(){ return SPIEL[state.level]; }
function maxHerz(f, level){ return allTasks(level).filter(t=>t.figur===f).length*2; }
function herz(f){ let s=0; allTasks().forEach(t=>{ if(t.figur===f && state.res[t.id]!=null) s+=state.res[t.id]; }); return Math.max(0,s); }
function istFreund(f){ const m=maxHerz(f); return m>0 && herz(f)>=Math.ceil(m*E.freundSchwelle); }
function freunde(){ return DEUTSCHE.filter(f=>maxHerz(f)>0 && istFreund(f)); }
function figurenImSpiel(){ return DEUTSCHE.filter(f=>maxHerz(f)>0); }

/* ---------- Daten prüfen ---------- */
const SZENEN_LISTE=['flughafen','kueche','klasse','schulhof','sportplatz','cafe','stadt','fest'];
function checkTask(a, tw, w){
  if(!a || !TYPEN.includes(a.typ)){ w.push(tw+'unbekannter typ „'+(a&&a.typ)+'“.'); return; }
  if(!a.figur || !FIGUREN[a.figur] || !FIGUREN[a.figur].deutsch) w.push(tw+'figur fehlt oder ist keine deutsche Figur aus FIGUREN.');
  if(a.szene && !SZENEN_LISTE.includes(a.szene)) w.push(tw+'unbekannte szene „'+a.szene+'“.');
  asList(a.dialog).forEach((d,i)=>{ if(!FIGUREN[d.wer]) w.push(tw+'dialog '+(i+1)+': „'+d.wer+'“ steht nicht in FIGUREN.'); });
  if(a.sprecher && !FIGUREN[a.sprecher]) w.push(tw+'sprecher „'+a.sprecher+'“ steht nicht in FIGUREN.');
  if(a.wort && !WORT[a.wort]) w.push(tw+'wort „'+a.wort+'“ steht nicht in WOERTER.');
  if(!a.erklaerung_de) w.push(tw+'erklaerung_de fehlt.');
  const gap = s => { if(!String(s||'').includes('___')) w.push(tw+'satz braucht ___ als Lücke.'); };
  if(a.typ==='chat'){
    if(asList(a.optionen).length<2) w.push(tw+'Es braucht mindestens zwei optionen.');
    if(!asList(a.optionen).includes(a.loesung)) w.push(tw+'loesung steht nicht genau so in optionen.');
    Object.keys(a.reaktionen||{}).forEach(k=>{ if(!asList(a.optionen).includes(k)) w.push(tw+'reaktionen: „'+k.slice(0,30)+'…“ steht nicht in optionen.'); });
    asList(a.optionen).forEach(o=>{ if(o!==a.loesung && !(a.reaktionen||{})[o]) w.push(tw+'Für „'+o.slice(0,30)+'…“ fehlt eine Reaktion in reaktionen.'); });
  }
  if(a.typ==='schreiben'){ gap(a.satz); if(!asList(a.loesung).length) w.push(tw+'loesung fehlt.'); }
  if(a.typ==='kino'){
    if(!a.satz || !a.ausloeser || !String(a.satz).includes(a.ausloeser)) w.push(tw+'ausloeser muss genau so im satz stehen.');
    const k=a.korrektur||{};
    if(asList(k.optionen).length){ if(!asList(k.optionen).includes(k.loesung)) w.push(tw+'korrektur.loesung steht nicht in korrektur.optionen.'); }
    else if(!k.frage || !String(k.frage).includes('___') || !asList(k.loesung).length) w.push(tw+'korrektur braucht optionen + loesung oder frage (mit ___) + loesung.');
  }
  if(a.typ==='sortieren'){
    const ws=asList(a.woerter); if(ws.length<4) w.push(tw+'Es braucht mindestens 4 woerter.');
    ws.forEach(x=>{ if(!WORT[x] || WORT[x].geheim) w.push(tw+'„'+x+'“ steht nicht in WOERTER.'); });
    const echt=ws.filter(x=>WORT[x] && WORT[x].kat==='echt').length;
    if(ws.length && echt*3<ws.length) w.push(tw+'Zu wenige echte Freunde (mindestens ein Drittel), sonst lernen die Schüler „Alles Ähnliche ist falsch“.');
  }
  if(a.typ==='auswahl'){ gap(a.satz); asList(a.loesung).forEach(l=>{ if(!asList(a.optionen).includes(l)) w.push(tw+'loesung steht nicht genau so in optionen.'); }); }
  if(a.typ==='luecke'){ gap(a.satz); if(!asList(a.loesung).length) w.push(tw+'loesung fehlt.'); }
}
function dataWarnings(){
  const w=[];
  WOERTER.forEach((x,i)=>{ const ww='WOERTER '+(i+1)+' ('+(x.id||'?')+'): ';
    if(x.geheim){ if(!x.titel||!x.text) w.push(ww+'titel oder text fehlt.'); return; }
    ['id','de','falle','es','kat'].forEach(f=>{ if(!x[f]) w.push(ww+f+' fehlt.'); });
    if(x.kat && !KAT[x.kat]) w.push(ww+'kat muss "echt", "falsch" oder "halb" sein.'); });
  Object.keys(FIGUREN).forEach(k=>{ if(!FIGUREN[k].name) w.push('FIGUREN '+k+': name fehlt.'); });
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(S==null) return;
    if(!Array.isArray(S.kapitel)||!S.kapitel.length){ w.push(lv+': „kapitel“ fehlt.'); return; }
    S.kapitel.forEach((K,k)=>{ const where=lv+' · Kapitel '+(k+1)+' ('+(K.name||'?')+')';
      if(!SZENEN_LISTE.includes(K.szene)) w.push(where+': unbekannte szene „'+K.szene+'“.');
      if(!asList(K.aufgaben).length) w.push(where+': keine Aufgaben.');
      asList(K.geheimnisse).forEach(g=>{ if(!WORT[g.seite]||!WORT[g.seite].geheim) w.push(where+': geheimnis „'+g.seite+'“ ist keine Extraseite in WOERTER.'); });
      asList(K.aufgaben).forEach((a,i)=>checkTask(a, where+', Aufgabe '+(i+1)+': ', w)); });
    const fig=DEUTSCHE.filter(f=>S.kapitel.some(K=>asList(K.aufgaben).some(a=>a.figur===f)));
    if(fig.length<E.freundeZumSieg) w.push(lv+': Es kommen nur '+fig.length+' Figuren vor, man braucht aber '+E.freundeZumSieg+' Freunde.');
  });
  return w;
}

/* ---------- Prüfcode ---------- */
function cyrb53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level,pct,fr,d,name){ let n=cyrb53(['FF',level,pct,fr,d,normName(name),E.geheimwort].join('|')); let s=''; for(let i=0;i<5;i++){ s+=B32[n%32]; n=Math.floor(n/32); } return s; }
function makeCode(level,pct,fr,date,name){ const p=n=>String(n).padStart(2,'0'); const d=p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100); return level+'-'+pct+'-'+fr+'-'+d+'-'+checksum(level,pct,fr,d,name); }
function verifyCode(code,name){
  const m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)-(\d{1,3})-(\d)-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: B1-78-4-141026-K7QFM' };
  return { valid: checksum(m[1],+m[2],+m[3],m[4],name)===m[5], level:m[1], pct:+m[2], fr:+m[3], date:m[4].slice(0,2)+'.'+m[4].slice(2,4)+'.20'+m[4].slice(4) };
}

function sound(n){ if(!settings.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  SND[n].forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.03); t+=d*0.9; }); }catch(e){} }

   SPIELABLAUF
   ===================================================================== */
function newGame(level){
  state={ v:1, level, sig:signature(level), room:0, phase:'intro', done:{}, res:{}, tries:{}, tips:{}, tipsUsed:{}, found:{}, wrong:[], seiten:[], replay:null, rtries:{}, elapsed:0, name:'', finished:null };
  ui={}; save();
}
function loadSaved(){
  let s=null; try{ s=JSON.parse(lsGet(LS_GAME)||'null'); }catch(e){ s=null; }
  if(!s || s.v!==1 || !SPIEL[s.level]) return null;
  try { if(s.sig!==signature(s.level)) return null; } catch(e){ return null; }
  return s;
}
function curKap(){ return D()[state.room]; }
function stats(){
  const all=allTasks(state.level); let score=0, ok=0;
  all.forEach(t=>{ const r=state.done[t.id]; if(r){ score+=r.pts; if(r.ok) ok++; } });
  const max=all.length*E.punkteErsterVersuch;
  return { score, max, pct: max? Math.min(100,Math.round(score/max*100)) : 0, total:all.length, ok };
}
function tipsLeft(){ return E.tippsProKapitel-(state.tipsUsed[state.room]||0); }
function imReplay(){ return state.phase==='replay'; }

/* Versuch: 'ok' | 'retry' | 'fail' */
function attempt(t, ok, given){
  const rep=imReplay(), tr=rep?state.rtries:state.tries, tries=tr[t.id]||0;
  if(ok){
    if(!rep){ let pts = tries===0 ? E.punkteErsterVersuch : E.punkteZweiterVersuch; if(state.tips[t.id]) pts=Math.max(0,pts-E.tippKosten); state.done[t.id]={ ok:true, pts }; }
    state.res[t.id]= tries===0 ? 2 : 1;
    sound('ok'); setTimeout(()=>sound('herz'),200); save(); return 'ok';
  }
  tr[t.id]=tries+1;
  if(tries+1>=2){
    if(!rep){ state.done[t.id]={ ok:false, pts:0 }; state.wrong.push({ kapitel:curKap().K.name, aufgabe:taskLabel(t), deine:given, loesung:solutionText(t) }); }
    state.res[t.id]=-1; sound('bad'); save(); return 'fail';
  }
  sound('huh'); save(); return 'retry';
}
function taskLabel(t){
  switch(t.typ){
    case 'chat': return (asList(t.dialog).slice(-1)[0]||{}).text || 'Gespräch';
    case 'schreiben': case 'auswahl': case 'luecke': return plain(t.satz);
    case 'kino': return plain(t.satz);
    case 'sortieren': return 'Sortieren: '+asList(t.woerter).map(x=>(WORT[x]||{}).de).join(', ');
  }
  return '';
}
function solutionText(t){
  switch(t.typ){
    case 'chat': return t.loesung;
    case 'schreiben': case 'luecke': return plain(t.satz).replace('___', asList(t.loesung)[0]);
    case 'auswahl': return plain(t.satz).replace('___', asList(t.loesung)[0]);
    case 'kino': { const k=t.korrektur||{}; return k.frage ? plain(k.frage).replace('___', asList(k.loesung)[0]) : (k.optionen && String(k.loesung).split(' ').length>3 ? k.loesung : plain(t.satz).replace(t.ausloeser, k.loesung)); }
    case 'sortieren': return asList(t.woerter).map(x=>WORT[x].de+' ↔ '+WORT[x].falle+': '+KAT[WORT[x].kat].kurz).join(' · ');
  }
  return String(asList(t.loesung)[0]);
}

function renderHud(){
  const hud=$('#hud');
  if(!state || view!=='game' || location.hash==='#lehrer' || state.phase==='name' || state.phase==='end'){ hud.innerHTML=''; return; }
  const s=stats(), n=D().length;
  hud.innerHTML='<span class="pill">'+esc(state.level)+'</span><span class="pill">📖 Kapitel '+Math.min(state.room+1,n)+'/'+n+'</span><span class="pill">⭐ '+s.score+'</span><span class="pill" id="clock">⏱ '+fmtTime(state.elapsed)+'</span><span class="pill" title="echte Freunde">🤝 '+freunde().length+'/'+figurenImSpiel().length+'</span><span class="pill" title="Seiten im Freundebuch">📒 '+buchCount()+'</span>';
}

/* ---------- Haupt-Render ---------- */
function render(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(location.hash==='#lehrer'){ renderTeacher(); renderHud(); return; }
  if(view==='buch') renderBuch();
  else if(view==='wiederholung') renderWiederholung();
  else if(view==='start' || !state) renderStart();
  else if(state.phase==='end') renderResult();
  else if(state.phase==='name') renderName();
  else renderGame();
  renderHud();
}

/* ---------- Start ---------- */
function renderStart(){
  view='start';
  const saved=loadSaved(), warn=dataWarnings(), n=buchCount(), N=buchWoerter().length;
  let h='<section class="card narrow hero"><div class="herorow"><div><h1>🤝 Falsche Freunde, echte Freunde</h1>'+
    '<p>Sofía, Matías und Benja machen einen Schüleraustausch in <strong>Lindenfeld</strong>. Sie wollen echte Freunde finden – aber manche deutschen Wörter sehen aus wie spanische und bedeuten etwas ganz anderes. Hilf ihnen, Missverständnisse zu vermeiden!</p>'+
    '<p class="small es" lang="es">🇨🇱 Una aventura de diálogos sobre los „falsos amigos“ entre el alemán y el español.</p></div>'+
    '<div class="heroart">'+['brandt','lena','jonas','kaya','weber'].map(f=>figurSVG(f,'froh')).join('')+'</div></div></section>';
  if(warn.length) h+='<div class="warnbox narrow"><strong>⚠️ Hinweis für Lehrkräfte – in den Daten stimmt etwas nicht:</strong><ul>'+warn.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  if(saved){
    h+='<section class="card narrow"><h2>▶ Weiterspielen</h2><p>Niveau <strong>'+esc(saved.level)+'</strong> · '+(saved.phase==='end'?'fertig':'Kapitel '+(saved.room+1)+': '+esc((SPIEL[saved.level].kapitel[saved.room]||{}).name||''))+'</p>'+
      '<div class="row"><button type="button" class="primary" id="btnCont">'+(saved.phase==='end'?'🏆 Ergebnis ansehen':'Weiterspielen ➜')+'</button><button type="button" id="btnDiscard">Neu beginnen</button></div></section>';
  } else {
    h+='<section class="card narrow"><h2>Wähle dein Niveau</h2><div class="levels">'+LEVELS.map(lv=>{ const S=SPIEL[lv];
      return S ? '<button type="button" class="level" data-l="'+lv+'"><span class="lv">'+lv+'</span><span class="lt">'+esc(S.titel)+'</span><span class="lo">'+esc(S.schwerpunkt||'')+'</span></button>'
               : '<button type="button" class="level" disabled><span class="lv">'+lv+'</span><span class="lt">🔒 kommt bald</span></button>'; }).join('')+'</div></section>';
  }
  h+='<section class="card narrow"><h2>Freundebuch und Wiederholung</h2><div class="extras">'+
    '<button type="button" id="btnBuch"><span class="big">📒</span><span><strong>Mein Freundebuch</strong><br><span class="small muted">'+n+' von '+N+' Seiten</span></span></button>'+
    '<button type="button" id="btnWdh"><span class="big">🔁</span><span><strong>Wiederholung</strong><br><span class="small muted">5 Minuten mit deinen Seiten</span></span></button></div></section>';
  h+='<p class="small center"><a href="#lehrer">Für Lehrkräfte: Prüfcode kontrollieren</a></p>';
  app.innerHTML=h;
  if($('#btnCont')) $('#btnCont').addEventListener('click',()=>{ state=saved; view='game'; ui={}; render(); });
  if($('#btnDiscard')) $('#btnDiscard').addEventListener('click',()=>bestaetigen('Das gespeicherte Spiel wird gelöscht (dein Freundebuch bleibt). Wirklich neu beginnen?', ()=>{ lsDel(LS_GAME); state=null; render(); }));
  $$('.level[data-l]').forEach(b=>b.addEventListener('click',()=>{ newGame(b.dataset.l); view='game'; render(); window.scrollTo(0,0); }));
  $('#btnBuch').addEventListener('click',()=>{ view='buch'; render(); });
  $('#btnWdh').addEventListener('click',()=>{ view='wiederholung'; wdh=null; render(); });

/* ---------- Spielbildschirm ---------- */
function renderGame(){
  view='game';
  app.innerHTML='<div class="gamegrid"><div><div class="stage" id="stage"></div><section class="dialog" id="dialog" aria-live="polite"></section></div><aside class="side" id="side"></aside></div>';
  drawSide();
  if(state.phase==='intro') return renderIntro();
  if(state.phase==='kapitelende') return renderKapitelEnde();
  if(state.phase==='fest') return renderFest();
  renderTask();
}
function drawSide(changed){
  const s=$('#side'); if(!s) return;
  const figs=figurenImSpiel(), n=D().length, t=curTask();
  s.innerHTML='<h3>💗 Freundschaftsbarometer</h3>'+figs.map(f=>{ const m=maxHerz(f), hz=herz(f), pct=m?Math.min(100,hz/m*100):0, fr=istFreund(f);
    return '<div class="baro'+(changed&&changed.f===f?' '+changed.dir:'')+(t&&t.figur===f?' cur':'')+'" data-f="'+f+'" title="'+esc(fname(f)+': '+hz+' von '+m+' Herzen')+'"><div class="ava">'+figurSVG(f, fr?'froh':'neutral', true)+'</div><div style="flex:1"><div class="bn">'+esc(fname(f))+(fr?' <span class="fr">🤝</span>':'')+'<small>'+esc(FIGUREN[f].rolle||'')+'</small></div>'+
      '<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="'+m+'" aria-valuenow="'+hz+'" aria-label="Freundschaft mit '+esc(fname(f))+'"><div style="width:'+pct+'%"></div><span class="th" style="left:'+(E.freundSchwelle*100)+'%"></span></div></div></div>'; }).join('')+
    '<p class="small muted" style="margin:.4em 0 0">Ab der weißen Linie seid ihr befreundet. Du brauchst '+E.freundeZumSieg+' Freunde fürs Fest.</p>'+
    '<h3 style="margin-top:.6em">📖 Kapitel</h3><div class="progress">'+range(n).map(i=>'<span class="'+(i<state.room?'done':i===state.room?'cur':'')+'"></span>').join('')+'</div>'+
    '<div class="row" style="margin-top:.5em"><button type="button" id="btnBuchG" style="flex:1">📒 Freundebuch</button></div>';
  $('#btnBuchG').addEventListener('click',openBuchModal);
  if(changed) setTimeout(()=>{ const b=$('.baro[data-f="'+changed.f+'"]'); if(b) b.classList.remove('up','down'); },1200);
}
function curTask(){ if(!state || (state.phase!=='play' && state.phase!=='replay')) return null; if(state.phase==='replay'){ const id=state.replay[state.ri||0]; return allTasks().find(t=>t.id===id)||null; }
  const K=curKap(); return ui.resolved ? K.tasks.find(x=>x.id===ui.resolved) : K.tasks.find(x=>!state.done[x.id]); }

function drawStage(o){
  const st=$('#stage'); if(!st) return;
  o=o||{};
  const K=curKap()||{K:{}}, szene=o.szene||K.K.szene, main=o.main, mood=o.mood||'neutral';
  let h=sceneSVG(szene);
  const kidPos=[12,24,36];
  KINDER.forEach((k,i)=>{ const sp=o.sprecher===k; h+='<div class="person kid'+(sp?' jump':' idle')+'" style="left:'+kidPos[i]+'%;animation-delay:'+(i*.4)+'s">'+figurSVG(k, sp&&o.kidMood?o.kidMood:'froh')+'</div>'; });
  if(main) h+='<div class="person main'+(o.anim?' '+o.anim:' idle')+'" id="mainFig" style="left:74%">'+figurSVG(main, mood)+'</div>';
  if(o.bubble) h+='<div class="bubble'+(o.bubble.conf?' conf':'')+'" style="'+(o.bubble.left?'left:4%;top:6%':'right:3%;top:5%')+'">'+fmt(o.bubble.text)+'</div>';
  if(!o.ohneGeheim && szene===K.K.szene) asList(K.K.geheimnisse).forEach((g,i)=>{ const f=state.found[g.seite]; const r=g.ort;
    h+='<button type="button" class="hot'+(f?' found':'')+'" data-g="'+i+'" style="left:'+(r[0]/10)+'%;top:'+(r[1]/3.6)+'%;width:'+(r[2]/10)+'%;height:'+(r[3]/3.6)+'%;--fs:'+(Math.min(r[2],r[3])*0.07).toFixed(2)+'cqw" aria-label="'+esc(g.name||'etwas')+'">'+esc(g.symbol||'✨')+'<span class="tag">'+esc(g.name||'')+'</span></button>'; });
  h+='<div class="chlabel">'+esc(o.label || ('Kapitel '+(state.room+1)+': '+(K.K.name||'')))+'</div>';
  st.innerHTML=h;
  $$('.hot[data-g]',st).forEach(b=>b.addEventListener('click',()=>findeGeheimnis(+b.dataset.g)));
}
function floatAt(txt, leftPct, topPct){ const st=$('#stage'); if(!st || ruhig()) return; const d=document.createElement('div'); d.className='float'; d.textContent=txt; d.style.left=leftPct+'%'; d.style.top=topPct+'%'; st.appendChild(d); setTimeout(()=>d.remove(),1700); }
function findeGeheimnis(i){
  const g=curKap().K.geheimnisse[i], w=WORT[g.seite]; if(!w) return;
  const neu=!state.found[g.seite]; state.found[g.seite]=true; const buchNeu=buchAdd(g.seite); save();
  if(neu||buchNeu) sound('seite');
  const m=document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML='<div class="card"><h2>'+esc(w.bild||'✨')+' '+esc(w.titel)+'</h2>'+paras(w.text)+(buchNeu?'<p class="tipbox ok">📒 <strong>Extraseite für dein Freundebuch!</strong></p>':'<p class="small muted">Diese Seite ist schon in deinem Freundebuch.</p>')+'<div class="row"><span class="spacer"></span><button type="button" class="primary" id="mOk">Weiter</button></div></div>';
  document.body.appendChild(m);
  const close=()=>{ m.remove(); const b=$('.hot[data-g="'+i+'"]'); if(b){ b.classList.add('found'); b.focus({preventScroll:true}); } renderHud(); };
  $('#mOk',m).addEventListener('click',close); m.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); }); $('#mOk',m).focus();
}

/* ---------- Kapitel-Anfang ---------- */
function renderIntro(){
  const K=curKap().K;
  drawStage({ main:K.hauptfigur, mood:'froh', szene:K.szene });
  const first=state.room===0;
  $('#dialog').innerHTML='<h2>📖 Kapitel '+(state.room+1)+': '+esc(K.name)+'</h2>'+(first?paras(L().intro):'')+paras(K.intro)+
    (first?'<div class="tipbox hint"><p><strong>So geht’s:</strong> Wähl die richtige Antwort oder schreib das passende Wort. Jede Aufgabe gehört zu einer deutschen Figur – richtige Wörter lassen ihr 💗 Barometer steigen. Du hast pro Aufgabe zwei Versuche. Mit 🔊 kannst du dir die Sätze vorlesen lassen. Und schau dich in den Bildern um: Manche Dinge kann man anklicken …</p></div>':'')+
    '<div class="row" style="margin-top:.5em"><span class="spacer"></span><button type="button" class="primary" id="btnGo">Los geht’s ➜</button></div>';
  $('#btnGo').addEventListener('click',()=>{ state.phase='play'; ui={}; save(); renderGame(); });
  focusEl('#btnGo');
}

/* ---------- Aufgabe ---------- */
function lineHTML(wer, text, cls){
  const me=KINDER.includes(wer);
  return '<div class="line'+(me?' me':'')+(cls?' '+cls:'')+'"><div class="mini">'+figurSVG(wer, cls==='conf'?'verwirrt':'froh', true)+'</div><div class="say"><b>'+esc(fname(wer))+'</b>'+fmt(text)+' <button type="button" class="speak" data-say="'+esc(plain(text))+'" data-wer="'+esc(wer)+'" aria-label="Vorlesen" title="Vorlesen">🔊</button></div></div>';
}
function bindSpeak(root){ $$('.speak',root).forEach(b=>{ if(b._b) return; b._b=1; b.addEventListener('click',()=>vorlesen(b.dataset.say, b.dataset.wer)); }); }
function renderTask(){
  const t=curTask();
  if(!t){ if(imReplay()) return replayEnde(); return kapitelFertig(); }
  if(ui.id!==t.id) ui={ id:t.id, resolved:ui.resolved, log:[] };
  const P=$('#dialog'), rep=imReplay();
  const dl=asList(t.dialog);
  const lastFig=dl.slice().reverse().find(d=>!KINDER.includes(d.wer));
  if(!ui.stage) ui.stage={ main:t.figur, mood:'neutral', szene:t.szene||D()[t.k].K.szene, sprecher:t.sprecher, bubble: lastFig?{ text:lastFig.text }:null, ohneGeheim:rep, label: rep?'🔁 Wiederholung: '+D()[t.k].K.name:undefined };
  drawStage(ui.stage);
  const K=curKap(), idx=rep?(state.ri||0):t.i, total=rep?state.replay.length:K.tasks.length;
  P.innerHTML='<div class="row" style="margin-bottom:.3em"><strong>'+(rep?'🔁 Szene ':'Aufgabe ')+(idx+1)+' von '+total+'</strong><span class="chip">💗 '+esc(fname(t.figur))+'</span><span class="spacer"></span><span class="chip" id="tipChip">💡 Tipps: '+tipsLeft()+'/'+E.tippsProKapitel+'</span></div>'+
    '<div class="log" id="log">'+dl.map((d,i)=>lineHTML(d.wer,d.text).replace('class="line','style="animation-delay:'+(i*0.35)+'s" class="line')).join('')+(ui.log||[]).join('')+'</div><div id="task"></div>';
  bindSpeak(P);
  T[t.typ](t, $('#task'), ()=>{ nextTask(); });
}
function nextTask(){
  if(imReplay()){ state.ri=(state.ri||0)+1; save(); ui={}; renderTask(); return; }
  ui={}; renderTask(); window.scrollTo({top:0});
}
function addLog(html){ ui.log=(ui.log||[]).concat([html]); const l=$('#log'); if(l){ l.insertAdjacentHTML('beforeend',html); bindSpeak(l); } }
function react(t, out, txt){
  const pos=74;
  if(out==='ok'){ ui.stage=Object.assign({},ui.stage,{ mood:'lacht', anim:'jump', bubble: txt?{ text:txt }:null, kidMood:'lacht' }); drawStage(ui.stage); floatAt(state.res[t.id]===2?'💗 +2':'💗 +1', pos, 10); }
  else { ui.stage=Object.assign({},ui.stage,{ mood:'verwirrt', anim:'shake', bubble: txt?{ text:txt, conf:true }:null, kidMood:'ueberrascht' }); drawStage(ui.stage); floatAt(out==='fail'?'💔 −1':'❓', pos, 10); }
  drawSide({ f:t.figur, dir: out==='ok'?'up':'down' }); renderHud();
}

/* ---------- Tipps und Rückmeldung ---------- */
function tipHTML(t){
  if(state.tips[t.id] && !resolved(t)) return '<div class="tipbox hint">💡 <strong>Tipp:</strong> '+fmt(t.tipp)+'</div>';
  if(resolved(t) || !t.tipp || imReplay()) return '';
  return '<button type="button" id="btnTip"'+(tipsLeft()<=0?' disabled title="Keine Tipps mehr in diesem Kapitel"':'')+'>💡 Tipp (−'+E.tippKosten+')</button>';
}
function bindTip(t, rerender){ const b=$('#btnTip'); if(!b) return; b.addEventListener('click',()=>{ if(tipsLeft()<=0) return; state.tips[t.id]=true; state.tipsUsed[state.room]=(state.tipsUsed[state.room]||0)+1; save(); const c=$('#tipChip'); if(c) c.textContent='💡 Tipps: '+tipsLeft()+'/'+E.tippsProKapitel; rerender(); }); }
function resolved(t){ return ui.resolved===t.id; }
function feedbackHTML(t){
  const f=ui.fb; if(!f) return '';
  const es = spanish() && t.erklaerung_es ? '<p class="small es" lang="es">🇨🇱 <strong>Ayuda:</strong> '+fmt(t.erklaerung_es)+'</p>' : '';
  const pts = imReplay() ? '' : ' <span class="small">+'+(state.done[t.id]?state.done[t.id].pts:0)+' Punkte</span>';
  if(f.type==='ok') return '<div class="tipbox ok"><p><strong>✓ Richtig!</strong> 💗 '+esc(fname(t.figur))+' freut sich.'+pts+'</p>'+(f.extra||'')+(t.erklaerung_de?'<p>'+fmt(t.erklaerung_de)+'</p>':'')+es+(f.seite||'')+'</div>';
  if(f.type==='retry') return '<div class="tipbox bad"><p><strong>❓ Missverständnis!</strong> '+fmt(f.msg||'Das hat '+fname(t.figur)+' anders verstanden.')+'</p>'+(t.thema?'<p>💡 Denkhilfe: <strong>'+esc(t.thema)+'</strong></p>':'')+'<p class="small">Du hast noch einen Versuch.</p></div>';
  return '<div class="tipbox bad"><p><strong>✗ Leider falsch.</strong> '+fmt(f.msg||'')+'</p><p>Richtig: <strong>'+esc(solutionText(t))+'</strong></p>'+(t.erklaerung_de?'<p>'+fmt(t.erklaerung_de)+'</p>':'')+es+'</div>';
}
function seiteHTML(t){
  const ids = t.typ==='sortieren' ? asList(t.woerter) : asList(t.wort);
  const neu=ids.filter(id=>buchAdd(id));
  if(!neu.length) return '';
  state.seiten=asList(state.seiten).concat(neu); save(); setTimeout(()=>sound('seite'),350);
  return '<p class="okline" style="margin-top:.4em">📒 <strong>Neue Seite'+(neu.length>1?'n':'')+' im Freundebuch:</strong> '+neu.map(id=>esc(WORT[id].de)).join(', ')+'</p>';
}
function nextBtn(){ return '<div class="row" style="margin-top:.6em"><span class="spacer"></span><button type="button" class="primary" id="btnNextTask">Weiter ➜</button></div>'; }
function bindNext(el, onNext){ const b=$('#btnNextTask',el); if(b) b.addEventListener('click',onNext); }
function afterAnswer(t, out, el, rerender){
  if(out==='ok'||out==='fail'){ ui.resolved=t.id; }
  if(out==='ok'){ ui.fb=Object.assign(ui.fb||{}, { type:'ok', seite: seiteHTML(t) }); }
  rerender();
  const fb=$('.tipbox.ok, .tipbox.bad', el); if(fb) setTimeout(()=>fb.scrollIntoView({block:'nearest',behavior:ruhig()?'auto':'smooth'}),30);
  if(out!=='retry'){ const nb=$('#btnNextTask',el); if(nb) nb.focus({preventScroll:true}); }
}
function umlautBar(){ return '<div class="umlauts" aria-label="Sonderzeichen">'+['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>'<button type="button" class="uml" data-u="'+c+'" tabindex="-1">'+c+'</button>').join('')+'<span class="small muted">oder ae, oe, ue, ss</span></div>'; }
function bindUmlauts(el, getInput){
  $$('.uml',el).forEach(b=>{ b.addEventListener('mousedown',e=>e.preventDefault()); b.addEventListener('click',()=>{ const inp=getInput(); if(!inp || inp.readOnly) return; const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??inp.value.length; inp.value=inp.value.slice(0,s)+b.dataset.u+inp.value.slice(en); inp.dispatchEvent(new Event('input')); inp.focus(); inp.setSelectionRange(s+1,s+1); }); });
}
function textInput(id, val, ro, w){ return '<input '+INPUT_ATTR+' id="'+id+'" style="width:'+(w||'10em')+'" value="'+esc(val||'')+'"'+(ro?' readonly':'')+'>'; }
function bindText(el, check){
  const inp=$('#ans',el); if(!inp) return;
  inp.addEventListener('input',()=>{ ui.val=inp.value; });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
  bindUmlauts(el, ()=>$('#ans',el));
  if(!ui.focused){ ui.focused=true; inp.focus({preventScroll:true}); }
}
function schreibweise(val, loesung){ const l=asList(loesung).find(x=>canon(x)===canon(val)); return l && l.trim()!==String(val).trim() ? '<p>✍️ Richtig geschrieben: <strong>'+esc(l)+'</strong></p>' : ''; }

/* ---------- Aufgabentypen ---------- */
const T = {
  /* Gespräch */
  chat(t, el, onNext){
    const res=resolved(t), rerender=()=>T.chat(t,el,onNext);
    if(!optOrder[t.id]) optOrder[t.id]=shuffle(range(t.optionen.length));
    ui.wrongs=ui.wrongs||[];
    let h='<p class="auftrag">Was sagt '+esc(fname(t.sprecher||'sofia'))+'?</p><div class="answers">'+optOrder[t.id].map(i=>{ const o=t.optionen[i], w=ui.wrongs.includes(o), r=res && o===t.loesung;
      return '<button type="button" class="answer'+(w?' wrong':'')+(r?' right':'')+'" data-i="'+i+'"'+(res||w?' disabled':'')+'><span class="who">'+esc(fname(t.sprecher||'sofia'))+' sagt:</span>'+esc(o)+'</button>'; }).join('')+'</div>';
    if(!res) h+='<div class="row" style="margin-top:.5em">'+tipHTML(t)+'</div>';
    h+=feedbackHTML(t)+(res?nextBtn():'');
    el.innerHTML=h; bindTip(t,rerender); bindNext(el,onNext);
    if(res) return;
    $$('.answer',el).forEach(b=>b.addEventListener('click',()=>{
      const o=t.optionen[+b.dataset.i], ok=o===t.loesung;
      addLog(lineHTML(t.sprecher||'sofia', o, ok?'':'wrong'));
      const out=attempt(t, ok, o);
      if(!ok) ui.wrongs.push(o);
      const reakt = ok ? t.reaktion : (t.reaktionen||{})[o];
      if(reakt) addLog(lineHTML(t.figur, reakt, ok?'':'conf'));
      if(out==='fail'){ addLog(lineHTML(t.sprecher||'sofia', t.loesung)); if(t.reaktion) addLog(lineHTML(t.figur, t.reaktion)); }
      react(t, out, reakt);
      ui.fb={ type:out, msg: out==='retry' ? fname(t.figur)+' hat etwas ganz anderes verstanden.' : '' };
      afterAnswer(t,out,el,rerender);
      if(out==='retry'){ const n=$('.answer:not([disabled])',el); if(n) n.focus({preventScroll:true}); }
    }));
    if(!ui.focused){ ui.focused=true; const f=$('.answer',el); if(f) f.focus({preventScroll:true}); }
  },

  /* Lücke im Gespräch */
  schreiben(t, el, onNext){
    const res=resolved(t), rerender=()=>T.schreiben(t,el,onNext);
    const val = res && state.res[t.id]<0 ? asList(t.loesung)[0] : (ui.val||'');
    let h='<p class="auftrag">Ergänze, was '+esc(fname(t.sprecher||'sofia'))+' sagt.</p><div class="line me" style="max-width:100%"><div class="mini">'+figurSVG(t.sprecher||'sofia','froh',true)+'</div><div class="say"><b>'+esc(fname(t.sprecher||'sofia'))+'</b>'+
      fmt(t.satz).replace('___', textInput('ans', val, res, '9em'))+(t.hinweis?' <span class="small" style="color:#5a62a0">('+esc(t.hinweis)+')</span>':'')+'</div></div>';
    if(!res) h+=umlautBar()+'<div class="row"><button type="button" class="primary" id="btnCheck">💬 Sagen</button>'+tipHTML(t)+'</div>';
    h+=feedbackHTML(t)+(res?nextBtn():'');
    el.innerHTML=h; bindTip(t,rerender); bindNext(el,onNext);
    if(res) return;
    const check=()=>{ const v=$('#ans',el).value.trim(); if(!v){ toast('Schreib zuerst etwas.'); $('#ans',el).focus(); return; }
      ui.val=v; const ok=matches(v, t.loesung);
      addLog(lineHTML(t.sprecher||'sofia', plain(t.satz).replace('___', v), ok?'':'wrong'));
      const out=attempt(t, ok, v);
      if(ok && t.reaktion) addLog(lineHTML(t.figur, t.reaktion));
      if(!ok){ addLog(lineHTML(t.figur, 'Hm? „'+v+'“? Das verstehe ich nicht ganz …', 'conf')); }
      if(out==='fail'){ addLog(lineHTML(t.sprecher||'sofia', plain(t.satz).replace('___', asList(t.loesung)[0]))); if(t.reaktion) addLog(lineHTML(t.figur, t.reaktion)); }
      react(t, out, ok ? t.reaktion : 'Hm? „'+v+'“?');
      ui.fb={ type:out, msg: out==='retry'?'„'+v+'“ passt hier nicht.':'', extra: ok?schreibweise(v,t.loesung):'' };
      afterAnswer(t,out,el,rerender); if(out==='retry'){ const i=$('#ans',el); if(i){ i.focus(); i.select(); } } };
    bindText(el, check);
    $('#btnCheck',el).addEventListener('click',check);
  },

  /* Missverständnis-Kino */
  kino(t, el, onNext){
    const res=resolved(t), rerender=()=>T.kino(t,el,onNext), k=t.korrektur||{};
    const teile=String(t.satz).split(t.ausloeser), vor=teile[0], nach=teile.slice(1).join(t.ausloeser);
    const toks=[]; vor.split(/\s+/).filter(Boolean).forEach(w=>toks.push({ w, hit:false })); toks.push({ w:t.ausloeser, hit:true }); nach.split(/\s+/).filter(Boolean).forEach(w=>toks.push({ w, hit:false }));
    // Satzzeichen direkt hinter dem Auslöser an das Wort hängen
    if(/^[.,!?]/.test(nach)){ const i=toks.findIndex(x=>x.hit); if(toks[i+1] && /^[.,!?]+$/.test(toks[i+1].w)){ toks[i].w+=toks[i+1].w; toks.splice(i+1,1); } }
    const gefunden = ui.gefunden || res;
    let h='<div class="kino"><div class="ktitle">🎬 MISSVERSTÄNDNIS-KINO</div>'+
      '<div class="ksatz">'+esc(fname(t.sprecher||'sofia'))+': „'+toks.map((x,i)=>'<button type="button" class="tok'+(gefunden&&x.hit?' hit':'')+'" data-i="'+i+'"'+(gefunden?' disabled':'')+'>'+esc(x.w)+'</button>').join(' ')+'“</div>'+
      '<div class="thought"><span class="tb" aria-hidden="true">'+esc(t.bild||'❓')+'</span><span><b>'+esc(fname(t.figur))+' denkt:</b> '+fmt(t.missverstaendnis||'')+'</span></div></div>';
    if(!gefunden){
      h+='<p class="auftrag">Welches Wort hat das Missverständnis ausgelöst? Klick es an.</p><p class="bedienung">⌨️ Tab = nächstes Wort, Enter = auswählen</p><div id="kfb" role="status"></div>';
    } else {
      h+='<p class="auftrag">'+(k.frage?'Wie hätte '+esc(fname(t.sprecher||'sofia'))+' es sagen sollen? Schreib es richtig.':'Was hätte '+esc(fname(t.sprecher||'sofia'))+' sagen sollen?')+'</p>';
      if(asList(k.optionen).length){
        if(!optOrder[t.id]) optOrder[t.id]=shuffle(range(k.optionen.length));
        ui.wrongs=ui.wrongs||[];
        h+='<div class="opts">'+optOrder[t.id].map(i=>{ const o=k.optionen[i], w=ui.wrongs.includes(o), r=res && o===k.loesung; return '<button type="button" class="opt'+(w?' wrong':'')+(r?' right':'')+'" data-o="'+esc(o)+'"'+(res||w?' disabled':'')+'>'+esc(o)+'</button>'; }).join('')+'</div>';
      } else {
        const val = res && state.res[t.id]<0 ? asList(k.loesung)[0] : (ui.val||'');
        h+='<p class="satz">'+fmt(k.frage).replace('___', textInput('ans', val, res, '12em'))+'</p>'+(res?'':umlautBar());
      }
      if(!res) h+='<div class="row" style="margin-top:.5em">'+(asList(k.optionen).length?'':'<button type="button" class="primary" id="btnCheck">✓ Prüfen</button>')+tipHTML(t)+'</div>';
    }
    h+=feedbackHTML(t)+(res?nextBtn():'');
    el.innerHTML=h; bindTip(t,rerender); bindNext(el,onNext);
    if(!ui.kinoStart){ ui.kinoStart=true; ui.stage=Object.assign({},ui.stage,{ mood:'verwirrt', bubble:{ text:t.missverstaendnis, conf:true } }); drawStage(ui.stage); }
    if(res) return;
    if(!gefunden){
      $$('.tok',el).forEach(b=>b.addEventListener('click',()=>{ const x=toks[+b.dataset.i];
        if(x.hit){ ui.gefunden=true; sound('pop'); rerender(); const f=$('.opt',el)||$('#ans',el); if(f) f.focus({preventScroll:true}); }
        else { b.classList.remove('miss'); void b.offsetWidth; b.classList.add('miss'); sound('tick'); $('#kfb',el).innerHTML='<p class="small badline">Nein – an diesem Wort lag es nicht. Welches Wort klingt spanisch?</p>'; } }));
      if(!ui.focused){ ui.focused=true; const f=$('.tok',el); if(f) f.focus({preventScroll:true}); }
      return;
    }
    const fertig=(ok, given)=>{
      const satzNeu = k.frage ? plain(k.frage).replace('___', given) : (String(given).split(' ').length>3 ? given : plain(t.satz).replace(t.ausloeser, given));
      addLog(lineHTML(t.sprecher||'sofia', satzNeu, ok?'':'wrong'));
      const out=attempt(t, ok, given);
      if(ok && t.reaktion) addLog(lineHTML(t.figur, t.reaktion));
      if(out==='fail'){ addLog(lineHTML(t.sprecher||'sofia', solutionText(t))); if(t.reaktion) addLog(lineHTML(t.figur, t.reaktion)); }
      react(t, out, ok ? t.reaktion : (out==='fail'?t.reaktion:'Hm, das verstehe ich immer noch nicht …'));
      ui.fb={ type:out, msg: out==='retry'?'„'+given+'“ passt noch nicht.':'', extra: ok && k.frage ? schreibweise(given,k.loesung):'' };
      afterAnswer(t,out,el,rerender);
      if(out==='retry'){ const n=$('.opt:not([disabled])',el)||$('#ans',el); if(n){ n.focus({preventScroll:true}); if(n.select) n.select(); } }
    };
    if(asList(k.optionen).length){
      $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{ const o=b.dataset.o, ok=o===k.loesung; if(!ok) ui.wrongs.push(o); fertig(ok,o); }));
      if(!ui.focused2){ ui.focused2=true; const f=$('.opt',el); if(f) f.focus({preventScroll:true}); }
    } else {
      const check=()=>{ const v=$('#ans',el).value.trim(); if(!v){ toast('Schreib zuerst etwas.'); return; } ui.val=v; fertig(matches(v,k.loesung), v); };
      ui.focused = ui.focused2; bindText(el, check); ui.focused2=true;
      $('#btnCheck',el).addEventListener('click',check);
    }
  },

  /* Freund, Feind oder halber Freund? */
  sortieren(t, el, onNext){
    const res=resolved(t), rerender=()=>T.sortieren(t,el,onNext), ws=asList(t.woerter);
    if(!optOrder[t.id]) optOrder[t.id]=shuffle(range(ws.length));
    ui.place=ui.place||{}; ui.lock=ui.lock||{};
    if(res && state.res[t.id]<0) ws.forEach(id=>{ ui.place[id]=WORT[id].kat; });
    const card=(id,cls)=>{ const w=WORT[id]; return '<button type="button" class="wcard'+(cls?' '+cls:'')+'" data-w="'+esc(id)+'"'+(res||ui.lock[id]?' disabled':'')+'>'+esc(w.de)+'<small>↔ '+esc(w.falle)+'</small></button>'; };
    const pool=optOrder[t.id].map(i=>ws[i]).filter(id=>!ui.place[id]);
    let h='<p class="auftrag">Sortiere: Bedeutet das deutsche Wort dasselbe wie das spanische?</p><p class="bedienung">🖱️ Karte anklicken, dann ein Fach · ⌨️ Karte wählen, dann Taste 1 / 2 / 3 · Karte im Fach anklicken = zurück</p>'+
      '<div class="pool" id="pool">'+(pool.length?pool.map(id=>card(id, ui.sel===id?'sel':'')).join(''):'<span class="small muted">Alle Karten sind sortiert.</span>')+'</div>'+
      '<div class="bins">'+['echt','falsch','halb'].map((k,i)=>'<div class="bin '+k+'" data-k="'+k+'"><button type="button" class="binbtn" data-k="'+k+'"'+(res?' disabled':'')+'><span class="bh">'+(i+1)+' · '+KAT[k].kurz+'</span><br><span class="small">'+(k==='echt'?'gleiche Bedeutung':k==='falsch'?'andere Bedeutung':'teils gleich, teils anders')+'</span></button>'+
        ws.filter(id=>ui.place[id]===k).map(id=>{ const fest=res||ui.lock[id], st = fest ? (WORT[id].kat===k?'ok':'bad') : (ui.bad&&ui.bad[id]?'bad':''); return '<button type="button" class="wcard '+st+'" data-back="'+esc(id)+'"'+(fest?' disabled':'')+' title="zurück">'+esc(WORT[id].de)+'<small>↔ '+esc(WORT[id].falle)+'</small></button>'; }).join('')+'</div>').join('')+'</div>';
    if(!res) h+='<div class="row" style="margin-top:.5em"><button type="button" class="primary" id="btnCheck"'+(pool.length?' disabled':'')+'>✓ Prüfen</button><button type="button" id="btnReset">↺ Alle zurück</button>'+tipHTML(t)+'</div>';
    h+=feedbackHTML(t)+(res?nextBtn():'');
    el.innerHTML=h; bindTip(t,rerender); bindNext(el,onNext);
    if(res) return;
    const put=(k)=>{ if(!ui.sel) { toast('Wähl zuerst eine Karte.'); return; } ui.place[ui.sel]=k; if(ui.bad) delete ui.bad[ui.sel]; ui.sel=null; sound('pop'); rerender(); const n=$('#pool .wcard',el)||$('#btnCheck',el); if(n) n.focus({preventScroll:true}); };
    $$('#pool .wcard',el).forEach(b=>{ b.addEventListener('click',()=>{ ui.sel=b.dataset.w; $$('#pool .wcard',el).forEach(x=>x.classList.toggle('sel',x===b)); sound('tick'); });
      b.addEventListener('keydown',e=>{ if(['1','2','3'].includes(e.key)){ e.preventDefault(); ui.sel=b.dataset.w; put(['echt','falsch','halb'][+e.key-1]); } }); });
    $$('.bin [data-back]',el).forEach(c=>c.addEventListener('click',e=>{ e.stopPropagation(); if(ui.lock[c.dataset.back]) return; delete ui.place[c.dataset.back]; if(ui.bad) delete ui.bad[c.dataset.back]; ui.sel=c.dataset.back; sound('tick'); rerender(); const n=$('#pool .wcard[data-w="'+ui.sel+'"]',el); if(n) n.focus({preventScroll:true}); }));
    $$('.bin',el).forEach(b=>b.addEventListener('click',e=>{ if(e.target.closest('[data-back]')) return; put(b.dataset.k); }));
    el.onkeydown=e=>{ if(['1','2','3'].includes(e.key) && ui.sel && !e.target.closest('#pool')){ e.preventDefault(); put(['echt','falsch','halb'][+e.key-1]); } };
    $('#btnReset',el).addEventListener('click',()=>{ ws.forEach(id=>{ if(!ui.lock[id]) delete ui.place[id]; }); ui.sel=null; rerender(); });
    $('#btnCheck',el).addEventListener('click',()=>{
      const falsch=ws.filter(id=>ui.place[id]!==WORT[id].kat), ok=!falsch.length;
      const out=attempt(t, ok, falsch.map(id=>WORT[id].de+' → '+KAT[ui.place[id]].kurz).join(', ')||'alles richtig');
      if(out==='retry'){ ws.forEach(id=>{ if(!falsch.includes(id)) ui.lock[id]=true; }); ui.bad={}; falsch.forEach(id=>{ ui.bad[id]=true; }); }
      react(t, out, ok ? t.reaktion : (out==='fail'?'Fast! Schau dir die Lösung an.':'Hm, da stimmt noch etwas nicht.'));
      ui.fb={ type:out, msg: out==='retry' ? falsch.length+' Karte'+(falsch.length>1?'n sind':' ist')+' im falschen Fach (rot). Die grünen bleiben liegen – sortiere die roten neu.' : '' };
      afterAnswer(t,out,el,rerender);
    });
    if(!ui.focused){ ui.focused=true; const f=$('#pool .wcard',el); if(f) f.focus({preventScroll:true}); }
  },

  /* Multiple Choice */
  auswahl(t, el, onNext){
    const res=resolved(t), rerender=()=>T.auswahl(t,el,onNext);
    if(!optOrder[t.id]) optOrder[t.id]=shuffle(range(t.optionen.length));
    ui.wrongs=ui.wrongs||[];
    const L_=asList(t.loesung);
    let h='<p class="auftrag">Wähl das richtige Wort.</p><p class="satz">'+fmt(t.satz).replace('___','<span class="gap">'+(res?esc(ui.chosen||L_[0]):'&nbsp;')+'</span>')+'</p>'+
      '<div class="opts">'+optOrder[t.id].map(i=>{ const o=t.optionen[i], w=ui.wrongs.includes(o), r=res && (ui.chosen?o===ui.chosen:L_.includes(o)); return '<button type="button" class="opt'+(w?' wrong':'')+(r?' right':'')+'" data-o="'+esc(o)+'"'+(res||w?' disabled':'')+'>'+esc(o)+'</button>'; }).join('')+'</div>';
    if(!res) h+='<div class="row" style="margin-top:.5em">'+tipHTML(t)+'</div>';
    h+=feedbackHTML(t)+(res?nextBtn():'');
    el.innerHTML=h; bindTip(t,rerender); bindNext(el,onNext);
    if(res) return;
    $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{ const o=b.dataset.o, ok=L_.includes(o), out=attempt(t,ok,o); if(!ok) ui.wrongs.push(o); else ui.chosen=o;
      react(t, out, ok?t.reaktion:'Hm?'); if(ok && t.reaktion) addLog(lineHTML(t.figur,t.reaktion)); ui.fb={ type:out, msg:'' }; afterAnswer(t,out,el,rerender);
      if(out==='retry'){ const n=$('.opt:not([disabled])',el); if(n) n.focus({preventScroll:true}); } }));
    if(!ui.focused){ ui.focused=true; const f=$('.opt',el); if(f) f.focus({preventScroll:true}); }
  },

  /* Lücke */
  luecke(t, el, onNext){
    const res=resolved(t), rerender=()=>T.luecke(t,el,onNext);
    const val = res && state.res[t.id]<0 ? asList(t.loesung)[0] : (ui.val||'');
    let h='<p class="auftrag">Schreib das richtige Wort in die Lücke.</p><p class="satz">'+fmt(t.satz).replace('___', textInput('ans', val, res, '9em'))+(t.hinweis?' <span class="muted">('+esc(t.hinweis)+')</span>':'')+'</p>';
    if(!res) h+=umlautBar()+'<div class="row"><button type="button" class="primary" id="btnCheck">✓ Prüfen</button>'+tipHTML(t)+'</div>';
    h+=feedbackHTML(t)+(res?nextBtn():'');
    el.innerHTML=h; bindTip(t,rerender); bindNext(el,onNext);
    if(res) return;
    const check=()=>{ const v=$('#ans',el).value.trim(); if(!v){ toast('Schreib zuerst etwas.'); return; } ui.val=v; const ok=matches(v,t.loesung), out=attempt(t,ok,v);
      react(t, out, ok?t.reaktion:'Hm?'); if(ok && t.reaktion) addLog(lineHTML(t.figur,t.reaktion));
      ui.fb={ type:out, msg: out==='retry'?'„'+v+'“ stimmt noch nicht.':'', extra: ok?schreibweise(v,t.loesung):'' }; afterAnswer(t,out,el,rerender);
      if(out==='retry'){ const i=$('#ans',el); if(i){ i.focus(); i.select(); } } };
    bindText(el, check);
    $('#btnCheck',el).addEventListener('click',check);
  },
};

/* ---------- Kapitelende, Fest und Wiederholung ---------- */
function kapitelFertig(){
  const last = state.room===D().length-1;
  state.phase = last ? 'fest' : 'kapitelende'; ui={}; save();
  sound(last?'fanfare':'seite'); renderGame();
}
function renderKapitelEnde(){
  const K=curKap();
  const figs=Array.from(new Set(K.tasks.map(t=>t.figur)));
  drawStage({ main:K.K.hauptfigur, mood:istFreund(K.K.hauptfigur)?'lacht':'froh', ohneGeheim:false });

function konfetti(){ if(ruhig()) return; for(let i=0;i<60;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.background=['#ffcf5a','#ff5c8a','#5ff0d8','#8fa8e0','#a6f28f'][i%5]; c.style.animationDuration=(2+Math.random()*2)+'s'; c.style.animationDelay=(Math.random()*.8)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),5000); } }
function festListe(){ // Aufgaben, die man wiederholen kann: von Figuren, die (noch) keine Freunde sind

}
function renderFest(){
  const figs=figurenImSpiel(), fr=freunde(), sieg=fr.length>=E.freundeZumSieg;

    '<div class="fest">'+figs.map((f,i)=>{ const da=fr.includes(f); return '<div class="gast '+(da?'da':'weg')+'" style="animation-delay:'+(i*0.35)+'s"><div class="ava">'+figurSVG(f, da?'lacht':'traurig', true)+'</div><strong>'+esc(fname(f))+'</strong><span>'+(da?'🤝 ist da!':'kommt nicht')+'</span></div>'; }).join('')+'</div>'+
    '<p><strong>'+fr.length+' von '+figs.length+' echten Freunden.</strong> '+(sieg?'Geschafft – ihr habt in Lindenfeld echte Freunde gefunden! 🎊':'Du brauchst '+E.freundeZumSieg+'. Aber keine Sorge: Du kannst die Szenen wiederholen, die schiefgelaufen sind.')+'</p>';
  if(!sieg && liste.length){
    h+='<h3>Diese Szenen sind schiefgelaufen:</h3><ul>'+liste.map(t=>'<li><span class="chip">'+esc(fname(t.figur))+'</span> '+esc(D()[t.k].K.name)+': '+esc(taskLabel(t).slice(0,70))+'</li>').join('')+'</ul>';
  }
  h+='<div class="row" style="margin-top:.5em"><span class="spacer"></span>'+(!sieg&&liste.length?'<button type="button" class="primary" id="btnReplay">🔁 Szenen wiederholen</button><button type="button" id="btnRes">Trotzdem zum Ergebnis</button>':'<button type="button" class="primary" id="btnRes">🏆 Zum Ergebnis</button>')+'</div>';

let wdh=null;
function renderWiederholung(){
  view='wiederholung';
  const a=loadBuch(), mine=Object.keys(a.seiten).filter(k=>WORT[k] && !WORT[k].geheim);
  const back='<button type="button" id="btnBack">← Zurück</button>';
  const goBack=()=>{ wdh=null; view=state?'game':'start'; render(); };
  if(!mine.length){
    app.innerHTML='<section class="card narrow"><div class="row"><h1 style="margin:0">🔁 Wiederholung</h1><span class="spacer"></span>'+back+'</div><p>Dein Freundebuch ist noch leer. Spiel ein Niveau – jeder falsche Freund, den du durchschaust, bekommt eine Seite. Dann kannst du hier üben.</p></section>';
    $('#btnBack').addEventListener('click',goBack); return;
  }
  if(!wdh){ const order=shuffle(mine).sort((x,y)=>(a.seiten[x].fach||1)-(a.seiten[y].fach||1)); wdh={ queue:order.slice(0,E.wiederholungKarten), i:0, ok:0, cur:null }; }
  if(wdh.i>=wdh.queue.length){
    const f=[1,2,3].map(k=>mine.filter(x=>(a.seiten[x].fach||1)===k).length);
    app.innerHTML='<section class="card narrow"><div class="row"><h1 style="margin:0">🔁 Runde geschafft!</h1><span class="spacer"></span>'+back+'</div><p>Du hattest <strong>'+wdh.ok+' von '+wdh.queue.length+'</strong> richtig.</p>'+
      '<div class="facher">'+['🟥 Fach 1: neu','🟨 Fach 2: geübt','🟩 Fach 3: sicher'].map((x,i)=>'<div class="f"><b>'+f[i]+'</b>'+x+'</div>').join('')+'</div>'+
      '<p class="small muted">Richtig = die Seite wandert ein Fach weiter. Falsch = sie kommt zurück in Fach 1 und kommt in der nächsten Runde zuerst.</p>'+
      '<div class="row"><button type="button" class="primary" id="btnAgain">🔁 Noch eine Runde</button><button type="button" id="btnB">📒 Zum Freundebuch</button></div></section>';
    $('#btnBack').addEventListener('click',goBack); $('#btnAgain').addEventListener('click',()=>{ wdh=null; render(); }); $('#btnB').addEventListener('click',()=>{ view='buch'; render(); }); focusEl('#btnAgain'); return;
  }
  const id=wdh.queue[wdh.i], w=WORT[id], card=a.seiten[id];
  if(!wdh.opts){ const andere=shuffle(WOERTER.filter(x=>!x.geheim && x.id!==id && x.es && x.es!==w.es && x.kat!=='echt').map(x=>x.es));
    const opts=[w.es]; if(w.kat==='falsch' && w.falle && !opts.includes(w.falle)) opts.push(w.falle); andere.forEach(x=>{ if(opts.length<3 && !opts.includes(x)) opts.push(x); }); wdh.opts=shuffle(opts); }
  const r=wdh.cur;
  app.innerHTML='<section class="card narrow"><div class="row"><h1 style="margin:0">🔁 Wiederholung</h1><span class="spacer"></span><span class="chip">Karte '+(wdh.i+1)+' von '+wdh.queue.length+'</span>'+back+'</div>'+
    '<p class="small muted">Fach '+(card.fach||1)+' '+'⭐'.repeat(card.fach||1)+'</p><h2 style="font-size:1.8em">'+esc(w.bild||'')+' '+esc(w.de)+'</h2><p class="satz"><i>'+esc(w.beispiel||'')+'</i></p>'+
    '<p class="auftrag">Was bedeutet „'+esc(w.de)+'“ auf Spanisch?</p><div class="opts">'+wdh.opts.map(o=>'<button type="button" class="opt'+(r&&o===w.es?' right':'')+(r&&r.wahl===o&&o!==w.es?' wrong':'')+'" data-o="'+esc(o)+'"'+(r?' disabled':'')+' lang="es">'+esc(o)+'</button>').join('')+'</div>'+
    (r?'<div class="tipbox '+(r.ok?'ok':'bad')+'"><p><strong>'+(r.ok?'✓ Richtig! Die Seite wandert in Fach '+r.fach+'.':'✗ Nicht ganz. Die Seite kommt zurück in Fach 1.')+'</strong></p><p>'+fmt(w.erklaerung||'')+'</p></div><div class="row" style="margin-top:.5em"><span class="spacer"></span><button type="button" class="primary" id="wNext">Weiter ➜</button></div>':'')+'</section>';
  $('#btnBack').addEventListener('click',goBack);
  if(r){ $('#wNext').addEventListener('click',()=>{ wdh.i++; wdh.cur=null; wdh.opts=null; render(); }); focusEl('#wNext'); return; }
  $$('.opt').forEach(b=>b.addEventListener('click',()=>{ const ok=b.dataset.o===w.es; const A=loadBuch(), c=A.seiten[id]; c.fach= ok ? Math.min(3,(c.fach||1)+1) : 1; saveBuch(A); if(ok) wdh.ok++; wdh.cur={ ok, fach:c.fach, wahl:b.dataset.o }; sound(ok?'ok':'bad'); render(); }));
  focusEl('.opt');
}

/* ---------- Name und Ergebnis ---------- */
function renderName(){
  app.innerHTML='<section class="card narrow"><h1>🏆 Geschafft!</h1><p>Schreib deinen Namen für das Ergebnis und den Prüfcode.</p>'+
    '<p class="row"><label for="nameIn">Dein Name:</label> <input '+INPUT_ATTR+' id="nameIn" maxlength="60" style="flex:1;min-width:220px" placeholder="Vorname Nachname"></p><div id="nameFb" role="status"></div>'+
    '<div class="row"><span class="spacer"></span><button type="button" class="primary" id="btnName">Ergebnis anzeigen ➜</button></div></section>';
  const go=()=>{ const n=$('#nameIn').value.trim().replace(/\s+/g,' '); if(normName(n).length<2){ $('#nameFb').innerHTML='<p class="badline">Bitte schreib deinen Namen.</p>'; return; } state.name=n; state.finished=new Date().toISOString(); if(state.freundeEnde==null) state.freundeEnde=freunde().length; state.phase='end'; save(); render(); };
  $('#btnName').addEventListener('click',go); $('#nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); focusEl('#nameIn');
}
function renderResult(){
  const s=stats(), d=new Date(state.finished), fr=state.freundeEnde!=null?state.freundeEnde:freunde().length, code=makeCode(state.level,s.pct,fr,d,state.name);
  const rows=[['Name',state.name],['Niveau',state.level+' – '+L().titel],['Punkte',s.score+' von '+s.max],['Prozent',s.pct+' %'],['Echte Freunde',fr+' von '+figurenImSpiel().length+(fr>=E.freundeZumSieg?' 🎉':'')],['Zeit',fmtTime(state.elapsed)+' min'],['Datum',fmtDate(d)],['Richtig',s.ok+' von '+s.total+' Aufgaben'],['Neue Seiten im Freundebuch',asList(state.seiten).length]];
  let h='<section class="card narrow"><div class="row"><h1 style="margin:0">🏆 Dein Ergebnis</h1><span class="spacer"></span><div style="display:flex;gap:4px">'+freunde().slice(0,5).map(f=>'<div style="width:56px">'+figurSVG(f,'lacht',true)+'</div>').join('')+'</div></div>'+
    '<table class="restable">'+rows.map(r=>'<tr><th scope="row">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table>'+
    '<p style="margin-bottom:0">Prüfcode:</p><div class="bigcode">'+esc(code)+'</div><p class="small muted">Mach einen Screenshot oder kopiere das Ergebnis und gib es in Google Classroom ab.</p>'+
    '<div class="row"><button type="button" class="primary" id="btnCopy">📋 Ergebnis kopieren</button><button type="button" id="btnBuchR">📒 Mein Freundebuch</button><button type="button" id="btnNew">↺ Neues Spiel</button><span id="copyFb" role="status" class="okline"></span></div>'+
    '<h2 style="margin-top:1em">Falsch beantwortete Aufgaben ('+state.wrong.length+')</h2>';
  h += state.wrong.length ? '<ol class="wronglist">'+state.wrong.map(w=>'<li><span class="muted small">'+esc(w.kapitel)+'</span><br>'+esc(w.aufgabe)+'<br><span class="badline">✗ Deine Antwort: '+esc(w.deine)+'</span><br><span class="okline">✓ Richtig: '+esc(w.loesung)+'</span></li>').join('')+'</ol>' : '<p class="okline">✓ Keine Fehler – super!</p>';
  app.innerHTML=h+'</section>';
  $('#btnCopy').addEventListener('click',()=>copyText(resultText(code,s,d,fr)));
  $('#btnBuchR').addEventListener('click',()=>{ view='buch'; render(); });
  $('#btnNew').addEventListener('click',()=>bestaetigen('Neues Spiel starten? Dieses Ergebnis wird gelöscht (dein Freundebuch bleibt). Hast du schon einen Screenshot gemacht?', ()=>{ lsDel(LS_GAME); state=null; view='start'; render(); }));
  focusEl('#btnCopy');
}
function resultText(code,s,d,fr){
  let t='Falsche Freunde, echte Freunde – Dialog-Abenteuer\nName: '+state.name+'\nNiveau: '+state.level+' – '+L().titel+
    '\nPunkte: '+s.score+' / '+s.max+' ('+s.pct+' %)\nEchte Freunde: '+fr+' von '+figurenImSpiel().length+'\nZeit: '+fmtTime(state.elapsed)+' min\nDatum: '+fmtDate(d)+'\nPrüfcode: '+code+'\n';
  t+='\nFalsch beantwortet ('+state.wrong.length+'):\n'+(state.wrong.length?state.wrong.map((w,i)=>(i+1)+'. '+w.aufgabe+'\n   Meine Antwort: '+w.deine+'\n   Richtig: '+w.loesung).join('\n'):'–');
  return t;
}
function copyText(t){
  const done=()=>{ $('#copyFb').textContent='✓ Kopiert! Jetzt in Google Classroom einfügen (Strg + V).'; };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('#copyFb').textContent='Kopieren hat nicht geklappt – bitte Screenshot machen.'; } ta.remove(); };
  let settled=false; const once=f=>()=>{ if(!settled){ settled=true; f(); } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(once(done),once(fallback)); setTimeout(once(fallback),800); } else once(fallback)(); }catch(e){ once(fallback)(); }
}

/* ---------- Lehrkraft ---------- */
function renderTeacher(){
  app.innerHTML='<section class="card narrow"><h1>🔎 Prüfcode kontrollieren</h1><p class="muted">Für Lehrkräfte. Name so eingeben, wie er im Ergebnis steht (Groß-/Kleinschreibung, Akzente und Leerzeichen sind egal).</p>'+
    '<p><label for="tName">Name</label><br><input '+INPUT_ATTR+' id="tName" style="width:100%"></p><p><label for="tCode">Prüfcode</label><br><input '+INPUT_ATTR+' id="tCode" style="width:100%" placeholder="z. B. B1-78-4-141026-K7QFM"></p>'+
    '<div class="row"><button type="button" class="primary" id="tCheck">Prüfen</button><span class="spacer"></span><button type="button" id="tBack">← Zurück zum Spiel</button></div><div id="tRes" role="status" aria-live="polite" style="margin-top:.8em"></div></section>'+
    '<section class="card narrow"><h2>ℹ️ Gut zu wissen</h2><ul>'+
    '<li><strong>Prüfcode:</strong> Niveau – Prozent – Zahl der echten Freunde – Datum – Kontrollzeichen.</li>'+
    '<li><strong>Punkte:</strong> 10 beim 1. Versuch, 5 beim 2.; ein Tipp kostet 3 Punkte. Die Punkte zählen nur beim ersten Durchgang.</li>'+
    '<li><strong>Freundschaft:</strong> ab '+Math.round(E.freundSchwelle*100)+' % der möglichen Herzen. Fürs Fest braucht man '+E.freundeZumSieg+' Freunde. Wer zu wenige hat, kann die schiefgelaufenen Szenen wiederholen – das verbessert die Freundschaften, aber nicht die Punkte.</li>'+
    '<li><strong>Freundebuch und Wiederholung</strong> werden im Browser des Geräts gespeichert, nicht im Prüfcode.</li></ul></section>';
  const go=()=>{ const r=verifyCode($('#tCode').value,$('#tName').value);
    $('#tRes').innerHTML = r.valid ? '<p class="tipbox ok"><strong>✓ Der Code ist gültig.</strong><br>Niveau <strong>'+r.level+'</strong> · <strong>'+r.pct+' %</strong> · <strong>'+r.fr+' echte Freunde</strong> · '+r.date+'</p>'
      : '<p class="tipbox bad"><strong>✗ Der Code ist nicht gültig.</strong><br>'+esc(r.reason||'Name oder Code passen nicht zusammen.')+'</p>'; };
  $('#tCheck').addEventListener('click',go); ['#tName','#tCode'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
  $('#tBack').addEventListener('click',()=>{ history.replaceState(null,'',location.pathname+location.search); render(); });
  focusEl('#tName');
}

/* ---------- Uhr ---------- */
setInterval(()=>{
  if(!state || view!=='game' || !['play','replay'].includes(state.phase) || document.hidden || location.hash) return;
  state.elapsed+=1000;
  const c=$('#clock'); if(c) c.textContent='⏱ '+fmtTime(state.elapsed);
  if(state.elapsed%5000===0) save();
},1000);

/* ---------- Start ---------- */
(function init(){
  try{ const s=JSON.parse(lsGet(LS_SET)||'{}'); if(s.sound) settings.sound=true; if(s.anim===false) settings.anim=false; }catch(e){}
  const sb=$('#btnSound'), ab=$('#btnAnim');
  const upd=()=>{ sb.textContent=settings.sound?'🔊 Ton an':'🔇 Ton aus'; sb.setAttribute('aria-pressed',String(settings.sound));
    ab.textContent=settings.anim?'🎞 Animationen an':'🎞 Animationen aus'; ab.setAttribute('aria-pressed',String(!settings.anim)); document.documentElement.classList.toggle('ruhig',!settings.anim); };
  upd();
  sb.addEventListener('click',()=>{ settings.sound=!settings.sound; saveSettings(); upd(); sound('ok'); });
  ab.addEventListener('click',()=>{ settings.anim=!settings.anim; saveSettings(); upd(); toast(settings.anim?'🎞 Animationen sind wieder an.':'🎞 Animationen sind aus – nur noch sanfte Überblendungen.'); });
  $('#btnMenu').addEventListener('click',()=>{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); view='start'; state=null; ui={}; render(); });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
