   AUFGABENTYPEN
     zahnrad – Kryptex: Ringe drehen (Person | Verbstamm | Endung).
               satz    : Satz mit ___
               ringe   : Liste der Ringe. "PERSON" = ich, du, er/sie/es,

<style>
:root{
  --bg:#120d09; --panel:#251a12; --panel2:#352619; --line:#7d5a36;
  --text:#fbf3e6; --muted:#e2cfb5; --accent:#f0c050; --accent-text:#1a1a1a;
  --brass:#d9a441; --brass2:#a8732a; --energy:#5ff0d8;
  --ok:#5ee08f; --ok-bg:#103a26; --bad:#ff8a8a; --bad-bg:#4a1a1f;
  --focus:#ffe066; --btn:#4f3823; --btnh:#644830;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(ellipse at 10% 0%,#3a2814 0%,transparent 55%),radial-gradient(ellipse at 95% 100%,#14303a 0%,transparent 50%);background-attachment:fixed;color:var(--text);font-family:Roboto,Arial,"Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.45;min-height:100vh}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em} h1{font-size:1.7em} h2{font-size:1.25em} h3{font-size:1.05em}
p{margin:.4em 0 .8em} a{color:var(--accent)}
button{font:inherit;color:var(--text);cursor:pointer;border-radius:12px;border:2px solid #9a7353;background:var(--btn);padding:.35em .9em;min-height:46px;touch-action:manipulation}
button:hover:not(:disabled){background:var(--btnh)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
.primary:hover:not(:disabled){background:#ffd978}
input[type=text]{font:inherit;color:#111;background:#fff;border:3px solid #d0a77f;border-radius:10px;padding:.25em .45em;min-height:46px}
select{font:inherit;min-height:40px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:.85em} .center{text-align:center}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center} .spacer{flex:1}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:1em 1.3em;box-shadow:0 8px 24px rgba(0,0,0,.35);margin-bottom:.9em}
.narrow{max-width:940px;margin-left:auto;margin-right:auto}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.05em .7em;font-size:.85em;color:var(--muted)}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.1em .7em;white-space:nowrap;font-size:.9em}
.warnbox{background:#4a3a00;border:2px solid var(--accent);border-radius:12px;padding:.6em 1em;margin:.6em 0;font-size:.85em}
.warnbox ul{margin:.3em 0 0;padding-left:1.2em}
.okline{color:var(--ok)} .badline{color:var(--bad)}
.tipbox{background:#3a3214;border:2px solid #b89a3a;border-radius:12px;padding:.45em .85em;margin-top:.6em}
.tipbox.ok{background:var(--ok-bg);border-color:var(--ok)}
.tipbox.bad{background:var(--bad-bg);border-color:var(--bad)}
.tipbox.sofia{background:#20283e;border-color:#8fa8e0}
.tipbox p{margin:.25em 0}
.es{color:#9fd0ff}

#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.6em;flex-wrap:wrap;padding:.3em .8em;background:rgba(18,13,9,.96);border-bottom:2px solid var(--line)}
#top .brand{font-weight:800;white-space:nowrap}
#hud{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;flex:1}
#top .tools{display:flex;gap:.4em}
#top .tools button{min-height:40px;padding:.2em .7em;font-size:.88em}
.homelink{color:var(--muted);text-decoration:none;font-size:.85em;border:1px solid var(--line);border-radius:999px;padding:.15em .7em;white-space:nowrap}
.homelink:hover{color:var(--text);border-color:var(--accent)}
main{max-width:1320px;margin:0 auto;padding:.5em 1em 1.5em}
.eingebettet .homelink{display:none}

/* ---------- Start ---------- */
.hero .herorow{display:flex;gap:1em;align-items:center;flex-wrap:wrap}
.hero .herorow > div:first-child{flex:1 1 440px}
.heroart{flex:0 1 220px;display:flex;justify-content:center}
.heroart svg{width:200px;height:auto}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8em;margin:.6em 0 .2em}
.level{display:flex;flex-direction:column;align-items:flex-start;gap:.15em;text-align:left;padding:.8em 1em;border-radius:16px;min-height:130px}
.level .lv{font-size:1.6em;font-weight:800;color:var(--accent)} .level .lt{font-weight:700}
.level .lo{font-size:.8em;color:var(--muted)}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8em}
.extras button{display:flex;gap:.7em;align-items:center;text-align:left;padding:.7em 1em;border-radius:16px}
.extras .big{font-size:2em}

/* ---------- Bühne ---------- */
.stage{position:relative;container-type:inline-size;width:min(100%, calc((100vh - 172px) * 1000 / 560));min-width:min(100%,520px);aspect-ratio:1000/560;margin:0 auto;border-radius:16px;overflow:hidden;border:3px solid var(--line);background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.world{position:absolute;inset:0}
.world svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;padding:0;min-height:0;background:transparent;border:3px solid transparent;border-radius:14px;cursor:pointer;z-index:4;display:flex;align-items:center;justify-content:center;line-height:1}
.hot .sym{font-size:var(--fs,4cqw);filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));pointer-events:none;transition:transform .2s}
.hot:hover:not(:disabled),.hot:focus-visible{border-color:rgba(255,226,120,.95);background:rgba(255,240,180,.14);box-shadow:0 0 22px 6px rgba(255,220,100,.5),inset 0 0 18px rgba(255,230,140,.3)}
.hot:hover .sym{transform:scale(1.12) rotate(-4deg)}
.hot .tag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);background:rgba(20,14,8,.92);color:#fff;border-radius:8px;padding:.05em .5em;font-size:16px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
.hot:hover .tag,.hot:focus-visible .tag{opacity:1}
.hot.task::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:3px solid rgba(255,214,102,.0);animation:hint 2.6s ease-in-out infinite;pointer-events:none}
@keyframes hint{50%{border-color:rgba(255,214,102,.55);box-shadow:0 0 18px rgba(255,214,102,.35)}}
.hot.done::after{display:none}
.hot .bdg{position:absolute;right:-8px;top:-10px;min-width:32px;height:32px;padding:0 4px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:5}
.bdg.dig{background:radial-gradient(circle at 35% 30%,#fff3c4,#e0b24a 60%,#8a5a1a);color:#2a1606;border:2px solid #5a3a10;animation:digpop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes digpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
@keyframes cellglow{0%{box-shadow:none;filter:brightness(1)}50%{box-shadow:0 0 26px #5ff0d8;filter:brightness(1.5)}100%{box-shadow:0 0 12px rgba(95,240,216,.7)}}
.bdg.tf{background:#2a6f8f;color:#fff;font-size:16px}
.bdg.part{background:#5d4a3c;color:#fff;font-size:13px}
.roomlabel{position:absolute;left:10px;top:10px;z-index:6;background:rgba(20,14,8,.85);border:2px solid var(--line);border-radius:12px;padding:.05em .7em;font-weight:700;font-size:max(13px,1.55cqw)}
.energy{position:absolute;right:10px;top:10px;z-index:6;display:flex;align-items:center;gap:.4em;background:rgba(20,14,8,.85);border:2px solid var(--line);border-radius:12px;padding:.15em .6em;font-size:max(12px,1.4cqw);font-weight:700}
.energy .segs{display:flex;gap:3px}
.energy .seg{width:max(12px,1.8cqw);height:max(12px,1.5cqw);border-radius:4px;background:#3a2d22;border:1px solid #6b5640;transition:background .5s,box-shadow .5s}
.energy .seg.ok{background:var(--energy);box-shadow:0 0 8px var(--energy)}
.energy .seg.half{background:#9a8a6a}
.energy.full{border-color:var(--energy);box-shadow:0 0 14px rgba(95,240,216,.6)}

/* Figuren */
.fig{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:3;font-size:5.2cqw;line-height:1;text-align:center;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}

.fig.bob{animation:bob 1.9s ease-in-out infinite alternate}
@keyframes bob{to{margin-top:-.5cqw}}
.poof{position:absolute;z-index:7;pointer-events:none;font-size:6cqw;transform:translate(-50%,-100%);animation:poof 1.1s ease-out forwards}
@keyframes poof{0%{opacity:0;transform:translate(-50%,-100%) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.7)}}

/* Maschine */
.machine{position:absolute;z-index:3;pointer-events:none}
.machine svg{width:100%;height:100%;display:block;overflow:visible}
.machine .g1,.machine .g2,.machine .g3{transform-box:fill-box;transform-origin:center}
.machine.run .g1{animation:spin 6s linear infinite}
.machine.run .g2{animation:spinr 4s linear infinite}
.machine.run .g3{animation:spin 3s linear infinite}
.machine.fast .g1{animation-duration:1s} .machine.fast .g2{animation-duration:.7s} .machine.fast .g3{animation-duration:.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.machine .tubefill{transition:height .8s ease,y .8s ease}
.machine.stutter{animation:stutter .6s}
@keyframes stutter{10%,50%,90%{transform:translate(-4px,1px) rotate(-1deg)}30%,70%{transform:translate(4px,-1px) rotate(1deg)}}
.machine.boost svg{animation:boost .9s ease-out}
@keyframes boost{40%{filter:drop-shadow(0 0 22px var(--energy)) brightness(1.25)}}
.machine .lever{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.5,1.6,.5,1)}
.machine.pulled .lever{transform:rotate(60deg)}
.machine .lamp{transition:fill .4s}
.machine .hand{transform-box:view-box;transform-origin:110px 95px}
.machine.run .hand{animation:spin 8s linear infinite}
.machine.fast .hand{animation-duration:.6s}
.machinehot{z-index:4}
.puff{position:absolute;z-index:8;pointer-events:none;width:7cqw;height:7cqw;border-radius:50%;background:radial-gradient(circle,rgba(90,90,90,.85),rgba(60,60,60,0) 70%);animation:puff 1.6s ease-out forwards}
@keyframes puff{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-30%,-180%) scale(2.4);opacity:0}}
.spark{position:fixed;z-index:1300;width:7px;height:7px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffb02e,0 0 2px #fff;pointer-events:none;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--sx),var(--sy)) scale(.2);opacity:0}}

/* Leerlauf-Animationen in den Szenen */
.wave{animation:wave 5s ease-in-out infinite alternate}
.wave.w2{animation-duration:6.5s;animation-delay:-2s}
@keyframes wave{to{transform:translateX(-30px)}}
.cloud{animation:cloud 60s linear infinite alternate}
@keyframes cloud{to{transform:translateX(120px)}}
.drift{animation:drift 9s linear infinite}
.drift.d2{animation-duration:12s;animation-delay:-4s} .drift.d3{animation-duration:7s;animation-delay:-2s}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(260px,-40px);opacity:0}}
.mote{animation:mote 7s ease-in-out infinite alternate}
.mote.m2{animation-delay:-3s;animation-duration:9s}
@keyframes mote{to{transform:translate(18px,-30px);opacity:.2}}
.rain{animation:rain .8s linear infinite}
@keyframes rain{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
.blink{animation:blink 1.4s steps(2,end) infinite}
.blink.b2{animation-delay:-.5s;animation-duration:1.9s} .blink.b3{animation-delay:-1s;animation-duration:1.1s}
@keyframes blink{50%{opacity:.2}}
.glide{animation:glide 14s ease-in-out infinite alternate}
@keyframes glide{to{transform:translate(160px,25px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .4s ease-in-out infinite alternate}
@keyframes flame{to{transform:scaleY(1.15) scaleX(.92)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 5s ease-out infinite}
.smoke.s2{animation-delay:1.6s} .smoke.s3{animation-delay:3.2s}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(30px,-70px) scale(1.9);opacity:0}}
.float{animation:float 3s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px)}}
.holo{transform-box:fill-box;transform-origin:center;animation:holo 6s linear infinite}
@keyframes holo{to{transform:rotate(360deg)}}

/* Leiste unter der Bühne */
.bar{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;width:min(100%, calc((100vh - 172px) * 1000 / 560));min-width:min(100%,520px);margin:.45em auto 0}
.bar button{min-height:42px;padding:.15em .7em;font-size:.9em}
.digits{display:flex;gap:.3em;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:.1em .6em;min-height:44px;font-size:.92em}
.digits .d{display:inline-flex;align-items:center;gap:.15em;padding:0 .3em;border-radius:8px;background:#3a2d22}
.digits .d b{display:inline-block;min-width:1.1em;text-align:center;color:var(--accent);font-size:1.15em}

/* ---------- Overlays auf der Bühne ---------- */
.over{position:absolute;z-index:20;left:1.2%;top:2.2%;bottom:2.2%;width:66%;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--brass2);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.7);font-size:17px;animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.over .ohead{display:flex;align-items:center;gap:.5em;padding:.35em .7em;border-bottom:2px solid var(--line);background:linear-gradient(180deg,#3d2c1c,#2c1f14);border-radius:13px 13px 0 0}
.over .ohead h2{margin:0;font-size:1.12em;flex:1}
.over .ohead button{min-height:38px;padding:.1em .6em}
.over .obody{flex:1;overflow:auto;padding:.5em .9em .8em}
.backdrop{position:absolute;inset:0;z-index:19;background:rgba(5,4,2,.55)}
.over.mid{left:50%;top:50%;bottom:auto;width:min(92%,760px);max-height:92%;transform:translate(-50%,-50%);animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.paper{background:#fbf3df;color:#2b2015;border-radius:10px;padding:.5em .8em;margin:.2em 0 .6em;font-family:Georgia,serif;box-shadow:inset 0 0 30px rgba(140,100,40,.25)}
.paper p{margin:.2em 0}
.anleitung{background:#1c2a2f;border:2px solid #4f8f9a;border-radius:12px;padding:.4em .8em;margin:.4em 0}
.anleitung p{margin:.2em 0}
.panelhead{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;margin-bottom:.3em}
.dots{display:flex;gap:6px}
.dots span{width:13px;height:13px;border-radius:50%;background:#5d4a3c;border:2px solid #9a7353}
.dots span.ok{background:var(--ok);border-color:var(--ok)} .dots span.bad{background:var(--bad);border-color:var(--bad)} .dots span.cur{background:var(--accent);border-color:var(--accent)}
.auftrag{font-weight:700;margin:.2em 0 .4em}
.bedienung{font-size:.82em;color:var(--muted);margin:.1em 0 .4em}
.satz{font-size:1.1em;margin:.3em 0 .5em}
.satz .gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);text-align:center;font-weight:800;color:var(--accent);padding:0 .2em}
.satz .gap.lit{color:var(--energy);border-color:var(--energy);text-shadow:0 0 10px rgba(95,240,216,.8)}
.opts{display:flex;flex-direction:column;gap:.4em}
.opt{text-align:left}
.opt.right,.opt.right:disabled{background:var(--ok-bg);border-color:var(--ok);opacity:1}
.opt.wrong,.opt.wrong:disabled{background:var(--bad-bg);border-color:var(--bad)}
.fullin{width:100%}
.umlauts{display:flex;gap:.35em;flex-wrap:wrap;align-items:center;margin:.3em 0}
.umlauts button{min-width:44px;min-height:40px;font-weight:700;padding:.1em .5em}

/* zahnrad */
.rings{display:flex;align-items:center;gap:.3em;margin:.4em 0 .5em;flex-wrap:wrap}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.ringwrap .rl{font-size:.72em;color:var(--muted)}
.ringwrap button.arr{min-height:30px;width:100%;padding:0;font-size:.85em;border-radius:8px;background:#3a2a1a}
.ring{min-width:7.2em;height:118px;border-radius:12px;border:3px solid #6e4a1e;background:linear-gradient(90deg,#6e4a1e,#e8b85a 18%,#fff0c0 50%,#e8b85a 82%,#6e4a1e);color:#2a1606;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:ns-resize;user-select:none;box-shadow:inset 0 10px 12px rgba(0,0,0,.35),inset 0 -10px 12px rgba(0,0,0,.35)}
.ring .rv{font-weight:800;line-height:1.25;white-space:nowrap;transition:transform .18s}
.ring .rv.cur{font-size:1.2em}
.ring .rv.side{opacity:.45;font-size:.85em}
.ring.turn .rv{animation:turn .2s ease-out}
@keyframes turn{from{transform:translateY(var(--td,-14px));opacity:.4}to{transform:none;opacity:1}}
.ring.lit{border-color:var(--energy);box-shadow:0 0 16px rgba(95,240,216,.8),inset 0 10px 12px rgba(0,0,0,.25),inset 0 -10px 12px rgba(0,0,0,.25)}
.gearsep{width:46px;height:46px;flex:0 0 auto}
.gearsep svg{width:100%;height:100%;transition:transform .3s}
.rings.mesh .gearsep svg{animation:spin 1.2s linear infinite}
.rings.mesh .gearsep:nth-of-type(even) svg{animation-name:spinr}

/* tabelle */
.ztable{border-collapse:separate;border-spacing:0 5px;margin:.3em 0}
.ztable caption{text-align:left;font-weight:800;color:var(--accent);padding-bottom:.2em}
.ztable th{text-align:right;padding:.1em .7em .1em 0;color:var(--muted);font-weight:600;white-space:nowrap}
.ztable td{padding:0}
.ztable .given,.ztable input{display:inline-block;min-width:9em;width:11em;min-height:42px;border-radius:9px;padding:.2em .5em}
.ztable .given{background:#3a2d22;border:2px solid #5d4a3c;color:var(--muted)}
.ztable input.lit,.ztable input.lit:read-only{background:#0f3a35;color:#d8fff8;border-color:var(--energy);box-shadow:0 0 12px rgba(95,240,216,.7)}
.ztable input.wrongcell{border-color:var(--bad);background:#ffe2e2}
.digitshow{display:flex;align-items:center;gap:.6em;margin:.5em 0;padding:.4em .8em;border-radius:12px;background:#2a2412;border:2px solid var(--accent)}
.digitshow .bd{font-size:2.2em;font-weight:900;color:var(--accent);text-shadow:0 0 14px rgba(240,192,80,.9);animation:digpop .8s cubic-bezier(.3,1.6,.5,1) both}

/* zelle */
.cells{display:flex;gap:1em;flex-wrap:wrap;margin:.5em 0}
.cell{position:relative;min-width:7.5em;min-height:64px;border-radius:12px 12px 10px 10px;font-weight:800;color:#0b2a26;border:3px solid #1d5f57;background:linear-gradient(90deg,#2aa594,#7ff5e2 45%,#2aa594);box-shadow:0 4px 0 #0e3f39;touch-action:none;user-select:none;cursor:grab}
.cell::before{content:"";position:absolute;left:50%;top:-11px;transform:translateX(-50%);width:22px;height:9px;border-radius:4px 4px 0 0;background:#8a8a8a;border:2px solid #555}
.cell:hover:not(:disabled){background:linear-gradient(90deg,#33b8a6,#a0fff0 45%,#33b8a6)}
.cell.used,.cell.used:disabled{opacity:.35;filter:grayscale(1)}
.cell.right,.cell.right:disabled{opacity:1;outline:4px solid var(--ok);outline-offset:3px}
.dropzone.hover{background:rgba(95,240,216,.25);border-color:var(--energy)}
.cellghost{position:fixed;z-index:1200;pointer-events:none;transform:translate(-50%,-50%) rotate(-6deg) scale(1.05);opacity:.95}
.mport{position:absolute;z-index:9;border:4px dashed rgba(95,240,216,.85);border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:max(11px,1.2cqw);font-weight:800;color:#d8fff8;text-shadow:0 1px 3px #000;animation:portglow 1.4s ease-in-out infinite;pointer-events:none}
@keyframes portglow{50%{box-shadow:0 0 22px rgba(95,240,216,.8);background:rgba(95,240,216,.12)}}
.mport.hover{background:rgba(95,240,216,.3)}

/* schmieden */
.anvil{position:relative;margin:.3em 0 .4em;padding:.6em .6em 2.6em;border-radius:14px;background:linear-gradient(180deg,#2c2520,#1d1815)}
.anvil::after{content:"";position:absolute;left:8%;right:8%;bottom:.5em;height:1.6em;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,#6d737a,#3b4046);box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
.blocks{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:.3em;justify-content:center;align-items:flex-end}
.block{min-width:2.6em;min-height:58px;padding:.1em .5em;border-radius:6px;font-weight:800;font-size:1.15em;color:#2b2b2b;border:3px solid #4a4f55;background:linear-gradient(180deg,#d6dbe0,#9aa2aa);box-shadow:0 4px 0 #3b4046}
.block.heiss{color:#3a0e00;border-color:#a33a00;background:linear-gradient(180deg,#ffd27a,#ff8a2a 55%,#d4480a);box-shadow:0 0 14px rgba(255,120,30,.7),0 4px 0 #6a2200;cursor:pointer}
.block.heiss:hover:not(:disabled){background:linear-gradient(180deg,#ffe2a0,#ff9a40 55%,#e0580f)}
.block.empty{color:rgba(58,14,0,.45)}
.block.cold,.block.cold:disabled{opacity:1;background:linear-gradient(180deg,#c9d6e2,#7d8fa0);border-color:#3f5568;color:#1a2a38;box-shadow:0 0 12px rgba(160,210,255,.6),0 4px 0 #2c3a48;cursor:default}
.block.strike{animation:strike .25s ease-out}
@keyframes strike{30%{transform:translateY(6px) scaleY(.85)}}
.hammer{position:absolute;z-index:3;font-size:2.2em;pointer-events:none;transform-origin:80% 80%;animation:hammer .3s ease-out forwards}
@keyframes hammer{0%{transform:translate(-50%,-110%) rotate(-50deg)}60%{transform:translate(-50%,-70%) rotate(10deg)}100%{transform:translate(-50%,-90%) rotate(-20deg);opacity:0}}
.forgeword{font-size:1.15em;margin:.2em 0}
.forgeword b{color:var(--accent);letter-spacing:.03em}
.steam{position:absolute;left:50%;top:0;z-index:4;font-size:2em;pointer-events:none;animation:steam 1.2s ease-out forwards}
@keyframes steam{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px) scale(1.8);opacity:0}}

/* Sammelkarten */
.vcard{position:relative;width:200px;height:250px;perspective:900px;background:none;border:none;padding:0;min-height:0}
.vcard .in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.vcard.flip .in{transform:rotateY(180deg)}
.vcard .fa,.vcard .ba{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:4px solid #8a5a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5em;text-align:center}
.vcard .fa{background:radial-gradient(circle at 50% 30%,#fff6d8,#e8c070 70%,#b8862a);color:#2a1606}
.vcard .fa .ic{font-size:2.4em}
.vcard .fa .inf{font-size:1.35em;font-weight:900;margin:.2em 0}
.vcard .fa .stars{font-size:.85em}
.vcard .ba{background:linear-gradient(160deg,#20323a,#13232a);color:#e9fbff;transform:rotateY(180deg);font-size:.82em;justify-content:flex-start;text-align:left;align-items:stretch}
.vcard .ba b{color:var(--energy)}
.vcard .ba p{margin:.15em 0}
.vcard.locked .fa{background:repeating-linear-gradient(45deg,#3a2d22,#3a2d22 10px,#33271d 10px,#33271d 20px);color:#8a7660;border-color:#5d4a3c}
.cardrow .vcard{width:150px;height:190px;font-size:.85em}
.vcard.newcard{animation:cardin 1s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cardin{from{transform:translateY(40px) rotate(-20deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.albumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.9em;justify-items:center;margin:.6em 0}
.cardrow{display:flex;gap:1em;align-items:center;flex-wrap:wrap;margin:.4em 0}
.facher{display:flex;gap:.6em;flex-wrap:wrap}
.facher .f{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:.3em .8em;min-width:120px;text-align:center}
.facher .f b{display:block;font-size:1.5em;color:var(--accent)}

/* Zeitschloss */
.lockbox{display:flex;gap:1em;flex-wrap:wrap;align-items:center;margin:.4em 0}
.wheels{display:flex;gap:.5em;padding:.5em .7em;border-radius:14px;background:linear-gradient(180deg,#3d2c1c,#1f150d);border:3px solid var(--brass2)}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel .wl{font-size:1.4em;line-height:1.2}
.wheel .wd{width:2.2em;height:2.4em;border-radius:10px;border:3px solid #6e4a1e;background:linear-gradient(180deg,#6e4a1e,#f3d48a 30%,#fff3cc 50%,#f3d48a 70%,#6e4a1e);color:#2a1606;font-size:1.5em;font-weight:900;display:flex;align-items:center;justify-content:center;user-select:none;cursor:ns-resize}
.wheel button{min-height:30px;width:100%;padding:0;border-radius:8px;font-size:.8em;background:#3a2a1a}
.wheels.rattle{animation:stutter .5s}
.wheels.open .wd{border-color:var(--energy);box-shadow:0 0 14px rgba(95,240,216,.8)}
.leverbtn{display:flex;flex-direction:column;align-items:center;gap:.2em;font-weight:800;padding:.4em 1em}
.leverbtn .lv{font-size:2em;display:inline-block;transition:transform .4s}
.leverbtn:hover:not(:disabled) .lv{transform:rotate(25deg)}
.meter{height:20px;border-radius:10px;background:#3a2d22;border:2px solid #6b5640;overflow:hidden;margin:.2em 0 .5em}
.meter > div{height:100%;background:linear-gradient(90deg,#2aa594,var(--energy));box-shadow:0 0 10px var(--energy);transition:width .8s}

/* Zeitreise */
.travel{position:absolute;inset:0;z-index:40;background:#05030a;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.travel .ringt{position:absolute;left:50%;top:50%;width:10%;aspect-ratio:1;border-radius:50%;border:6px solid;transform:translate(-50%,-50%) scale(.1);animation:tunnel 1.6s linear infinite;opacity:0}
@keyframes tunnel{0%{transform:translate(-50%,-50%) scale(.1) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-50%) scale(12) rotate(90deg);opacity:0}}
.travel .tg{position:absolute;width:22%;opacity:.75}
.travel .tg svg{width:100%;height:auto;animation:spin 1.4s linear infinite}
.travel .tg.r svg{animation-name:spinr}
.travel .year{position:relative;z-index:3;font-family:"Courier New",monospace;font-weight:900;font-size:9cqw;color:#fff3c4;text-shadow:0 0 20px #f0c050,0 0 40px #ff8a2a;letter-spacing:.06em;text-align:center}
.travel .year small{display:block;font-size:.3em;letter-spacing:.02em;font-family:Roboto,Arial,sans-serif;color:#d8fff8;text-shadow:0 0 10px #5ff0d8}
.travel .skip{position:absolute;right:12px;bottom:12px;z-index:4;min-height:40px;font-size:15px}
.travel.calm .ringt,.travel.calm .tg{display:none}
.flash{position:absolute;inset:0;z-index:41;background:#fff;pointer-events:none;animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* Sonstiges */
.restable{border-collapse:collapse;margin:.5em 0} .restable th,.restable td{text-align:left;padding:.2em .8em .2em 0;border-bottom:1px solid var(--line)}
.bigcode{font-family:"Courier New",monospace;font-size:1.6em;font-weight:800;letter-spacing:.06em;background:#fff;color:#111;border-radius:12px;padding:.2em .6em;display:inline-block;margin:.2em 0}
.wronglist li{margin-bottom:.6em}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#222;border-radius:12px;padding:.5em 1em;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:1500;max-width:90vw}
code{font-family:"Courier New",monospace;background:#00000055;padding:0 .3em;border-radius:4px}
pre.code{background:#000;color:#9fe;padding:.6em;border-radius:10px;white-space:pre-wrap}
.edold{position:absolute;border:3px solid #5ee08f;border-radius:10px;z-index:5;pointer-events:none}
.edold span{position:absolute;left:0;top:-1.4em;background:#000c;color:#fff;font-size:13px;padding:0 .3em;border-radius:4px;white-space:nowrap}
.edbox{position:absolute;border:3px dashed #ffd166;background:rgba(255,209,102,.15);z-index:6;pointer-events:none}
.confirmbox{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:1em}
.confirmbox .cb{background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:1em 1.2em;max-width:520px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.confirmbox .cbrow{display:flex;gap:.6em;justify-content:flex-end;flex-wrap:wrap}
.tfcount{animation:digpop .7s cubic-bezier(.3,1.6,.5,1)}

/* Ruhiger Modus: „Animationen aus“ oder Systemeinstellung → nur Überblendungen */
html.ruhig *,html.ruhig *::before,html.ruhig *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-property:opacity,background-color,border-color,color,width !important}
html.ruhig .over,html.ruhig .over.mid,html.ruhig .travel,html.ruhig .flash{animation:fadein .4s ease-out !important}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-property:opacity,background-color,border-color,color,width !important}
  .over,.over.mid,.travel,.flash{animation:fadein .4s ease-out !important}
}
@media (max-width:900px){ .over{width:auto;right:1.2%} }
@media (max-width:700px){ body{font-size:17px} }
</style>
</head>

  <a class="homelink" href="index.html" title="Zur Startseite mit allen Spielen">← Alle Spiele</a>

  <div id="hud" aria-live="polite"></div>

<script>
/* =====================================================================

const E = EINSTELLUNGEN;
const LEVELS = ['A2','B1','B2','C1'];
const LS_GAME = 'zeitmaschine.spiel.v1', LS_ALBUM = 'zeitmaschine.album.v1', LS_SET = 'zeitmaschine.einstellungen.v1';
const TYPEN = ['zahnrad','tabelle','zelle','schmieden','umschreiben','auswahl','luecke','satz'];
const ARTEN = ['aufgabe','zeitfehler','gag','info'];
const PERSONEN = ['ich','du','er/sie/es','wir','ihr','sie/Sie'];
const KINDER = ['👧🏽','👦🏻','🧒🏽'];
const INPUT_ATTR = 'type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';

const app = document.getElementById('app');
let state=null, view='start', ui={}, settings={ sound:false, anim:true };
const optOrder={};

/* ---------- Speicher ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }
function save(){ if(state) lsSet(LS_GAME, JSON.stringify(state)); }
function saveSettings(){ lsSet(LS_SET, JSON.stringify(settings)); }

/* ---------- Hilfen ---------- */
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function plain(s){ return String(s==null?'':s).replace(/\*\*/g,''); }
function paras(s){ return String(s||'').split(/\n\s*\n/).map(p => '<p>'+fmt(p)+'</p>').join(''); }
function asList(x){ return x==null ? [] : (Array.isArray(x) ? x : [x]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function range(n){ return Array.from({length:n},(_,i)=>i); }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
function focusEl(sel){ const el = sel ? (typeof sel==='string'?$(sel):sel) : null; (el||app).focus({preventScroll:true}); }
let toastT=null;
function toast(msg, ms){ const t=$('#toast'); t.innerHTML=fmt(msg); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, ms||3000); }
function spanish(){ return state && E.spanischeHilfe[state.level]; }
function pos(r){ return 'left:'+(r[0]/10)+'%;top:'+(r[1]/5.6)+'%;width:'+(r[2]/10)+'%;height:'+(r[3]/5.6)+'%'; }
function ruhig(){ return !settings.anim || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

/* ---------- Eingebettet (z. B. Google Sites) ---------- */
const EINGEBETTET = (()=>{ try { return window.self!==window.top; } catch(e){ return true; } })();
if(EINGEBETTET) document.documentElement.classList.add('eingebettet');
function bestaetigen(msg, ok){
  const d=document.createElement('div'); d.className='confirmbox'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="cb"><p></p><div class="cbrow"><button type="button" class="cbno">Abbrechen</button><button type="button" class="primary cbyes">Ja</button></div></div>';
  d.querySelector('p').textContent=msg; document.body.appendChild(d);
  const close=()=>d.remove();
  d.querySelector('.cbno').addEventListener('click',close);
  d.querySelector('.cbyes').addEventListener('click',()=>{ close(); ok(); });
  d.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } });
  d.querySelector('.cbno').focus();
}

/* ---------- Antworten vergleichen (ae/oe/ue/ss werden akzeptiert) ---------- */
function canon(s){
  return String(s==null?'':s).normalize('NFC').toLowerCase().replace(/[„“”‟"«»‚‘’']/g,' ').replace(/[.,!?;:…–-]/g,' ')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}
function matches(val, list){ const c=canon(val); return c!=='' && asList(list).some(l=>canon(l)===c); }

/* ---------- Verben ---------- */
const VERB={}; VERBEN.forEach(v=>{ if(v && v.inf) VERB[v.inf]=v; });
function sammelbar(inf){ const v=VERB[inf]; return !!v && v.art!=='regelmäßig'; }
function sammelVerben(){
  const set=new Set();
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(!S) return;
    asList(S.raeume).concat(S.bonus?[S.bonus]:[]).forEach(R=>asList(R.gegenstaende).forEach(O=>asList(O.aufgaben).forEach(a=>{ if(a.typ==='schmieden' && sammelbar(a.verb)) set.add(a.verb); }))); });
  return VERBEN.filter(v=>set.has(v.inf));
}

/* ---------- Album (bleibt über alle Spiele erhalten) ---------- */
function loadAlbum(){ try{ const a=JSON.parse(lsGet(LS_ALBUM)||'null'); if(a && a.v===1 && a.karten && typeof a.karten==='object') return a; }catch(e){} return { v:1, karten:{} }; }
function saveAlbum(a){ lsSet(LS_ALBUM, JSON.stringify(a)); }
function albumAdd(inf){ const a=loadAlbum(); if(a.karten[inf]) return false; a.karten[inf]={ fach:1, seit:new Date().toISOString().slice(0,10), richtig:0 }; saveAlbum(a); return true; }
function albumCount(){ const a=loadAlbum(); return Object.keys(a.karten).filter(k=>VERB[k]).length; }

/* ---------- Daten vorbereiten ---------- */
function normTask(a, id){
  const t=Object.assign({}, a, { id });
  if(t.typ==='zahnrad'){ t.pRing = asList(a.ringe)[0]==='PERSON'; t.ringe=asList(a.ringe).map(r=>r==='PERSON'?PERSONEN.slice():asList(r)); }
  return t;
}
function normRoom(R, r, bonus){
  const objs=asList(R.gegenstaende).map((O,oi)=>({ O, oi, tasks: O.art==='aufgabe' ? asList(O.aufgaben).map((a,i)=>normTask(a,(bonus?'b':r)+'.'+oi+'.'+i)) : [] }));
  const tasks=[]; objs.forEach(o=>o.tasks.forEach((t,i)=>{ t.oi=o.oi; t.k=i; tasks.push(t); }));
  return { R, r, objs, tasks, bonus:!!bonus, lockObjs: objs.filter(o=>o.O.art==='aufgabe' && o.O.ziffer!=null && o.O.ziffer!=='') };
}
const DATA={};
function D(level){ level=level||state.level; if(!DATA[level]){ const S=SPIEL[level]; DATA[level]={ rooms:asList(S.raeume).map((R,r)=>normRoom(R,r,false)), bonus:S.bonus?normRoom(S.bonus,asList(S.raeume).length,true):null }; } return DATA[level]; }
function rooms(level){ return D(level).rooms; }
function allTasks(level){ return rooms(level).reduce((a,x)=>a.concat(x.tasks),[]); }
function signature(level){ const d=D(level); return d.rooms.concat(d.bonus?[d.bonus]:[]).map(x=>x.objs.map(o=>o.tasks.map(t=>t.typ.slice(0,2)).join('')).join(',')).join('|'); }
function zfTotal(level){ return rooms(level).reduce((n,x)=>n+x.objs.filter(o=>o.O.art==='zeitfehler').length,0); }
function L(){ return SPIEL[state.level]; }

/* ---------- Daten prüfen ---------- */
function forgeWords(b){ let words=['']; asList(b).forEach(seg=>{ const opts=Array.isArray(seg)?seg:[seg]; const n=[]; words.forEach(w=>opts.forEach(o=>n.push(w+o))); words=n; }); return words; }
function checkTask(a, tw, w){
  if(!a || !TYPEN.includes(a.typ)){ w.push(tw+'unbekannter typ „'+(a&&a.typ)+'“.'); return; }
  if(!a.erklaerung_de) w.push(tw+'erklaerung_de fehlt.');
  const gap = s => { if(!String(s||'').includes('___')) w.push(tw+'satz braucht ___ als Lücke.'); };
  if(a.typ==='zahnrad'){
    const ringe=asList(a.ringe).map(r=>r==='PERSON'?PERSONEN:asList(r)), l=asList(a.loesung);
    gap(a.satz);
    if(ringe.length<2) w.push(tw+'Es braucht mindestens zwei Ringe.');
    if(l.length!==ringe.length) w.push(tw+'loesung braucht genau einen Wert pro Ring.');
    else l.forEach((v,i)=>{ if(!ringe[i].includes(v)) w.push(tw+'„'+v+'“ steht nicht in Ring '+(i+1)+'.'); });
  }
  if(a.typ==='tabelle'){
    const z=a.zellen||{}, l=a.loesung||{}, gaps=Object.keys(z).filter(k=>z[k]==='?');
    if(!gaps.length) w.push(tw+'Die Tabelle hat keine Lücke ("?").');
    gaps.forEach(k=>{ if(!asList(l[k]).length) w.push(tw+'loesung für „'+k+'“ fehlt.'); });
    Object.keys(l).forEach(k=>{ if(z[k]!=='?') w.push(tw+'„'+k+'“ hat eine Lösung, aber in zellen steht kein "?".'); });
  }
  if(a.typ==='zelle'){
    const o=asList(a.optionen).length?asList(a.optionen):['haben','sein'];
    gap(a.satz); if(!o.includes(a.loesung)) w.push(tw+'loesung steht nicht in den Zellen.'); if(!a.form) w.push(tw+'form fehlt.');
  }
  if(a.typ==='schmieden'){
    if(!['Partizip II','Präteritum'].includes(a.form)) w.push(tw+'form muss "Partizip II" oder "Präteritum" sein.');
    if(!VERB[a.verb]) w.push(tw+'Das Verb „'+a.verb+'“ steht nicht in VERBEN.');
    if(!forgeWords(a.bausteine).includes(a.loesung)) w.push(tw+'Mit diesen bausteinen kann man „'+a.loesung+'“ nicht schmieden.');
    else if(VERB[a.verb]){ const soll=a.form==='Präteritum'?VERB[a.verb].praet:VERB[a.verb].part; if(soll!==a.loesung) w.push(tw+'loesung „'+a.loesung+'“ passt nicht zu VERBEN („'+soll+'“).'); }
  }
  if(a.typ==='umschreiben'){ if(!a.satz) w.push(tw+'satz fehlt.'); if(!asList(a.loesung).length) w.push(tw+'loesung fehlt.'); }
  if(a.typ==='auswahl'){ gap(a.satz); if(!asList(a.optionen).includes(a.loesung)) w.push(tw+'loesung steht nicht genau so in optionen.'); }
  if(a.typ==='luecke'){ gap(a.satz); if(!asList(a.loesung).length) w.push(tw+'loesung fehlt.'); }
  if(a.typ==='satz'){ if(!asList(a.loesung).length) w.push(tw+'loesung fehlt.'); }
}
function checkRoom(R, where, w, bonus){
  if(!SCENES[R.szene]) w.push(where+': unbekannte szene „'+R.szene+'“.');
  const ids={};
  asList(R.gegenstaende).forEach((O,i)=>{
    const ow=where+', Gegenstand '+(i+1)+' ('+(O.id||'?')+'): ';
    if(!O.id) w.push(ow+'id fehlt.'); else if(ids[O.id]) w.push(ow+'id kommt doppelt vor.'); ids[O.id]=1;
    if(!ARTEN.includes(O.art)) w.push(ow+'unbekannte art „'+O.art+'“.');
    if(!Array.isArray(O.ort) || O.ort.length!==4 || O.ort.some(n=>typeof n!=='number')) w.push(ow+'ort muss [x, y, Breite, Höhe] sein.');
    if(O.art==='aufgabe'){
      if(!asList(O.aufgaben).length) w.push(ow+'keine aufgaben.');
      if(!bonus && !(Number.isInteger(O.ziffer) && O.ziffer>=0 && O.ziffer<=9)) w.push(ow+'ziffer (0–9) fehlt.');
      asList(O.aufgaben).forEach((a,k)=>checkTask(a, ow+'Aufgabe '+(k+1)+': ', w));
    }
  });
  if(!asList(R.gegenstaende).some(O=>O.art==='aufgabe')) w.push(where+': keine Gegenstände mit Aufgaben.');
}
function dataWarnings(){
  const w=[];
  VERBEN.forEach((v,i)=>{ ['inf','praet','part','hilfs','art'].forEach(f=>{ if(!v[f]) w.push('VERBEN '+(i+1)+' ('+(v.inf||'?')+'): '+f+' fehlt.'); }); if(v.art && !['unregelmäßig','gemischt','regelmäßig'].includes(v.art)) w.push('VERBEN „'+v.inf+'“: unbekannte art.'); });
  LEVELS.forEach(lv=>{ const S=SPIEL[lv]; if(S==null) return;
    if(!Array.isArray(S.raeume)||!S.raeume.length){ w.push(lv+': „raeume“ fehlt.'); return; }
    S.raeume.forEach((R,r)=>checkRoom(R, lv+' · Raum '+(r+1)+' ('+(R.name||'?')+')', w, false));
    if(S.bonus) checkRoom(S.bonus, lv+' · Bonusraum', w, true);
  });
  return w;
}

/* ---------- Prüfcode ---------- */
function cyrb53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level,pct,d,name){ let n=cyrb53(['ZM',level,pct,d,normName(name),E.geheimwort].join('|')); let s=''; for(let i=0;i<5;i++){ s+=B32[n%32]; n=Math.floor(n/32); } return s; }
function makeCode(level,pct,date,name){ const p=n=>String(n).padStart(2,'0'); const d=p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100); return level+'-'+pct+'-'+d+'-'+checksum(level,pct,d,name); }
function verifyCode(code,name){
  const m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)-(\d{1,3})-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: B1-85-131026-K7QFM' };
  return { valid: checksum(m[1],+m[2],m[3],name)===m[4], level:m[1], pct:+m[2], date:m[3].slice(0,2)+'.'+m[3].slice(2,4)+'.20'+m[3].slice(4) };
}

/* ---------- Ton ---------- */
let actx=null;
const SND={ ok:[[660,.12],[880,.2]], bad:[[220,.28]], stutter:[[140,.07],[110,.07],[150,.07],[90,.2]], hammer:[[1500,.03],[750,.07]], cool:[[900,.05],[650,.05],[420,.12]],
  tick:[[520,.03]], open:[[523,.1],[659,.1],[784,.18]], tf:[[1047,.1],[1319,.1],[1568,.25]], card:[[660,.08],[880,.08],[1320,.22]], fanfare:[[523,.15],[659,.15],[784,.15],[1047,.4]], clank:[[200,.05],[160,.12]] };
function sound(n){ if(!settings.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  if(n==='travel'){ const o=actx.createOscillator(), g=actx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(1400,t+2.4); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.08,t+0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+2.8); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+2.9); return; }
  SND[n].forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=n==='stutter'||n==='clank'?'square':'triangle'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(n==='stutter'?0.06:0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.03); t+=d*0.9; }); }catch(e){} }

function gearPath(cx,cy,r,n){
  let d=''; const ri=r*0.78;
  for(let i=0;i<n*2;i++){ const rr=i%2?ri:r, a1=Math.PI*2*i/(n*2), a2=Math.PI*2*(i+1)/(n*2);
    const p=a=>(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1); d+=(i?'L':'M')+p(a1)+' L'+p(a2)+' '; }
  return d+'Z';
}
function gear(cx,cy,r,n,cls,fill){ return '<g class="'+cls+'"><path d="'+gearPath(cx,cy,r,n)+'" fill="'+(fill||'#c8913a')+'" stroke="#5a3a10" stroke-width="2.5"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.32)+'" fill="#5a3a10"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.14)+'" fill="#e8c070"/></g>'; }
function smallGear(){ return '<svg viewBox="-25 -25 50 50" aria-hidden="true"><path d="'+gearPath(0,0,22,10)+'" fill="#c8913a" stroke="#5a3a10" stroke-width="2"/><circle r="7" fill="#5a3a10"/></svg>'; }
function machineSVG(en){

  let ticks=''; for(let i=0;i<12;i++){ const a=i*Math.PI/6; ticks+='<line x1="'+(110+48*Math.sin(a)).toFixed(1)+'" y1="'+(95-48*Math.cos(a)).toFixed(1)+'" x2="'+(110+54*Math.sin(a)).toFixed(1)+'" y2="'+(95-54*Math.cos(a)).toFixed(1)+'" stroke="#5a3a10" stroke-width="3"/>'; }
  return '<svg viewBox="0 0 220 330" aria-hidden="true"><defs>'+
    '<linearGradient id="mbr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe7a0"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#8a5a1a"/></linearGradient>'+
    '<linearGradient id="mwd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a5f2e"/><stop offset="1" stop-color="#5e3517"/></linearGradient></defs>'+
    '<rect x="150" y="14" width="22" height="70" fill="url(#mbr)" stroke="#5a3a10" stroke-width="3"/><rect x="143" y="6" width="36" height="13" rx="3" fill="url(#mbr)" stroke="#5a3a10" stroke-width="3"/>'+
    gear(40,168,30,12,'g1')+gear(184,176,20,9,'g3','#b8823a')+
    '<circle cx="110" cy="95" r="70" fill="url(#mbr)" stroke="#5a3a10" stroke-width="5"/><circle cx="110" cy="95" r="57" fill="#fff6dc" stroke="#8a5a1a" stroke-width="3"/>'+ticks+
    '<line class="hand" x1="110" y1="95" x2="110" y2="52" stroke="#2a1606" stroke-width="5" stroke-linecap="round"/><line x1="110" y1="95" x2="138" y2="104" stroke="#2a1606" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="95" r="7" fill="#2a1606"/>'+
    gear(96,186,22,10,'g2','#e0b050')+
    '<rect x="20" y="200" width="180" height="112" rx="10" fill="url(#mwd)" stroke="#3a2210" stroke-width="4"/>'+
    '<rect x="26" y="206" width="168" height="8" rx="3" fill="#b07a40" opacity=".6"/>'+

    '<rect class="tubefill" x="44" y="'+(292-h)+'" width="26" height="'+h+'" rx="8" fill="#5ff0d8"/>'+
    '<path d="M48 224 v60" stroke="#ffffff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>'+
    [0,1,2].map(i=>'<circle class="lamp" cx="'+(98+i*22)+'" cy="230" r="8" fill="'+(i<lit?'#5ff0d8':'#3a2d22')+'" stroke="#2a1606" stroke-width="2"/>').join('')+
    '<circle cx="176" cy="232" r="11" fill="#d33" stroke="#600" stroke-width="3"/>'+
    '<rect x="90" y="252" width="96" height="44" rx="7" fill="#1d1712" stroke="#d9a441" stroke-width="3"/><text x="138" y="281" text-anchor="middle" font-size="20" font-family="Arial" fill="#d9a441">⚡</text>'+
    '<rect x="26" y="312" width="22" height="14" rx="3" fill="#3a2210"/><rect x="172" y="312" width="22" height="14" rx="3" fill="#3a2210"/>'+
    '<g class="lever"><rect x="203" y="214" width="9" height="62" rx="4" fill="#8a8f96" stroke="#3b4046" stroke-width="2"/><circle cx="207.5" cy="212" r="11" fill="#d33" stroke="#600" stroke-width="3"/></g>'+
    '<rect x="198" y="270" width="20" height="18" rx="4" fill="url(#mbr)" stroke="#5a3a10" stroke-width="2"/>'+
    '</svg>';
}

/* Szenen: svg = Raumbild (1000 × 560), m = Ort der Maschine, figs = Füße der drei Figuren */
function moai(x,y,s){ return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M-16 0 V-40 Q-16 -46 -12 -48 V-78 Q-12 -92 0 -92 Q12 -92 12 -78 V-48 Q16 -46 16 -40 V0 Z" fill="#74665b" stroke="#4a3f38" stroke-width="2"/><path d="M-9 -70 H9" stroke="#4a3f38" stroke-width="4"/><path d="M0 -68 V-56 L-3 -54" stroke="#4a3f38" stroke-width="2.5" fill="none"/><path d="M-6 -50 H6" stroke="#4a3f38" stroke-width="2"/></g>'; }
function waves(y, n, cls, col){ let s=''; for(let k=0;k<n;k++){ let d='M'+(-40)+' '+(y+k*22); for(let x=-40;x<1060;x+=50) d+=' q 12 -7 25 0 t 25 0'; s+='<path class="wave'+(k%2?' w2':'')+(cls?' '+cls:'')+'" d="'+d+'" stroke="'+(col||'#d6efff')+'" stroke-opacity=".55" stroke-width="2.5" fill="none"/>'; } return s; }
function volcano(cx,base,peak,half){ return '<polygon points="'+(cx-half)+','+base+' '+cx+','+peak+' '+(cx+half)+','+base+'" fill="#6b7f99"/><path d="M'+(cx-half*0.32)+' '+(peak+(base-peak)*0.32)+' L'+cx+' '+peak+' L'+(cx+half*0.32)+' '+(peak+(base-peak)*0.32)+' l-14 10 l-12 -8 l-14 12 l-12 -10 l-14 9 l-12 -8 Z" fill="#f4f8ff"/>'; }
function tree(x,y,s,c){ return '<polygon points="'+(x-18*s)+','+y+' '+x+','+(y-70*s)+' '+(x+18*s)+','+y+'" fill="'+(c||'#2f5a35')+'"/><polygon points="'+(x-14*s)+','+(y-30*s)+' '+x+','+(y-90*s)+' '+(x+14*s)+','+(y-30*s)+'" fill="'+(c||'#2f5a35')+'"/>'; }
function house(x,y,w,h,c){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'" stroke="#3a2210" stroke-width="2"/><polygon points="'+(x-6)+','+y+' '+(x+w/2)+','+(y-w*0.55)+' '+(x+w+6)+','+y+'" fill="#7a3a22" stroke="#3a2210" stroke-width="2"/><rect x="'+(x+w*0.18)+'" y="'+(y+h*0.25)+'" width="'+(w*0.22)+'" height="'+(h*0.25)+'" fill="#fff8d8" stroke="#fff" stroke-width="2"/><rect x="'+(x+w*0.6)+'" y="'+(y+h*0.25)+'" width="'+(w*0.22)+'" height="'+(h*0.25)+'" fill="#fff8d8" stroke="#fff" stroke-width="2"/><rect x="'+(x+w*0.4)+'" y="'+(y+h*0.62)+'" width="'+(w*0.2)+'" height="'+(h*0.38)+'" fill="#5a3218"/>'; }
function grad(id,a,b,v){ return '<linearGradient id="'+id+'" x1="0" y1="0" x2="'+(v?0:1)+'" y2="'+(v?1:0)+'"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient>'; }

/* =====================================================================
   SPIELABLAUF
   ===================================================================== */
function newGame(level){
  state={ v:1, level, sig:signature(level), room:0, inBonus:false, bonusDone:false, phase:'play', intro:{}, done:{}, tries:{}, tips:{}, tipsUsed:{}, zf:{}, lock:{},
    wrong:[], karten:[], elapsed:0, name:'', finished:null };
  ui={}; save();
}
function loadSaved(){
  let s=null; try{ s=JSON.parse(lsGet(LS_GAME)||'null'); }catch(e){ s=null; }
  if(!s || s.v!==1 || !SPIEL[s.level]) return null;
  try { if(s.sig!==signature(s.level)) return null; } catch(e){ return null; }
  return s;
}
function curRoom(){ const d=D(); return state.inBonus && d.bonus ? d.bonus : d.rooms[state.room]; }
function roomKey(){ return state.inBonus ? 'B' : String(state.room); }
function objDone(o){ return o.tasks.length>0 && o.tasks.every(t=>state.done[t.id]); }
function energy(X){ X=X||curRoom(); if(!X.tasks.length) return 1; return X.tasks.filter(t=>state.done[t.id]).length/X.tasks.length; }
function zfCount(){ return Object.keys(state.zf).length; }
function stats(){
  const all=allTasks(state.level); let score=0, ok=0, bonus=0;
  all.forEach(t=>{ const r=state.done[t.id]; if(r){ score+=r.pts; if(r.ok) ok++; } });
  const B=D().bonus; if(B) B.tasks.forEach(t=>{ const r=state.done[t.id]; if(r) bonus+=r.pts; });
  const max=all.length*E.punkteErsterVersuch;
  return { score:score+bonus, bonus, max, pct: max? Math.min(100,Math.round((score+bonus)/max*100)) : 0, total:all.length, ok };
}
function tipsLeft(){ return E.tippsProRaum-(state.tipsUsed[roomKey()]||0); }

/* Versuch: 'ok' | 'retry' | 'fail' */
function attempt(t, ok, given){
  const tries=state.tries[t.id]||0;
  if(ok){
    let pts = tries===0 ? E.punkteErsterVersuch : E.punkteZweiterVersuch;
    if(state.tips[t.id]) pts=Math.max(0, pts-E.tippKosten);
    state.done[t.id]={ ok:true, pts }; sound('ok'); save(); return 'ok';
  }
  state.tries[t.id]=tries+1;
  if(tries+1>=2){
    state.done[t.id]={ ok:false, pts:0 };
    state.wrong.push({ raum:curRoom().R.name, aufgabe:taskLabel(t), deine:given, loesung:solutionText(t) });
    sound('stutter'); save(); return 'fail';
  }
  sound('stutter'); save(); return 'retry';
}
function zahnWort(t, vals){ return vals.slice(t.pRing?1:0).map(v=>v==='–'?'':v).join(''); }
function taskLabel(t){
  switch(t.typ){
    case 'zahnrad': case 'zelle': case 'auswahl': return plain(t.satz);
    case 'luecke': return plain(t.satz)+(t.hinweis?' ('+t.hinweis+')':'');
    case 'tabelle': return t.verb+' – '+t.zeit;
    case 'schmieden': return t.form+' von „'+t.verb+'“';
    case 'umschreiben': return plain(t.satz)+' → '+t.nach;
    case 'satz': return plain(t.auftrag)+(t.woerter?' ('+plain(t.woerter)+')':'');
  }
  return '';
}
function solutionText(t){
  switch(t.typ){
    case 'zahnrad': return plain(t.satz).replace('___', zahnWort(t, t.loesung))+(t.pRing?' ('+t.loesung[0]+')':'');
    case 'tabelle': return Object.keys(t.loesung).map(k=>k+' '+asList(t.loesung[k])[0]).join(' · ');
    case 'zelle': return plain(t.satz).replace('___', t.form)+' ('+t.loesung+')';
    case 'schmieden': return t.loesung;
    case 'auswahl': return plain(t.satz).replace('___', t.loesung);
    case 'luecke': return plain(t.satz).replace('___', asList(t.loesung)[0]);
    default: return asList(t.loesung)[0];
  }
}

/* ---------- Kopfzeile ---------- */

/* ---------- Haupt-Render ---------- */
function render(){
  closeTravel(true);

}

    $$('.vcard',el).forEach(c=>c.addEventListener('click',()=>c.classList.toggle('flip')));
    if(res) return;
    const strike=(i)=>{ const s=B[i]; ui.sel[i]=(ui.sel[i]+1)%s.length; const b=$('.block[data-i="'+i+'"]',el), cur=s[ui.sel[i]];
      b.textContent=cur===''?'·':cur; b.classList.toggle('empty',cur===''); b.setAttribute('aria-label','glühender Baustein: '+(cur===''?'leer':cur)+'. Klick zum Schmieden.');
      b.classList.remove('strike'); void b.offsetWidth; b.classList.add('strike');

        else if(e.key==='ArrowRight'){ e.preventDefault(); (hots[k+1]||$('#btnCheck',el)).focus(); } else if(e.key==='ArrowLeft'){ e.preventDefault(); if(hots[k-1]) hots[k-1].focus(); } }); });
    const check=()=>{

      if(out==='retry'){ const f=$('.block.heiss',el); if(f) f.focus({preventScroll:true}); } };
    $('#btnCheck',el).addEventListener('click',check);

  },

  /* Satz umformen */
  umschreiben(t, el, onNext){

        return '<button type="button" class="opt'+(w?' wrong':'')+(r?' right':'')+'" data-o="'+esc(o)+'"'+(res||w?' disabled':'')+'>'+esc(o)+'</button>'; }).join('')+'</div>';
    if(!res) h+='<div class="row" style="margin-top:.5em">'+tipHTML(t)+'</div>';
    h+=feedbackHTML(t)+(res?nextBtn():'');

    $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{ const o=b.dataset.o, ok=o===t.loesung, out=attempt(t,ok,o); if(!ok) ui.wrongs.push(o); ui.fb={ type:out, msg:'' }; afterAnswer(t,out,el,rerender); if(out==='retry'){ const n=$('.opt:not([disabled])',el); if(n) n.focus({preventScroll:true}); } }));
    if(!ui.focused){ ui.focused=true; const f=$('.opt',el); if(f) f.focus({preventScroll:true}); }
  },

  /* Lücke mit Texteingabe */
  luecke(t, el, onNext){

    const inp='<input '+INPUT_ATTR+' id="ans" style="width:9em" aria-label="Lücke" value="'+esc(res&&!res.ok?asList(t.loesung)[0]:(ui.val||''))+'" class="'+(res&&res.ok?'lit':'')+'"'+(res?' readonly':'')+'>';

  /* ganzen Satz schreiben */
  satz(t, el, onNext){
    const res=state.done[t.id], rerender=()=>T.satz(t,el,onNext);

function textCheck(t, el, rerender){
  const inp=$('#ans',el);
  inp.addEventListener('input',()=>{ ui.val=inp.value; });
  const check=()=>{ const v=inp.value.trim(); if(!v){ toast('Schreib zuerst etwas.'); inp.focus(); return; }
    ui.val=v; const ok=matches(v, t.loesung), out=attempt(t,ok,v); ui.fb={ type:out, msg: out==='retry'?'„'+v+'“ stimmt noch nicht.':'' };
    afterAnswer(t,out,el,rerender); if(out==='retry'){ const i=$('#ans',el); if(i){ i.focus(); i.select(); } } };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
  bindUmlauts(el, ()=>$('#ans',el));
  $('#btnCheck',el).addEventListener('click',check);
  if(!ui.focused){ ui.focused=true; inp.focus({preventScroll:true}); }
}
function solveSel(B, word){
  const go=(i,acc,sel)=>{ if(i===B.length) return acc===word?sel:null; const s=B[i];
    if(!Array.isArray(s)) return word.startsWith(acc+s)?go(i+1,acc+s,sel.concat([0])):null;
    for(let k=0;k<s.length;k++){ if(word.startsWith(acc+s[k])){ const r=go(i+1,acc+s[k],sel.concat([k])); if(r) return r; } } return null; };
  return go(0,'',[]);
}
function karteHTML(t){
  const v=VERB[t.verb]; if(!v) return '';
  if(!sammelbar(t.verb)) return '<p class="small muted">„'+esc(v.inf)+'“ ist regelmäßig – dafür gibt es keine Sammelkarte.</p>';
  const neu=albumAdd(t.verb); if(neu) state.karten=asList(state.karten).concat([t.verb]); save();
  return '<div class="cardrow">'+vcardHTML(v, loadAlbum().karten[v.inf], neu?'newcard':'')+'<p><strong>'+(neu?'🃏 Neue Sammelkarte für dein Album!':'🃏 Diese Karte hast du schon im Album.')+'</strong><br><span class="small">Klick auf die Karte, dann dreht sie sich um.</span></p></div>';
}

/* ---------- Ziehen der Energiezellen (Maus, Touchpad, Touch) ---------- */
let dragState=null;
function startDrag(e, btn, onDrop){
  if(btn.disabled || e.button>0) return;
  dragState={ btn, onDrop, x:e.clientX, y:e.clientY, moved:false, ghost:null, id:e.pointerId };
  btn.setPointerCapture && btn.setPointerCapture(e.pointerId);
  btn.addEventListener('pointermove',dragMove); btn.addEventListener('pointerup',dragEnd); btn.addEventListener('pointercancel',dragCancel);
}
function dropAt(x,y){ const el=document.elementFromPoint(x,y); if(el && el.closest('.dropzone')) return el.closest('.dropzone'); const p=$('#stage .mport'); if(p){ const r=p.getBoundingClientRect(); if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return p; } return null; }
function dragMove(e){
  const d=dragState; if(!d) return;
  if(!d.moved && Math.hypot(e.clientX-d.x,e.clientY-d.y)>6){ d.moved=true; d.ghost=d.btn.cloneNode(true); d.ghost.classList.add('cellghost'); document.body.appendChild(d.ghost); }
  if(d.moved){ d.ghost.style.left=e.clientX+'px'; d.ghost.style.top=e.clientY+'px'; $$('.dropzone.hover').forEach(z=>z.classList.remove('hover')); const z=dropAt(e.clientX,e.clientY); if(z) z.classList.add('hover'); }
}
function dragEnd(e){
  const d=dragState; if(!d) return;
  const z=d.moved ? dropAt(e.clientX,e.clientY) : null;
  const v=d.btn.dataset.v, cb=d.onDrop, moved=d.moved;
  stopDrag(); if(moved){ dragState={ moved:true }; setTimeout(()=>{ if(dragState && !dragState.btn) dragState=null; },50); }
  if(z) cb(v);
}
function dragCancel(){ stopDrag(); }
function stopDrag(){ const d=dragState; if(!d) return; if(d.btn){ d.btn.removeEventListener('pointermove',dragMove); d.btn.removeEventListener('pointerup',dragEnd); d.btn.removeEventListener('pointercancel',dragCancel); } if(d.ghost) d.ghost.remove(); $$('.dropzone.hover').forEach(z=>z.classList.remove('hover')); dragState=null; }

let sch=null;
function renderSchmiede(){
  view='schmiede';

    '<p class="row"><label for="sPa" style="min-width:12em">Partizip II:</label><input '+INPUT_ATTR+' id="sPa" value="'+esc(sch.pa||'')+'"'+(r?' readonly':'')+'></p>'+
    '<div class="row"><span style="min-width:12em">Perfekt mit:</span><div class="cells" style="margin:0">'+hb('haben')+hb('sein')+'</div></div>'+
    (r?'':umlautBar()+'<div class="row" style="margin-top:.5em"><button type="button" class="primary" id="sCheck">🔨 Schmieden!</button></div>')+

}

  h += state.wrong.length ? '<ol class="wronglist">'+state.wrong.map(w=>'<li><span class="muted small">'+esc(w.raum)+'</span><br>'+esc(w.aufgabe)+'<br><span class="badline">✗ Deine Antwort: '+esc(w.deine)+'</span><br><span class="okline">✓ Richtig: '+esc(w.loesung)+'</span></li>').join('')+'</ol>' : '<p class="okline">✓ Keine Fehler – super!</p>';
  app.innerHTML=h+'</section>';
  $('#btnCopy').addEventListener('click',()=>copyText(resultText(code,s,d)));
  $('#btnAlb').addEventListener('click',()=>{ view='album'; render(); });
  $('#btnNew').addEventListener('click',()=>bestaetigen('Neues Spiel starten? Dieses Ergebnis wird gelöscht (dein Album bleibt). Hast du schon einen Screenshot gemacht?', ()=>{ lsDel(LS_GAME); state=null; view='start'; render(); }));
  focusEl('#btnCopy');
}
function resultText(code,s,d){
  let t='Die Zeitmaschine von Frutillar – Verben-Escape-Room\nName: '+state.name+'\nNiveau: '+state.level+' – '+L().titel+
    '\nPunkte: '+s.score+' / '+s.max+' ('+s.pct+' %)'+(s.bonus?' – davon '+s.bonus+' Bonus':'')+'\nZeit: '+fmtTime(state.elapsed)+' min\nDatum: '+fmtDate(d)+'\nZeitfehler: '+zfCount()+' von '+zfTotal()+'\nPrüfcode: '+code+'\n';
  t+='\nFalsch beantwortet ('+state.wrong.length+'):\n'+(state.wrong.length?state.wrong.map((w,i)=>(i+1)+'. '+w.aufgabe+'\n   Meine Antwort: '+w.deine+'\n   Richtig: '+w.loesung).join('\n'):'–');
  return t;
}
function copyText(t){
  const done=()=>{ $('#copyFb').textContent='✓ Kopiert! Jetzt in Google Classroom einfügen (Strg + V).'; };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('#copyFb').textContent='Kopieren hat nicht geklappt – bitte Screenshot machen.'; } ta.remove(); };
  let settled=false; const once=f=>()=>{ if(!settled){ settled=true; f(); } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(once(done),once(fallback)); setTimeout(once(fallback),800); } else once(fallback)(); }catch(e){ once(fallback)(); }
}

/* ---------- Lehrkraft ---------- */
function backToGame(){ history.replaceState(null,'',location.pathname+location.search); render(); }
function renderTeacher(){
  app.innerHTML='<section class="card narrow"><h1>🔎 Prüfcode kontrollieren</h1><p class="muted">Für Lehrkräfte. Name so eingeben, wie er im Ergebnis steht (Groß-/Kleinschreibung, Akzente und Leerzeichen sind egal).</p>'+
    '<p><label for="tName">Name</label><br><input '+INPUT_ATTR+' id="tName" class="fullin"></p><p><label for="tCode">Prüfcode</label><br><input '+INPUT_ATTR+' id="tCode" class="fullin" placeholder="z. B. B1-85-131026-K7QFM"></p>'+
    '<div class="row"><button type="button" class="primary" id="tCheck">Prüfen</button><span class="spacer"></span><button type="button" id="tBack">← Zurück zum Spiel</button></div><div id="tRes" role="status" aria-live="polite" style="margin-top:.8em"></div></section>'+
    '<section class="card narrow"><h2>ℹ️ Gut zu wissen</h2><ul>'+
    '<li><strong>Punkte:</strong> 10 beim 1. Versuch, 5 beim 2. Versuch; ein Tipp kostet 3 Punkte (höchstens 3 Tipps pro Raum).</li>'+
    '<li><strong>Zeitfehler</strong> 🕰️ (ein Anachronismus pro Raum) zählen nicht für die Punkte. Wer alle findet, darf in den <strong>Bonusraum</strong>: Die Bonuspunkte kommen dazu, senken den Prozentwert aber nie.</li>'+
    '<li><strong>Album und Schmiede</strong> werden im Browser des Geräts gespeichert (nicht im Prüfcode). Auf einem anderen Chromebook ist das Album leer.</li>'+
    '<li><strong>Gegenstände verschieben:</strong> <a href="#editor">Bearbeitungsmodus</a></li></ul></section>';
  const go=()=>{ const r=verifyCode($('#tCode').value,$('#tName').value);
    $('#tRes').innerHTML = r.valid ? '<p class="tipbox ok"><strong>✓ Der Code ist gültig.</strong><br>Niveau <strong>'+r.level+'</strong> · <strong>'+r.pct+' %</strong> · '+r.date+'</p>'
      : '<p class="tipbox bad"><strong>✗ Der Code ist nicht gültig.</strong><br>'+esc(r.reason||'Name oder Code passen nicht zusammen.')+'</p>'; };
  $('#tCheck').addEventListener('click',go); ['#tName','#tCode'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
  $('#tBack').addEventListener('click',backToGame);
  focusEl('#tName');
}
function renderEditor(){
  const lv = (renderEditor.lv && SPIEL[renderEditor.lv]) ? renderEditor.lv : LEVELS.find(l=>SPIEL[l]);
  const S=SPIEL[lv], list=asList(S.raeume).concat(S.bonus?[S.bonus]:[]);
  const ri = Math.min(renderEditor.ri||0, list.length-1), Rm=list[ri], Sc=SCENES[Rm.szene]||SCENES.dachboden;
  app.innerHTML='<section><h1>🛠️ Bearbeitungsmodus</h1><p class="muted">Ziehe mit der Maus einen Rahmen um die Stelle, an der ein Gegenstand liegen soll. Unten erscheint die Zeile <code>ort: […]</code> zum Kopieren. Grüne Rahmen = vorhandene Gegenstände, gelb = Zeitmaschine.</p>'+
    '<div class="row" style="margin-bottom:.5em"><label>Niveau <select id="edLv">'+LEVELS.filter(l=>SPIEL[l]).map(l=>'<option'+(l===lv?' selected':'')+'>'+l+'</option>').join('')+'</select></label>'+
    '<label>Raum <select id="edRm">'+list.map((x,i)=>'<option value="'+i+'"'+(i===ri?' selected':'')+'>'+(i<asList(S.raeume).length?(i+1):'Bonus')+' – '+esc(x.name)+'</option>').join('')+'</select></label><span class="spacer"></span><button type="button" id="edBack">← Zurück zum Spiel</button></div>'+
    '<div class="stage" id="edStage" style="cursor:crosshair;touch-action:none"><svg class="bg" viewBox="0 0 1000 560" style="position:absolute;inset:0;width:100%;height:100%">'+Sc.svg()+'</svg>'+
    '<div class="machine" style="'+pos(Sc.m)+'">'+machineSVG(.5)+'</div>'+
    asList(Rm.gegenstaende).map(o=>'<div class="edold" style="'+pos(o.ort)+';display:flex;align-items:center;justify-content:center;font-size:'+(Math.min(o.ort[2],o.ort[3])*0.075).toFixed(2)+'cqw"><span>'+esc(o.id)+' ('+esc(o.art)+')</span>'+(o.symbol||'')+'</div>').join('')+
    '<div class="edold" style="'+pos(Sc.m)+';border-color:#ffd166"><span>Zeitmaschine</span></div></div>'+
    '<pre class="code" id="edOut">Noch kein Rahmen gezogen.</pre><button type="button" id="edCopy">📋 Zeile kopieren</button>'+
    '<p class="small muted">Als <code>symbol</code> kann jedes Emoji stehen (z. B. "🧳"). Ist der Gegenstand schon im Raumbild gezeichnet, schreiben Sie <code>symbol:""</code> und für das Zeitschloss <code>schloss:"🏠"</code>.</p></section>';
  $('#edLv').addEventListener('change',e=>{ renderEditor.lv=e.target.value; renderEditor.ri=0; renderEditor(); });
  $('#edRm').addEventListener('change',e=>{ renderEditor.ri=+e.target.value; renderEditor(); });
  $('#edBack').addEventListener('click',backToGame);
  const st=$('#edStage'); let start=null, box=null;
  const toU=e=>{ const r=st.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*1000), Math.round((e.clientY-r.top)/r.height*560)]; };
  st.addEventListener('pointerdown',e=>{ start=toU(e); if(box) box.remove(); box=document.createElement('div'); box.className='edbox'; st.appendChild(box); st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove',e=>{ if(!start) return; const p=toU(e); const r=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.abs(p[0]-start[0]),Math.abs(p[1]-start[1])]; box.style.cssText=pos(r); box.dataset.r=JSON.stringify(r); });
  st.addEventListener('pointerup',()=>{ if(!start) return; start=null; if(box && box.dataset.r){ const r=JSON.parse(box.dataset.r); $('#edOut').textContent='ort: ['+r.join(', ')+'],'; } });
  $('#edCopy').addEventListener('click',()=>{ const t=$('#edOut').textContent; try{ navigator.clipboard.writeText(t); }catch(e){} toast('📋 Kopiert: '+t); });
}

/* ---------- Uhr ---------- */
setInterval(()=>{
  if(!state || view!=='game' || state.phase!=='play' || document.hidden || location.hash) return;
  state.elapsed+=1000;
  const c=$('#clock'); if(c) c.textContent='⏱ '+fmtTime(state.elapsed);
  if(state.elapsed%5000===0) save();
},1000);

/* ---------- Start ---------- */
(function init(){
  try{ const s=JSON.parse(lsGet(LS_SET)||'{}'); if(s.sound) settings.sound=true; if(s.anim===false) settings.anim=false; }catch(e){}
  const sb=$('#btnSound'), ab=$('#btnAnim');
  const upd=()=>{ sb.textContent=settings.sound?'🔊 Ton an':'🔇 Ton aus'; sb.setAttribute('aria-pressed',String(settings.sound));
    ab.textContent=settings.anim?'🎞 Animationen an':'🎞 Animationen aus'; ab.setAttribute('aria-pressed',String(!settings.anim)); document.documentElement.classList.toggle('ruhig',!settings.anim); };
  upd();
  sb.addEventListener('click',()=>{ settings.sound=!settings.sound; saveSettings(); upd(); sound('ok'); });
  ab.addEventListener('click',()=>{ settings.anim=!settings.anim; saveSettings(); upd(); toast(settings.anim?'🎞 Animationen sind wieder an.':'🎞 Animationen sind aus – nur noch sanfte Überblendungen.'); });
  $('#btnMenu').addEventListener('click',()=>{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); closeTravel(true); view='start'; state=null; ui={}; render(); });
  window.addEventListener('hashchange',()=>{ if(!location.hash && view==='game' && !state) view='start'; render(); });
  render();
})();
</script>
</body>
