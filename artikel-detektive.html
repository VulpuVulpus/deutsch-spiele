<style>
:root{
  --bg:#0b1626; --panel:#14243b; --panel2:#1c3150; --line:#3b5a85;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,#1b2f52 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#2a1d3d 0%,transparent 50%);background-attachment:fixed;color:var(--text);font-family:Roboto,Arial,"Segoe UI",system-ui,sans-serif;font-size:20px;line-height:1.45;min-height:100vh}

function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }

/* ---------- Antworten vergleichen ---------- */
function canon(s){
  return String(s==null?'':s).normalize('NFC').replace(/[„“”‟"«»‚‘’']/g,' ').replace(/[.,!?;:…]/g,' ')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss')
    .replace(/\s+/g,' ').trim();
}
function lowFirst(s){ return s.charAt(0).toLowerCase()+s.slice(1); }
function compare(input, solutions, atStart){
  const a = canon(input); if(!a) return { empty:true };
  const sols = asList(solutions);
  for(const sol of sols){ const b=canon(sol); if(a===b || (atStart!==false && lowFirst(a)===lowFirst(b))) return { ok:true, match:sol, note:(String(sol).includes(',') && !String(input).includes(',')) ? 'Denk an das Komma: „'+sol+'“.' : '' }; }
  for(const sol of sols){ if(a.toLowerCase()===canon(sol).toLowerCase()) return { ok:true, match:sol, note:'Achte auf die Groß- und Kleinschreibung: „'+sol+'“.' }; }
  return { ok:false };
}

/* ---------- Prüfcode ---------- */
function cyrb53(str){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); }
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normName(n){ return String(n||'').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function checksum(level,ch,pct,d,name){ let n=cyrb53([level,ch?'C':'N',pct,d,normName(name),E.geheimwort].join('|')); let o=''; for(let i=0;i<5;i++){ o+=B32[n%32]; n=Math.floor(n/32); } return o; }
function makeCode(level,ch,pct,date,name){ const p=n=>String(n).padStart(2,'0'); const d=p(date.getDate())+p(date.getMonth()+1)+p(date.getFullYear()%100); return level+(ch?'C':'')+'-'+pct+'-'+d+'-'+checksum(level,ch,pct,d,name); }
function verifyCode(code,name){
  const m=String(code||'').toUpperCase().replace(/\s+/g,'').match(/^(A2|B1|B2|C1)(C?)-(\d{1,3})-(\d{6})-([A-Z0-9]{5})$/);
  if(!m) return { valid:false, reason:'Das Format stimmt nicht. Beispiel: A2-75-081026-K7QFM' };
  return { valid: checksum(m[1],!!m[2],+m[3],m[4],name)===m[5], level:m[1], challenge:!!m[2], pct:+m[3], date:m[4].slice(0,2)+'.'+m[4].slice(2,4)+'.20'+m[4].slice(4) };
}

const OL = 'stroke="#3b2a1e" stroke-width="4"';
function stripes(x0,x1,y0,y1,step,w,col){ let s=''; for(let x=x0;x<x1;x+=step) s+='<rect x="'+x+'" y="'+y0+'" width="'+w+'" height="'+(y1-y0)+'" fill="'+col+'"/>'; return s; }
function planks(y0,y1,step,col){ let s=''; for(let y=y0+step;y<y1;y+=step) s+='<line x1="0" y1="'+y+'" x2="1000" y2="'+y+'" stroke="'+col+'" stroke-width="3"/>'; return s; }
function doorFrame(r, inner){ return '<rect x="'+(r[0]-12)+'" y="'+(r[1]-12)+'" width="'+(r[2]+24)+'" height="'+(r[3]+12)+'" fill="#5a3a22" '+OL+'/><rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+(inner||'#1b120b')+'"/>'; }
function volcanoWindow(x,y,w,h){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#9fd3f5"/>'+
    '<path d="M'+(x)+' '+(y+h*0.82)+' L'+(x+w*0.3)+' '+(y+h*0.8)+' L'+(x+w*0.55)+' '+(y+h*0.3)+' L'+(x+w*0.8)+' '+(y+h*0.8)+' L'+(x+w)+' '+(y+h*0.82)+' L'+(x+w)+' '+(y+h)+' L'+x+' '+(y+h)+' Z" fill="#7f8c8d"/>'+
    '<path d="M'+(x+w*0.47)+' '+(y+h*0.45)+' L'+(x+w*0.55)+' '+(y+h*0.3)+' L'+(x+w*0.63)+' '+(y+h*0.45)+' Q'+(x+w*0.55)+' '+(y+h*0.5)+' '+(x+w*0.47)+' '+(y+h*0.45)+' Z" fill="#fff"/>'+
    '<rect x="'+x+'" y="'+(y+h*0.82)+'" width="'+w+'" height="'+(h*0.18)+'" fill="#2e86c1"/>'+
    '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="#f8f4ec" stroke-width="12"/>'+

    '<rect x="'+(x-6)+'" y="'+(y-6)+'" width="'+(w+12)+'" height="'+(h+12)+'" fill="none" '+OL+'/>';
}
function prng(seed){ let x=seed||1; return () => { x=(x*16807)%2147483647; return x/2147483647; }; }
function stars(n,x,y,w,h,seed){ const r=prng(seed); let s=''; for(let i=0;i<n;i++) s+='<circle cx="'+Math.round(x+r()*w)+'" cy="'+Math.round(y+r()*h)+'" r="'+(1+r()*1.6).toFixed(1)+'" fill="#fff" opacity="'+(0.5+r()*0.5).toFixed(2)+'"/>'; return s; }
function checker(y0,y1,w,h,a,b){ let s=''; for(let y=y0;y<y1;y+=h) for(let x=0;x<1000;x+=w) s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+((((x/w)+((y-y0)/h))%2)?b:a)+'"/>'; return s; }
function winFrame(x,y,w,h){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="#f8f4ec" stroke-width="12"/><rect x="'+(x-6)+'" y="'+(y-6)+'" width="'+(w+12)+'" height="'+(h+12)+'" fill="none" '+OL+'/>'; }
/* Regen am Fenster (animiert) */
function rainWin(x,y,w,h,id){
  const r=prng(x+y); let drops='';
  for(let i=0;i<Math.round(w*h/900);i++){ const px=x+r()*(w+40), py=y-70+r()*(h+70); drops+='<line x1="'+px.toFixed(0)+'" y1="'+py.toFixed(0)+'" x2="'+(px-6).toFixed(0)+'" y2="'+(py+18).toFixed(0)+'" stroke="#aed6f1" stroke-width="2" opacity=".7"/>'; }

}

function snowWin(x,y,w,h,id){

   ===================================================================== */
const TYPEN = ['auswahl','karten','luecke','satz','ordnen','fehler'];
const FEHLER_RX = /\[([^|\]]+)\|([^\]]+)\]/g;
function validate(){
  const errs = [];
  LEVELS.forEach(lv => {
    (SPIEL[lv].raeume||[]).forEach((R,ri) => {
      const W = lv+', Raum '+(ri+1)+' („'+R.name+'“)';
      if(!SCENES[R.szene]) errs.push(W+': Raumbild „'+R.szene+'“ gibt es nicht.');
      const ids = new Set();
      (R.gegenstaende||[]).forEach((o,oi) => {
        const w = W+', Gegenstand '+(oi+1)+' („'+(o.id||'?')+'“): ';
        if(!o.id) errs.push(w+'id fehlt.'); else if(ids.has(o.id)) errs.push(w+'id doppelt.'); ids.add(o.id);
        if(!['aufgabe','witz','falle'].includes(o.art)) errs.push(w+'art muss "aufgabe", "witz" oder "falle" sein.');
        if(!Array.isArray(o.ort) || o.ort.length!==4) errs.push(w+'ort braucht vier Zahlen [x, y, Breite, Höhe].');
        if(o.art==='aufgabe'){
          if(!o.aufgaben || !o.aufgaben.length) errs.push(w+'keine aufgaben.');
          (o.aufgaben||[]).forEach((q,qi) => {
            const wq = w+'Aufgabe '+(qi+1)+': ';
            q.niveau = lv; q.raum = ri+1;
            if(!TYPEN.includes(q.typ)){ errs.push(wq+'unbekannter typ „'+q.typ+'“.'); return; }
            if(q.typ!=='fehler' && !q.satz) errs.push(wq+'satz fehlt.');
            if(q.typ==='auswahl'||q.typ==='karten'){
              if(!Array.isArray(q.optionen)||q.optionen.length<2) errs.push(wq+'mindestens zwei optionen nötig.');
              else if(!q.optionen.includes(q.loesung)) errs.push(wq+'loesung „'+q.loesung+'“ steht nicht in den optionen.');
              if(q.typ==='karten' && !String(q.satz).includes('___')) errs.push(wq+'der satz braucht eine Lücke ___.');
            }
            if(q.typ==='luecke' && (String(q.satz).split('___').length-1)!==1) errs.push(wq+'der satz braucht genau eine Lücke ___.');
            if((q.typ==='luecke'||q.typ==='satz') && !q.loesung) errs.push(wq+'loesung fehlt.');
            if(q.typ==='ordnen' && (!Array.isArray(q.woerter)||q.woerter.length<2||!String(q.satz).includes('___'))) errs.push(wq+'ordnen braucht woerter und eine Lücke ___.');
            if(q.typ==='fehler' && (!q.text || (String(q.text).match(FEHLER_RX)||[]).length!==1)) errs.push(wq+'der text braucht genau eine Markierung [falsch|richtig].');
          });
        } else if(!o.text) errs.push(w+'text fehlt.');
      });
      if(!(R.gegenstaende||[]).some(o => o.art==='aufgabe')) errs.push(W+': mindestens ein Gegenstand mit art "aufgabe" nötig.');
    });
  });
  return errs;
}

function signature(lv){ return SPIEL[lv].raeume.map(R => R.gegenstaende.map(o => o.id+':'+(o.aufgaben?o.aufgaben.length:0)).join('|')).join('/'); }
function L(){ return SPIEL[state.level]; }
function R(){ return L().raeume[state.room]; }
function okey(r,o){ return r+'-'+o.id; }
function taskObjs(Rm){ return Rm.gegenstaende.filter(o => o.art==='aufgabe'); }
function totalTasks(lv){ return SPIEL[lv].raeume.reduce((n,Rm) => n + taskObjs(Rm).reduce((m,o) => m+o.aufgaben.length, 0), 0); }
function totalJokes(lv){ return SPIEL[lv].raeume.reduce((n,Rm) => n + Rm.gegenstaende.filter(o => o.art==='witz').length, 0); }
function spanish(){ return !!(E.spanischeHilfe && E.spanischeHilfe[state.level]); }
function limitMs(){ return (E.challengeMinuten[state.level]||30)*60000; }
function solvedCount(r){ return taskObjs(L().raeume[r]).filter(o => state.solved[okey(r,o)]).length; }
function keyReady(){ return solvedCount(state.room) === taskObjs(R()).length; }

function newGame(level, challenge){
  const order = {};
  SPIEL[level].raeume.forEach((Rm,r) => taskObjs(Rm).forEach(o => { order[okey(r,o)] = shuffle(o.aufgaben.map((_,i)=>i)); }));
  state = { v:1, level, challenge:!!challenge, sig:signature(level), phase:'intro', room:0, introSeen:{},
    order, step:{}, att:{}, tipFor:{}, results:{}, solved:{}, jokes:{}, score:0,
    tipsUsed: SPIEL[level].raeume.map(()=>0), wrong:[], elapsed:0, name:'', finished:null, timeout:false };
  save();
}
function loadGame(){
  try{ const s = JSON.parse(lsGet(LS_GAME)||'null'); if(s && s.v===1 && SPIEL[s.level] && s.sig===signature(s.level)) return s; }catch(e){}
  return null;
}

    '<div id="tipBox" class="tipbox" '+(tipShown?'':'hidden')+'>💡 '+fmt(q.tipp||('Denk an: '+(q.thema||'')))+'</div>'+
    '<div id="feedback" class="feedback" role="status" aria-live="polite"></div></div>';
  bindClose();
  T[q.typ].init(q, $('#taskBody'));
  if(state.att[tk]) showTry('Du hast noch einen Versuch. Denk an: **'+(q.thema||'')+'**');
  $('#btnCheck').addEventListener('click', check);
  $('#btnTip').addEventListener('click', useTip);
  dropHandler = (p,t) => ui.onDrop && ui.onDrop(p,t);
  const first = $('#taskBody input, #taskBody button:not(:disabled)'); if(first) first.focus({preventScroll:true});
}
function useTip(){
  const tk = tkey(); if(ui.done || state.tipFor[tk] || state.tipsUsed[current.r] >= E.tippsProRaum) return;
  state.tipsUsed[current.r]++; state.tipFor[tk]=true; state.score -= E.tippKosten; save();
  $('#tipBox').hidden=false; $('#btnTip').disabled=true;
  const tp=$('#tipsPill'); if(tp) tp.textContent='💡 '+(E.tippsProRaum-state.tipsUsed[current.r])+'/'+E.tippsProRaum+' Tipps';
  renderHUD();
}
function showTry(msg){ const fb=$('#feedback'); fb.className='feedback try'; fb.innerHTML='<div class="fb-title">✗ Noch nicht richtig.</div><p style="margin:.2em 0 0">'+fmt(msg)+'</p>'; }
function check(){
  if(ui.done) return;
  const q = ui.q, tk = tkey(), res = T[q.typ].check(q);
  if(res.invalid){ const fb=$('#feedback'); fb.className='feedback'; fb.innerHTML='<p style="margin:0">ℹ️ '+fmt(res.invalid)+'</p>'; return; }
  if(res.ok) return finish(true,res);
  if(!state.att[tk]){
    state.att[tk]=1; save();
    if(T[q.typ].markWrong) T[q.typ].markWrong(q,res);
    $('#attemptInfo').textContent='Versuch 2 von 2';
    showTry((res.msg?res.msg+' ':'')+'Du hast noch einen Versuch. Denk an: **'+(q.thema||'')+'**');
    paper.classList.remove('shake'); void paper.offsetWidth; paper.classList.add('shake');
    sound('bad'); return;
  }
  finish(false,res);
}
function finish(ok, res){
  ui.done = true;
  const q = ui.q, tk = tkey(), o = current.o;
  const pts = ok ? (state.att[tk] ? E.punkteZweiterVersuch : E.punkteErsterVersuch) : 0;
  state.score += pts; state.results[tk] = { p:pts, ok };
  if(!ok) state.wrong.push({ raum:R().name+' · '+(o.name||o.id), aufgabe:q.typ==='fehler'?plain(String(q.text).replace(FEHLER_RX,'$1')):plain(q.satz), deine:T[q.typ].answer(q)||'–', loesung:solutionText(q), thema:q.thema||'' });
  save();
  if(T[q.typ].reveal) T[q.typ].reveal(q, ok);
  $$('#taskBody input').forEach(i => i.readOnly=true); $$('#taskBody button').forEach(b => b.disabled=true);
  $('#btnCheck').hidden=true; $('#btnTip').disabled=true; $('#attemptInfo').textContent='';
  const fb=$('#feedback'); fb.className='feedback '+(ok?'ok':'bad');
  let h = ok ? '<div class="fb-title">✓ Richtig! +'+pts+' Punkte</div>' : '<div class="fb-title">✗ Leider falsch.</div><p style="margin:.2em 0">Richtig ist: <strong>'+esc(solutionText(q))+'</strong></p>';
  if(res && res.note) h += '<p style="margin:.2em 0">ℹ️ '+esc(res.note)+'</p>';
  if(q.erklaerung_de) h += '<p style="margin:.3em 0">'+fmt(q.erklaerung_de)+'</p>';
  if(spanish() && q.erklaerung_es) h += '<div id="esBox" class="tipbox es" lang="es" hidden>'+fmt(q.erklaerung_es)+'</div>';
  h += '<div class="row" style="margin-top:.3em">'+(spanish()&&q.erklaerung_es?'<button type="button" id="btnES" lang="es" aria-expanded="false">💬 Ayuda en español</button>':'')+'<span class="spacer"></span><button type="button" class="primary" id="btnNext">Weiter ➜</button></div>';
  fb.innerHTML = h;
  const es=$('#btnES'); if(es) es.addEventListener('click', () => { const b=$('#esBox'); b.hidden=!b.hidden; es.setAttribute('aria-expanded', String(!b.hidden)); });
  $('#btnNext').addEventListener('click', nextStep);
  renderHUD(); sound(ok?'ok':'bad');
  $('#btnNext').focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function nextStep(){
  const k = okey(current.r,current.o);
  state.step[k] = (state.step[k]||0)+1;
  if(state.step[k] >= state.order[k].length){ state.solved[k]=true; current.justSolved=true; }
  save(); drawObject();
}
function solutionText(q){
  switch(q.typ){
    case 'auswahl': case 'karten': return String(q.satz).includes('___') ? fillGap(q.satz,q.loesung) : q.loesung;
    case 'luecke': return fillGap(q.satz, asList(q.loesung)[0]);
    case 'satz':   return asList(q.loesung)[0];
    case 'ordnen': return fillGap(q.satz, q.woerter.join(' '));
    case 'fehler': return plain(String(q.text).replace(FEHLER_RX,'$2'));
  }
  return '';
}

/* ---------- Ziehen & Ablegen ---------- */
let drag=null, suppressClick=false, dropHandler=null;
function draggable(el, payload){
  el.addEventListener('pointerdown', e => { if(ui.done || (e.pointerType==='mouse' && e.button!==0)) return; drag={ el, payload, sx:e.clientX, sy:e.clientY, ghost:null }; });
}
function dropAt(x,y){ const t=document.elementFromPoint(x,y); return t ? t.closest('[data-drop]') : null; }
function clearHover(){ $$('.drop-hover').forEach(x => x.classList.remove('drop-hover')); }
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 8) return;
    drag.ghost = drag.el.cloneNode(true); drag.ghost.removeAttribute('id'); drag.ghost.classList.add('ghost');
    document.body.appendChild(drag.ghost); drag.el.style.opacity='.35'; drag.el.style.pointerEvents='none';
  }
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  clearHover(); const dz=dropAt(e.clientX,e.clientY); if(dz) dz.classList.add('drop-hover');
  e.preventDefault();
}, { passive:false });
function endDrag(e, cancel){
  const d=drag; drag=null; if(!d||!d.ghost) return;
  d.ghost.remove(); clearHover(); d.el.style.opacity=''; d.el.style.pointerEvents='';
  suppressClick=true; setTimeout(()=>{ suppressClick=false; }, 60);
  if(cancel) return;
  const dz=dropAt(e.clientX,e.clientY); if(dz && dropHandler) dropHandler(d.payload, dz.dataset.drop);
}
document.addEventListener('pointerup', e => endDrag(e,false));
document.addEventListener('pointercancel', e => endDrag(e,true));

const INPUT_ATTR = 'type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';
function umlautBar(){ return '<div class="umlauts" aria-label="Sonderzeichen">'+['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>'<button type="button" class="uml" data-c="'+c+'" tabindex="-1">'+c+'</button>').join('')+'<span class="small">oder tippe ae, oe, ue, ss</span></div>'; }
function bindInputs(body){
  $$('input[type=text]',body).forEach(inp => { inp.addEventListener('focus',()=>{ ui.lastInput=inp; }); inp.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); check(); } }); });
  ui.lastInput = $('input[type=text]',body);
  $$('.uml',body).forEach(b => { b.addEventListener('mousedown', e=>e.preventDefault()); b.addEventListener('click', () => {
    const inp=ui.lastInput; if(!inp||inp.readOnly) return; const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??inp.value.length;
    inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(en); inp.focus(); inp.setSelectionRange(s+1,s+1); }); });
}
const T = {

    },
    select(i){ ui.sel=i; $$('.opt').forEach((b,j)=>{ b.classList.toggle('sel',j===i); b.setAttribute('aria-checked',String(j===i)); }); const g=$('#gap'); if(g) g.textContent=ui.opts[i]; },
    check(q){ if(ui.sel==null) return { invalid:'Bitte wähle zuerst eine Antwort.' }; return { ok: ui.opts[ui.sel]===q.loesung }; },
    markWrong(){ const b=$$('.opt')[ui.sel]; b.classList.remove('sel'); b.classList.add('mark-bad'); b.disabled=true; ui.lastWrong=ui.sel; ui.sel=null; const g=$('#gap'); if(g) g.innerHTML='&nbsp;'; const n=$$('.opt').find(x=>!x.disabled); if(n) n.focus(); },
    reveal(q){ $$('.opt').forEach((b,i)=>{ b.classList.remove('sel'); if(ui.opts[i]===q.loesung) b.classList.add('mark-ok'); else if(i===ui.sel) b.classList.add('mark-bad'); }); const g=$('#gap'); if(g) g.textContent=q.loesung; },

  karten: {
    init(q, body){

      ui.onDrop = (i, t) => { if(ui.done) return; if(t==='gap') ui.placed=i; else if(t==='pool' && ui.placed===i) ui.placed=null; T.karten.draw(); };

    markWrong(){ ui.bad=(ui.bad||[]).concat([ui.placed]); ui.placed=null; T.karten.draw(); const c=$('.acard:not(:disabled)'); if(c) c.focus(); },
    reveal(q, ok){ const was=ui.placed; ui.placed=ui.opts.indexOf(q.loesung); if(!ok && was!=null) ui.bad=(ui.bad||[]).concat([was]); T.karten.draw(); $('#dgap').classList.add('mark-ok'); },
    answer(){ return ui.placed==null ? (ui.bad&&ui.bad.length? ui.opts[ui.bad[ui.bad.length-1]] : '') : ui.opts[ui.placed]; }

  luecke: {

    check(q){ const v=$('#ans').value; ui.ans=v; const before=String(q.satz).split('___')[0].trim();

  satz: {
    init(q, body){ body.innerHTML='<p class="satz">'+fmt(q.satz)+'</p><input '+INPUT_ATTR+' id="ans" class="fullin" aria-label="Deine Antwort" placeholder="Schreib hier den ganzen Satz …">'+umlautBar(); bindInputs(body); },

    check(q){ if(ui.sel==null) return { invalid:'Klick zuerst auf das falsche Wort.' }; const v=$('#ans').value; if(!canon(v)) return { invalid:'Schreib die richtige Form in das Feld.' };

  app.innerHTML=h+'</section>';
  $('#btnCopy').addEventListener('click',()=>copyText(resultText(code,s,d)));
  $('#btnNew').addEventListener('click',()=>{ if(!window.confirm('Neues Spiel starten? Dieses Ergebnis wird gelöscht. Hast du schon einen Screenshot gemacht?')) return; lsDel(LS_GAME); state=null; view='start'; render(); });
  focusEl('#btnCopy');
}
function resultText(code,s,d){
  let t='Artikel-Detektive – Grammatik-Escape-Room\nName: '+state.name+'\nNiveau: '+state.level+' – '+L().titel+'\nModus: '+(state.challenge?'Challenge':'normal')+
    '\nPunkte: '+s.score+' / '+s.max+' ('+s.pct+' %)\nZeit: '+fmtTime(state.elapsed)+' min\nDatum: '+fmtDate(d)+'\nWitze: '+Object.keys(state.jokes).length+'/'+totalJokes(state.level)+(s.open?'\nNicht bearbeitet: '+s.open:'')+'\nPrüfcode: '+code+'\n';
  t+='\nFalsch beantwortet ('+state.wrong.length+'):\n'+(state.wrong.length?state.wrong.map((w,i)=>(i+1)+'. '+w.aufgabe+'\n   Meine Antwort: '+w.deine+'\n   Richtig: '+w.loesung).join('\n'):'–');
  return t;
}
function copyText(t){
  const done=()=>{ $('#copyFb').textContent='✓ Kopiert! Jetzt in Google Classroom einfügen (Strg + V).'; };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('#copyFb').textContent='Kopieren hat nicht geklappt – bitte Screenshot machen.'; } ta.remove(); };
  let settled=false; const once=f=>()=>{ if(!settled){ settled=true; f(); } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(once(done),once(fallback)); setTimeout(once(fallback),800); } else once(fallback)(); }catch(e){ once(fallback)(); }
}

/* ---------- Lehrkraft: Prüfcode ---------- */
function backToGame(){ history.replaceState(null,'',location.pathname+location.search); view='start'; render(); }
function renderTeacher(){
  app.innerHTML='<section class="card narrow"><h1>🔎 Prüfcode kontrollieren</h1><p class="muted">Für Lehrkräfte. Name so eingeben, wie er im Ergebnis steht (Groß-/Kleinschreibung, Akzente und Leerzeichen sind egal).</p>'+
    '<p><label for="tName">Name</label><br><input '+INPUT_ATTR+' id="tName" class="fullin"></p><p><label for="tCode">Prüfcode</label><br><input '+INPUT_ATTR+' id="tCode" class="fullin" placeholder="z. B. A2-75-081026-K7QFM"></p>'+
    '<div class="row"><button type="button" class="primary" id="tCheck">Prüfen</button><span class="spacer"></span><button type="button" id="tBack">← Zurück zum Spiel</button></div><div id="tRes" role="status" aria-live="polite" style="margin-top:.8em"></div></section>';
  const go=()=>{ const r=verifyCode($('#tCode').value,$('#tName').value);
    $('#tRes').innerHTML = r.valid ? '<p class="tipbox" style="border-color:var(--ok);background:var(--ok-bg)"><strong>✓ Der Code ist gültig.</strong><br>Niveau <strong>'+r.level+'</strong>'+(r.challenge?' (Challenge)':'')+' · <strong>'+r.pct+' %</strong> · '+r.date+'</p>'
      : '<p class="tipbox" style="border-color:var(--bad);background:var(--bad-bg)"><strong>✗ Der Code ist nicht gültig.</strong><br>'+esc(r.reason||'Name oder Code passen nicht zusammen.')+'</p>'; };
  $('#tCheck').addEventListener('click',go); ['#tName','#tCode'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
  $('#tBack').addEventListener('click',backToGame); focusEl('#tName');
}

/* ---------- Lehrkraft: Bearbeitungsmodus ---------- */
function renderEditor(){
  const lv = (renderEditor.lv && SPIEL[renderEditor.lv]) ? renderEditor.lv : LEVELS[0];
  const ri = Math.min(renderEditor.ri||0, SPIEL[lv].raeume.length-1);
  const Rm = SPIEL[lv].raeume[ri], S = SCENES[Rm.szene];
  app.innerHTML='<section><h1>🛠️ Bearbeitungsmodus</h1><p class="muted">Ziehe mit der Maus einen Rahmen um die Stelle, an der ein Gegenstand liegen soll. Unten erscheint die Zeile <code>ort: […]</code> zum Kopieren. Grüne Rahmen = vorhandene Gegenstände.</p>'+
    '<div class="row" style="margin-bottom:.5em"><label>Niveau <select id="edLv">'+LEVELS.map(l=>'<option'+(l===lv?' selected':'')+'>'+l+'</option>').join('')+'</select></label>'+
    '<label>Raum <select id="edRm">'+SPIEL[lv].raeume.map((x,i)=>'<option value="'+i+'"'+(i===ri?' selected':'')+'>'+(i+1)+' – '+esc(x.name)+'</option>').join('')+'</select></label><span class="spacer"></span><button type="button" id="edBack">← Zurück zum Spiel</button></div>'+
    '<div class="stage" id="edStage" style="cursor:crosshair;touch-action:none"><svg class="bg" viewBox="0 0 1000 560" style="position:absolute;inset:0;width:100%;height:100%">'+sceneSVG(S)+Rm.gegenstaende.map(iconSVG).join('')+'</svg>'+
    Rm.gegenstaende.map(o=>'<div class="edold" style="'+pos(o.ort)+'"><span>'+esc(o.id)+' ('+o.art+')</span></div>').join('')+'<div class="edold" style="'+pos(S.tuer)+';border-color:#ffd166"><span>Tür</span></div></div>'+
    '<pre class="code" id="edOut">Noch kein Rahmen gezogen.</pre><button type="button" id="edCopy">📋 Zeile kopieren</button>'+
    '<h2 style="margin-top:1em">Verfügbare Symbole</h2><div class="iconlist">'+Object.keys(ICONS).map(k=>'<div><svg viewBox="'+ICONS[k]({})[0]+'">'+ICONS[k]({})[1]+'</svg><br><code>'+k+'</code></div>').join('')+'</div></section>';
  $('#edLv').addEventListener('change',e=>{ renderEditor.lv=e.target.value; renderEditor.ri=0; renderEditor(); });
  $('#edRm').addEventListener('change',e=>{ renderEditor.ri=+e.target.value; renderEditor(); });
  $('#edBack').addEventListener('click',backToGame);
  const st=$('#edStage'); let start=null, box=null;
  const toU=e=>{ const r=st.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*1000), Math.round((e.clientY-r.top)/r.height*560)]; };
  st.addEventListener('pointerdown',e=>{ start=toU(e); if(box) box.remove(); box=document.createElement('div'); box.className='edbox'; st.appendChild(box); st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove',e=>{ if(!start) return; const p=toU(e); const r=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.abs(p[0]-start[0]),Math.abs(p[1]-start[1])]; box.style.cssText=pos(r); box.dataset.r=JSON.stringify(r); });
  st.addEventListener('pointerup',()=>{ if(!start) return; start=null; if(box && box.dataset.r){ const r=JSON.parse(box.dataset.r); $('#edOut').textContent='ort: ['+r.join(', ')+'],'; } });
  $('#edCopy').addEventListener('click',()=>{ const t=$('#edOut').textContent; try{ navigator.clipboard.writeText(t); }catch(e){} toast('📋 Kopiert: '+t); });
}

/* ---------- Start ---------- */
try{ settings=Object.assign(settings, JSON.parse(lsGet(LS_SET)||'{}')); }catch(e){}
updateSoundBtn();
state = loadGame();
window.addEventListener('hashchange',()=>{ closeObject(true); if(!location.hash) view='start'; render(); });
render();
if(/[?&]test\b/.test(location.search)) window.__ad = { state:()=>state, ui:()=>ui, current:()=>current, verifyCode, compare, SPIEL, openDoor };
})();
</script>
